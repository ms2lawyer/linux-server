name: Linux OmniRoute Server

on:
  schedule:
    # Rebuild/restart the persistent OmniRoute runner every 6 hours.
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: permanent-linux-ssh-server
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # 350 min runtime + setup + persistence margin.
    timeout-minutes: 380

    env:
      OMNIROUTE_PORT: '20128'
      OMNIROUTE_VERSION: '3.8.49'
      OMNIROUTE_RUNTIME_MINUTES: '350'
      OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES: '30'
      OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS: '45'
      OMNIROUTE_MODEL_TEST_PARALLELISM: '6'
      OMNIROUTE_MAX_MODELS_PER_CYCLE: '100'
      OMNIROUTE_DB_PATH: 'backup/omniroute/storage.sqlite'
      OMNIROUTE_BASE_URL: 'http://127.0.0.1:20128'

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================
      - name: 01. Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # ==========================================================
      # 02. VALIDATE GITHUB CONFIGURATION
      # ==========================================================
      - name: 02. Validate GitHub Configuration
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail

          required=(
            SSH_USERNAME
            SSH_PASSWORD
            OMNIROUTE_ENV
            GIT_TOKEN
            TAILSCALE_AUTHKEY
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
            OMNIROUTE_API_KEY
          )

          for name in "${required[@]}"; do
            test -n "${!name:-}" || {
              echo "ERROR: $name is empty."
              exit 1
            }
          done

          echo "Required GitHub configuration is present."
          echo "Secret values were not displayed."

      # ==========================================================
      # 03. INSTALL SYSTEM PACKAGES
      # ==========================================================
      - name: 03. Install Required Packages
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            git \
            sqlite3 \
            jq \
            openssh-server \
            ca-certificates \
            gnupg \
            lsb-release \
            tar \
            gzip \
            psmisc \
            lsof

          echo "Required packages installed."

      # ==========================================================
      # 04. INSTALL GITHUB CLI
      # ==========================================================
      - name: 04. Install GitHub CLI
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg |
              sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg

            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg

            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" |
              sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null

            sudo apt-get update
            sudo apt-get install -y gh
          fi

          gh --version

      # ==========================================================
      # 05. CONFIGURE GIT
      # ==========================================================
      - name: 05. Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

      # ==========================================================
      # 06. SETUP SSH SERVER
      # ==========================================================
      - name: 06. Setup SSH Server
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          if ! id "$SSH_USERNAME" >/dev/null 2>&1; then
            sudo useradd --create-home --shell /bin/bash "$SSH_USERNAME"
          fi

          echo "$SSH_USERNAME:$SSH_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$SSH_USERNAME"

          sudo mkdir -p /run/sshd

          sudo sed -i -E \
            's/^#?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i -E \
            's/^#?PermitRootLogin .*/PermitRootLogin no/' \
            /etc/ssh/sshd_config

          sudo systemctl enable --now ssh

          echo "SSH server is running."

      # ==========================================================
      # 07. PREPARE OMNIROUTE HOME
      # ==========================================================
      - name: 07. Prepare OmniRoute Directory
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          sudo mkdir -p "$OMNIROUTE_HOME"
          sudo chown "$SSH_USERNAME:$SSH_USERNAME" "$OMNIROUTE_HOME"
          sudo chmod 700 "$OMNIROUTE_HOME"

      # ==========================================================
      # 08. RESTORE SQLITE DATABASE
      # ==========================================================
      - name: 08. Restore OmniRoute Database
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          REPO_DB="$GITHUB_WORKSPACE/$OMNIROUTE_DB_PATH"
          DB="$OMNIROUTE_HOME/storage.sqlite"

          test -s "$REPO_DB" || {
            echo "ERROR: Persistent SQLite database missing or empty: $REPO_DB"
            exit 1
          }

          sudo rm -f "$DB" "$DB-wal" "$DB-shm"

          sudo install \
            -o "$SSH_USERNAME" \
            -g "$SSH_USERNAME" \
            -m 600 \
            "$REPO_DB" \
            "$DB"

          sudo -u "$SSH_USERNAME" sqlite3 "$DB" "PRAGMA integrity_check;" |
            grep -Fxq "ok"

          echo "SQLite database restored successfully."
          sudo ls -lh "$DB"

      # ==========================================================
      # 09. RESTORE COMPLETE .ENV
      # ==========================================================
      - name: 09. Restore OmniRoute Environment
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          ENV_FILE="$OMNIROUTE_HOME/.env"
          TEMP_ENV="$RUNNER_TEMP/omniroute.env"

          printf '%s' "$OMNIROUTE_ENV" > "$TEMP_ENV"

          test -s "$TEMP_ENV"
          grep -Eq '^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*=' "$TEMP_ENV"

          sudo install \
            -o "$SSH_USERNAME" \
            -g "$SSH_USERNAME" \
            -m 600 \
            "$TEMP_ENV" \
            "$ENV_FILE"

          rm -f "$TEMP_ENV"

          echo "OmniRoute .env restored."

      # ==========================================================
      # 10. NORMALIZE + VALIDATE NETWORK/ENCRYPTION ENVIRONMENT
      # ==========================================================
      - name: 10. Normalize And Validate OmniRoute Environment
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          ENV_FILE="$OMNIROUTE_HOME/.env"
          TEMP_ENV="$RUNNER_TEMP/omniroute.env.normalized"

          sudo cp "$ENV_FILE" "$TEMP_ENV"

          sudo sed -i -E \
            '/^[[:space:]]*(export[[:space:]]+)?HOSTNAME[[:space:]]*=/d' \
            "$TEMP_ENV"

          sudo sed -i -E \
            '/^[[:space:]]*(export[[:space:]]+)?OMNIROUTE_SERVER_HOST[[:space:]]*=/d' \
            "$TEMP_ENV"

          printf '\nHOSTNAME=0.0.0.0\n' | sudo tee -a "$TEMP_ENV" >/dev/null
          printf 'OMNIROUTE_SERVER_HOST=0.0.0.0\n' | sudo tee -a "$TEMP_ENV" >/dev/null

          sudo install \
            -o "$SSH_USERNAME" \
            -g "$SSH_USERNAME" \
            -m 600 \
            "$TEMP_ENV" \
            "$ENV_FILE"

          sudo rm -f "$TEMP_ENV"

          grep -Eq '^HOSTNAME=0\.0\.0\.0$' "$ENV_FILE"
          grep -Eq '^OMNIROUTE_SERVER_HOST=0\.0\.0\.0$' "$ENV_FILE"

          grep -Eq \
            '^[[:space:]]*(export[[:space:]]+)?STORAGE_ENCRYPTION_KEY[[:space:]]*=[[:space:]]*[^[:space:]]' \
            "$ENV_FILE" || {
              echo "ERROR: STORAGE_ENCRYPTION_KEY is missing or empty."
              exit 1
            }

          OWNER="$(sudo stat -c '%U' "$ENV_FILE")"
          PERMISSIONS="$(sudo stat -c '%a' "$ENV_FILE")"

          test "$OWNER" = "$SSH_USERNAME"
          test "$PERMISSIONS" = "600"

          echo "Environment validation passed."

      # ==========================================================
      # 11. INSTALL NODE.JS
      # ==========================================================
      - name: 11. Install Node.js
        run: |
          set -euo pipefail

          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs

          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"

      # ==========================================================
      # 12. INSTALL EXACT OMNIROUTE VERSION
      # ==========================================================
      - name: 12. Install OmniRoute
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo -u "$SSH_USERNAME" \
            OMNIROUTE_VERSION="$OMNIROUTE_VERSION" \
            -H bash <<'USER_SCRIPT'

          set -euo pipefail

          export HOME="/home/$USER"
          export NPM_PREFIX="$HOME/.npm-global"
          export PATH="$NPM_PREFIX/bin:$PATH"

          mkdir -p "$NPM_PREFIX"
          npm config set prefix "$NPM_PREFIX"

          npm install -g "omniroute@$OMNIROUTE_VERSION"

          test -x "$NPM_PREFIX/bin/omniroute"
          "$NPM_PREFIX/bin/omniroute" --version

          USER_SCRIPT

      # ==========================================================
      # 13. VERIFY OMNIROUTE INSTALLATION
      # ==========================================================
      - name: 13. Verify OmniRoute Installation
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_BIN="/home/$SSH_USERNAME/.npm-global/bin/omniroute"

          test -x "$OMNIROUTE_BIN"

          INSTALLED_VERSION="$(sudo -u "$SSH_USERNAME" "$OMNIROUTE_BIN" --version)"

          echo "Installed version: $INSTALLED_VERSION"

          echo "$INSTALLED_VERSION" | grep -F "$OMNIROUTE_VERSION" >/dev/null || {
            echo "ERROR: Installed OmniRoute version does not match $OMNIROUTE_VERSION."
            exit 1
          }

      # ==========================================================
      # 14. CREATE SYSTEMD SERVICE
      # ==========================================================
      - name: 14. Create OmniRoute systemd Service
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          OMNIROUTE_BIN="/home/$SSH_USERNAME/.npm-global/bin/omniroute"

          sudo tee /etc/systemd/system/omniroute.service >/dev/null <<EOF
          [Unit]
          Description=OmniRoute AI Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$SSH_USERNAME
          Group=$SSH_USERNAME
          WorkingDirectory=$OMNIROUTE_HOME

          Environment=HOME=/home/$SSH_USERNAME
          Environment=NODE_ENV=production
          Environment=PORT=$OMNIROUTE_PORT
          Environment=DATA_DIR=$OMNIROUTE_HOME
          Environment=PATH=/home/$SSH_USERNAME/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          EnvironmentFile=$OMNIROUTE_HOME/.env

          Environment=OMNIROUTE_SERVER_HOST=0.0.0.0
          Environment=HOSTNAME=0.0.0.0

          ExecStart=$OMNIROUTE_BIN

          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable omniroute

          sudo systemctl cat omniroute

      # ==========================================================
      # 15. START OMNIROUTE
      # ==========================================================
      - name: 15. Start OmniRoute
        run: |
          set -euo pipefail

          sudo systemctl restart omniroute

          for i in {1..30}; do
            if sudo systemctl is-active --quiet omniroute &&
               curl -fsS --max-time 5 \
                 "$OMNIROUTE_BASE_URL/v1/models" >/dev/null 2>&1; then
              echo "OmniRoute is healthy."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: OmniRoute failed startup/health validation."
          sudo systemctl --no-pager --full status omniroute || true
          sudo journalctl -u omniroute --no-pager -n 150 || true
          exit 1

      # ==========================================================
      # 16. VERIFY REAL TCP BIND
      # ==========================================================
      - name: 16. Verify OmniRoute Bind
        run: |
          set -euo pipefail

          SOCKET="$(
            sudo ss -lntp |
            grep -E ":$OMNIROUTE_PORT[[:space:]]" ||
            true
          )"

          echo "$SOCKET"

          echo "$SOCKET" |
            grep -Eq \
              "0\.0\.0\.0:$OMNIROUTE_PORT[[:space:]]|\[::\]:$OMNIROUTE_PORT[[:space:]]" || {
                echo "ERROR: OmniRoute is not externally bound."
                exit 1
            }

      # ==========================================================
      # 17. SETUP TAILSCALE
      # ==========================================================
      - name: 17. Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="omniroute"

          sudo tailscale ip -4

      # ==========================================================
      # 18. INSTALL MODEL HEALTH-CHECK SCRIPT
      # ==========================================================
      - name: 18. Install Model Health And Combo Sync Script
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          set -euo pipefail

          OMNIROUTE_TEST_DIR="$GITHUB_WORKSPACE/omniroute-tests"

          sudo -u "$SSH_USERNAME" mkdir -p "$OMNIROUTE_TEST_DIR"
          sudo -u "$SSH_USERNAME" mkdir -p "$OMNIROUTE_TEST_DIR/history"

          sudo tee "$OMNIROUTE_TEST_DIR/check-and-sync.sh" >/dev/null <<'SCRIPT'
          #!/usr/bin/env bash

          set -euo pipefail

          BASE_URL="${OMNIROUTE_BASE_URL:-http://127.0.0.1:20128}"
          API_KEY="${OMNIROUTE_API_KEY:-}"
          TEST_TIMEOUT="${OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS:-45}"
          PARALLELISM="${OMNIROUTE_MODEL_TEST_PARALLELISM:-6}"
          MAX_MODELS="${OMNIROUTE_MAX_MODELS_PER_CYCLE:-100}"

          TEST_DIR="${HOME}/omniroute-tests"
          HISTORY_DIR="${TEST_DIR}/history"

          mkdir -p "$HISTORY_DIR"

          NOW_UTC="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          STAMP="$(date -u '+%Y%m%dT%H%M%SZ')"

          REPORT="$HISTORY_DIR/models-$STAMP.tsv"
          PASS_LIST="$HISTORY_DIR/pass-models-$STAMP.txt"
          COMBO_REPORT="$HISTORY_DIR/combos-$STAMP.txt"

          CURL_AUTH=()
          if [[ -n "$API_KEY" ]]; then
            CURL_AUTH=(-H "Authorization: Bearer $API_KEY")
          fi

          echo "============================================================"
          echo "OmniRoute model health cycle"
          echo "UTC: $NOW_UTC"
          echo "============================================================"

          curl \
            --silent \
            --show-error \
            --fail \
            --max-time 15 \
            "${CURL_AUTH[@]}" \
            "$BASE_URL/v1/models" > "$TEST_DIR/models.json"

          mapfile -t MODELS < <(
            jq -r '
              .data[]?.id
              | select(type == "string")
              | select(contains("/"))
              | select(startswith("auto/") | not)
              | select(. != "coding")
              | select(. != "coding-fast")
              | select(. != "reasoning")
              | select(. != "fast")
            ' "$TEST_DIR/models.json" |
            sort -u |
            head -n "$MAX_MODELS"
          )

          if [[ "${#MODELS[@]}" -eq 0 ]]; then
            echo "ERROR: No concrete provider/model IDs were found."
            exit 1
          fi

          echo "Testing ${#MODELS[@]} concrete models..."
          printf 'timestamp\tstatus\tlatency_ms\tmodel\n' > "$REPORT"

          test_model() {
            local model="$1"
            local key
            local tmp
            local start
            local end
            local elapsed
            local http_code

            key="$(printf '%s' "$model" | sha256sum | cut -d' ' -f1)"
            tmp="$TEST_DIR/.model-$key"

            start="$(date +%s%3N)"

            set +e
            http_code="$(
              curl \
                --silent \
                --show-error \
                --output "$tmp.response" \
                --write-out '%{http_code}' \
                --max-time "$TEST_TIMEOUT" \
                "${CURL_AUTH[@]}" \
                -H 'Content-Type: application/json' \
                -d "$(jq -nc \
                  --arg model "$model" \
                  '{
                    model: $model,
                    messages: [
                      {role: "user", content: "Reply with exactly OK"}
                    ],
                    max_tokens: 16,
                    stream: false
                  }')" \
                "$BASE_URL/v1/chat/completions" \
                2>"$tmp.error"
            )"
            local status=$?
            set -e

            end="$(date +%s%3N)"
            elapsed=$((end - start))

            if [[ "$status" -eq 0 && "$http_code" =~ ^2 ]]; then
              printf '%s\tPASS\t%s\t%s\n' \
                "$NOW_UTC" "$elapsed" "$model" >> "$REPORT"
              rm -f "$tmp.response" "$tmp.error"
            else
              printf '%s\tFAIL\t%s\t%s\n' \
                "$NOW_UTC" "$elapsed" "$model" >> "$REPORT"

              {
                echo "MODEL=$model"
                echo "HTTP=$http_code"
                echo "CURL_EXIT=$status"
                echo "ERROR:"
                sed -n '1,12p' "$tmp.error" 2>/dev/null || true
                echo "RESPONSE:"
                sed -n '1,12p' "$tmp.response" 2>/dev/null || true
                echo
              } >> "$TEST_DIR/last-failures.log"

              rm -f "$tmp.response" "$tmp.error"
            fi
          }

          active=0
          for model in "${MODELS[@]}"; do
            test_model "$model" &
            active=$((active + 1))

            if (( active >= PARALLELISM )); then
              wait
              active=0
            fi
          done

          wait

          awk -F'\t' '$2=="PASS"{print $4}' "$REPORT" |
            sort -u > "$PASS_LIST"

          PASS_COUNT="$(wc -l < "$PASS_LIST" | tr -d ' ')"

          echo
          echo "PASS count: $PASS_COUNT"
          echo "PASS models:"
          cat "$PASS_LIST" || true

          if [[ "$PASS_COUNT" -eq 0 ]]; then
            echo "ERROR: Zero models passed. Existing combos will be preserved."
            exit 2
          fi

          # --------------------------------------------------------
          # Model ordering/classification.
          #
          # This is intentionally based only on health-test results.
          # A PASS means the basic OpenAI-compatible smoke test works;
          # it does NOT prove tool calling, reasoning quality, context
          # length, or production suitability.
          # --------------------------------------------------------

          sort -t$'\t' -k3,3n "$REPORT" |
            awk -F'\t' '$2=="PASS"{print $3 "\t" $4}' |
            awk -F'\t' '!seen[$2]++' > "$TEST_DIR/passed-by-latency.tsv"

          awk -F'\t' '
            {
              m=tolower($2)
              if (
                m ~ /code/ ||
                m ~ /coder/ ||
                m ~ /codestral/ ||
                m ~ /codex/ ||
                m ~ /deepseek/
              ) print $1 "\t" $2
            }
          ' "$TEST_DIR/passed-by-latency.tsv" > "$TEST_DIR/passed-coding.tsv"

          awk -F'\t' '
            {
              m=tolower($2)
              if (
                m ~ /reason/ ||
                m ~ /think/ ||
                m ~ /(^|[^0-9])r1([^0-9]|$)/ ||
                m ~ /(^|[^0-9])o1([^0-9]|$)/ ||
                m ~ /(^|[^0-9])o3([^0-9]|$)/ ||
                m ~ /(^|[^0-9])o4([^0-9]|$)/
              ) print $1 "\t" $2
            }
          ' "$TEST_DIR/passed-by-latency.tsv" > "$TEST_DIR/passed-reasoning.tsv"

          head -n 8 \
            "$TEST_DIR/passed-by-latency.tsv" > "$TEST_DIR/passed-fast.tsv"

          head -n 8 \
            "$TEST_DIR/passed-coding.tsv" > "$TEST_DIR/passed-coding-fast.tsv"

          # If classification produces an empty pool, fall back to all
          # currently healthy models rather than deleting the combo.
          [[ -s "$TEST_DIR/passed-coding.tsv" ]] ||
            cp "$TEST_DIR/passed-by-latency.tsv" "$TEST_DIR/passed-coding.tsv"

          [[ -s "$TEST_DIR/passed-coding-fast.tsv" ]] ||
            cp "$TEST_DIR/passed-coding.tsv" "$TEST_DIR/passed-coding-fast.tsv"

          [[ -s "$TEST_DIR/passed-reasoning.tsv" ]] ||
            cp "$TEST_DIR/passed-by-latency.tsv" "$TEST_DIR/passed-reasoning.tsv"

          [[ -s "$TEST_DIR/passed-fast.tsv" ]] ||
            cp "$TEST_DIR/passed-by-latency.tsv" "$TEST_DIR/passed-fast.tsv"

          # --------------------------------------------------------
          # Combo management.
          #
          # OmniRoute 3.8.49 supports creating combos via POST and
          # editing them via PUT. Do not use PATCH here.
          # --------------------------------------------------------

          combo_auth=()
          if [[ -n "$API_KEY" ]]; then
            combo_auth=(-H "Authorization: Bearer $API_KEY")
          fi

          COMBOS_JSON="$TEST_DIR/combos.json"

          curl \
            --silent \
            --show-error \
            --fail \
            --max-time 15 \
            "${combo_auth[@]}" \
            "$BASE_URL/api/combos" > "$COMBOS_JSON"

          get_combo_id() {
            local name="$1"

            jq -r \
              --arg name "$name" \
              '.[]? | select(.name == $name) | .id' \
              "$COMBOS_JSON" |
              head -n 1
          }

          get_existing_models() {
            local name="$1"

            jq -r \
              --arg name "$name" \
              '.[]?
               | select(.name == $name)
               | (.models // [])
               | .[]
               | (.model // .id // empty)' \
              "$COMBOS_JSON" 2>/dev/null || true
          }

          model_object() {
            local model="$1"
            local provider="${model%%/*}"

            jq -nc \
              --arg model "$model" \
              --arg provider "$provider" \
              '{
                id: $model,
                kind: "model",
                model: $model,
                providerId: $provider,
                weight: 0
              }'
          }

          build_models_json() {
            local file="$1"
            local combo_name="$2"
            local tmp_existing="$TEST_DIR/existing-$combo_name.txt"
            local tmp_all="$TEST_DIR/all-$combo_name.txt"

            get_existing_models "$combo_name" |
              while IFS= read -r model; do
                [[ -n "$model" ]] && printf '%s\n' "$model"
              done > "$tmp_existing"

            : > "$tmp_all"

            # Keep existing combo members first, but only when they passed
            # the current health cycle.
            while IFS= read -r model; do
              [[ -z "$model" ]] && continue

              if grep -Fxq "$model" "$PASS_LIST"; then
                printf '%s\n' "$model" >> "$tmp_all"
              fi
            done < "$tmp_existing"

            # Then append the newly healthy profile candidates.
            while IFS=$'\t' read -r latency model; do
              [[ -z "$model" ]] && continue
              printf '%s\n' "$model" >> "$tmp_all"
            done < "$file"

            mapfile -t candidates < <(
              cat "$tmp_all" |
              awk 'NF && !seen[$0]++'
            )

            if [[ "${#candidates[@]}" -eq 0 ]]; then
              # Never replace a healthy combo with an empty model list.
              echo '[]'
              return
            fi

            json='['

            local first=1
            for model in "${candidates[@]}"; do
              if [[ "$first" -eq 0 ]]; then
                json+=','
              fi

              first=0
              json+="$(model_object "$model")"
            done

            json+=']'

            printf '%s\n' "$json"
          }

          update_or_create_combo() {
            local name="$1"
            local candidate_file="$2"
            local strategy="${3:-priority}"
            local combo_id
            local models_json
            local body
            local response

            combo_id="$(get_combo_id "$name")"
            models_json="$(build_models_json "$candidate_file" "$name")"

            if [[ "$models_json" == "[]" ]]; then
              echo "WARN: $name has no candidate models; preserving existing combo."
              return 0
            fi

            if [[ -n "$combo_id" ]]; then
              # Preserve only server-owned fields that PUT expects.
              body="$(
                jq -nc \
                  --arg name "$name" \
                  --arg strategy "$strategy" \
                  --argjson models "$models_json" \
                  '{
                    name: $name,
                    strategy: $strategy,
                    models: $models
                  }'
              )"

              response="$(
                curl \
                  --silent \
                  --show-error \
                  --fail \
                  --max-time 20 \
                  --request PUT \
                  "${combo_auth[@]}" \
                  -H 'Content-Type: application/json' \
                  -d "$body" \
                  "$BASE_URL/api/combos/$combo_id"
              )"

              printf '%s\n' "$response" > "$TEST_DIR/combo-response-$name.json"

              echo "UPDATED combo: $name ($combo_id)"
            else
              body="$(
                jq -nc \
                  --arg name "$name" \
                  --arg strategy "$strategy" \
                  --argjson models "$models_json" \
                  '{
                    name: $name,
                    strategy: $strategy,
                    models: $models
                  }'
              )"

              response="$(
                curl \
                  --silent \
                  --show-error \
                  --fail \
                  --max-time 20 \
                  --request POST \
                  "${combo_auth[@]}" \
                  -H 'Content-Type: application/json' \
                  -d "$body" \
                  "$BASE_URL/api/combos"
              )"

              printf '%s\n' "$response" > "$TEST_DIR/combo-response-$name.json"

              echo "CREATED combo: $name"
            fi

            {
              echo "[$name]"
              echo "$models_json" | jq -r '.[].model'
              echo
            } >> "$COMBO_REPORT"
          }

          : > "$COMBO_REPORT"

          update_or_create_combo \
            "coding" \
            "$TEST_DIR/passed-coding.tsv" \
            "priority"

          update_or_create_combo \
            "coding-fast" \
            "$TEST_DIR/passed-coding-fast.tsv" \
            "priority"

          update_or_create_combo \
            "reasoning" \
            "$TEST_DIR/passed-reasoning.tsv" \
            "priority"

          update_or_create_combo \
            "fast" \
            "$TEST_DIR/passed-fast.tsv" \
            "priority"

          echo
          echo "============================================================"
          echo "UPDATED COMBOS"
          echo "============================================================"

          cat "$COMBO_REPORT"

          # Keep a stable latest report for SSH/manual inspection.
          cp "$REPORT" "$TEST_DIR/latest-models.tsv"
          cp "$PASS_LIST" "$TEST_DIR/pass-models.txt"
          cp "$COMBO_REPORT" "$TEST_DIR/latest-combos.txt"

          # Retain only the latest 48 cycles (~24 hours at 30-min cadence).
          find "$HISTORY_DIR" -type f -printf '%T@ %p\n' |
            sort -nr |
            awk 'NR>96{print $2}' |
            xargs -r rm -f

          echo "Model health/combo synchronization completed."
          SCRIPT

          sudo chmod 750 "$OMNIROUTE_TEST_DIR/check-and-sync.sh"
          sudo chown "$SSH_USERNAME:$SSH_USERNAME" "$OMNIROUTE_TEST_DIR/check-and-sync.sh"

          echo "Health-check script installed."

      # ==========================================================
      # 19. INITIAL MODEL CHECK + COMBO SYNC
      # ==========================================================
      - name: 19. Initial Model Check And Combo Sync
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ env.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS: ${{ env.OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS }}
          OMNIROUTE_MODEL_TEST_PARALLELISM: ${{ env.OMNIROUTE_MODEL_TEST_PARALLELISM }}
          OMNIROUTE_MAX_MODELS_PER_CYCLE: ${{ env.OMNIROUTE_MAX_MODELS_PER_CYCLE }}
        run: |
          set -euo pipefail

          sudo -u "$SSH_USERNAME" \
            env \
              OMNIROUTE_BASE_URL="$OMNIROUTE_BASE_URL" \
              OMNIROUTE_API_KEY="$OMNIROUTE_API_KEY" \
              OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS="$OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS" \
              OMNIROUTE_MODEL_TEST_PARALLELISM="$OMNIROUTE_MODEL_TEST_PARALLELISM" \
              OMNIROUTE_MAX_MODELS_PER_CYCLE="$OMNIROUTE_MAX_MODELS_PER_CYCLE" \
            /home/"$SSH_USERNAME"/omniroute-tests/check-and-sync.sh

      # ==========================================================
      # 20. TELEGRAM ONLINE NOTIFICATION
      # ==========================================================
      - name: 20. Send Tailscale Connection Information To Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1)"
          TAILSCALE_DNS="$(
            sudo tailscale dns status 2>/dev/null |
            grep -Eo '[A-Za-z0-9._-]+\.ts\.net' |
            head -n 1 ||
            true
          )"

          TAILSCALE_DNS="${TAILSCALE_DNS:-Not detected}"

          MESSAGE="$(cat <<EOF
          🚀 OmniRoute Linux Server is ONLINE
          ━━━━━━━━━━━━━━━━━━━━
          Hostname:
          $TAILSCALE_DNS

          IP:
          $TAILSCALE_IP

          SSH:
          ssh $SSH_USERNAME@$TAILSCALE_IP

          OmniRoute:
          http://$TAILSCALE_IP:$OMNIROUTE_PORT/v1

          Version:
          $OMNIROUTE_VERSION

          Model health:
          every $OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES minutes

          Combo policy:
          PASS-only models
          EOF
          )"

          curl \
            --silent \
            --show-error \
            --fail \
            --max-time 20 \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            >/dev/null

      # ==========================================================
      # 21. KEEP RUNNER ALIVE + CHECK EVERY 30 MINUTES
      # ==========================================================
      - name: 21. Keep Runner Alive And Maintain Combos
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ env.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS: ${{ env.OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS }}
          OMNIROUTE_MODEL_TEST_PARALLELISM: ${{ env.OMNIROUTE_MODEL_TEST_PARALLELISM }}
          OMNIROUTE_MAX_MODELS_PER_CYCLE: ${{ env.OMNIROUTE_MAX_MODELS_PER_CYCLE }}
        run: |
          set -euo pipefail

          TEST_SCRIPT="/home/$SSH_USERNAME/omniroute-tests/check-and-sync.sh"
          TOTAL_SECONDS=$((OMNIROUTE_RUNTIME_MINUTES * 60))
          INTERVAL_SECONDS=$((OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES * 60))
          STARTED_AT="$(date +%s)"
          CYCLE=1

          echo "Production runtime: $OMNIROUTE_RUNTIME_MINUTES minutes"
          echo "Model health interval: $OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES minutes"

          while true; do
            NOW="$(date +%s)"
            ELAPSED=$((NOW - STARTED_AT))

            if (( ELAPSED >= TOTAL_SECONDS )); then
              break
            fi

            echo
            echo "============================================================"
            echo "MAINTENANCE CYCLE $CYCLE"
            echo "Elapsed: $((ELAPSED / 60)) / $OMNIROUTE_RUNTIME_MINUTES minutes"
            echo "UTC: $(date -u)"
            echo "============================================================"

            if ! sudo systemctl is-active --quiet omniroute; then
              echo "ERROR: OmniRoute stopped unexpectedly."
              sudo systemctl --no-pager --full status omniroute || true
              sudo journalctl -u omniroute --no-pager -n 100 || true
              exit 1
            fi

            if ! curl \
              --silent \
              --show-error \
              --fail \
              --max-time 15 \
              "$OMNIROUTE_BASE_URL/v1/models" >/dev/null; then
              echo "ERROR: OmniRoute health endpoint failed."
              exit 1
            fi

            set +e
            sudo -u "$SSH_USERNAME" \
              env \
                OMNIROUTE_BASE_URL="$OMNIROUTE_BASE_URL" \
                OMNIROUTE_API_KEY="$OMNIROUTE_API_KEY" \
                OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS="$OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS" \
                OMNIROUTE_MODEL_TEST_PARALLELISM="$OMNIROUTE_MODEL_TEST_PARALLELISM" \
                OMNIROUTE_MAX_MODELS_PER_CYCLE="$OMNIROUTE_MAX_MODELS_PER_CYCLE" \
              "$TEST_SCRIPT"
            CHECK_STATUS=$?
            set -e

            case "$CHECK_STATUS" in
              0)
                echo "Model health and combo synchronization PASSED."
                ;;
              2)
                echo "WARNING: No healthy models were found."
                echo "Existing combos were preserved."
                ;;
              *)
                echo "ERROR: Model health/combo synchronization failed."
                exit "$CHECK_STATUS"
                ;;
            esac

            CYCLE=$((CYCLE + 1))

            REMAINING=$((TOTAL_SECONDS - ( $(date +%s) - STARTED_AT ) ))

            if (( REMAINING <= 0 )); then
              break
            fi

            SLEEP_SECONDS="$INTERVAL_SECONDS"
            if (( SLEEP_SECONDS > REMAINING )); then
              SLEEP_SECONDS="$REMAINING"
            fi

            echo "Sleeping $SLEEP_SECONDS seconds until next health cycle..."
            sleep "$SLEEP_SECONDS"
          done

          echo "Runtime period completed."

      # ==========================================================
      # 22. STOP OMNIROUTE BEFORE SQLITE PERSISTENCE
      # ==========================================================
      - name: 22. Stop OmniRoute Before Persistence
        if: ${{ !cancelled() }}
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          DB="$OMNIROUTE_HOME/storage.sqlite"

          sudo systemctl stop omniroute || true

          for i in {1..30}; do
            if ! sudo systemctl is-active --quiet omniroute; then
              break
            fi
            sleep 1
          done

          if sudo systemctl is-active --quiet omniroute; then
            echo "ERROR: OmniRoute is still active."
            sudo systemctl --no-pager --full status omniroute || true
            exit 1
          fi

          for i in {1..30}; do
            HOLDERS="$(sudo fuser "$DB" 2>/dev/null || true)"

            if [[ -z "$HOLDERS" ]]; then
              break
            fi

            echo "SQLite holders: $HOLDERS"
            sudo fuser -TERM "$DB" 2>/dev/null || true
            sleep 2
          done

          HOLDERS="$(sudo fuser "$DB" 2>/dev/null || true)"

          if [[ -n "$HOLDERS" ]]; then
            sudo fuser -KILL "$DB" 2>/dev/null || true
            sleep 3
          fi

          HOLDERS="$(sudo fuser "$DB" 2>/dev/null || true)"

          if [[ -n "$HOLDERS" ]]; then
            sudo fuser -v "$DB" || true
            sudo lsof "$DB" 2>/dev/null || true
            exit 1
          fi

          echo "OmniRoute stopped and SQLite is free."

      # ==========================================================
      # 23. FINALIZE SQLITE
      # ==========================================================
      - name: 23. Finalize SQLite Database
        if: ${{ !cancelled() }}
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"

          test -s "$DB"

          sudo -u "$SSH_USERNAME" \
            sqlite3 \
            -cmd ".timeout 60000" \
            "$DB" \
            "PRAGMA wal_checkpoint(TRUNCATE);" >/dev/null

          sudo -u "$SSH_USERNAME" \
            sqlite3 \
            -cmd ".timeout 60000" \
            "$DB" \
            "PRAGMA integrity_check;" |
            grep -Fxq "ok"

          sudo rm -f "$DB-wal" "$DB-shm"

          echo "SQLite finalization passed."

      # ==========================================================
      # 24. AUTHENTICATE GITHUB CLI
      # ==========================================================
      - name: 24. Authenticate GitHub CLI
        if: ${{ !cancelled() }}
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GIT_TOKEN" |
            gh auth login \
              --hostname github.com \
              --git-protocol https \
              --with-token

          gh auth setup-git

      # ==========================================================
      # 25. SYNCHRONIZE REPOSITORY SAFELY
      # ==========================================================
      - name: 25. Synchronize Git Repository
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"
          REMOTE_URL="https://github.com/$GITHUB_REPOSITORY.git"

          git remote set-url origin "$REMOTE_URL"

          git fetch origin --prune

          # Pull remote changes first. Never force-push over remote state.
          git checkout -B "$BRANCH" "origin/$BRANCH"

          echo "Repository synchronized with origin/$BRANCH."

      # ==========================================================
      # 26. SECURITY CHECK
      # ==========================================================
      - name: 26. Security Check Before Persistence
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          if git ls-files |
            grep -E '(^|/)\.env$|(^|/)logs/|\.log$'; then
            echo "ERROR: Forbidden .env/log file is tracked."
            exit 1
          fi

          if find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name ".env" -o -name "*.log" \) \
            -not -path "$GITHUB_WORKSPACE/.git/*" \
            -print -quit |
            grep -q .; then
            echo "ERROR: .env or .log exists in workspace."
            exit 1
          fi

          echo "Security check passed."

      # ==========================================================
      # 27. REMOVE LEGACY BACKUPS
      # ==========================================================
      - name: 27. Remove Legacy Backup Artifacts
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/backup/omniroute/data"
          rm -f "$GITHUB_WORKSPACE/backup/omniroute/omniroute-full-backup.tar.gz"

      # ==========================================================
      # 28. COPY SQLITE TO REPOSITORY
      # ==========================================================
      - name: 28. Backup SQLite Database To Repository
        if: ${{ !cancelled() }}
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"
          REPO_DB="$GITHUB_WORKSPACE/$OMNIROUTE_DB_PATH"

          test -s "$DB"
          test -z "$(sudo fuser "$DB" 2>/dev/null || true)"

          mkdir -p "$(dirname "$REPO_DB")"

          sudo -u "$SSH_USERNAME" \
            sqlite3 "$DB" \
            ".backup '$REPO_DB'"

          if [[ ! -s "$REPO_DB" ]]; then
            echo "ERROR: SQLite backup produced an empty file."
            exit 1
          fi

          chown "$(id -u):$(id -g)" "$REPO_DB"
          chmod 600 "$REPO_DB"

          sqlite3 \
            -cmd ".timeout 60000" \
            "$REPO_DB" \
            "PRAGMA integrity_check;" |
            grep -Fxq "ok"

          rm -f "$REPO_DB-wal" "$REPO_DB-shm"

          echo "Repository SQLite backup is valid."

      # ==========================================================
      # 29. CHECK DATABASE SIZE
      # ==========================================================
      - name: 29. Check SQLite File Size
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          REPO_DB="$GITHUB_WORKSPACE/$OMNIROUTE_DB_PATH"
          DB_SIZE="$(stat -c '%s' "$REPO_DB")"

          echo "SQLite database size: $DB_SIZE bytes"

          if (( DB_SIZE > 99614720 )); then
            echo "ERROR: SQLite database exceeds 95 MB."
            exit 1
          fi

      # ==========================================================
      # 30. STAGE ONLY PERSISTENT STATE
      # ==========================================================
      - name: 30. Stage SQLite Database
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          git add -f "$OMNIROUTE_DB_PATH"

          git add -u \
            -- backup/omniroute/data \
               backup/omniroute/omniroute-full-backup.tar.gz \
            2>/dev/null || true

          if git diff --cached --name-only |
            grep -E '(^|/)\.env$|(^|/)logs/|\.log$|storage\.sqlite-(wal|shm)$'; then
            echo "ERROR: Secret/log/SQLite sidecar is staged."
            exit 1
          fi

          git diff --cached --name-status

      # ==========================================================
      # 31. COMMIT
      # ==========================================================
      - name: 31. Commit Updated OmniRoute State
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "chore: persist OmniRoute state and healthy model combos"

      # ==========================================================
      # 32. PUSH
      # ==========================================================
      - name: 32. Push Updated OmniRoute State
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"

          git fetch origin "$BRANCH"

          COUNTS="$(
            git rev-list \
              --left-right \
              --count \
              "origin/$BRANCH...HEAD"
          )"

          BEHIND="$(awk '{print $1}' <<< "$COUNTS")"
          AHEAD="$(awk '{print $2}' <<< "$COUNTS")"

          echo "Behind: $BEHIND"
          echo "Ahead : $AHEAD"

          test "$BEHIND" -eq 0 || {
            echo "ERROR: Local branch diverged from origin/$BRANCH."
            echo "Refusing to overwrite remote history."
            exit 1
          }

          if [[ "$AHEAD" -eq 0 ]]; then
            echo "No new local commit to push."
            exit 0
          fi

          git push origin "$BRANCH"

          echo "State pushed to GitHub."

      # ==========================================================
      # 33. FINAL REPOSITORY VALIDATION
      # ==========================================================
      - name: 33. Final Repository Validation
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"

          git fetch origin "$BRANCH"

          LOCAL_COMMIT="$(git rev-parse HEAD)"
          REMOTE_COMMIT="$(git rev-parse "origin/$BRANCH")"

          echo "Local commit : $LOCAL_COMMIT"
          echo "Remote commit: $REMOTE_COMMIT"

          test "$LOCAL_COMMIT" = "$REMOTE_COMMIT"

          git ls-tree \
            -r \
            --name-only \
            HEAD \
            "$OMNIROUTE_DB_PATH" |
            grep -Fxq "$OMNIROUTE_DB_PATH"

          if git ls-tree \
            -r \
            --name-only \
            HEAD |
            grep -E '(^|/)\.env$|(^|/)logs/|\.log$|storage\.sqlite-(wal|shm)$'; then
            echo "ERROR: Forbidden file exists in Git."
            exit 1
          fi

          WORKFLOW_COUNT="$(
            git ls-tree \
              -r \
              --name-only \
              HEAD |
              grep -E '^\.github/workflows/.*\.ya?ml$' |
              wc -l
          )"

          test "$WORKFLOW_COUNT" -gt 0

          echo "Final repository validation passed."

      # ==========================================================
      # 34. FINAL SERVICE STATE
      # ==========================================================
      - name: 34. Verify OmniRoute Is Stopped
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          if sudo systemctl is-active --quiet omniroute; then
            echo "ERROR: OmniRoute is still running after persistence."
            exit 1
          fi

          echo "OmniRoute is stopped and persistence is complete."
