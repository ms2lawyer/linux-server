name: Linux OmniRoute Server

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: permanent-linux-ssh-server
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    env:
      OMNIROUTE_PORT: '20128'
      OMNIROUTE_VERSION: '3.8.49'
      OMNIROUTE_RUNTIME_MINUTES: '350'
      OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES: '30'
      OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS: '45'
      OMNIROUTE_MODEL_TEST_PARALLELISM: '6'
      OMNIROUTE_MAX_MODELS_PER_CYCLE: '100'
      OMNIROUTE_DB_PATH: 'backup/omniroute/storage.sqlite'
      OMNIROUTE_BASE_URL: 'http://127.0.0.1:20128'

    steps:

      # ==========================================================
      # 01. Checkout
      # ==========================================================

      - name: 01. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 02. Validate configuration
      # ==========================================================

      - name: 02. Validate Required GitHub Configuration
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          required_vars=(
            SSH_USERNAME
            SSH_PASSWORD
            TAILSCALE_AUTHKEY
            OMNIROUTE_ENV
            OMNIROUTE_API_KEY
            STORAGE_ENCRYPTION_KEY
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: Required GitHub configuration is missing: $name"
              exit 1
            fi
          done

          echo "All required GitHub configuration is present."

      # ==========================================================
      # 03. Install packages
      # ==========================================================

      - name: 03. Install Required Packages
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            git \
            openssh-server \
            sqlite3 \
            ca-certificates \
            gnupg \
            lsof \
            net-tools \
            unzip \
            ethtool

      # ==========================================================
      # 04. Install GitHub CLI
      # ==========================================================

      - name: 04. Install GitHub CLI
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL \
              https://cli.github.com/packages/githubcli-archive-keyring.gpg |
              sudo dd \
                of=/usr/share/keyrings/githubcli-archive-keyring.gpg

            sudo chmod go+r \
              /usr/share/keyrings/githubcli-archive-keyring.gpg

            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" |
              sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null

            sudo apt-get update
            sudo apt-get install -y gh
          fi

          gh --version

      # ==========================================================
      # 05. Configure Git
      # ==========================================================

      - name: 05. Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global pull.rebase false
          git config --global init.defaultBranch main

      # ==========================================================
      # 06. Setup SSH user
      #
      # IMPORTANT:
      # Make SSH_USERNAME a real Linux administrator.
      #
      # This gives the user:
      #   - sudo group membership
      #   - passwordless sudo
      #   - normal interactive administrative access
      #
      # This is intentionally done on every runner because the
      # GitHub-hosted runner is ephemeral.
      # ==========================================================

      - name: 06. Setup SSH User And Administrator Access
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Configuring SSH user: $SSH_USERNAME"

          if ! id "$SSH_USERNAME" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$SSH_USERNAME"
          fi

          echo "$SSH_USERNAME:$SSH_PASSWORD" | sudo chpasswd

          # ------------------------------------------------------
          # Add user to sudo/admin group
          # ------------------------------------------------------

          sudo usermod \
            --append \
            --groups sudo \
            "$SSH_USERNAME"

          # ------------------------------------------------------
          # Explicit sudoers rule.
          #
          # This avoids depending only on group membership and
          # makes sudo work immediately for the SSH account.
          # ------------------------------------------------------

          sudo tee "/etc/sudoers.d/$SSH_USERNAME" >/dev/null <<EOF
          $SSH_USERNAME ALL=(ALL:ALL) NOPASSWD:ALL
          EOF

          sudo chmod 0440 \
            "/etc/sudoers.d/$SSH_USERNAME"

          sudo visudo \
            -cf "/etc/sudoers.d/$SSH_USERNAME"

          # ------------------------------------------------------
          # Verify administrator membership
          # ------------------------------------------------------

          sudo id "$SSH_USERNAME"

          sudo -u "$SSH_USERNAME" \
            id

          echo "SSH user is configured as a Linux administrator."

      # ==========================================================
      # 07. Configure SSH server
      # ==========================================================

      - name: 07. Setup SSH Server
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo sed -i \
            -E 's/^#?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            -E 's/^#?PubkeyAuthentication .*/PubkeyAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            -E 's/^#?PermitRootLogin .*/PermitRootLogin no/' \
            /etc/ssh/sshd_config

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          echo "SSH server configured for administrator: $SSH_USERNAME"

      # ==========================================================
      # 08. Configure Linux IP forwarding
      #
      # Required for Tailscale subnet routing / Exit Node.
      # ==========================================================

      - name: 08. Configure IP Forwarding
        run: |
          set -euo pipefail

          echo "Enabling IPv4 forwarding..."
          sudo sysctl -w net.ipv4.ip_forward=1

          echo "Enabling IPv6 forwarding..."
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

          sudo tee /etc/sysctl.d/99-tailscale-forwarding.conf >/dev/null <<'EOF'
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
          EOF

          sudo sysctl --system

          echo
          echo "Forwarding status:"
          sysctl net.ipv4.ip_forward
          sysctl net.ipv6.conf.all.forwarding

          if [[ "$(sysctl -n net.ipv4.ip_forward)" != "1" ]]; then
            echo "ERROR: IPv4 forwarding is not enabled."
            exit 1
          fi

          if [[ "$(sysctl -n net.ipv6.conf.all.forwarding)" != "1" ]]; then
            echo "ERROR: IPv6 forwarding is not enabled."
            exit 1
          fi

          echo "IP forwarding configured successfully."

      # ==========================================================
      # 09. Prepare OmniRoute directory
      # ==========================================================

      - name: 09. Prepare OmniRoute Directory
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          sudo mkdir -p "$OMNIROUTE_HOME"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$OMNIROUTE_HOME"

          sudo chmod 700 \
            "$OMNIROUTE_HOME"

          echo "Prepared: $OMNIROUTE_HOME"

      # ==========================================================
      # 10. Restore SQLite database
      # ==========================================================

      - name: 10. Restore OmniRoute SQLite Database
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          SOURCE_DB="$GITHUB_WORKSPACE/$OMNIROUTE_DB_PATH"
          TARGET_DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"

          if [[ -f "$SOURCE_DB" ]]; then
            echo "Restoring OmniRoute database..."

            sudo install \
              -o "$SSH_USERNAME" \
              -g "$SSH_USERNAME" \
              -m 600 \
              "$SOURCE_DB" \
              "$TARGET_DB"

            echo "Database restored."
          else
            echo "No previous OmniRoute database found."
            echo "OmniRoute will initialize a new database."
          fi

      # ==========================================================
      # 11. Restore .env
      # ==========================================================

      - name: 11. Restore OmniRoute Environment
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
        run: |
          set -euo pipefail

          ENV_FILE="/home/$SSH_USERNAME/.omniroute/.env"

          printf '%s\n' "$OMNIROUTE_ENV" |
            sudo tee "$ENV_FILE" >/dev/null

          sudo chown \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$ENV_FILE"

          sudo chmod 600 "$ENV_FILE"

          echo "OmniRoute environment restored."

      # ==========================================================
      # 12. Normalize and validate .env
      # ==========================================================

      - name: 12. Normalize And Validate OmniRoute Environment
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          ENV_FILE="/home/$SSH_USERNAME/.omniroute/.env"

          sudo test -f "$ENV_FILE"

          if ! sudo grep -Eq '^HOSTNAME=' "$ENV_FILE"; then
            printf '%s\n' 'HOSTNAME=0.0.0.0' |
              sudo tee -a "$ENV_FILE" >/dev/null
          else
            sudo sed -i \
              's/^HOSTNAME=.*/HOSTNAME=0.0.0.0/' \
              "$ENV_FILE"
          fi

          if ! sudo grep -Eq '^OMNIROUTE_SERVER_HOST=' "$ENV_FILE"; then
            printf '%s\n' 'OMNIROUTE_SERVER_HOST=0.0.0.0' |
              sudo tee -a "$ENV_FILE" >/dev/null
          else
            sudo sed -i \
              's/^OMNIROUTE_SERVER_HOST=.*/OMNIROUTE_SERVER_HOST=0.0.0.0/' \
              "$ENV_FILE"
          fi

          if ! sudo grep -Eq '^STORAGE_ENCRYPTION_KEY=' "$ENV_FILE"; then
            printf 'STORAGE_ENCRYPTION_KEY=%s\n' \
              "$STORAGE_ENCRYPTION_KEY" |
              sudo tee -a "$ENV_FILE" >/dev/null
          fi

          if ! sudo grep -Eq '^STORAGE_ENCRYPTION_KEY=.+$' "$ENV_FILE"; then
            echo "ERROR: STORAGE_ENCRYPTION_KEY is empty."
            exit 1
          fi

          sudo chown \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$ENV_FILE"

          sudo chmod 600 "$ENV_FILE"

          echo "OmniRoute environment validated."

      # ==========================================================
      # 13. Install Node.js 24
      # ==========================================================

      - name: 13. Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ==========================================================
      # 14. Install exact OmniRoute
      # ==========================================================

      - name: 14. Install OmniRoute
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo -u "$SSH_USERNAME" \
            mkdir -p "/home/$SSH_USERNAME/.npm-global"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "/home/$SSH_USERNAME/.npm-global"

          sudo -u "$SSH_USERNAME" \
            npm config set prefix \
              "/home/$SSH_USERNAME/.npm-global"

          sudo -u "$SSH_USERNAME" \
            npm install -g \
              "omniroute@$OMNIROUTE_VERSION"

      # ==========================================================
      # 15. Verify installation
      # ==========================================================

      - name: 15. Verify OmniRoute Installation
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo -u "$SSH_USERNAME" \
            "/home/$SSH_USERNAME/.npm-global/bin/omniroute" \
            --version

      # ==========================================================
      # 16. Create systemd service
      # ==========================================================

      - name: 16. Create OmniRoute Systemd Service
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo tee /etc/systemd/system/omniroute.service >/dev/null <<EOF
          [Unit]
          Description=OmniRoute AI Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$SSH_USERNAME
          Group=$SSH_USERNAME

          WorkingDirectory=/home/$SSH_USERNAME/.omniroute

          Environment=HOME=/home/$SSH_USERNAME
          Environment=NODE_ENV=production
          Environment=PORT=$OMNIROUTE_PORT
          Environment=DATA_DIR=/home/$SSH_USERNAME/.omniroute
          Environment=PATH=/home/$SSH_USERNAME/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          EnvironmentFile=/home/$SSH_USERNAME/.omniroute/.env

          Environment=OMNIROUTE_SERVER_HOST=0.0.0.0
          Environment=HOSTNAME=0.0.0.0

          ExecStart=/home/$SSH_USERNAME/.npm-global/bin/omniroute

          Restart=on-failure
          RestartSec=5

          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable omniroute.service

      # ==========================================================
      # 17. Start OmniRoute
      # ==========================================================

      - name: 17. Start OmniRoute
        run: |
          set -euo pipefail

          sudo systemctl restart omniroute.service

          sleep 5

          sudo systemctl \
            --no-pager \
            --full \
            status \
            omniroute.service || true

      # ==========================================================
      # 18. Verify TCP bind
      # ==========================================================

      - name: 18. Verify OmniRoute TCP Bind
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if sudo ss -lntp |
              grep -q ":$OMNIROUTE_PORT"; then

              echo "OmniRoute is listening on port $OMNIROUTE_PORT."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: OmniRoute did not bind to port $OMNIROUTE_PORT."

          sudo journalctl \
            -u omniroute.service \
            --no-pager \
            -n 100 || true

          exit 1

      # ==========================================================
      # 19. Setup Tailscale
      #
      # This now:
      #   1. Installs Tailscale
      #   2. Enables tailscaled
      #   3. Makes SSH_USERNAME the Tailscale operator
      #   4. Enables Exit Node advertisement
      #   5. Explicitly enables forwarding
      # ==========================================================

      - name: 19. Setup Tailscale Exit Node
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          curl -fsSL \
            https://tailscale.com/install.sh |
            sh

          sudo systemctl enable --now tailscaled

          # ------------------------------------------------------
          # Make the SSH user the Tailscale operator.
          #
          # After this, interactive Tailscale commands can be
          # executed by SSH_USERNAME without sudo.
          # ------------------------------------------------------

          sudo tailscale set \
            --operator="$SSH_USERNAME"

          echo "Tailscale operator configured: $SSH_USERNAME"

          # ------------------------------------------------------
          # Configure Exit Node.
          #
          # We explicitly specify hostname because tailscale up
          # requires all non-default settings to be mentioned.
          # ------------------------------------------------------

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="omniroute" \
            --advertise-exit-node

          # ------------------------------------------------------
          # Verify Linux forwarding after Tailscale setup.
          # ------------------------------------------------------

          echo
          echo "IPv4 forwarding:"
          sysctl net.ipv4.ip_forward

          echo "IPv6 forwarding:"
          sysctl net.ipv6.conf.all.forwarding

          # ------------------------------------------------------
          # Verify Tailscale.
          # ------------------------------------------------------

          echo
          echo "Tailscale status:"
          sudo tailscale status

          echo
          echo "Tailscale IP:"
          sudo tailscale ip

      # ==========================================================
      # 20. Verify SSH user administrator access
      # ==========================================================

      - name: 20. Verify SSH User Administrator Access
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          echo "Verifying administrator access for: $SSH_USERNAME"

          sudo -u "$SSH_USERNAME" \
            id

          sudo -u "$SSH_USERNAME" \
            sudo -n true

          sudo -u "$SSH_USERNAME" \
            sudo -n id

          echo
          echo "Administrator verification passed."

      # ==========================================================
      # 21. Install model health / combo synchronization script
      # ==========================================================

      - name: 21. Install Model Health And Combo Sync Script
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          TEST_DIR="/home/$SSH_USERNAME/omniroute-tests"
          SCRIPT="$TEST_DIR/check-and-sync.sh"

          sudo mkdir -p "$TEST_DIR"
          sudo mkdir -p "$TEST_DIR/history"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$TEST_DIR"

          sudo chmod 700 "$TEST_DIR"
          sudo chmod 700 "$TEST_DIR/history"

          sudo -u "$SSH_USERNAME" tee "$SCRIPT" >/dev/null <<'SCRIPT'
          #!/usr/bin/env bash

          set -euo pipefail

          BASE_URL="${OMNIROUTE_BASE_URL:-http://127.0.0.1:20128}"
          API_KEY="${OMNIROUTE_API_KEY:-}"

          TEST_DIR="${HOME}/omniroute-tests"

          TIMEOUT="${OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS:-45}"
          PARALLELISM="${OMNIROUTE_MODEL_TEST_PARALLELISM:-6}"
          MAX_MODELS="${OMNIROUTE_MAX_MODELS_PER_CYCLE:-100}"

          mkdir -p "$TEST_DIR/history"

          TIMESTAMP="$(date -u '+%Y%m%d-%H%M%S')"

          REPORT="$TEST_DIR/model-results-${TIMESTAMP}.tsv"
          PASS_LIST="$TEST_DIR/pass-models-${TIMESTAMP}.txt"
          COMBOS_JSON="$TEST_DIR/combos-${TIMESTAMP}.json"

          LATEST_REPORT="$TEST_DIR/latest-models.tsv"
          LATEST_PASS_LIST="$TEST_DIR/pass-models.txt"
          LATEST_COMBOS="$TEST_DIR/latest-combos.txt"

          FAILURE_LOG="$TEST_DIR/last-failures.log"

          echo "=============================================="
          echo "OmniRoute model health cycle"
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "=============================================="

          AUTH_HEADER="Authorization: Bearer $API_KEY"

          MODELS_JSON="$TEST_DIR/models-${TIMESTAMP}.json"

          # ------------------------------------------------------
          # Get model catalog
          # ------------------------------------------------------

          if ! curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              -H "$AUTH_HEADER" \
              "$BASE_URL/v1/models" \
              > "$MODELS_JSON"; then

            echo
            echo "WARNING: Unable to read OmniRoute /v1/models."
            echo "WARNING: Existing combos will be preserved."
            echo "WARNING: Runner will continue normally."

            exit 0
          fi

          # ------------------------------------------------------
          # Select concrete provider/model IDs.
          # ------------------------------------------------------

          mapfile -t MODELS < <(
            jq -r '
              .data[]?.id
              | select(type == "string")
              | select(contains("/"))
              | select(startswith("auto/") | not)
            ' "$MODELS_JSON" 2>/dev/null |
            grep -Ev '^(coding|coding-fast|reasoning|fast)$' |
            sort -u |
            head -n "$MAX_MODELS"
          )

          if [[ "${#MODELS[@]}" -eq 0 ]]; then
            echo
            echo "WARNING: No concrete provider/model IDs were found."
            echo "WARNING: Existing combos will be preserved."
            echo "WARNING: Runner will continue normally."

            exit 0
          fi

          echo "Testing ${#MODELS[@]} concrete models..."

          printf 'model\tstatus\tlatency_ms\terror\n' > "$REPORT"

          : > "$PASS_LIST"
          : > "$FAILURE_LOG"

          # ------------------------------------------------------
          # Test one model
          # ------------------------------------------------------

          test_model() {
            local model="$1"
            local start
            local end
            local latency
            local response_file
            local http_code
            local error_text
            local curl_exit

            response_file="$(mktemp)"

            start="$(date +%s%3N)"

            set +e

            http_code="$(
              curl \
                --silent \
                --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --max-time "$TIMEOUT" \
                -H "$AUTH_HEADER" \
                -H 'Content-Type: application/json' \
                "$BASE_URL/v1/chat/completions" \
                -d "$(jq -nc \
                  --arg model "$model" \
                  '{
                    model: $model,
                    messages: [
                      {
                        role: "user",
                        content: "Reply with exactly: OK"
                      }
                    ],
                    max_tokens: 8,
                    temperature: 0
                  }'
                )"
            )"

            curl_exit=$?

            set -e

            end="$(date +%s%3N)"
            latency=$((end - start))

            if [[ \
              "$curl_exit" -eq 0 &&
              "$http_code" =~ ^2[0-9][0-9]$
            ]]; then

              printf '%s\tPASS\t%s\t\n' \
                "$model" \
                "$latency" >> "$REPORT"

              printf '%s\n' \
                "$model" >> "$PASS_LIST"

            else
              error_text="$(
                jq -r '
                  .error.message //
                  .error //
                  .message //
                  empty
                ' "$response_file" 2>/dev/null |
                head -c 500
              )"

              if [[ -z "$error_text" ]]; then
                error_text="HTTP $http_code"
              fi

              printf '%s\tFAIL\t%s\t%s\n' \
                "$model" \
                "$latency" \
                "$error_text" >> "$REPORT"

              printf '%s\t%s\t%s\n' \
                "$model" \
                "$http_code" \
                "$error_text" >> "$FAILURE_LOG"
            fi

            rm -f "$response_file"
          }

          # ------------------------------------------------------
          # Parallel model testing
          # ------------------------------------------------------

          running=0

          for model in "${MODELS[@]}"; do
            test_model "$model" &

            running=$((running + 1))

            if [[ "$running" -ge "$PARALLELISM" ]]; then
              wait
              running=0
            fi
          done

          if [[ "$running" -gt 0 ]]; then
            wait
          fi

          sort -o "$PASS_LIST" "$PASS_LIST"

          PASS_COUNT="$(wc -l < "$PASS_LIST" | tr -d ' ')"

          FAIL_COUNT="$(
            grep -c $'\tFAIL\t' "$REPORT" || true
          )"

          echo
          echo "PASS count: $PASS_COUNT"
          echo "FAIL count: $FAIL_COUNT"
          echo

          if [[ "$PASS_COUNT" -gt 0 ]]; then
            echo "PASS models:"
            cat "$PASS_LIST"
          else
            echo "PASS models: none"
          fi

          cp "$REPORT" "$LATEST_REPORT"
          cp "$PASS_LIST" "$LATEST_PASS_LIST"

          cp "$REPORT" \
            "$TEST_DIR/history/model-results-${TIMESTAMP}.tsv"

          cp "$PASS_LIST" \
            "$TEST_DIR/history/pass-models-${TIMESTAMP}.txt"

          # ------------------------------------------------------
          # Zero healthy models is NOT a workflow failure.
          # ------------------------------------------------------

          if [[ "$PASS_COUNT" -eq 0 ]]; then
            echo
            echo "WARNING: Zero models passed this health cycle."
            echo "WARNING: Existing combos will be preserved."
            echo "WARNING: Runner will continue normally."

            if [[ -s "$FAILURE_LOG" ]]; then
              echo
              echo "Top model failures:"
              head -n 20 "$FAILURE_LOG" || true
            fi

            exit 0
          fi

          # ------------------------------------------------------
          # Retrieve existing combos
          # ------------------------------------------------------

          if ! curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              -H "$AUTH_HEADER" \
              "$BASE_URL/api/combos" \
              > "$COMBOS_JSON"; then

            echo
            echo "WARNING: Could not retrieve existing combos."
            echo "WARNING: Existing server-side combos will not be modified."
            echo "WARNING: Runner will continue normally."

            exit 0
          fi

          # ------------------------------------------------------
          # Save readable combo report
          # ------------------------------------------------------

          jq -r '
            .[]
            | [
                (.name // .id // "unknown"),
                (
                  .models
                  // .config.models
                  // []
                  | map(
                      if type == "string"
                      then .
                      elif .model
                      then .model
                      else tostring
                      end
                    )
                  | join(",")
                )
              ]
            | @tsv
          ' "$COMBOS_JSON" \
            > "$LATEST_COMBOS" 2>/dev/null || true

          # ------------------------------------------------------
          # Determine whether model passed
          # ------------------------------------------------------

          is_passed_model() {
            local model="$1"

            grep -Fxq "$model" "$PASS_LIST"
          }

          # ------------------------------------------------------
          # Build combo model list
          # ------------------------------------------------------

          build_models_json() {
            local existing_json="$1"
            local desired_count="$2"

            local result='[]'

            while IFS= read -r existing_model; do
              [[ -z "$existing_model" ]] && continue

              if is_passed_model "$existing_model"; then
                result="$(
                  jq -c \
                    --arg model "$existing_model" \
                    '. + [$model] | unique' \
                    <<< "$result"
                )"
              fi

            done < <(
              jq -r '
                .[]
                | if type == "string"
                  then .
                  elif .model
                  then .model
                  else empty
                  end
              ' <<< "$existing_json"
            )

            while IFS= read -r candidate; do
              [[ -z "$candidate" ]] && continue

              if [[ \
                "$(jq 'length' <<< "$result")" \
                -ge "$desired_count"
              ]]; then
                break
              fi

              result="$(
                jq -c \
                  --arg model "$candidate" \
                  '. + [$model] | unique' \
                  <<< "$result"
              )"

            done < "$PASS_LIST"

            printf '%s\n' "$result"
          }

          # ------------------------------------------------------
          # Combo sizes
          # ------------------------------------------------------

          declare -A COMBO_SIZES=(
            [coding]=5
            [coding-fast]=3
            [reasoning]=5
            [fast]=3
          )

          # ------------------------------------------------------
          # Get combo ID
          # ------------------------------------------------------

          get_combo_id() {
            local name="$1"

            jq -r \
              --arg name "$name" \
              '
                .[]
                | select(
                    (.name // .id // "") == $name
                  )
                | (.id // "")
              ' \
              "$COMBOS_JSON" |
              head -n 1
          }

          # ------------------------------------------------------
          # Sync one combo
          # ------------------------------------------------------

          sync_combo() {
            local name="$1"
            local desired_count="$2"

            local combo_id
            local existing_models
            local models_json
            local payload
            local response_file

            combo_id="$(get_combo_id "$name")"

            if [[ -n "$combo_id" ]]; then
              existing_models="$(
                jq -c \
                  --arg name "$name" \
                  '
                    [
                      .[]
                      | select(
                          (.name // .id // "") == $name
                        )
                      | (
                          .models
                          // .config.models
                          // []
                        )
                      | .[]
                    ]
                  ' "$COMBOS_JSON"
              )"
            else
              existing_models='[]'
            fi

            models_json="$(
              build_models_json \
                "$existing_models" \
                "$desired_count"
            )"

            if [[ "$models_json" == "[]" ]]; then
              echo "WARNING: $name has no candidate models."
              echo "WARNING: Preserving existing combo."
              return 0
            fi

            payload="$(
              jq -nc \
                --arg name "$name" \
                --argjson models "$models_json" \
                '{
                  name: $name,
                  models: $models
                }'
            )"

            response_file="$(mktemp)"

            if [[ -n "$combo_id" ]]; then
              echo "Updating combo: $name ($combo_id)"

              if ! curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 30 \
                  -X PUT \
                  -H "$AUTH_HEADER" \
                  -H 'Content-Type: application/json' \
                  "$BASE_URL/api/combos/$combo_id" \
                  -d "$payload" \
                  > "$response_file"; then

                echo "WARNING: Failed to update combo: $name"
                echo "WARNING: Existing combo remains unchanged."

                rm -f "$response_file"
                return 0
              fi

            else
              echo "Creating combo: $name"

              if ! curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 30 \
                  -X POST \
                  -H "$AUTH_HEADER" \
                  -H 'Content-Type: application/json' \
                  "$BASE_URL/api/combos" \
                  -d "$payload" \
                  > "$response_file"; then

                echo "WARNING: Failed to create combo: $name"

                rm -f "$response_file"
                return 0
              fi
            fi

            rm -f "$response_file"

            echo "Combo synchronized: $name"
            echo "Models: $models_json"
          }

          # ------------------------------------------------------
          # Synchronize configured combos
          # ------------------------------------------------------

          for combo_name in \
            coding \
            coding-fast \
            reasoning \
            fast
          do
            sync_combo \
              "$combo_name" \
              "${COMBO_SIZES[$combo_name]}"
          done

          # ------------------------------------------------------
          # Retain seven days of history
          # ------------------------------------------------------

          find "$TEST_DIR/history" \
            -type f \
            -mtime +7 \
            -delete \
            2>/dev/null || true

          echo
          echo "Model health/combo synchronization completed."

          exit 0
          SCRIPT

          sudo chmod 700 "$SCRIPT"

          sudo chown \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$SCRIPT"

          sudo test -x "$SCRIPT"

          echo "Installed model health script:"
          echo "$SCRIPT"

      # ==========================================================
      # 22. Initial model check
      # ==========================================================

      - name: 22. Initial Model Check And Combo Sync
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ env.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS: ${{ env.OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS }}
          OMNIROUTE_MODEL_TEST_PARALLELISM: ${{ env.OMNIROUTE_MODEL_TEST_PARALLELISM }}
          OMNIROUTE_MAX_MODELS_PER_CYCLE: ${{ env.OMNIROUTE_MAX_MODELS_PER_CYCLE }}
        run: |
          set -euo pipefail

          SCRIPT="/home/$SSH_USERNAME/omniroute-tests/check-and-sync.sh"

          sudo test -x "$SCRIPT"

          echo "Running initial OmniRoute model health check..."

          sudo -u "$SSH_USERNAME" \
            env \
              HOME="/home/$SSH_USERNAME" \
              OMNIROUTE_BASE_URL="$OMNIROUTE_BASE_URL" \
              OMNIROUTE_API_KEY="$OMNIROUTE_API_KEY" \
              OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS="$OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS" \
              OMNIROUTE_MODEL_TEST_PARALLELISM="$OMNIROUTE_MODEL_TEST_PARALLELISM" \
              OMNIROUTE_MAX_MODELS_PER_CYCLE="$OMNIROUTE_MAX_MODELS_PER_CYCLE" \
            "$SCRIPT"

          echo
          echo "Initial model health check completed."
          echo "Zero passing models is non-fatal."
          echo "The runner will continue."

      # ==========================================================
      # 23. Telegram online notification
      # ==========================================================

      - name: 23. Telegram Online Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          TAILSCALE_IP="$(
            sudo tailscale ip -4 |
            head -n 1
          )"

          test -n "$TAILSCALE_IP"

          TAILSCALE_DNS="$(
            sudo tailscale dns status 2>/dev/null |
            grep -Eo '[A-Za-z0-9._-]+\.ts\.net' |
            head -n 1 ||
            true
          )"

          [ -z "$TAILSCALE_DNS" ] &&
            TAILSCALE_DNS="Not detected"

          MESSAGE="$(cat <<EOF
          🚀 OmniRoute Linux Server is ONLINE
          ━━━━━━━━━━━━━━━━━━━━
          Tailscale
          ━━━━━━━━━━━━━━━━━━━━

          Hostname:
          $TAILSCALE_DNS

          IP:
          $TAILSCALE_IP

          ━━━━━━━━━━━━━━━━━━━━
          SSH
          ━━━━━━━━━━━━━━━━━━━━

          ssh $SSH_USERNAME@$TAILSCALE_IP

          Port:
          22

          ━━━━━━━━━━━━━━━━━━━━
          OmniRoute
          ━━━━━━━━━━━━━━━━━━━━

          URL:
          http://$TAILSCALE_IP:$OMNIROUTE_PORT

          Omniroute:
          http://omniroute.taile1a1a.ts.net:20128

          API:
          http://$TAILSCALE_IP:$OMNIROUTE_PORT/v1

          Port:
          $OMNIROUTE_PORT

          Bind:
          0.0.0.0

          Version:
          $OMNIROUTE_VERSION

          ━━━━━━━━━━━━━━━━━━━━
          Status
          ━━━━━━━━━━━━━━━━━━━━

          Service: RUNNING
          Runtime: approximately 6 hours

          The GitHub Actions runner is active.
          EOF
          )"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --max-time 20 \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}"
          )"

          echo "$RESPONSE" |
            grep -q '"ok":true' || {
              echo "ERROR: Telegram API did not report success."
              exit 1
            }

          echo "Telegram notification sent."

      # ==========================================================
      # 24. Keep runner alive and check models
      # ==========================================================

      - name: 24. Keep Runner Alive And Check Models
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ env.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS: ${{ env.OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS }}
          OMNIROUTE_MODEL_TEST_PARALLELISM: ${{ env.OMNIROUTE_MODEL_TEST_PARALLELISM }}
          OMNIROUTE_MAX_MODELS_PER_CYCLE: ${{ env.OMNIROUTE_MAX_MODELS_PER_CYCLE }}
        run: |
          set -euo pipefail

          SCRIPT="/home/$SSH_USERNAME/omniroute-tests/check-and-sync.sh"

          END_TIME="$(
            date \
              -u \
              -d "+${OMNIROUTE_RUNTIME_MINUTES} minutes" \
              +%s
          )"

          echo "Runner will remain alive for approximately ${OMNIROUTE_RUNTIME_MINUTES} minutes."

          while true; do
            NOW="$(date -u +%s)"

            if [[ "$NOW" -ge "$END_TIME" ]]; then
              echo "Runtime window completed."
              break
            fi

            echo
            echo "=============================================="
            echo "Periodic OmniRoute model health check"
            echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "=============================================="

            if ! sudo -u "$SSH_USERNAME" \
              env \
                HOME="/home/$SSH_USERNAME" \
                OMNIROUTE_BASE_URL="$OMNIROUTE_BASE_URL" \
                OMNIROUTE_API_KEY="$OMNIROUTE_API_KEY" \
                OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS="$OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS" \
                OMNIROUTE_MODEL_TEST_PARALLELISM="$OMNIROUTE_MODEL_TEST_PARALLELISM" \
                OMNIROUTE_MAX_MODELS_PER_CYCLE="$OMNIROUTE_MAX_MODELS_PER_CYCLE" \
              "$SCRIPT"
            then
              echo "ERROR: Model health/combo synchronization failed."
              echo "The failure was not caused merely by zero passing models."
              exit 1
            fi

            NOW="$(date -u +%s)"

            if [[ "$NOW" -ge "$END_TIME" ]]; then
              break
            fi

            echo
            echo "Next model health cycle in ${OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES} minutes."

            sleep_seconds=$(
              ((OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES * 60))
            )

            remaining=$((END_TIME - NOW))

            if [[ "$sleep_seconds" -gt "$remaining" ]]; then
              sleep_seconds="$remaining"
            fi

            if [[ "$sleep_seconds" -gt 0 ]]; then
              sleep "$sleep_seconds"
            fi
          done

      # ==========================================================
      # 25. Stop OmniRoute
      # ==========================================================

      - name: 25. Stop OmniRoute
        if: always()
        run: |
          set -euo pipefail

          sudo systemctl stop omniroute.service || true
          sudo systemctl is-active omniroute.service || true

      # ==========================================================
      # 26. Finalize SQLite
      # ==========================================================

      - name: 26. Finalize OmniRoute SQLite
        if: always()
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"

          if sudo test -f "$DB"; then
            echo "Running SQLite WAL checkpoint..."

            sudo -u "$SSH_USERNAME" \
              sqlite3 "$DB" \
              'PRAGMA wal_checkpoint(TRUNCATE);' || true

            sudo -u "$SSH_USERNAME" \
              sqlite3 "$DB" \
              'PRAGMA optimize;' || true

            echo "Running SQLite integrity check..."

            sudo -u "$SSH_USERNAME" \
              sqlite3 "$DB" \
              'PRAGMA integrity_check;' || true

            sudo chown \
              "$SSH_USERNAME:$SSH_USERNAME" \
              "$DB"

            sudo chmod 600 "$DB"
          else
            echo "No SQLite database found."
          fi

      # ==========================================================
      # 27. Authenticate GitHub CLI
      # ==========================================================

      - name: 27. Authenticate GitHub CLI
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh auth status

      # ==========================================================
      # 28. Synchronize repository safely
      # ==========================================================

      - name: 28. Synchronize Repository Safely
        if: always()
        run: |
          set -euo pipefail

          git status --short

          git fetch origin

          CURRENT_BRANCH="$(git branch --show-current)"

          if [[ -z "$CURRENT_BRANCH" ]]; then
            CURRENT_BRANCH="main"
          fi

          echo "Current branch: $CURRENT_BRANCH"

          if git show-ref --verify --quiet \
            "refs/remotes/origin/$CURRENT_BRANCH"
          then
            git merge --no-edit \
              "origin/$CURRENT_BRANCH"
          fi

      # ==========================================================
      # 29. Security check
      # ==========================================================

      - name: 29. Security Check
        if: always()
        run: |
          set -euo pipefail

          forbidden_files=(
            '.env'
            'omniroute.log'
            'storage.sqlite-wal'
            'storage.sqlite-shm'
          )

          for file in "${forbidden_files[@]}"; do
            if git ls-files --error-unmatch "$file" \
              >/dev/null 2>&1
            then
              echo "ERROR: Forbidden file is tracked: $file"
              exit 1
            fi
          done

          if git ls-files |
            grep -E \
              '(^|/)\.env$|storage\.sqlite-(wal|shm)$' \
              >/dev/null 2>&1
          then
            echo "ERROR: Sensitive OmniRoute files are tracked."
            exit 1
          fi

          echo "Repository security check passed."

      # ==========================================================
      # 30. Remove legacy backups
      # ==========================================================

      - name: 30. Remove Legacy OmniRoute Backups
        if: always()
        run: |
          set -euo pipefail

          mkdir -p backup/omniroute

          find backup/omniroute \
            -type f \
            ! -name 'storage.sqlite' \
            -delete \
            2>/dev/null || true

      # ==========================================================
      # 31. Backup SQLite
      # ==========================================================

      - name: 31. Backup OmniRoute SQLite
        if: always()
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          SOURCE_DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"
          TARGET_DB="$GITHUB_WORKSPACE/$OMNIROUTE_DB_PATH"

          if sudo test -f "$SOURCE_DB"; then
            sudo cp \
              "$SOURCE_DB" \
              "$TARGET_DB"

            sudo chown \
              "$(id -u):$(id -g)" \
              "$TARGET_DB"

            chmod 600 "$TARGET_DB"

            echo "SQLite database backed up."
          else
            echo "WARNING: OmniRoute SQLite database does not exist."
          fi

      # ==========================================================
      # 32. Check DB size
      # ==========================================================

      - name: 32. Check OmniRoute Database Size
        if: always()
        run: |
          set -euo pipefail

          DB="$GITHUB_WORKSPACE/$OMNIROUTE_DB_PATH"

          if [[ ! -f "$DB" ]]; then
            echo "No database file to check."
            exit 0
          fi

          SIZE_BYTES="$(stat -c '%s' "$DB")"
          SIZE_MB="$((SIZE_BYTES / 1024 / 1024))"

          echo "Database size: ${SIZE_MB} MB"

          MAX_MB=95

          if [[ "$SIZE_MB" -gt "$MAX_MB" ]]; then
            echo "ERROR: Database exceeds ${MAX_MB} MB."
            exit 1
          fi

      # ==========================================================
      # 33. Stage DB
      # ==========================================================

      - name: 33. Stage SQLite Database
        if: always()
        run: |
          set -euo pipefail

          git add \
            backup/omniroute/storage.sqlite

          git status --short

      # ==========================================================
      # 34. Commit
      # ==========================================================

      - name: 34. Commit OmniRoute State
        if: always()
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No OmniRoute state changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update OmniRoute state"

      # ==========================================================
      # 35. Push
      # ==========================================================

      - name: 35. Push OmniRoute State
        if: always()
        run: |
          set -euo pipefail

          git push origin HEAD

      # ==========================================================
      # 36. Final repository validation
      # ==========================================================

      - name: 36. Final Repository Validation
        if: always()
        run: |
          set -euo pipefail

          git status --short
          git log -1 --oneline

          if git ls-files |
            grep -E \
              '(^|/)\.env$|storage\.sqlite-(wal|shm)$' \
              >/dev/null 2>&1
          then
            echo "ERROR: Sensitive files are tracked."
            exit 1
          fi

          echo "Final repository validation passed."

      # ==========================================================
      # 37. Verify OmniRoute stopped
      # ==========================================================

      - name: 37. Verify OmniRoute Service Stopped
        if: always()
        run: |
          set -euo pipefail

          if sudo systemctl is-active --quiet omniroute.service; then
            echo "WARNING: OmniRoute service is still active."
            sudo systemctl stop omniroute.service || true
          fi

          echo "OmniRoute service is stopped."
