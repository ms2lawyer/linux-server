
name: Linux OmniRoute Server

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: permanent-linux-ssh-server
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    env:
      OMNIROUTE_PORT: '20128'
      OMNIROUTE_VERSION: '3.8.49'
      OMNIROUTE_RUNTIME_MINUTES: '350'
      OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES: '30'
      OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS: '45'
      OMNIROUTE_MODEL_TEST_PARALLELISM: '6'
      OMNIROUTE_MAX_MODELS_PER_CYCLE: '100'
      OMNIROUTE_DB_PATH: 'backup/omniroute/storage.sqlite'
      OMNIROUTE_BASE_URL: 'http://127.0.0.1:20128'

    steps:

      # ==========================================================
      # 01. Checkout
      # ==========================================================

      - name: 01. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 02. Validate configuration
      # ==========================================================

      - name: 02. Validate Required GitHub Configuration
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          required_vars=(
            SSH_USERNAME
            SSH_PASSWORD
            TAILSCALE_AUTHKEY
            OMNIROUTE_ENV
            OMNIROUTE_API_KEY
            STORAGE_ENCRYPTION_KEY
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: Required configuration is missing: $name"
              exit 1
            fi
          done

          echo "All required GitHub configuration is present."

      # ==========================================================
      # 03. Install packages
      # ==========================================================

      - name: 03. Install Required Packages
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            jq \
            git \
            openssh-server \
            sqlite3 \
            ca-certificates \
            gnupg \
            lsof \
            net-tools \
            unzip

      # ==========================================================
      # 04. Install GitHub CLI
      # ==========================================================

      - name: 04. Install GitHub CLI
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            type -p curl >/dev/null
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg |
              sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg

            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg

            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" |
              sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null

            sudo apt-get update
            sudo apt-get install -y gh
          fi

          gh --version

      # ==========================================================
      # 05. Configure Git
      # ==========================================================

      - name: 05. Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global pull.rebase false
          git config --global init.defaultBranch main

      # ==========================================================
      # 06. Setup SSH server
      # ==========================================================

      - name: 06. Setup SSH Server
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          if ! id "$SSH_USERNAME" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$SSH_USERNAME"
          fi

          echo "$SSH_USERNAME:$SSH_PASSWORD" | sudo chpasswd

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sudo sed -i \
            -E 's/^#?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            -E 's/^#?PubkeyAuthentication .*/PubkeyAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo systemctl restart ssh

          echo "SSH server configured for user: $SSH_USERNAME"

      # ==========================================================
      # 07. Prepare OmniRoute directory
      # ==========================================================

      - name: 07. Prepare OmniRoute Directory
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          sudo mkdir -p "$OMNIROUTE_HOME"
          sudo chown -R "$SSH_USERNAME:$SSH_USERNAME" "$OMNIROUTE_HOME"
          sudo chmod 700 "$OMNIROUTE_HOME"

          echo "Prepared: $OMNIROUTE_HOME"

      # ==========================================================
      # 08. Restore SQLite database
      # ==========================================================

      - name: 08. Restore OmniRoute SQLite Database
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          SOURCE_DB="$GITHUB_WORKSPACE/$OMNIROUTE_DB_PATH"
          TARGET_DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"

          if [[ -f "$SOURCE_DB" ]]; then
            echo "Restoring OmniRoute database..."

            sudo install \
              -o "$SSH_USERNAME" \
              -g "$SSH_USERNAME" \
              -m 600 \
              "$SOURCE_DB" \
              "$TARGET_DB"

            echo "Database restored."
          else
            echo "No previous OmniRoute database found."
            echo "OmniRoute will initialize a new database."
          fi

      # ==========================================================
      # 09. Restore .env
      # ==========================================================

      - name: 09. Restore OmniRoute Environment
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
        run: |
          set -euo pipefail

          ENV_FILE="/home/$SSH_USERNAME/.omniroute/.env"

          printf '%s\n' "$OMNIROUTE_ENV" |
            sudo tee "$ENV_FILE" >/dev/null

          sudo chown "$SSH_USERNAME:$SSH_USERNAME" "$ENV_FILE"
          sudo chmod 600 "$ENV_FILE"

          echo "OmniRoute environment restored."

      # ==========================================================
      # 10. Normalize and validate .env
      # ==========================================================

      - name: 10. Normalize And Validate OmniRoute Environment
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          ENV_FILE="/home/$SSH_USERNAME/.omniroute/.env"

          sudo test -f "$ENV_FILE"

          if ! sudo grep -Eq '^HOSTNAME=' "$ENV_FILE"; then
            printf '\nHOSTNAME=0.0.0.0\n' |
              sudo tee -a "$ENV_FILE" >/dev/null
          else
            sudo sed -i \
              's/^HOSTNAME=.*/HOSTNAME=0.0.0.0/' \
              "$ENV_FILE"
          fi

          if ! sudo grep -Eq '^OMNIROUTE_SERVER_HOST=' "$ENV_FILE"; then
            printf 'OMNIROUTE_SERVER_HOST=0.0.0.0\n' |
              sudo tee -a "$ENV_FILE" >/dev/null
          else
            sudo sed -i \
              's/^OMNIROUTE_SERVER_HOST=.*/OMNIROUTE_SERVER_HOST=0.0.0.0/' \
              "$ENV_FILE"
          fi

          if ! sudo grep -Eq '^STORAGE_ENCRYPTION_KEY=' "$ENV_FILE"; then
            printf 'STORAGE_ENCRYPTION_KEY=%s\n' "$STORAGE_ENCRYPTION_KEY" |
              sudo tee -a "$ENV_FILE" >/dev/null
          fi

          if ! sudo grep -Eq '^STORAGE_ENCRYPTION_KEY=.+$' "$ENV_FILE"; then
            echo "ERROR: STORAGE_ENCRYPTION_KEY is empty."
            exit 1
          fi

          sudo chown "$SSH_USERNAME:$SSH_USERNAME" "$ENV_FILE"
          sudo chmod 600 "$ENV_FILE"

          echo "OmniRoute environment validated."

      # ==========================================================
      # 11. Install Node.js 24
      # ==========================================================

      - name: 11. Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ==========================================================
      # 12. Install exact OmniRoute
      # ==========================================================

      - name: 12. Install OmniRoute
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo -u "$SSH_USERNAME" mkdir -p \
            "/home/$SSH_USERNAME/.npm-global"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "/home/$SSH_USERNAME/.npm-global"

          sudo -u "$SSH_USERNAME" \
            npm config set prefix "/home/$SSH_USERNAME/.npm-global"

          sudo -u "$SSH_USERNAME" \
            npm install -g "omniroute@$OMNIROUTE_VERSION"

      # ==========================================================
      # 13. Verify installation
      # ==========================================================

      - name: 13. Verify OmniRoute Installation
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo -u "$SSH_USERNAME" \
            "/home/$SSH_USERNAME/.npm-global/bin/omniroute" --version

      # ==========================================================
      # 14. Create systemd service
      # ==========================================================

      - name: 14. Create OmniRoute Systemd Service
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo tee /etc/systemd/system/omniroute.service >/dev/null <<EOF
          [Unit]
          Description=OmniRoute AI Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$SSH_USERNAME
          Group=$SSH_USERNAME
          WorkingDirectory=/home/$SSH_USERNAME/.omniroute

          Environment=HOME=/home/$SSH_USERNAME
          Environment=NODE_ENV=production
          Environment=PORT=$OMNIROUTE_PORT
          Environment=DATA_DIR=/home/$SSH_USERNAME/.omniroute
          Environment=PATH=/home/$SSH_USERNAME/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          EnvironmentFile=/home/$SSH_USERNAME/.omniroute/.env

          Environment=OMNIROUTE_SERVER_HOST=0.0.0.0
          Environment=HOSTNAME=0.0.0.0

          ExecStart=/home/$SSH_USERNAME/.npm-global/bin/omniroute

          Restart=on-failure
          RestartSec=5

          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable omniroute.service

      # ==========================================================
      # 15. Start OmniRoute
      # ==========================================================

      - name: 15. Start OmniRoute
        run: |
          set -euo pipefail

          sudo systemctl restart omniroute.service

          sleep 5

          sudo systemctl --no-pager --full status omniroute.service || true

      # ==========================================================
      # 16. Verify TCP bind
      # ==========================================================

      - name: 16. Verify OmniRoute TCP Bind
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if sudo ss -lntp | grep -q ":$OMNIROUTE_PORT"; then
              echo "OmniRoute is listening on port $OMNIROUTE_PORT."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: OmniRoute did not bind to port $OMNIROUTE_PORT."
          sudo journalctl -u omniroute.service --no-pager -n 100 || true
          exit 1

      # ==========================================================
      # 17. Setup Tailscale
      # ==========================================================

      - name: 17. Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="omniroute-ci-gateway"

          sudo tailscale status

      # ==========================================================
      # 18. Install model health / combo synchronization script
      # ==========================================================

      - name: 18. Install Model Health And Combo Sync Script
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          TEST_DIR="/home/$SSH_USERNAME/omniroute-tests"
          SCRIPT="$TEST_DIR/check-and-sync.sh"

          sudo mkdir -p "$TEST_DIR"
          sudo mkdir -p "$TEST_DIR/history"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$TEST_DIR"

          sudo chmod 700 "$TEST_DIR"
          sudo chmod 700 "$TEST_DIR/history"

          sudo -u "$SSH_USERNAME" tee "$SCRIPT" >/dev/null <<'SCRIPT'
          #!/usr/bin/env bash

          set -euo pipefail

          BASE_URL="${OMNIROUTE_BASE_URL:-http://127.0.0.1:20128}"
          API_KEY="${OMNIROUTE_API_KEY:-}"
          TEST_DIR="${HOME}/omniroute-tests"

          TIMEOUT="${OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS:-45}"
          PARALLELISM="${OMNIROUTE_MODEL_TEST_PARALLELISM:-6}"
          MAX_MODELS="${OMNIROUTE_MAX_MODELS_PER_CYCLE:-100}"

          mkdir -p "$TEST_DIR/history"

          TIMESTAMP="$(date -u '+%Y%m%d-%H%M%S')"

          REPORT="$TEST_DIR/model-results-${TIMESTAMP}.tsv"
          PASS_LIST="$TEST_DIR/pass-models-${TIMESTAMP}.txt"
          COMBOS_JSON="$TEST_DIR/combos-${TIMESTAMP}.json"

          LATEST_REPORT="$TEST_DIR/latest-models.tsv"
          LATEST_PASS_LIST="$TEST_DIR/pass-models.txt"
          LATEST_COMBOS="$TEST_DIR/latest-combos.txt"
          FAILURE_LOG="$TEST_DIR/last-failures.log"

          echo "=============================================="
          echo "OmniRoute model health cycle"
          echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "=============================================="

          AUTH_HEADER="Authorization: Bearer $API_KEY"

          MODELS_JSON="$TEST_DIR/models-${TIMESTAMP}.json"

          if ! curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              -H "$AUTH_HEADER" \
              "$BASE_URL/v1/models" \
              > "$MODELS_JSON"; then

            echo
            echo "WARNING: Unable to read OmniRoute /v1/models."
            echo "WARNING: Existing combos will be preserved."
            echo "WARNING: Runner will continue normally."
            exit 0
          fi

          mapfile -t MODELS < <(
            jq -r '
              .data[]?.id
              | select(type == "string")
              | select(contains("/") and
                       startswith("auto/") | not)
            ' "$MODELS_JSON" 2>/dev/null |
            grep -Ev '^(coding|coding-fast|reasoning|fast)$' |
            sort -u |
            head -n "$MAX_MODELS"
          )

          if [[ "${#MODELS[@]}" -eq 0 ]]; then
            echo
            echo "WARNING: No concrete provider/model IDs were found."
            echo "WARNING: Existing combos will be preserved."
            echo "WARNING: Runner will continue normally."
            exit 0
          fi

          echo "Testing ${#MODELS[@]} concrete models..."

          printf 'model\tstatus\tlatency_ms\terror\n' > "$REPORT"
          : > "$PASS_LIST"
          : > "$FAILURE_LOG"

          test_model() {
            local model="$1"
            local start
            local end
            local latency
            local response_file
            local http_code
            local error_text

            response_file="$(mktemp)"

            start="$(date +%s%3N)"

            set +e

            http_code="$(
              curl \
                --silent \
                --show-error \
                --output "$response_file" \
                --write-out '%{http_code}' \
                --max-time "$TIMEOUT" \
                -H "$AUTH_HEADER" \
                -H 'Content-Type: application/json' \
                "$BASE_URL/v1/chat/completions" \
                -d "$(jq -nc \
                  --arg model "$model" \
                  '{
                    model: $model,
                    messages: [
                      {
                        role: "user",
                        content: "Reply with exactly: OK"
                      }
                    ],
                    max_tokens: 8,
                    temperature: 0
                  }'
                )"
            )"

            local curl_exit=$?

            set -e

            end="$(date +%s%3N)"
            latency=$((end - start))

            if [[ "$curl_exit" -eq 0 && "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              printf '%s\tPASS\t%s\t\n' \
                "$model" \
                "$latency" >> "$REPORT"

              printf '%s\n' "$model" >> "$PASS_LIST"
            else
              error_text="$(
                jq -r '
                  .error.message //
                  .error //
                  .message //
                  empty
                ' "$response_file" 2>/dev/null |
                head -c 500
              )"

              if [[ -z "$error_text" ]]; then
                error_text="HTTP $http_code"
              fi

              printf '%s\tFAIL\t%s\t%s\n' \
                "$model" \
                "$latency" \
                "$error_text" >> "$REPORT"

              printf '%s\t%s\t%s\n' \
                "$model" \
                "$http_code" \
                "$error_text" >> "$FAILURE_LOG"
            fi

            rm -f "$response_file"
          }

          running=0

          for model in "${MODELS[@]}"; do
            test_model "$model" &

            running=$((running + 1))

            if [[ "$running" -ge "$PARALLELISM" ]]; then
              wait
              running=0
            fi
          done

          if [[ "$running" -gt 0 ]]; then
            wait
          fi

          sort -o "$PASS_LIST" "$PASS_LIST"

          PASS_COUNT="$(wc -l < "$PASS_LIST" | tr -d ' ')"
          FAIL_COUNT="$(grep -c $'\tFAIL\t' "$REPORT" || true)"

          echo
          echo "PASS count: $PASS_COUNT"
          echo "FAIL count: $FAIL_COUNT"
          echo

          if [[ "$PASS_COUNT" -gt 0 ]]; then
            echo "PASS models:"
            cat "$PASS_LIST"
          else
            echo "PASS models: none"
          fi

          cp "$REPORT" "$LATEST_REPORT"
          cp "$PASS_LIST" "$LATEST_PASS_LIST"

          cp "$REPORT" \
            "$TEST_DIR/history/model-results-${TIMESTAMP}.tsv"

          cp "$PASS_LIST" \
            "$TEST_DIR/history/pass-models-${TIMESTAMP}.txt"

          # ------------------------------------------------------
          # CRITICAL SAFETY RULE:
          #
          # Zero healthy models MUST NOT modify existing combos.
          # Zero healthy models MUST NOT terminate the runner.
          # ------------------------------------------------------

          if [[ "$PASS_COUNT" -eq 0 ]]; then
            echo
            echo "WARNING: Zero models passed this health cycle."
            echo "WARNING: Existing combos will be preserved."
            echo "WARNING: Runner will continue normally."

            if [[ -s "$FAILURE_LOG" ]]; then
              echo
              echo "Top model failures:"
              head -n 20 "$FAILURE_LOG" || true
            fi

            exit 0
          fi

          # ------------------------------------------------------
          # Retrieve existing combos
          # ------------------------------------------------------

          if ! curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              -H "$AUTH_HEADER" \
              "$BASE_URL/api/combos" \
              > "$COMBOS_JSON"; then

            echo
            echo "WARNING: Could not retrieve existing combos."
            echo "WARNING: Existing server-side combos will not be modified."
            echo "WARNING: Runner will continue normally."

            exit 0
          fi

          # ------------------------------------------------------
          # Save readable combo report
          # ------------------------------------------------------

          jq -r '
            .[]
            | [
                (.name // .id // "unknown"),
                (
                  .models
                  // .config.models
                  // []
                  | map(
                      if type == "string"
                      then .
                      elif .model
                      then .model
                      else tostring
                      end
                    )
                  | join(",")
                )
              ]
            | @tsv
          ' "$COMBOS_JSON" \
            > "$LATEST_COMBOS" 2>/dev/null || true

          # ------------------------------------------------------
          # Helper: determine whether a model passed
          # ------------------------------------------------------

          is_passed_model() {
            local model="$1"

            grep -Fxq "$model" "$PASS_LIST"
          }

          # ------------------------------------------------------
          # Build a model array for a combo.
          #
          # Existing models are retained only when they passed
          # the current health cycle.
          #
          # Then healthy models are appended until the desired
          # size is reached.
          # ------------------------------------------------------

          build_models_json() {
            local existing_json="$1"
            local desired_count="$2"

            local result='[]'

            while IFS= read -r existing_model; do
              [[ -z "$existing_model" ]] && continue

              if is_passed_model "$existing_model"; then
                result="$(
                  jq -c \
                    --arg model "$existing_model" \
                    '. + [$model] | unique' \
                    <<< "$result"
                )"
              fi
            done < <(
              jq -r '
                .[]
                | if type == "string"
                  then .
                  elif .model
                  then .model
                  else empty
                  end
              ' <<< "$existing_json"
            )

            while IFS= read -r candidate; do
              [[ -z "$candidate" ]] && continue

              if [[ "$(jq 'length' <<< "$result")" -ge "$desired_count" ]]; then
                break
              fi

              result="$(
                jq -c \
                  --arg model "$candidate" \
                  '. + [$model] | unique' \
                  <<< "$result"
              )"
            done < "$PASS_LIST"

            printf '%s\n' "$result"
          }

          # ------------------------------------------------------
          # Combo definitions
          # ------------------------------------------------------

          declare -A COMBO_SIZES=(
            [coding]=5
            [coding-fast]=3
            [reasoning]=5
            [fast]=3
          )

          # ------------------------------------------------------
          # Find combo by name
          # ------------------------------------------------------

          get_combo_id() {
            local name="$1"

            jq -r \
              --arg name "$name" \
              '
                .[]
                | select(
                    (.name // .id // "") == $name
                  )
                | (.id // "")
              ' \
              "$COMBOS_JSON" |
              head -n 1
          }

          # ------------------------------------------------------
          # Sync one combo
          # ------------------------------------------------------

          sync_combo() {
            local name="$1"
            local desired_count="$2"

            local combo_id
            local existing_models
            local models_json
            local payload
            local response_file

            combo_id="$(get_combo_id "$name")"

            if [[ -n "$combo_id" ]]; then
              existing_models="$(
                jq -c \
                  --arg name "$name" \
                  '
                    [
                      .[]
                      | select(
                          (.name // .id // "") == $name
                        )
                      | (
                          .models
                          // .config.models
                          // []
                        )
                      | .[]
                    ]
                  ' "$COMBOS_JSON"
              )"
            else
              existing_models='[]'
            fi

            models_json="$(
              build_models_json \
                "$existing_models" \
                "$desired_count"
            )"

            if [[ "$models_json" == "[]" ]]; then
              echo "WARNING: $name has no candidate models."
              echo "WARNING: Preserving existing combo."
              return 0
            fi

            payload="$(
              jq -nc \
                --arg name "$name" \
                --argjson models "$models_json" \
                '{
                  name: $name,
                  models: $models
                }'
            )"

            response_file="$(mktemp)"

            if [[ -n "$combo_id" ]]; then
              echo "Updating combo: $name ($combo_id)"

              if ! curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 30 \
                  -X PUT \
                  -H "$AUTH_HEADER" \
                  -H 'Content-Type: application/json' \
                  "$BASE_URL/api/combos/$combo_id" \
                  -d "$payload" \
                  > "$response_file"; then

                echo "WARNING: Failed to update combo: $name"
                echo "WARNING: Existing combo remains unchanged."
                rm -f "$response_file"
                return 0
              fi
            else
              echo "Creating combo: $name"

              if ! curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 30 \
                  -X POST \
                  -H "$AUTH_HEADER" \
                  -H 'Content-Type: application/json' \
                  "$BASE_URL/api/combos" \
                  -d "$payload" \
                  > "$response_file"; then

                echo "WARNING: Failed to create combo: $name"
                rm -f "$response_file"
                return 0
              fi
            fi

            rm -f "$response_file"

            echo "Combo synchronized: $name"
            echo "Models: $models_json"
          }

          # ------------------------------------------------------
          # Synchronize configured combos
          # ------------------------------------------------------

          for combo_name in coding coding-fast reasoning fast; do
            sync_combo \
              "$combo_name" \
              "${COMBO_SIZES[$combo_name]}"
          done

          # ------------------------------------------------------
          # Keep only recent history
          # ------------------------------------------------------

          find "$TEST_DIR/history" \
            -type f \
            -mtime +7 \
            -delete \
            2>/dev/null || true

          echo
          echo "Model health/combo synchronization completed."
          exit 0
          SCRIPT

          sudo chmod 700 "$SCRIPT"
          sudo chown "$SSH_USERNAME:$SSH_USERNAME" "$SCRIPT"

          sudo test -x "$SCRIPT"

          echo "Installed model health script:"
          echo "$SCRIPT"

      # ==========================================================
      # 19. Initial model health check
      # ==========================================================

      - name: 19. Initial Model Check And Combo Sync
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ env.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS: ${{ env.OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS }}
          OMNIROUTE_MODEL_TEST_PARALLELISM: ${{ env.OMNIROUTE_MODEL_TEST_PARALLELISM }}
          OMNIROUTE_MAX_MODELS_PER_CYCLE: ${{ env.OMNIROUTE_MAX_MODELS_PER_CYCLE }}
        run: |
          set -euo pipefail

          SCRIPT="/home/$SSH_USERNAME/omniroute-tests/check-and-sync.sh"

          sudo test -x "$SCRIPT"

          echo "Running initial OmniRoute model health check..."

          sudo -u "$SSH_USERNAME" \
            env \
              HOME="/home/$SSH_USERNAME" \
              OMNIROUTE_BASE_URL="$OMNIROUTE_BASE_URL" \
              OMNIROUTE_API_KEY="$OMNIROUTE_API_KEY" \
              OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS="$OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS" \
              OMNIROUTE_MODEL_TEST_PARALLELISM="$OMNIROUTE_MODEL_TEST_PARALLELISM" \
              OMNIROUTE_MAX_MODELS_PER_CYCLE="$OMNIROUTE_MAX_MODELS_PER_CYCLE" \
            "$SCRIPT"

          echo
          echo "Initial model health check completed."
          echo "Zero passing models is considered a non-fatal condition."
          echo "The runner will continue."

      # ==========================================================
      # 20. Telegram online notification
      # ==========================================================

      - name: 20. Telegram Online Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          MESSAGE="OmniRoute server is online.%0A%0APort: $OMNIROUTE_PORT%0AVersion: $OMNIROUTE_VERSION%0AWorkflow: $GITHUB_RUN_ID"

          curl \
            --silent \
            --show-error \
            --fail \
            --max-time 20 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            >/dev/null

          echo "Telegram online notification sent."

      # ==========================================================
      # 21. Keep runner alive
      # ==========================================================

      - name: 21. Keep Runner Alive And Check Models
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: ${{ env.OMNIROUTE_BASE_URL }}
          OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS: ${{ env.OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS }}
          OMNIROUTE_MODEL_TEST_PARALLELISM: ${{ env.OMNIROUTE_MODEL_TEST_PARALLELISM }}
          OMNIROUTE_MAX_MODELS_PER_CYCLE: ${{ env.OMNIROUTE_MAX_MODELS_PER_CYCLE }}
        run: |
          set -euo pipefail

          SCRIPT="/home/$SSH_USERNAME/omniroute-tests/check-and-sync.sh"

          END_TIME="$(
            date \
              -u \
              -d "+${OMNIROUTE_RUNTIME_MINUTES} minutes" \
              +%s
          )"

          echo "Runner will remain alive for approximately ${OMNIROUTE_RUNTIME_MINUTES} minutes."

          while true; do
            NOW="$(date -u +%s)"

            if [[ "$NOW" -ge "$END_TIME" ]]; then
              echo "Runtime window completed."
              break
            fi

            echo
            echo "=============================================="
            echo "Periodic OmniRoute model health check"
            echo "UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "=============================================="

            if ! sudo -u "$SSH_USERNAME" \
              env \
                HOME="/home/$SSH_USERNAME" \
                OMNIROUTE_BASE_URL="$OMNIROUTE_BASE_URL" \
                OMNIROUTE_API_KEY="$OMNIROUTE_API_KEY" \
                OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS="$OMNIROUTE_MODEL_TEST_TIMEOUT_SECONDS" \
                OMNIROUTE_MODEL_TEST_PARALLELISM="$OMNIROUTE_MODEL_TEST_PARALLELISM" \
                OMNIROUTE_MAX_MODELS_PER_CYCLE="$OMNIROUTE_MAX_MODELS_PER_CYCLE" \
              "$SCRIPT"; then

              echo "ERROR: Model health/combo synchronization failed."
              echo "The failure was not caused merely by zero passing models."
              exit 1
            fi

            NOW="$(date -u +%s)"

            if [[ "$NOW" -ge "$END_TIME" ]]; then
              break
            fi

            echo
            echo "Next model health cycle in ${OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES} minutes."

            sleep_seconds=$((OMNIROUTE_MODEL_CHECK_INTERVAL_MINUTES * 60))

            remaining=$((END_TIME - NOW))

            if [[ "$sleep_seconds" -gt "$remaining" ]]; then
              sleep_seconds="$remaining"
            fi

            if [[ "$sleep_seconds" -gt 0 ]]; then
              sleep "$sleep_seconds"
            fi
          done

      # ==========================================================
      # 22. Stop OmniRoute
      # ==========================================================

      - name: 22. Stop OmniRoute
        if: always()
        run: |
          set -euo pipefail

          sudo systemctl stop omniroute.service || true

          sudo systemctl is-active omniroute.service || true

      # ==========================================================
      # 23. Finalize SQLite
      # ==========================================================

      - name: 23. Finalize OmniRoute SQLite
        if: always()
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"

          if sudo test -f "$DB"; then
            echo "Running SQLite integrity check..."

            sudo -u "$SSH_USERNAME" \
              sqlite3 "$DB" \
              'PRAGMA wal_checkpoint(TRUNCATE);' || true

            sudo -u "$SSH_USERNAME" \
              sqlite3 "$DB" \
              'PRAGMA optimize;' || true

            sudo -u "$SSH_USERNAME" \
              sqlite3 "$DB" \
              'PRAGMA integrity_check;' || true

            sudo chown "$SSH_USERNAME:$SSH_USERNAME" "$DB"
            sudo chmod 600 "$DB"
          else
            echo "No SQLite database found."
          fi

      # ==========================================================
      # 24. Authenticate GitHub CLI
      # ==========================================================

      - name: 24. Authenticate GitHub CLI
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh auth status

      # ==========================================================
      # 25. Synchronize repository safely
      # ==========================================================

      - name: 25. Synchronize Repository Safely
        if: always()
        run: |
          set -euo pipefail

          git status --short
          git fetch origin

          CURRENT_BRANCH="$(git branch --show-current)"

          if [[ -z "$CURRENT_BRANCH" ]]; then
            CURRENT_BRANCH="main"
          fi

          echo "Current branch: $CURRENT_BRANCH"

          if git show-ref --verify --quiet "refs/remotes/origin/$CURRENT_BRANCH"; then
            git merge --no-edit "origin/$CURRENT_BRANCH"
          fi

      # ==========================================================
      # 26. Security check
      # ==========================================================

      - name: 26. Security Check
        if: always()
        run: |
          set -euo pipefail

          forbidden_files=(
            '.env'
            'omniroute.log'
            'storage.sqlite-wal'
            'storage.sqlite-shm'
          )

          for file in "${forbidden_files[@]}"; do
            if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
              echo "ERROR: Forbidden file is tracked: $file"
              exit 1
            fi
          done

          if git ls-files |
             grep -E '(^|/)\.env$|storage\.sqlite-(wal|shm)$' >/dev/null 2>&1; then
            echo "ERROR: Sensitive OmniRoute files are tracked."
            exit 1
          fi

          echo "Repository security check passed."

      # ==========================================================
      # 27. Remove legacy backups
      # ==========================================================

      - name: 27. Remove Legacy OmniRoute Backups
        if: always()
        run: |
          set -euo pipefail

          find backup/omniroute \
            -type f \
            ! -name 'storage.sqlite' \
            -delete \
            2>/dev/null || true

          mkdir -p backup/omniroute

      # ==========================================================
      # 28. Backup SQLite
      # ==========================================================

      - name: 28. Backup OmniRoute SQLite
        if: always()
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          SOURCE_DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"
          TARGET_DB="$GITHUB_WORKSPACE/$OMNIROUTE_DB_PATH"

          if sudo test -f "$SOURCE_DB"; then
            sudo cp "$SOURCE_DB" "$TARGET_DB"

            sudo chown \
              "$(id -u):$(id -g)" \
              "$TARGET_DB"

            chmod 600 "$TARGET_DB"

            echo "SQLite database backed up."
          else
            echo "WARNING: OmniRoute SQLite database does not exist."
          fi

      # ==========================================================
      # 29. Check DB size
      # ==========================================================

      - name: 29. Check OmniRoute Database Size
        if: always()
        run: |
          set -euo pipefail

          DB="$GITHUB_WORKSPACE/$OMNIROUTE_DB_PATH"

          if [[ ! -f "$DB" ]]; then
            echo "No database file to check."
            exit 0
          fi

          SIZE_BYTES="$(stat -c '%s' "$DB")"
          SIZE_MB="$((SIZE_BYTES / 1024 / 1024))"

          echo "Database size: ${SIZE_MB} MB"

          MAX_MB=95

          if [[ "$SIZE_MB" -gt "$MAX_MB" ]]; then
            echo "ERROR: Database exceeds ${MAX_MB} MB."
            exit 1
          fi

      # ==========================================================
      # 30. Stage DB
      # ==========================================================

      - name: 30. Stage SQLite Database
        if: always()
        run: |
          set -euo pipefail

          git add backup/omniroute/storage.sqlite

          git status --short

      # ==========================================================
      # 31. Commit
      # ==========================================================

      - name: 31. Commit OmniRoute State
        if: always()
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No OmniRoute state changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update OmniRoute state"

      # ==========================================================
      # 32. Push
      # ==========================================================

      - name: 32. Push OmniRoute State
        if: always()
        run: |
          set -euo pipefail

          git push origin HEAD

      # ==========================================================
      # 33. Final repository validation
      # ==========================================================

      - name: 33. Final Repository Validation
        if: always()
        run: |
          set -euo pipefail

          git status --short
          git log -1 --oneline

          if git ls-files |
             grep -E '(^|/)\.env$|storage\.sqlite-(wal|shm)$' >/dev/null 2>&1; then
            echo "ERROR: Sensitive files are tracked."
            exit 1
          fi

          echo "Final repository validation passed."

      # ==========================================================
      # 34. Verify OmniRoute stopped
      # ==========================================================

      - name: 34. Verify OmniRoute Service Stopped
        if: always()
        run: |
          set -euo pipefail

          if sudo systemctl is-active --quiet omniroute.service; then
            echo "WARNING: OmniRoute service is still active."
            sudo systemctl stop omniroute.service || true
          fi

          echo "OmniRoute service is stopped."
