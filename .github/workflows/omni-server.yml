name: Linux OmniRoute Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: permanent-linux-ssh-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 380

    permissions:
      contents: write

    env:
      OMNIROUTE_PORT: '20128'
      OMNIROUTE_VERSION: '3.8.49'
      OMNIROUTE_BACKUP_PATH: 'backup/omniroute/omniroute-full-backup.tar.gz'

    steps:

      # ============================================================
      # 01. Checkout repository
      # ============================================================
      - name: 01. Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # ============================================================
      # 02. Validate GitHub configuration
      # ============================================================
      - name: 02. Validate GitHub Configuration
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          test -n "${SSH_USERNAME:-}" || {
            echo "ERROR: SSH_USERNAME is empty."
            echo "Create repository variable SSH_USERNAME (preferred)."
            exit 1
          }

          test -n "${SSH_PASSWORD:-}" || {
            echo "ERROR: SSH_PASSWORD secret is empty."
            exit 1
          }

          test -n "${OMNIROUTE_ENV:-}" || {
            echo "ERROR: OMNIROUTE_ENV secret is empty."
            exit 1
          }

          test -n "${GIT_TOKEN:-}" || {
            echo "ERROR: GIT_TOKEN secret is empty."
            exit 1
          }

          test -n "${TAILSCALE_AUTHKEY:-}" || {
            echo "ERROR: TAILSCALE_AUTHKEY secret is empty."
            exit 1
          }

          test -n "${TELEGRAM_BOT_TOKEN:-}" || {
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is empty."
            exit 1
          }

          test -n "${TELEGRAM_CHAT_ID:-}" || {
            echo "ERROR: TELEGRAM_CHAT_ID secret is empty."
            exit 1
          }

          echo "Required GitHub configuration is present."
          echo "Secret values were not displayed."

      # ============================================================
      # 03. Install required packages
      # ============================================================
      - name: 03. Install Required Packages
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            wget \
            git \
            sqlite3 \
            openssh-server \
            ca-certificates \
            gnupg \
            lsb-release \
            tar \
            gzip

          echo "Required packages installed."

      # ============================================================
      # 04. Install GitHub CLI
      # ============================================================
      - name: 04. Install GitHub CLI
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            echo "GitHub CLI already installed."
          else
            curl -fsSL \
              https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg

            sudo chmod go+r \
              /usr/share/keyrings/githubcli-archive-keyring.gpg

            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null

            sudo apt-get update
            sudo apt-get install -y gh
          fi

          gh --version

      # ============================================================
      # 05. Configure Git
      # ============================================================
      - name: 05. Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

          echo "Git configured."

      # ============================================================
      # 06. Setup SSH server
      # ============================================================
      - name: 06. Setup SSH Server
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${SSH_USERNAME:-}"
          test -n "${SSH_PASSWORD:-}"

          if ! id "$SSH_USERNAME" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$SSH_USERNAME"
          fi

          echo "$SSH_USERNAME:$SSH_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$SSH_USERNAME"

          sudo mkdir -p /run/sshd

          sudo sed -i \
            -E 's/^#?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            -E 's/^#?PermitRootLogin .*/PermitRootLogin no/' \
            /etc/ssh/sshd_config

          sudo systemctl restart ssh
          sudo systemctl enable ssh

          echo "SSH server is running."

      # ============================================================
      # 07. Prepare OmniRoute directory
      # ============================================================
      - name: 07. Prepare OmniRoute Directory
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          sudo mkdir -p "$OMNIROUTE_HOME"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$OMNIROUTE_HOME"

          sudo chmod 700 "$OMNIROUTE_HOME"

          echo "OmniRoute directory prepared."

      # ============================================================
      # 08. Restore OmniRoute archive
      #
      # Archive contains the CONTENTS of .omniroute.
      #
      # Excluded from archive:
      #   .env
      #   logs/
      #
      # Therefore the archive is extracted directly into:
      #   /home/<user>/.omniroute
      # ============================================================
      - name: 08. Restore OmniRoute Archive
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          sudo mkdir -p "$OMNIROUTE_HOME"

          # Always start from a clean persisted state.
          # .env will be restored separately from GitHub Secret.
          sudo find "$OMNIROUTE_HOME" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf {} +

          if [ -f "$BACKUP_FILE" ]; then

            echo "OmniRoute backup archive found:"
            echo "$BACKUP_FILE"

            test -s "$BACKUP_FILE"

            gzip -t "$BACKUP_FILE"

            tar -tzf "$BACKUP_FILE" >/dev/null

            echo "Backup archive validated."

            sudo tar \
              -xzf "$BACKUP_FILE" \
              -C "$OMNIROUTE_HOME"

            echo "OmniRoute archive extracted."

          else

            echo "No OmniRoute backup archive exists yet."
            echo "Starting with an empty .omniroute directory."

          fi

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$OMNIROUTE_HOME"

          sudo chmod 700 "$OMNIROUTE_HOME"

          echo "OmniRoute archive restore completed."

      # ============================================================
      # 09. Restore COMPLETE .env from GitHub Secret
      #
      # .env is NEVER stored in Git or the backup archive.
      # ============================================================
      - name: 09. Restore OmniRoute Environment From Secret
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          ENV_FILE="$OMNIROUTE_HOME/.env"
          TEMP_ENV="$RUNNER_TEMP/omniroute.env"

          test -n "${OMNIROUTE_ENV:-}" || {
            echo "ERROR: OMNIROUTE_ENV GitHub secret is empty."
            exit 1
          }

          rm -f "$TEMP_ENV"

          printf '%s' "$OMNIROUTE_ENV" > "$TEMP_ENV"

          test -s "$TEMP_ENV" || {
            echo "ERROR: Temporary OmniRoute .env is empty."
            rm -f "$TEMP_ENV"
            exit 1
          }

          grep -Eq \
            '^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*=' \
            "$TEMP_ENV" || {
              echo "ERROR: OMNIROUTE_ENV does not look like a valid .env file."
              rm -f "$TEMP_ENV"
              exit 1
            }

          sudo install \
            -o "$SSH_USERNAME" \
            -g "$SSH_USERNAME" \
            -m 600 \
            "$TEMP_ENV" \
            "$ENV_FILE"

          rm -f "$TEMP_ENV"

          sudo test -f "$ENV_FILE"
          sudo test -s "$ENV_FILE"

          sudo chown \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$ENV_FILE"

          sudo chmod 600 "$ENV_FILE"

          echo "OmniRoute .env restored successfully."
          echo "Secret contents were not displayed."

      # ============================================================
      # 10. Verify .env
      # ============================================================
      - name: 10. Verify OmniRoute Environment
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          ENV_FILE="$OMNIROUTE_HOME/.env"

          sudo test -f "$ENV_FILE" || {
            echo "ERROR: OmniRoute .env does not exist."
            echo "Expected: $ENV_FILE"
            exit 1
          }

          sudo test -s "$ENV_FILE" || {
            echo "ERROR: OmniRoute .env is empty."
            exit 1
          }

          sudo stat "$ENV_FILE"

          echo "OmniRoute .env exists and is non-empty."
          echo "Contents are intentionally not displayed."

      # ============================================================
      # 11. Install Node.js
      # ============================================================
      - name: 11. Install Node.js
        run: |
          set -euo pipefail

          curl -fsSL \
            https://deb.nodesource.com/setup_22.x \
            | sudo -E bash -

          sudo apt-get install -y nodejs

          node --version
          npm --version

      # ============================================================
      # 12. Install OmniRoute
      # ============================================================
      - name: 12. Install OmniRoute
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo -u "$SSH_USERNAME" -H bash <<'USER_SCRIPT'
          set -euo pipefail

          export HOME="/home/$USER"
          export NPM_PREFIX="$HOME/.npm-global"
          export PATH="$NPM_PREFIX/bin:$PATH"

          mkdir -p "$NPM_PREFIX"

          npm config set prefix "$NPM_PREFIX"

          npm install -g "omniroute@3.8.49"

          test -x "$NPM_PREFIX/bin/omniroute"

          "$NPM_PREFIX/bin/omniroute" --version
          USER_SCRIPT

      # ============================================================
      # 13. Verify OmniRoute installation
      # ============================================================
      - name: 13. Verify OmniRoute Installation
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          OMNIROUTE_BIN="/home/$SSH_USERNAME/.npm-global/bin/omniroute"

          test -x "$OMNIROUTE_BIN" || {
            echo "ERROR: OmniRoute executable not found."
            exit 1
          }

          sudo test -f "$OMNIROUTE_HOME/.env"
          sudo test -s "$OMNIROUTE_HOME/.env"

          echo "OmniRoute executable and .env are both available."

      # ============================================================
      # 14. Create systemd service
      # ============================================================
      - name: 14. Create OmniRoute systemd Service
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          OMNIROUTE_BIN="/home/$SSH_USERNAME/.npm-global/bin/omniroute"

          test -x "$OMNIROUTE_BIN"
          sudo test -f "$OMNIROUTE_HOME/.env"
          sudo test -s "$OMNIROUTE_HOME/.env"

          sudo tee /etc/systemd/system/omniroute.service >/dev/null <<EOF
          [Unit]
          Description=OmniRoute AI Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple

          User=$SSH_USERNAME
          Group=$SSH_USERNAME

          WorkingDirectory=$OMNIROUTE_HOME

          Environment=HOME=/home/$SSH_USERNAME
          Environment=NODE_ENV=production
          Environment=PORT=$OMNIROUTE_PORT
          Environment=PATH=/home/$SSH_USERNAME/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          EnvironmentFile=$OMNIROUTE_HOME/.env

          # Must come after EnvironmentFile so .env cannot override it.
          Environment=HOSTNAME=0.0.0.0

          ExecStart=$OMNIROUTE_BIN

          Restart=on-failure
          RestartSec=5

          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable omniroute

          echo "OmniRoute systemd service created."

      # ============================================================
      # 15. Start OmniRoute
      # ============================================================
      - name: 15. Start OmniRoute
        run: |
          set -euo pipefail

          sudo systemctl restart omniroute

          sleep 5

          sudo systemctl --no-pager --full status omniroute || true

          if ! sudo systemctl is-active --quiet omniroute; then
            echo "ERROR: OmniRoute failed to start."

            echo "===== JOURNAL ====="

            sudo journalctl \
              -u omniroute \
              --no-pager \
              -n 100 || true

            exit 1
          fi

          echo "OmniRoute is running."

      # ============================================================
      # 16. Verify OmniRoute listening port
      # ============================================================
      - name: 16. Verify OmniRoute Port
        run: |
          set -euo pipefail

          for i in {1..30}; do

            if sudo ss -lntp | grep -q ":$OMNIROUTE_PORT "; then

              echo "OmniRoute is listening on port $OMNIROUTE_PORT."

              sudo ss -lntp | grep ":$OMNIROUTE_PORT " || true

              exit 0
            fi

            echo "Waiting for OmniRoute... ($i/30)"

            sleep 2
          done

          echo "ERROR: OmniRoute did not listen on port $OMNIROUTE_PORT."

          sudo journalctl \
            -u omniroute \
            --no-pager \
            -n 100 || true

          exit 1

      # ============================================================
      # 16A. Verify OmniRoute bind address is 0.0.0.0
      # ============================================================
      - name: 16A. Verify OmniRoute Bind Address
        run: |
          set -euo pipefail

          echo "===== SYSTEMD HOSTNAME ====="

          sudo systemctl show omniroute -p Environment --no-pager \
            | grep -F 'HOSTNAME=0.0.0.0' || {
              echo "ERROR: systemd omniroute service does not contain HOSTNAME=0.0.0.0."
              echo "===== SERVICE FILE ====="
              sudo systemctl cat omniroute
              exit 1
            }

          echo "systemd HOSTNAME=0.0.0.0 confirmed."

          echo "===== LISTENING SOCKET ====="

          if sudo ss -lntp \
            | grep -Eq "0\.0\.0\.0:$OMNIROUTE_PORT[[:space:]]|\[::\]:$OMNIROUTE_PORT[[:space:]]"; then

            sudo ss -lntp \
              | grep -E ":$OMNIROUTE_PORT[[:space:]]" || true

            echo "OmniRoute is listening on an externally reachable interface."

          else

            echo "ERROR: OmniRoute is not listening on 0.0.0.0:$OMNIROUTE_PORT or [::]:$OMNIROUTE_PORT."

            sudo ss -lntp \
              | grep ":$OMNIROUTE_PORT[[:space:]]" || true

            echo "===== JOURNAL ====="

            sudo journalctl \
              -u omniroute \
              --no-pager \
              -n 100 || true

            exit 1
          fi

      # ============================================================
      # 17. Verify SQLite database
      # ============================================================
      - name: 17. Verify OmniRoute Database
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          DB="$OMNIROUTE_HOME/storage.sqlite"

          if [ ! -f "$DB" ]; then
            echo "WARNING: storage.sqlite does not currently exist."
            echo "OmniRoute may create it during runtime."
            exit 0
          fi

          echo "SQLite database found."

          sudo -u "$SSH_USERNAME" \
            sqlite3 "$DB" \
            "PRAGMA integrity_check;" \
            | grep -qx "ok"

          echo "SQLite integrity check passed."

      # ============================================================
      # 18. OmniRoute health check
      # ============================================================
      - name: 18. OmniRoute Health Check
        run: |
          set -euo pipefail

          if curl \
            --silent \
            --show-error \
            --fail \
            --max-time 10 \
            "http://127.0.0.1:$OMNIROUTE_PORT/v1/models" \
            >/dev/null; then

            echo "OmniRoute API responded successfully."

          else

            echo "WARNING: /v1/models did not return HTTP success."
            echo "The service is running, so continuing."

          fi

      # ============================================================
      # 19. Setup Tailscale
      # ============================================================
      - name: 19. Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          test -n "${TAILSCALE_AUTHKEY:-}" || {
            echo "ERROR: TAILSCALE_AUTHKEY secret is empty."
            exit 1
          }

          curl -fsSL \
            https://tailscale.com/install.sh \
            | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="omniroute"

          echo "Tailscale is connected."

      # ============================================================
      # 20. Final startup validation
      # ============================================================
      - name: 20. Final Startup Validation
        run: |
          set -euo pipefail

          echo "===== SYSTEMD ====="

          sudo systemctl is-active omniroute

          echo
          echo "===== PORT ====="

          sudo ss -lntp | grep ":$OMNIROUTE_PORT "

          echo
          echo "===== TAILSCALE IP ====="

          TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1)"

          test -n "$TAILSCALE_IP"

          echo "$TAILSCALE_IP"

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status

          echo
          echo "OmniRoute startup validation completed."

      # ============================================================
      # 21. Send Tailscale connection information to Telegram
      # ============================================================
      - name: 21. Send Tailscale Connection Information To Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          test -n "${TELEGRAM_BOT_TOKEN:-}" || {
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is empty."
            exit 1
          }

          test -n "${TELEGRAM_CHAT_ID:-}" || {
            echo "ERROR: TELEGRAM_CHAT_ID secret is empty."
            exit 1
          }

          TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1)"

          test -n "$TAILSCALE_IP" || {
            echo "ERROR: Could not determine Tailscale IPv4 address."
            exit 1
          }

          TAILSCALE_DNS="$(
            sudo tailscale dns status 2>/dev/null \
              | grep -Eo '[A-Za-z0-9._-]+\.ts\.net' \
              | head -n 1 \
              || true
          )"

          if [ -z "$TAILSCALE_DNS" ]; then
            TAILSCALE_DNS="Not detected"
          fi

          MESSAGE="$(cat <<EOF
          🚀 OmniRoute Linux Server is ONLINE
          ━━━━━━━━━━━━━━━━━━━━
          Tailscale
          ━━━━━━━━━━━━━━━━━━━━

          Hostname:
          $TAILSCALE_DNS

          IP:
          $TAILSCALE_IP

          ━━━━━━━━━━━━━━━━━━━━
          SSH
          ━━━━━━━━━━━━━━━━━━━━
          ssh ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}@$TAILSCALE_IP

          Port:
          22

          ━━━━━━━━━━━━━━━━━━━━
          OmniRoute
          ━━━━━━━━━━━━━━━━━━━━

          URL:
          http://$TAILSCALE_IP:$OMNIROUTE_PORT

          API:
          http://$TAILSCALE_IP:$OMNIROUTE_PORT/v1

          Port:
          $OMNIROUTE_PORT

          ━━━━━━━━━━━━━━━━━━━━
          Status
          ━━━━━━━━━━━━━━━━━━━━

          Service: RUNNING
          Runtime: 6 hours

          The GitHub Actions runner is active.
          EOF
          )"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail \
              --max-time 20 \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}"
          )"

          echo "$RESPONSE" | grep -q '"ok":true' || {
            echo "ERROR: Telegram API did not report success."
            exit 1
          }

          echo "Telegram notification sent successfully."

      # ============================================================
      # 22. Keep runner alive for 6 hours
      # ============================================================
      - name: 22. Keep Runner Alive For 6 Hours
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "PRODUCTION MODE"
          echo "Keeping OmniRoute runner alive for 6 hours."
          echo "============================================================"

          for i in {1..360}; do

            echo
            echo "===== RUNTIME MINUTE $i / 360 ====="

            echo "OmniRoute service:"
            sudo systemctl is-active omniroute || true

            echo
            echo "Listening port:"
            sudo ss -lntp | grep ":$OMNIROUTE_PORT " || true

            echo
            echo "Tailscale:"
            sudo tailscale ip -4 || true

            echo
            echo "SQLite:"

            if [ -f "/home/$SSH_USERNAME/.omniroute/storage.sqlite" ]; then

              ls -lh \
                "/home/$SSH_USERNAME/.omniroute/storage.sqlite"

            else

              echo "storage.sqlite not present."

            fi

            echo
            echo "Waiting 60 seconds..."

            sleep 60

          done

          echo
          echo "6-hour runtime period completed."

      # ============================================================
      # 23. Stop OmniRoute before persistence
      # ============================================================
      - name: 23. Stop OmniRoute Before Persistence
        run: |
          set -euo pipefail

          sudo systemctl stop omniroute

          sleep 3

          if sudo systemctl is-active --quiet omniroute; then

            echo "ERROR: OmniRoute is still running."

            sudo systemctl \
              --no-pager \
              --full \
              status omniroute || true

            exit 1
          fi

          echo "OmniRoute is stopped."

      # ============================================================
      # 24. SQLite checkpoint
      # ============================================================
      - name: 24. Checkpoint SQLite Database
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          DB="$OMNIROUTE_HOME/storage.sqlite"

          if [ ! -f "$DB" ]; then
            echo "WARNING: storage.sqlite does not exist."
            exit 0
          fi

          sudo -u "$SSH_USERNAME" \
            sqlite3 "$DB" \
            "PRAGMA wal_checkpoint(TRUNCATE);"

          echo "SQLite checkpoint completed."

      # ============================================================
      # 25. Validate final SQLite database
      # ============================================================
      - name: 25. Validate Final SQLite Database
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"

          if [ ! -f "$DB" ]; then
            echo "WARNING: storage.sqlite does not exist."
            exit 0
          fi

          sudo -u "$SSH_USERNAME" \
            sqlite3 "$DB" \
            "PRAGMA integrity_check;" \
            | grep -qx "ok"

          echo "Final SQLite integrity check passed."

      # ============================================================
      # 26. Create final OmniRoute backup archive
      #
      # IMPORTANT:
      # The archive contains the CONTENTS of .omniroute,
      # not the .omniroute directory itself.
      #
      # Excluded:
      #   .env
      #   logs/
      #
      # Everything else is included.
      # ============================================================
      - name: 26. Create Final OmniRoute Backup
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          FINAL_BACKUP="$RUNNER_TEMP/omniroute-full-backup.tar.gz"

          rm -f "$FINAL_BACKUP"

          sudo tar \
            --exclude='./.env' \
            --exclude='./logs' \
            -czf "$FINAL_BACKUP" \
            -C "$OMNIROUTE_HOME" \
            .

          test -s "$FINAL_BACKUP"

          gzip -t "$FINAL_BACKUP"

          tar -tzf "$FINAL_BACKUP" >/dev/null

          echo "Final OmniRoute backup created and validated."

          ls -lh "$FINAL_BACKUP"

      # ============================================================
      # 27. Authenticate GitHub CLI using GIT_TOKEN over HTTPS
      # ============================================================
      - name: 27. Authenticate GitHub CLI
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${GIT_TOKEN:-}" || {
            echo "ERROR: GIT_TOKEN secret is empty."
            exit 1
          }

          printf '%s' "$GIT_TOKEN" \
            | gh auth login \
                --hostname github.com \
                --git-protocol https \
                --with-token

          gh auth setup-git

          echo "GitHub CLI HTTPS authentication configured."

      # ============================================================
      # 28. Verify GitHub repository
      # ============================================================
      - name: 28. Verify GitHub Repository
        run: |
          set -euo pipefail

          gh repo view \
            "$GITHUB_REPOSITORY" \
            --json nameWithOwner,url

          echo "GitHub repository verified."

      # ============================================================
      # 29. Synchronize Git repository before modifying backup
      # ============================================================
      - name: 29. Synchronize Git Repository
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"

          REMOTE_URL="https://github.com/$GITHUB_REPOSITORY.git"

          git remote set-url origin "$REMOTE_URL"

          git fetch origin --prune

          if git show-ref \
            --verify \
            --quiet \
            "refs/remotes/origin/$BRANCH"; then

            git checkout -B \
              "$BRANCH" \
              "origin/$BRANCH"

          else

            git checkout -B "$BRANCH"

          fi

          echo "Repository synchronized with origin/$BRANCH."

      # ============================================================
      # 30. Remove legacy individual OmniRoute state
      #
      # The repository must contain ONLY the backup archive.
      # ============================================================
      - name: 30. Remove Legacy OmniRoute State
        run: |
          set -euo pipefail

          LEGACY_PATH="$GITHUB_WORKSPACE/backup/omniroute/data"

          if [ -d "$LEGACY_PATH" ]; then
            echo "Removing legacy individual OmniRoute state:"
            echo "$LEGACY_PATH"

            rm -rf "$LEGACY_PATH"
          fi

          echo "Legacy OmniRoute state removed."

      # ============================================================
      # 31. Persist ONLY final backup archive
      # ============================================================
      - name: 31. Persist Final Backup Archive
        run: |
          set -euo pipefail

          test -f \
            "$RUNNER_TEMP/omniroute-full-backup.tar.gz"

          mkdir -p \
            "$(dirname "$OMNIROUTE_BACKUP_PATH")"

          cp \
            "$RUNNER_TEMP/omniroute-full-backup.tar.gz" \
            "$OMNIROUTE_BACKUP_PATH"

          test -s "$OMNIROUTE_BACKUP_PATH"

          gzip -t "$OMNIROUTE_BACKUP_PATH"

          tar -tzf \
            "$OMNIROUTE_BACKUP_PATH" \
            >/dev/null

          echo "Final backup archive copied to repository."

          ls -lh "$OMNIROUTE_BACKUP_PATH"

      # ============================================================
      # 32. Verify archive does NOT contain .env or logs
      # ============================================================
      - name: 32. Verify Backup Contents
        run: |
          set -euo pipefail

          BACKUP="$OMNIROUTE_BACKUP_PATH"

          test -f "$BACKUP"

          echo "===== BACKUP CONTENTS ====="

          tar -tzf "$BACKUP" | sort

          echo
          echo "===== VERIFY .env IS EXCLUDED ====="

          if tar -tzf "$BACKUP" \
            | grep -E '(^|/)\.env$'; then

            echo "ERROR: .env exists inside backup archive."
            exit 1
          fi

          echo ".env is not present in backup archive."

          echo
          echo "===== VERIFY logs/ IS EXCLUDED ====="

          if tar -tzf "$BACKUP" \
            | grep -E '(^|/)logs(/|$)'; then

            echo "ERROR: logs directory exists inside backup archive."
            exit 1
          fi

          echo "logs directory is not present in backup archive."

          echo
          echo "Backup contents security check passed."

      # ============================================================
      # 33. Verify no .env/log files are being committed
      # ============================================================
      - name: 33. Security Check Before Commit
        run: |
          set -euo pipefail

          echo "Checking repository for forbidden files."

          if git ls-files \
            | grep -E '(^|/)\.env$|(^|/)logs/|\.log$'; then

            echo "ERROR: Forbidden files are already tracked by Git."

            exit 1
          fi

          echo "No .env or log files are tracked."

          echo
          echo "Checking backup archive."

          if tar -tzf "$OMNIROUTE_BACKUP_PATH" \
            | grep -E '(^|/)\.env$|(^|/)logs(/|$)'; then

            echo "ERROR: Backup contains forbidden files."

            exit 1
          fi

          echo "Backup archive contains no .env or logs."

          echo
          echo "Security check passed."

      # ============================================================
      # 34. Check GitHub file size limit
      # ============================================================
      - name: 34. Check GitHub File Size Limit
        run: |
          set -euo pipefail

          BACKUP_SIZE="$(
            stat \
              -c '%s' \
              "$OMNIROUTE_BACKUP_PATH"
          )"

          echo "Backup size: $BACKUP_SIZE bytes"

          if [ "$BACKUP_SIZE" -gt 99614720 ]; then

            echo "ERROR: Backup exceeds 95 MB."

            exit 1
          fi

          echo "Backup size is within the 95 MB safety limit."

      # ============================================================
      # 35. Git status
      # ============================================================
      - name: 35. Git Status Before Commit
        run: |
          set -euo pipefail

          echo "===== GIT STATUS ====="

          git status --short

          echo
          echo "===== BACKUP FILE ====="

          ls -lh "$OMNIROUTE_BACKUP_PATH"

      # ============================================================
      # 36. Git add
      # ============================================================
      - name: 36. Git Add Backup
        run: |
          set -euo pipefail

          git add -A

          echo "Repository changes staged."

          echo
          echo "===== STAGED FILES ====="

          git diff --cached --name-status

      # ============================================================
      # 37. Verify ONLY backup archive is staged
      # ============================================================
      - name: 37. Verify Backup Is Staged
        run: |
          set -euo pipefail

          git diff --cached --name-only \
            | grep -Fxq "$OMNIROUTE_BACKUP_PATH" || {

              echo "ERROR: Final backup is not staged."

              exit 1
            }

          echo "Final backup archive is staged."

          echo
          echo "===== VERIFY .env IS NOT STAGED ====="

          if git diff --cached --name-only \
            | grep -E '(^|/)\.env$'; then

            echo "ERROR: .env is staged."

            exit 1
          fi

          echo ".env is not staged."

          echo
          echo "===== VERIFY LOGS ARE NOT STAGED ====="

          if git diff --cached --name-only \
            | grep -E '(^|/)logs/|\.log$'; then

            echo "ERROR: log files are staged."

            exit 1
          fi

          echo "Log files are not staged."

      # ============================================================
      # 38. Commit
      # ============================================================
      - name: 38. Commit Backup
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0
          fi

          git commit \
            -m "chore: persist OmniRoute backup"

          echo "Commit created:"

          git log -1 --oneline

      # ============================================================
      # 39. Push using GitHub CLI HTTPS credentials
      # ============================================================
      - name: 39. Push Using GitHub CLI Authentication
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"

          git push origin "$BRANCH"

          echo "Git push completed successfully."

      # ============================================================
      # 40. Verify remote commit and final backup
      # ============================================================
      - name: 40. Final Repository Validation
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"

          git fetch origin "$BRANCH"

          LOCAL_COMMIT="$(git rev-parse HEAD)"

          REMOTE_COMMIT="$(
            git rev-parse "origin/$BRANCH"
          )"

          echo "Local commit : $LOCAL_COMMIT"
          echo "Remote commit: $REMOTE_COMMIT"

          test "$LOCAL_COMMIT" = "$REMOTE_COMMIT"

          echo
          echo "===== FINAL BACKUP ====="

          git ls-tree \
            -r \
            --name-only \
            HEAD \
            "$OMNIROUTE_BACKUP_PATH"

          echo
          echo "===== VERIFY .env IS NOT IN GIT ====="

          if git ls-tree \
            -r \
            --name-only \
            HEAD \
            | grep -E '(^|/)\.env$'; then

            echo "ERROR: .env exists in the Git commit."

            exit 1
          fi

          echo ".env is not stored in Git."

          echo
          echo "===== VERIFY LOGS ARE NOT IN GIT ====="

          if git ls-tree \
            -r \
            --name-only \
            HEAD \
            | grep -E '(^|/)logs/|\.log$'; then

            echo "ERROR: log files exist in the Git commit."

            exit 1
          fi

          echo "Logs are not stored in Git."

          echo
          echo "===== VERIFY BACKUP ARCHIVE ====="

          test -f "$OMNIROUTE_BACKUP_PATH"

          gzip -t "$OMNIROUTE_BACKUP_PATH"

          tar -tzf "$OMNIROUTE_BACKUP_PATH" >/dev/null

          echo "Backup archive is valid."

          echo
          echo "===== FINAL SERVICE STATE ====="

          if sudo systemctl is-active --quiet omniroute; then

            echo "ERROR: OmniRoute is still running."

            exit 1
          fi

          echo "OmniRoute is STOPPED."

          echo
          echo "=============================================="
          echo "OMNIROUTE 6-HOUR BACKUP TEST COMPLETED"
          echo "SUCCESSFULLY"
          echo "=============================================="
