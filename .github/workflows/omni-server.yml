name: Linux OmniRoute Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: permanent-linux-ssh-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    env:
      OMNIROUTE_PORT: '20128'
      OMNIROUTE_VERSION: '3.8.49'
      OMNIROUTE_REPO_PATH: 'backup/omniroute/data'
      OMNIROUTE_BACKUP_PATH: 'backup/omniroute/omniroute-full-backup.tar.gz'

    steps:
      # ============================================================
      # 01. Checkout repository
      # ============================================================
      - name: 01. Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # ============================================================
      # 02. Validate GitHub configuration before changing the runner
      # ============================================================
      - name: 02. Validate GitHub Configuration
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          test -n "${SSH_USERNAME:-}" || {
            echo "ERROR: SSH_USERNAME is empty. Create repository variable SSH_USERNAME (preferred)."
            exit 1
          }

          test -n "${SSH_PASSWORD:-}" || {
            echo "ERROR: SSH_PASSWORD secret is empty."
            exit 1
          }

          test -n "${OMNIROUTE_ENV:-}" || {
            echo "ERROR: OMNIROUTE_ENV secret is empty."
            exit 1
          }

          test -n "${GIT_TOKEN:-}" || {
            echo "ERROR: GIT_TOKEN secret is empty."
            exit 1
          }

          test -n "${TAILSCALE_AUTHKEY:-}" || {
            echo "ERROR: TAILSCALE_AUTHKEY secret is empty."
            exit 1
          }

          echo "Required GitHub configuration is present."
          echo "Secret values were not displayed."

      # ============================================================
      # 03. Install required packages
      # ============================================================
      - name: 03. Install Required Packages
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl \
            wget \
            git \
            rsync \
            sqlite3 \
            openssh-server \
            ca-certificates \
            gnupg \
            lsb-release \
            tar \
            gzip

          echo "Required packages installed."

      # ============================================================
      # 04. Install GitHub CLI
      # ============================================================
      - name: 04. Install GitHub CLI
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            echo "GitHub CLI already installed."
          else
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg

            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg

            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null

            sudo apt-get update
            sudo apt-get install -y gh
          fi

          gh --version

      # ============================================================
      # 05. Configure Git
      # ============================================================
      - name: 05. Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

          echo "Git configured."

      # ============================================================
      # 06. Setup SSH server
      # ============================================================
      - name: 06. Setup SSH Server
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${SSH_USERNAME:-}"
          test -n "${SSH_PASSWORD:-}"

          if ! id "$SSH_USERNAME" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$SSH_USERNAME"
          fi

          echo "$SSH_USERNAME:$SSH_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo "$SSH_USERNAME"

          sudo mkdir -p /run/sshd

          sudo sed -i \
            -E 's/^#?PasswordAuthentication .*/PasswordAuthentication yes/' \
            /etc/ssh/sshd_config

          sudo sed -i \
            -E 's/^#?PermitRootLogin .*/PermitRootLogin no/' \
            /etc/ssh/sshd_config

          sudo systemctl restart ssh
          sudo systemctl enable ssh

          echo "SSH server is running."

      # ============================================================
      # 07. Prepare OmniRoute directory
      # ============================================================
      - name: 07. Prepare OmniRoute Directory
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          sudo mkdir -p "$OMNIROUTE_HOME"
          sudo chown -R "$SSH_USERNAME:$SSH_USERNAME" "$OMNIROUTE_HOME"
          sudo chmod 700 "$OMNIROUTE_HOME"

          echo "OmniRoute directory prepared."

      # ============================================================
      # 08. Restore persisted OmniRoute state from Git repository
      #     .env is deliberately excluded and restored separately.
      # ============================================================
      - name: 08. Restore Persisted OmniRoute State From Git
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          REPO_TARGET="$GITHUB_WORKSPACE/$OMNIROUTE_REPO_PATH"

          sudo mkdir -p "$OMNIROUTE_HOME"

          if [ -d "$REPO_TARGET" ]; then
            echo "Restoring persisted OmniRoute state from repository."

            sudo rsync \
              -a \
              --delete \
              --exclude='.env' \
              --exclude='logs/' \
              --exclude='*.log' \
              --exclude='storage.sqlite-wal' \
              --exclude='storage.sqlite-shm' \
              "$REPO_TARGET/" \
              "$OMNIROUTE_HOME/"
          else
            echo "No persisted OmniRoute state exists yet."
            sudo mkdir -p "$OMNIROUTE_HOME"
          fi

          sudo chown -R "$SSH_USERNAME:$SSH_USERNAME" "$OMNIROUTE_HOME"
          sudo chmod 700 "$OMNIROUTE_HOME"

          echo "Persisted OmniRoute state restored."

      # ============================================================
      # 09. Restore COMPLETE .env from GitHub Actions Secret
      #     .env NEVER goes into Git, cache, or backup.
      # ============================================================
      - name: 09. Restore OmniRoute Environment From Secret
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          OMNIROUTE_ENV: ${{ secrets.OMNIROUTE_ENV }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          ENV_FILE="$OMNIROUTE_HOME/.env"
          TEMP_ENV="$RUNNER_TEMP/omniroute.env"

          test -n "${OMNIROUTE_ENV:-}" || {
            echo "ERROR: OMNIROUTE_ENV GitHub secret is empty."
            exit 1
          }

          rm -f "$TEMP_ENV"

          # Write the multiline secret without ever printing it.
          printf '%s' "$OMNIROUTE_ENV" > "$TEMP_ENV"

          test -s "$TEMP_ENV" || {
            echo "ERROR: Temporary OmniRoute .env is empty."
            rm -f "$TEMP_ENV"
            exit 1
          }

          # Validate at least one KEY=VALUE assignment without revealing values.
          grep -Eq '^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*=' "$TEMP_ENV" || {
            echo "ERROR: OMNIROUTE_ENV does not look like a valid .env file."
            rm -f "$TEMP_ENV"
            exit 1
          }

          sudo install \
            -o "$SSH_USERNAME" \
            -g "$SSH_USERNAME" \
            -m 600 \
            "$TEMP_ENV" \
            "$ENV_FILE"

          rm -f "$TEMP_ENV"

          # Verify in the same step that actually created the file.
          sudo test -f "$ENV_FILE"
          sudo test -s "$ENV_FILE"
          sudo chown "$SSH_USERNAME:$SSH_USERNAME" "$ENV_FILE"
          sudo chmod 600 "$ENV_FILE"

          echo "OmniRoute .env restored successfully."
          echo "Secret contents were not displayed."

      # ============================================================
      # 10. Verify .env immediately after restoration
      # ============================================================
      - name: 10. Verify OmniRoute Environment
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          ENV_FILE="$OMNIROUTE_HOME/.env"

          sudo test -f "$ENV_FILE" || {
            echo "ERROR: OmniRoute .env does not exist at expected path."
            echo "Expected: $ENV_FILE"
            exit 1
          }

          sudo test -s "$ENV_FILE" || {
            echo "ERROR: OmniRoute .env is empty."
            exit 1
          }

          sudo stat "$ENV_FILE"
          echo "OmniRoute .env exists and is non-empty."
          echo "Contents are intentionally not displayed."

      # ============================================================
      # 11. Install Node.js
      # ============================================================
      - name: 11. Install Node.js
        run: |
          set -euo pipefail

          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs

          node --version
          npm --version

      # ============================================================
      # 12. Install OmniRoute as SSH user
      # ============================================================
      - name: 12. Install OmniRoute
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo -u "$SSH_USERNAME" -H bash <<'USER_SCRIPT'
          set -euo pipefail

          export HOME="/home/$USER"
          export NPM_PREFIX="$HOME/.npm-global"
          export PATH="$NPM_PREFIX/bin:$PATH"

          mkdir -p "$NPM_PREFIX"
          npm config set prefix "$NPM_PREFIX"

          npm install -g "omniroute@3.8.49"

          test -x "$NPM_PREFIX/bin/omniroute"
          "$NPM_PREFIX/bin/omniroute" --version
          USER_SCRIPT

      # ============================================================
      # 13. Verify OmniRoute executable and env together
      # ============================================================
      - name: 13. Verify OmniRoute Installation
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          OMNIROUTE_BIN="/home/$SSH_USERNAME/.npm-global/bin/omniroute"

          test -x "$OMNIROUTE_BIN" || {
            echo "ERROR: OmniRoute executable not found at expected path."
            exit 1
          }

          sudo test -f "$OMNIROUTE_HOME/.env"
          sudo test -s "$OMNIROUTE_HOME/.env"

          echo "OmniRoute executable and .env are both available."

      # ============================================================
      # 14. Create systemd service
      # ============================================================
      - name: 14. Create OmniRoute systemd Service
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          OMNIROUTE_BIN="/home/$SSH_USERNAME/.npm-global/bin/omniroute"

          test -x "$OMNIROUTE_BIN"
          sudo test -f "$OMNIROUTE_HOME/.env"
          sudo test -s "$OMNIROUTE_HOME/.env"

          sudo tee /etc/systemd/system/omniroute.service >/dev/null <<EOF
          [Unit]
          Description=OmniRoute AI Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$SSH_USERNAME
          Group=$SSH_USERNAME
          WorkingDirectory=$OMNIROUTE_HOME

          Environment=HOME=/home/$SSH_USERNAME
          Environment=NODE_ENV=production
          Environment=PORT=$OMNIROUTE_PORT
          Environment=PATH=/home/$SSH_USERNAME/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

          EnvironmentFile=$OMNIROUTE_HOME/.env
          ExecStart=$OMNIROUTE_BIN

          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable omniroute

          echo "OmniRoute systemd service created."

      # ============================================================
      # 15. Start OmniRoute
      # ============================================================
      - name: 15. Start OmniRoute
        run: |
          set -euo pipefail

          sudo systemctl restart omniroute
          sleep 5

          sudo systemctl --no-pager --full status omniroute || true

          if ! sudo systemctl is-active --quiet omniroute; then
            echo "ERROR: OmniRoute failed to start."
            echo "===== JOURNAL ====="
            sudo journalctl -u omniroute --no-pager -n 100 || true
            exit 1
          fi

          echo "OmniRoute is running."

      # ============================================================
      # 16. Verify listening port
      # ============================================================
      - name: 16. Verify OmniRoute Port
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if sudo ss -lntp | grep -q ":$OMNIROUTE_PORT "; then
              echo "OmniRoute is listening on port $OMNIROUTE_PORT."
              sudo ss -lntp | grep ":$OMNIROUTE_PORT " || true
              exit 0
            fi

            echo "Waiting for OmniRoute... ($i/30)"
            sleep 2
          done

          echo "ERROR: OmniRoute did not listen on port $OMNIROUTE_PORT."
          sudo journalctl -u omniroute --no-pager -n 100 || true
          exit 1

      # ============================================================
      # 17. Verify SQLite database
      # ============================================================
      - name: 17. Verify OmniRoute Database
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          DB="$OMNIROUTE_HOME/storage.sqlite"

          if [ ! -f "$DB" ]; then
            echo "WARNING: storage.sqlite does not currently exist."
            echo "OmniRoute may create it during runtime."
            exit 0
          fi

          echo "SQLite database found."
          sudo -u "$SSH_USERNAME" sqlite3 "$DB" "PRAGMA integrity_check;" | grep -qx "ok"
          echo "SQLite integrity check passed."

      # ============================================================
      # 18. OmniRoute health check
      # ============================================================
      - name: 18. OmniRoute Health Check
        run: |
          set -euo pipefail

          if curl \
            --silent \
            --show-error \
            --fail \
            --max-time 10 \
            "http://127.0.0.1:$OMNIROUTE_PORT/v1/models" \
            >/dev/null; then
            echo "OmniRoute API responded successfully."
          else
            echo "WARNING: /v1/models did not return HTTP success."
            echo "The service is running, so continuing."
          fi

      # ============================================================
      # 19. Setup Tailscale
      # ============================================================
      - name: 19. Setup Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          test -n "${TAILSCALE_AUTHKEY:-}" || {
            echo "ERROR: TAILSCALE_AUTHKEY secret is empty."
            exit 1
          }

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="omniroute"

          echo "Tailscale is connected."

      # ============================================================
      # 20. Final startup validation
      # ============================================================
      - name: 20. Final Startup Validation
        run: |
          set -euo pipefail

          echo "===== SYSTEMD ====="
          sudo systemctl is-active omniroute

          echo
          echo "===== PORT ====="
          sudo ss -lntp | grep ":$OMNIROUTE_PORT "

          echo
          echo "===== TAILSCALE ====="
          sudo tailscale ip -4 || true

          echo
          echo "OmniRoute startup validation completed."

      # ============================================================
      # 21. Keep runner alive for 10 minutes for testing
      # ============================================================
      - name: 21. Keep Runner Alive For 10 Minutes
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "TEST MODE"
          echo "Keeping OmniRoute runner alive for 10 minutes."
          echo "============================================================"

          for i in {1..10}; do
            echo
            echo "===== TEST MINUTE $i / 10 ====="

            echo "OmniRoute service:"
            sudo systemctl is-active omniroute || true

            echo
            echo "Listening port:"
            sudo ss -lntp | grep ":$OMNIROUTE_PORT " || true

            echo
            echo "SQLite:"
            if [ -f "/home/$SSH_USERNAME/.omniroute/storage.sqlite" ]; then
              ls -lh "/home/$SSH_USERNAME/.omniroute/storage.sqlite"
            else
              echo "storage.sqlite not present."
            fi

            echo
            echo "Waiting..."
            sleep 60
          done

          echo
          echo "10-minute test period completed."

      # ============================================================
      # 22. Stop OmniRoute before persistence
      # ============================================================
      - name: 22. Stop OmniRoute Before Persistence
        run: |
          set -euo pipefail

          sudo systemctl stop omniroute
          sleep 3

          if sudo systemctl is-active --quiet omniroute; then
            echo "ERROR: OmniRoute is still running."
            sudo systemctl --no-pager --full status omniroute || true
            exit 1
          fi

          echo "OmniRoute is stopped."

      # ============================================================
      # 23. SQLite checkpoint
      # ============================================================
      - name: 23. Checkpoint SQLite Database
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          DB="$OMNIROUTE_HOME/storage.sqlite"

          if [ ! -f "$DB" ]; then
            echo "WARNING: storage.sqlite does not exist."
            exit 0
          fi

          sudo -u "$SSH_USERNAME" sqlite3 "$DB" "PRAGMA wal_checkpoint(TRUNCATE);"

          if [ -f "$DB-wal" ]; then
            echo "WARNING: WAL file still exists."
          fi

          if [ -f "$DB-shm" ]; then
            echo "WARNING: SHM file still exists."
          fi

          echo "SQLite checkpoint completed."

      # ============================================================
      # 24. Validate final SQLite database
      # ============================================================
      - name: 24. Validate Final SQLite Database
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          DB="/home/$SSH_USERNAME/.omniroute/storage.sqlite"

          if [ ! -f "$DB" ]; then
            echo "WARNING: storage.sqlite does not exist."
            exit 0
          fi

          sudo -u "$SSH_USERNAME" sqlite3 "$DB" "PRAGMA integrity_check;" | grep -qx "ok"
          echo "Final SQLite integrity check passed."

      # ============================================================
      # 25. Create final backup
      #     .env is explicitly excluded.
      # ============================================================
      - name: 25. Create Final OmniRoute Backup
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          FINAL_BACKUP="$RUNNER_TEMP/omniroute-full-backup.tar.gz"

          rm -f "$FINAL_BACKUP"

          sudo tar \
            --exclude='.env' \
            --exclude='logs' \
            --exclude='*.log' \
            --exclude='storage.sqlite-wal' \
            --exclude='storage.sqlite-shm' \
            -czf "$FINAL_BACKUP" \
            -C "/home/$SSH_USERNAME" \
            ".omniroute"

          test -s "$FINAL_BACKUP"
          gzip -t "$FINAL_BACKUP"
          tar -tzf "$FINAL_BACKUP" >/dev/null

          echo "Final backup created and validated."
          ls -lh "$FINAL_BACKUP"

      # ============================================================
      # 26. Authenticate GitHub CLI using GIT_TOKEN over HTTPS
      # ============================================================
      - name: 26. Authenticate GitHub CLI
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${GIT_TOKEN:-}" || {
            echo "ERROR: GIT_TOKEN secret is empty."
            exit 1
          }

          printf '%s' "$GIT_TOKEN" \
            | gh auth login \
                --hostname github.com \
                --git-protocol https \
                --with-token

          gh auth setup-git

          echo "GitHub CLI HTTPS authentication configured."

      # ============================================================
      # 27. Verify GitHub repository
      # ============================================================
      - name: 27. Verify GitHub Repository
        run: |
          set -euo pipefail

          gh repo view "$GITHUB_REPOSITORY" --json nameWithOwner,url
          echo "GitHub repository verified."

      # ============================================================
      # 28. Synchronize repository before modifying persisted state
      # ============================================================
      - name: 28. Synchronize Git Repository
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"
          REMOTE_URL="https://github.com/$GITHUB_REPOSITORY.git"

          git remote set-url origin "$REMOTE_URL"
          git fetch origin --prune

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi

          echo "Repository synchronized with origin/$BRANCH."
          git status --short

      # ============================================================
      # 29. Persist OmniRoute state into repository
      # ============================================================
      - name: 29. Persist OmniRoute State
        env:
          SSH_USERNAME: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"
          REPO_TARGET="$GITHUB_WORKSPACE/$OMNIROUTE_REPO_PATH"

          test -d "$OMNIROUTE_HOME"
          mkdir -p "$REPO_TARGET"

          # Never copy secrets/transient runtime files into Git.
          sudo rsync \
            -a \
            --delete \
            --exclude='.env' \
            --exclude='logs/' \
            --exclude='*.log' \
            --exclude='storage.sqlite-wal' \
            --exclude='storage.sqlite-shm' \
            "$OMNIROUTE_HOME/" \
            "$REPO_TARGET/"

          sudo chown -R "$(id -u):$(id -g)" "$REPO_TARGET"

          echo "OmniRoute state persisted to: $OMNIROUTE_REPO_PATH"
          find "$REPO_TARGET" -type f -print | sort

      # ============================================================
      # 30. Persist final backup into repository
      # ============================================================
      - name: 30. Persist Final Backup
        run: |
          set -euo pipefail

          test -f "$RUNNER_TEMP/omniroute-full-backup.tar.gz"

          mkdir -p "$(dirname "$OMNIROUTE_BACKUP_PATH")"
          cp "$RUNNER_TEMP/omniroute-full-backup.tar.gz" "$OMNIROUTE_BACKUP_PATH"

          test -s "$OMNIROUTE_BACKUP_PATH"
          gzip -t "$OMNIROUTE_BACKUP_PATH"
          tar -tzf "$OMNIROUTE_BACKUP_PATH" >/dev/null

          echo "Final backup copied to repository."
          ls -lh "$OMNIROUTE_BACKUP_PATH"

      # ============================================================
      # 31. Remove forbidden files from repository worktree
      # ============================================================
      - name: 31. Remove Sensitive And Transient Files
        run: |
          set -euo pipefail

          TARGET="$GITHUB_WORKSPACE/$OMNIROUTE_REPO_PATH"

          find "$TARGET" -type f -name '.env' -delete
          find "$TARGET" -type f -name '*.log' -delete
          find "$TARGET" -type f \( -name 'storage.sqlite-wal' -o -name 'storage.sqlite-shm' \) -delete
          find "$TARGET" -type d -name 'logs' -prune -exec rm -rf {} +

          echo "Sensitive and transient files removed from persisted state."

      # ============================================================
      # 32. Security check before staging
      # ============================================================
      - name: 32. Security Check Before Commit
        run: |
          set -euo pipefail

          echo "Checking repository for forbidden files."

          if find "$OMNIROUTE_REPO_PATH" \
            -type f \
            \( \
              -name '.env' \
              -o -name '*.log' \
              -o -name 'storage.sqlite-wal' \
              -o -name 'storage.sqlite-shm' \
            \) \
            -print -quit | grep -q .; then
            echo "ERROR: Forbidden file found in persisted repository directory."
            exit 1
          fi

          if git ls-files | grep -E '(^|/)\.env$|(^|/)logs/|\.log$|storage\.sqlite-(wal|shm)$'; then
            echo "ERROR: Forbidden files are already tracked by Git."
            exit 1
          fi

          echo "Security check passed."

      # ============================================================
      # 33. Check file sizes
      # ============================================================
      - name: 33. Check GitHub File Size Limits
        run: |
          set -euo pipefail

          LARGE_FILES="$(find "$OMNIROUTE_REPO_PATH" -type f -size +95M -print || true)"

          if [ -n "$LARGE_FILES" ]; then
            echo "ERROR: Files larger than 95 MB were found:"
            echo "$LARGE_FILES"
            exit 1
          fi

          if [ -f "$OMNIROUTE_BACKUP_PATH" ]; then
            BACKUP_SIZE="$(stat -c '%s' "$OMNIROUTE_BACKUP_PATH")"
            if [ "$BACKUP_SIZE" -gt 99614720 ]; then
              echo "ERROR: Backup exceeds 95 MB."
              exit 1
            fi
          fi

          echo "File size check passed."

      # ============================================================
      # 34. Git status
      # ============================================================
      - name: 34. Git Status Before Commit
        run: |
          set -euo pipefail

          echo "===== GIT STATUS ====="
          git status --short

          echo
          echo "===== EXISTING FILE COUNT ====="
          git ls-files | wc -l

      # ============================================================
      # 35. Git add
      # ============================================================
      - name: 35. Git Add Everything
        run: |
          set -euo pipefail

          git add -A

          echo "All repository changes staged."
          echo
          echo "===== STAGED FILES ====="
          git diff --cached --name-status

      # ============================================================
      # 36. Verify staged backup/state and .env exclusion
      # ============================================================
      - name: 36. Verify Backup And State Are Staged
        run: |
          set -euo pipefail

          git diff --cached --name-only | grep -Fxq "$OMNIROUTE_BACKUP_PATH" || {
            echo "ERROR: Final backup is not staged."
            exit 1
          }

          if ! git diff --cached --name-only | grep -q "^$OMNIROUTE_REPO_PATH/"; then
            echo "WARNING: No OmniRoute state files are staged."
          else
            echo "OmniRoute state files are staged."
          fi

          if git diff --cached --name-only | grep -E '(^|/)\.env$'; then
            echo "ERROR: .env is staged."
            exit 1
          fi

          echo ".env is not staged."

      # ============================================================
      # 37. Commit
      # ============================================================
      - name: 37. Commit Backup And OmniRoute State
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: persist OmniRoute state and backup"

          echo "Commit created:"
          git log -1 --oneline

      # ============================================================
      # 38. Push using GitHub CLI HTTPS credentials
      # ============================================================
      - name: 38. Push Using GitHub CLI Authentication
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"

          git push origin "$BRANCH"
          echo "Git push completed successfully."

      # ============================================================
      # 39. Verify remote commit
      # ============================================================
      - name: 39. Verify Remote Commit
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"

          git fetch origin "$BRANCH"

          LOCAL_COMMIT="$(git rev-parse HEAD)"
          REMOTE_COMMIT="$(git rev-parse "origin/$BRANCH")"

          echo "Local commit : $LOCAL_COMMIT"
          echo "Remote commit: $REMOTE_COMMIT"

          test "$LOCAL_COMMIT" = "$REMOTE_COMMIT"

          echo "Remote push verified successfully."

      # ============================================================
      # 40. Final repository validation and service state
      # ============================================================
      - name: 40. Final Validation
        run: |
          set -euo pipefail

          echo "===== PERSISTED OMNIROUTE FILES ====="
          git ls-tree -r --name-only HEAD "$OMNIROUTE_REPO_PATH" | sort

          echo
          echo "===== FINAL BACKUP ====="
          git ls-tree -r --name-only HEAD "$OMNIROUTE_BACKUP_PATH"

          echo
          echo "===== VERIFY .env IS NOT IN GIT ====="
          if git ls-tree -r --name-only HEAD | grep -E '(^|/)\.env$'; then
            echo "ERROR: .env exists in the Git commit."
            exit 1
          fi

          echo ".env is not stored in Git."

          echo
          echo "===== FINAL SERVICE STATE ====="
          if sudo systemctl is-active --quiet omniroute; then
            echo "ERROR: OmniRoute is still running."
            exit 1
          fi

          echo "OmniRoute is STOPPED."
          sudo systemctl is-active omniroute || true

          echo
          echo "=============================================="
          echo "OMNIROUTE BACKUP TEST COMPLETED SUCCESSFULLY"
          echo "=============================================="
