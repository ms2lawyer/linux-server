name: OmniRoute CI Gateway (Restored State)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: omniroute-ci-gateway
  cancel-in-progress: false

jobs:
  run-omniroute:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GIT_TOKEN || github.token }}

      - name: 2. Set Workspace Permissions & Install Dependencies
        run: |
          sudo chmod -R 777 ${{ github.workspace }}
          sudo apt-get update && sudo apt-get install -y sqlite3 git-lfs

      - name: 3. Connect Tailscale VPN (OAuth)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: omniroute-ci-gateway

      - name: 4. Enable SSH Access
        env:
          SSH_USERNAME: ${{ secrets.RDP_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "CONFIGURING SSH ACCESS"
          echo "=================================================="

          # Install OpenSSH server
          sudo apt-get update
          sudo apt-get install -y openssh-server

          # Create the requested user if it does not already exist
          if ! id "$SSH_USERNAME" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$SSH_USERNAME"
          fi

          # Set password
          echo "${SSH_USERNAME}:${SSH_PASSWORD}" | sudo chpasswd

          # Add user to sudo group
          sudo usermod -aG sudo "$SSH_USERNAME"

          # Allow password authentication
          sudo mkdir -p /etc/ssh/sshd_config.d

          printf '%s\n' \
            'PasswordAuthentication yes' \
            'KbdInteractiveAuthentication yes' \
            'UsePAM yes' \
            'PubkeyAuthentication yes' \
            | sudo tee /etc/ssh/sshd_config.d/99-github-runner-ssh.conf > /dev/null

          # Validate SSH configuration
          sudo sshd -t

          # Start/restart SSH server
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          echo ""
          echo "SSH service:"
          sudo systemctl is-active ssh

          echo ""
          echo "Tailscale hostname:"
          tailscale status --self=false || true

          echo ""
          echo "Tailscale IPv4:"
          tailscale ip -4

          echo ""
          echo "SSH username:"
          echo "$SSH_USERNAME"

          echo ""
          echo "SSH endpoint:"
          echo "$SSH_USERNAME@omniroute-ci-gateway"

          echo "=================================================="

      - name: 5. Start OmniRoute Container
        run: |
          docker run -d \
            --name omniroute \
            --restart unless-stopped \
            -p 20128:20128 \
            -e NODE_ENV=production \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e API_KEY_SECRET="${{ secrets.API_KEY_SECRET }}" \
            -e STORAGE_ENCRYPTION_KEY="${{ secrets.STORAGE_ENCRYPTION_KEY }}" \
            -e REDIS_URL="redis://host.docker.internal:6379" \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}:/root/.omniroute \
            -v ${{ github.workspace }}:/app/data \
            diegosouzapw/omniroute:latest

      - name: 6. Verify OmniRoute Health
        run: |
          echo "Waiting for OmniRoute gateway to initialize..."
          for i in {1..30}; do
            if curl -s http://localhost:20128 > /dev/null; then
              echo "=================================================="
              echo "OMNIROUTE GATEWAY LIVE VIA TAILSCALE (MAGICDNS)"
              echo "Dashboard URL : http://omniroute-ci-gateway:20128"
              echo "API Endpoint  : http://omniroute-ci-gateway:20128/v1"
              echo "=================================================="
              exit 0
            fi
            sleep 2
          done
          echo "OmniRoute initialization failed. Logs:"
          docker logs omniroute
          exit 1

      - name: 7. Keep-Alive (355-Minute Loop)
        run: |
          set -euo pipefail
          echo "Running server keep-alive for 355 minutes..."
          for i in {1..355}; do
            sleep 60
            if (( i % 10 == 0 )); then
              echo "[$i/355 min] Container status:"
              docker ps --filter "name=omniroute" --format "Status: {{.Status}}"
              tailscale status --peers=false || true
            fi
          done

      - name: 8. Graceful Shutdown & Database Checkpoint
        if: always()
        run: |
          set -euo pipefail
          echo "Stopping OmniRoute container to release file locks..."
          docker stop omniroute || true

          if [ -f "${{ github.workspace }}/storage.sqlite" ]; then
            echo "Flushing SQLite WAL checkpoint..."
            sqlite3 "${{ github.workspace }}/storage.sqlite" "PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi

      - name: 9. Create Backup & Push Latest State to GitHub
        if: always()
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          set -euo pipefail

          USERNAME="${GIT_USERNAME:-github-actions[bot]}"
          git config user.name "$USERNAME"
          git config user.email "$USERNAME@users.noreply.github.com"
          git lfs install

          mkdir -p backup/omniroute
          tar -czf backup/omniroute/omniroute-full-backup.tar.gz \
            --exclude='logs' \
            --exclude='server' \
            storage.sqlite* .env db_backups/ 2>/dev/null || true

          # Stash all working directory changes to allow clean git rebase
          git stash push --include-untracked -m "omniroute-backup-stash" || true

          # Fetch latest origin changes and rebase
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }} || git rebase --abort

          # Restore local backup state onto updated tree
          git stash pop || true

          # Stage backup files and attributes
          git add .gitattributes storage.sqlite* backup/omniroute/omniroute-full-backup.tar.gz db_backups/ .env 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No database changes detected. Skipping git push."
          else
            git commit -m "chore: automated OmniRoute DB backup [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Latest database pushed via Git LFS successfully."
          fi
