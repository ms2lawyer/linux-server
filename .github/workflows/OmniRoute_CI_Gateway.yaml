name: OmniRoute CI Gateway (Restored State)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

concurrency:
  group: omniroute-ci-gateway
  cancel-in-progress: false

jobs:
  run-omniroute:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN || github.token }}

      - name: 2. Set Workspace Permissions & Install SQLite CLI
        run: |
          sudo chmod -R 777 ${{ github.workspace }}
          sudo apt-get update && sudo apt-get install -y sqlite3

      - name: 3. Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail
          test -n "${TAILSCALE_AUTHKEY:-}" || { echo "ERROR: TAILSCALE_AUTHKEY is empty."; exit 1; }
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="omniroute-ci-gateway"
          TS_IP="$(tailscale ip -4)"
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: 4. Start OmniRoute Container
        run: |
          docker run -d \
            --name omniroute \
            --restart unless-stopped \
            -p 20128:20128 \
            -e NODE_ENV=production \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e API_KEY_SECRET="${{ secrets.API_KEY_SECRET }}" \
            -e STORAGE_ENCRYPTION_KEY="${{ secrets.STORAGE_ENCRYPTION_KEY }}" \
            -e REDIS_URL="redis://host.docker.internal:6379" \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}:/root/.omniroute \
            -v ${{ github.workspace }}:/app/data \
            diegosouzapw/omniroute:latest

      - name: 5. Verify OmniRoute Health
        run: |
          echo "Waiting for OmniRoute gateway to initialize..."
          for i in {1..30}; do
            if curl -s http://localhost:20128 > /dev/null; then
              echo "=================================================="
              echo "OMNIROUTE GATEWAY LIVE VIA TAILSCALE"
              echo "Dashboard URL : http://${{ env.TAILSCALE_IP }}:20128"
              echo "API Endpoint  : http://${{ env.TAILSCALE_IP }}:20128/v1"
              echo "=================================================="
              exit 0
            fi
            sleep 2
          done
          echo "OmniRoute initialization failed. Logs:"
          docker logs omniroute
          exit 1

      - name: 6. Keep-Alive (355-Minute Loop)
        run: |
          set -euo pipefail
          echo "Running server keep-alive for 355 minutes..."
          for i in {1..355}; do
            sleep 60
            if (( i % 10 == 0 )); then
              echo "[$i/355 min] Container status:"
              docker ps --filter "name=omniroute" --format "Status: {{.Status}}"
              sudo tailscale status --peers=false || true
            fi
          done
      - name: 7. Graceful Shutdown & Database Checkpoint
        if: always()
        run: |
          set -euo pipefail
          echo "Stopping OmniRoute container to release file locks..."
          docker stop omniroute || true

          # Force-flush SQLite WAL log into the main storage.sqlite database file
          if [ -f "${{ github.workspace }}/storage.sqlite" ]; then
            echo "Flushing SQLite WAL checkpoint..."
            sqlite3 "${{ github.workspace }}/storage.sqlite" "PRAGMA wal_checkpoint(TRUNCATE);" || true
          fi

      - name: 8. Create Backup & Push Latest State to GitHub
        if: always()
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          set -euo pipefail

          # 1. Configure Git Bot Identity
          USERNAME="${GIT_USERNAME:-github-actions[bot]}"
          git config user.name "$USERNAME"
          git config user.email "$USERNAME@users.noreply.github.com"

          # 2. Update Full Compressed Backup Archive
          mkdir -p backup/omniroute
          tar -czf backup/omniroute/omniroute-full-backup.tar.gz \
            --exclude='logs' \
            --exclude='server' \
            storage.sqlite* .env db_backups/ 2>/dev/null || true

          # 3. Pull latest remote changes to avoid push conflicts
          git fetch origin ${{ github.ref_name }}
          git rebase origin/${{ github.ref_name }} || git rebase --abort

          # 4. Stage raw database files, backup archive, and db_backups folder
          git add storage.sqlite* backup/omniroute/omniroute-full-backup.tar.gz db_backups/ .env || true

          # 5. Commit and Push to Repository
          if git diff --cached --quiet; then
            echo "No database changes detected. Skipping git push."
          else
            git commit -m "chore: automated OmniRoute DB backup [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Latest database pushed to GitHub successfully."
          fi
