# ==============================================================
# Permanent Linux SSH Server
#
# GitHub-hosted Ubuntu Runner
#
# PURPOSE
# -------
# Reconstruct as much of the previous Linux runner state as
# reasonably possible on every new GitHub-hosted runner.
#
# PERSISTED:
#   - User workspace
#   - User profile
#   - .bashrc / .profile
#   - selected .config
#   - Git configuration
#   - SSH client configuration (NOT private keys)
#   - manually installed APT packages
#   - Python packages
#   - npm global packages
#   - selected /etc configuration
#   - sudo configuration for cynetadmin
#   - cron configuration
#   - custom systemd unit files
#   - environment configuration
#
# NOT PERSISTED:
#   - RAM
#   - running processes
#   - kernel state
#   - network state
#   - Tailscale runtime state
#   - /proc
#   - /sys
#   - complete /usr
#   - complete /var
#   - SSH private keys
#   - cloud credentials / known secrets
#
# RUNTIME
# -------
# 350 minutes
#
# CHECK
# -----
# Every 60 seconds
#
# NOTIFICATION
# ------------
# Every 5 minutes
#
# PERSISTENCE
# -----------
# GitHub Actions Cache
#
# IMPORTANT
# ---------
# GitHub-hosted runners are disposable.
# This workflow REBUILDS state; it does not restore a VM image.
# ==============================================================


name: Permanent Linux SSH Server


# ==============================================================
# TRIGGERS
# ==============================================================

on:

  schedule:

    # Every 6 hours.
    #
    # 350 minute server lifetime
    # + approximately 10 minutes gap
    #
    - cron: '0 */6 * * *'

  workflow_dispatch:


# ==============================================================
# JOB
# ==============================================================

jobs:

  build:

    runs-on: ubuntu-latest

    # 350 minutes runtime + startup/shutdown overhead
    timeout-minutes: 360

    permissions:

      contents: read
      actions: write


    steps:


      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: 1. Checkout Repository

        uses: actions/checkout@v4


      # ==========================================================
      # 2. DEFINE PERSISTENT STATE PATHS
      # ==========================================================

      - name: 2. Initialize Persistent State Paths

        shell: bash

        run: |

          set -e

          STATE="$GITHUB_WORKSPACE/persistent-state"

          mkdir -p "$STATE"

          echo "STATE=$STATE" >> "$GITHUB_ENV"

          echo ""
          echo "=================================================="
          echo "PERSISTENT LINUX STATE"
          echo "=================================================="
          echo ""

          echo "State directory:"
          echo "$STATE"

          echo ""


      # ==========================================================
      # 3. RESTORE PREVIOUS STATE
      # ==========================================================

      - name: 3. Restore Previous Linux State

        id: restore_state

        uses: actions/cache/restore@v4

        with:

          path: ${{ github.workspace }}/persistent-state

          key: cynet-linux-state-${{ runner.os }}-${{ github.run_id }}

          restore-keys: |
            cynet-linux-state-${{ runner.os }}-


      # ==========================================================
      # 4. INSPECT RESTORED STATE
      # ==========================================================

      - name: 4. Inspect Restored Linux State

        shell: bash

        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "RESTORED LINUX STATE"
          echo "=================================================="
          echo ""

          echo "Exact cache hit:"
          echo "${{ steps.restore_state.outputs.cache-hit }}"

          echo ""

          echo "Matched cache:"
          echo "${{ steps.restore_state.outputs.cache-matched-key }}"

          echo ""

          echo "State directory:"
          echo "$STATE"

          echo ""

          echo "Stored state files:"
          echo "--------------------------------------------------"

          if find "$STATE" -type f -print -quit 2>/dev/null | grep -q .; then

            find "$STATE" \
              -type f \
              -printf '%p | %s bytes\n' \
              2>/dev/null |
              sort |
              head -1000

          else

            echo "No previous persistent state found."

          fi

          echo "--------------------------------------------------"


      # ==========================================================
      # 5. INSTALL BASE DEPENDENCIES
      #
      # These packages are needed to reconstruct the environment.
      # ==========================================================

      - name: 5. Install Base Dependencies

        shell: bash

        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "INSTALLING BASE DEPENDENCIES"
          echo "=================================================="
          echo ""

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
              openssh-server \
              python3 \
              python3-pip \
              python3-venv \
              python3-dev \
              build-essential \
              curl \
              wget \
              git \
              unzip \
              zip \
              jq \
              rsync \
              tar \
              ca-certificates

          echo ""
          echo "Base dependencies installed."


      # ==========================================================
      # 6. RESTORE MANUALLY INSTALLED APT PACKAGES
      #
      # We intentionally save "manual" packages instead of the
      # entire dpkg database.
      #
      # This avoids trying to restore hundreds of runner-specific
      # base packages.
      # ==========================================================

      - name: 6. Restore APT Packages

        shell: bash

        run: |

          set -e

          PACKAGE_FILE="$STATE/apt-manual-packages.txt"

          echo ""
          echo "=================================================="
          echo "RESTORING APT PACKAGES"
          echo "=================================================="
          echo ""

          if [ ! -f "$PACKAGE_FILE" ]; then

            echo "No previous APT package list found."
            echo "Skipping package restoration."

          else

            echo "Previous manually installed packages:"
            echo "--------------------------------------------------"

            cat "$PACKAGE_FILE"

            echo "--------------------------------------------------"

            # Filter package names.
            #
            # Only package names are passed to apt.
            #
            # This prevents accidental command injection from
            # corrupted state files.

            grep -E '^[a-zA-Z0-9][a-zA-Z0-9+._-]*$' \
              "$PACKAGE_FILE" |
              sort -u |
              sudo xargs -r \
                DEBIAN_FRONTEND=noninteractive \
                apt-get install -y

            echo ""
            echo "APT package restoration completed."

          fi


      # ==========================================================
      # 7. RESTORE PYTHON PACKAGES
      # ==========================================================

      - name: 7. Restore Python Packages

        shell: bash

        run: |

          set +e

          PYTHON_FILE="$STATE/python-packages.txt"

          echo ""
          echo "=================================================="
          echo "RESTORING PYTHON PACKAGES"
          echo "=================================================="
          echo ""

          if [ ! -f "$PYTHON_FILE" ]; then

            echo "No Python package snapshot found."

          else

            echo "Python packages:"
            echo "--------------------------------------------------"

            cat "$PYTHON_FILE"

            echo "--------------------------------------------------"

            python3 -m pip install \
              --user \
              --break-system-packages \
              -r "$PYTHON_FILE"

            RESULT=$?

            if [ "$RESULT" -ne 0 ]; then

              echo ""
              echo "WARNING:"
              echo "Some Python packages could not be restored."

            else

              echo ""
              echo "Python package restoration completed."

            fi

          fi

          true


      # ==========================================================
      # 8. INSTALL / RESTORE NODE.JS
      #
      # We install Node.js only if a previous npm snapshot exists.
      #
      # The current runner may already contain Node.js.
      # ==============================================================

      - name: 8. Restore Node.js Environment

        shell: bash

        run: |

          set -e

          NPM_FILE="$STATE/npm-global-packages.txt"

          echo ""
          echo "=================================================="
          echo "RESTORING NODE.JS / NPM"
          echo "=================================================="
          echo ""

          if [ ! -f "$NPM_FILE" ]; then

            echo "No npm global package snapshot found."
            echo "Node.js restoration is not required."

          else

            if command -v node >/dev/null 2>&1; then

              echo "Node.js already exists:"
              node --version

            else

              echo "Node.js is not installed."
              echo "Installing Node.js 22 LTS..."

              curl -fsSL https://deb.nodesource.com/setup_22.x |
                sudo -E bash -

              sudo apt-get install -y nodejs

            fi

            echo ""
            echo "Node:"
            node --version

            echo "npm:"
            npm --version

            echo ""

            echo "Global npm packages:"
            echo "--------------------------------------------------"

            cat "$NPM_FILE"

            echo "--------------------------------------------------"

            while IFS= read -r PACKAGE; do

              if [[ "$PACKAGE" =~ ^[a-zA-Z0-9@/_+.-]+(@[a-zA-Z0-9._-]+)?$ ]]; then

                echo "Installing npm package: $PACKAGE"

                sudo npm install \
                  --global \
                  "$PACKAGE" ||
                  echo "WARNING: failed to install $PACKAGE"

              fi

            done < "$NPM_FILE"

          fi


      # ==========================================================
      # 9. CREATE / CONFIGURE USER
      # ==========================================================

      - name: 9. Create User cynetadmin

        shell: bash

        env:

          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

        run: |

          set -e

          USERNAME="cynetadmin"

          if [ -z "$SSH_PASSWORD" ]; then

            echo "ERROR:"
            echo "GitHub Secret SSH_PASSWORD is missing."

            exit 1

          fi

          echo ""
          echo "=================================================="
          echo "CONFIGURING USER"
          echo "=================================================="
          echo ""

          if id "$USERNAME" >/dev/null 2>&1; then

            echo "User already exists."

          else

            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"

          fi

          echo "$USERNAME:$SSH_PASSWORD" |
            sudo chpasswd

          sudo usermod -aG sudo "$USERNAME"

          echo "$USERNAME ALL=(ALL) NOPASSWD:ALL" |
            sudo tee "/etc/sudoers.d/$USERNAME" >/dev/null

          sudo chmod 440 \
            "/etc/sudoers.d/$USERNAME"

          sudo visudo -cf \
            "/etc/sudoers.d/$USERNAME"

          echo ""
          echo "User:"
          id "$USERNAME"


      # ==========================================================
      # 10. RESTORE USER PROFILE
      #
      # The archive is extracted as root and then ownership is
      # corrected.
      #
      # IMPORTANT:
      # Private SSH keys are intentionally excluded.
      # ==========================================================

      - name: 10. Restore User Profile

        shell: bash

        run: |

          set -e

          USERNAME="cynetadmin"
          HOME_DIR="/home/$USERNAME"

          PROFILE_ARCHIVE="$STATE/user-profile.tar.gz"

          echo ""
          echo "=================================================="
          echo "RESTORING USER PROFILE"
          echo "=================================================="
          echo ""

          sudo mkdir -p "$HOME_DIR"

          if [ ! -f "$PROFILE_ARCHIVE" ]; then

            echo "No previous user profile archive found."

          else

            echo "Restoring user profile..."

            sudo tar \
              --extract \
              --gzip \
              --file="$PROFILE_ARCHIVE" \
              --directory="$HOME_DIR" \
              --no-same-owner

            echo "User profile extracted."

          fi

          # ------------------------------------------------------
          # Ensure required directories exist.
          # ------------------------------------------------------

          sudo mkdir -p \
            "$HOME_DIR/workspace" \
            "$HOME_DIR/.config" \
            "$HOME_DIR/.local" \
            "$HOME_DIR/.ssh"

          # ------------------------------------------------------
          # Restore SSH client configuration ONLY.
          #
          # Private keys are never restored.
          # ------------------------------------------------------

          SSH_CONFIG="$STATE/ssh-client-config.tar.gz"

          if [ -f "$SSH_CONFIG" ]; then

            echo "Restoring SSH client configuration..."

            sudo tar \
              --extract \
              --gzip \
              --file="$SSH_CONFIG" \
              --directory="$HOME_DIR" \
              --no-same-owner

          fi

          # ------------------------------------------------------
          # Ownership
          # ------------------------------------------------------

          sudo chown -R \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR"

          # ------------------------------------------------------
          # SSH directory permissions
          # ------------------------------------------------------

          sudo chmod 700 \
            "$HOME_DIR/.ssh"

          if [ -f "$HOME_DIR/.ssh/config" ]; then

            sudo chmod 600 \
              "$HOME_DIR/.ssh/config"

          fi

          echo ""
          echo "User profile restored."


      # ==========================================================
      # 11. RESTORE SELECTED SYSTEM CONFIGURATION
      # ==============================================================

      - name: 11. Restore System Configuration

        shell: bash

        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "RESTORING SYSTEM CONFIGURATION"
          echo "=================================================="
          echo ""

          # ------------------------------------------------------
          # SSH server configuration
          # ------------------------------------------------------

          if [ -f "$STATE/ssh-server-config.tar.gz" ]; then

            echo "Restoring SSH server configuration..."

            sudo tar \
              --extract \
              --gzip \
              --file="$STATE/ssh-server-config.tar.gz" \
              --directory=/ \
              --no-same-owner

          else

            echo "No previous SSH server configuration found."

          fi


          # ------------------------------------------------------
          # sudo configuration
          # ------------------------------------------------------

          if [ -f "$STATE/sudo-config.tar.gz" ]; then

            echo "Restoring sudo configuration..."

            sudo tar \
              --extract \
              --gzip \
              --file="$STATE/sudo-config.tar.gz" \
              --directory=/ \
              --no-same-owner

          fi


          # ------------------------------------------------------
          # cron configuration
          # ------------------------------------------------------

          if [ -f "$STATE/cron-config.tar.gz" ]; then

            echo "Restoring cron configuration..."

            sudo tar \
              --extract \
              --gzip \
              --file="$STATE/cron-config.tar.gz" \
              --directory=/ \
              --no-same-owner

          fi


          # ------------------------------------------------------
          # systemd custom units
          # ------------------------------------------------------

          if [ -f "$STATE/systemd-units.tar.gz" ]; then

            echo "Restoring custom systemd units..."

            sudo tar \
              --extract \
              --gzip \
              --file="$STATE/systemd-units.tar.gz" \
              --directory=/ \
              --no-same-owner

            sudo systemctl daemon-reload

          fi


          # ------------------------------------------------------
          # environment
          # ------------------------------------------------------

          if [ -f "$STATE/environment" ]; then

            echo "Restoring /etc/environment..."

            sudo cp \
              "$STATE/environment" \
              /etc/environment

          fi


          # ------------------------------------------------------
          # sysctl custom configuration
          # ------------------------------------------------------

          if [ -f "$STATE/sysctl-config.tar.gz" ]; then

            echo "Restoring sysctl configuration..."

            sudo tar \
              --extract \
              --gzip \
              --file="$STATE/sysctl-config.tar.gz" \
              --directory=/ \
              --no-same-owner

          fi

          echo ""
          echo "System configuration restoration completed."


      # ==========================================================
      # 12. RESTORE SSH SERVER CONFIGURATION SAFELY
      # ==============================================================

      - name: 12. Validate SSH Configuration

        shell: bash

        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "VALIDATING SSH"
          echo "=================================================="
          echo ""

          # ------------------------------------------------------
          # Force password authentication.
          #
          # This protects us if old configuration disabled it.
          # ------------------------------------------------------

          sudo mkdir -p /etc/ssh/sshd_config.d

          echo "PasswordAuthentication yes" |
            sudo tee \
              /etc/ssh/sshd_config.d/99-cynetadmin.conf \
              >/dev/null

          echo "UsePAM yes" |
            sudo tee -a \
              /etc/ssh/sshd_config.d/99-cynetadmin.conf \
              >/dev/null

          # ------------------------------------------------------
          # Validate
          # ------------------------------------------------------

          sudo sshd -t

          echo "SSH configuration: VALID"

          # ------------------------------------------------------
          # Start SSH
          # ------------------------------------------------------

          sudo systemctl enable ssh

          sudo systemctl restart ssh

          sleep 2

          STATUS=$(sudo systemctl is-active ssh)

          echo "SSH status: $STATUS"

          if [ "$STATUS" != "active" ]; then

            echo "ERROR: SSH failed to start."

            sudo systemctl status ssh \
              --no-pager ||
              true

            exit 1

          fi


      # ==========================================================
      # 13. RESTORE CRON
      # ==============================================================

      - name: 13. Restore Cron

        shell: bash

        run: |

          set +e

          USERNAME="cynetadmin"

          echo ""
          echo "=================================================="
          echo "RESTORING CRON"
          echo "=================================================="
          echo ""

          USER_CRON="$STATE/cynetadmin-crontab"

          if [ -f "$USER_CRON" ]; then

            echo "Restoring cynetadmin crontab..."

            sudo crontab \
              -u "$USERNAME" \
              "$USER_CRON"

          else

            echo "No previous user crontab found."

          fi

          sudo systemctl enable cron \
            2>/dev/null ||
            true

          sudo systemctl restart cron \
            2>/dev/null ||
            true

          true


      # ==========================================================
      # 14. RESTORE SYSTEMD CUSTOM UNITS
      #
      # We only restore unit files.
      #
      # We DO NOT automatically start arbitrary services from
      # previous state because some services may not exist or may
      # be incompatible with the new GitHub runner.
      # ==============================================================

      - name: 14. Restore Systemd Units

        shell: bash

        run: |

          set +e

          echo ""
          echo "=================================================="
          echo "SYSTEMD CUSTOM UNITS"
          echo "=================================================="
          echo ""

          if [ -d /etc/systemd/system ]; then

            sudo find /etc/systemd/system \
              -maxdepth 1 \
              -type f \
              -name '*.service' \
              -printf '%f\n' |
              sort

          fi

          sudo systemctl daemon-reload

          true


      # ==========================================================
      # 15. RESTORE USER ENVIRONMENT
      # ==============================================================

      - name: 15. Restore User Environment

        shell: bash

        run: |

          set -e

          USERNAME="cynetadmin"
          HOME_DIR="/home/$USERNAME"

          echo ""
          echo "=================================================="
          echo "USER ENVIRONMENT"
          echo "=================================================="
          echo ""

          # ------------------------------------------------------
          # Make sure shell configuration exists.
          # ------------------------------------------------------

          if [ ! -f "$HOME_DIR/.bashrc" ]; then

            sudo -u "$USERNAME" \
              cp /etc/skel/.bashrc \
              "$HOME_DIR/.bashrc"

          fi

          if [ ! -f "$HOME_DIR/.profile" ]; then

            sudo -u "$USERNAME" \
              cp /etc/skel/.profile \
              "$HOME_DIR/.profile"

          fi

          # ------------------------------------------------------
          # Git identity/configuration is preserved if it existed.
          # ------------------------------------------------------

          if [ -f "$HOME_DIR/.gitconfig" ]; then

            echo "Git configuration restored."

          else

            echo "No previous Git configuration found."

          fi

          sudo chown \
            "$USERNAME:$USERNAME" \
            "$HOME_DIR/.bashrc" \
            "$HOME_DIR/.profile" \
            2>/dev/null ||
            true


      # ==========================================================
      # 16. CONNECT TAILSCALE
      # ==============================================================

      - name: 16. Connect Tailscale

        shell: bash

        env:

          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |

          set -e

          if [ -z "$TAILSCALE_AUTHKEY" ]; then

            echo "ERROR:"
            echo "TAILSCALE_AUTHKEY secret is missing."

            exit 1

          fi

          echo ""
          echo "=================================================="
          echo "INSTALLING TAILSCALE"
          echo "=================================================="
          echo ""

          curl -fsSL \
            https://tailscale.com/install.sh |
            sh

          sudo systemctl enable tailscaled

          sudo systemctl start tailscaled

          sleep 5

          echo "Connecting Tailscale..."

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="cynet-linux-ssh" \
            --accept-dns=true

          sleep 5

          TS_IP=""

          for i in {1..15}; do

            TS_IP=$(sudo tailscale ip -4 2>/dev/null || true)

            if [ -n "$TS_IP" ]; then

              break

            fi

            sleep 2

          done

          if [ -z "$TS_IP" ]; then

            echo "ERROR: No Tailscale IPv4 address."

            sudo tailscale status || true

            exit 1

          fi

          echo ""
          echo "=================================================="
          echo "       LINUX SSH SERVER IS READY"
          echo "=================================================="
          echo ""

          echo "Tailscale IP : $TS_IP"
          echo "Hostname     : cynet-linux-ssh"
          echo "Username     : cynetadmin"
          echo ""
          echo "SSH:"
          echo ""
          echo "ssh cynetadmin@$TS_IP"
          echo ""
          echo "Persistent workspace:"
          echo ""
          echo "/home/cynetadmin/workspace"
          echo ""

          echo "=================================================="
          echo ""

          sudo tailscale status || true


      # ==========================================================
      # 17. VERIFY COMPLETE ENVIRONMENT
      # ==============================================================

      - name: 17. Verify Server

        shell: bash

        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "SERVER VERIFICATION"
          echo "=================================================="
          echo ""

          # ------------------------------------------------------
          # SSH
          # ------------------------------------------------------

          sudo sshd -t

          SSH_STATUS=$(sudo systemctl is-active ssh)

          if [ "$SSH_STATUS" != "active" ]; then

            echo "ERROR: SSH is not running."

            exit 1

          fi

          echo "SSH                 : OK"


          # ------------------------------------------------------
          # User
          # ------------------------------------------------------

          id cynetadmin >/dev/null

          echo "User                : OK"


          # ------------------------------------------------------
          # Workspace
          # ------------------------------------------------------

          if [ ! -d /home/cynetadmin/workspace ]; then

            echo "ERROR: Workspace missing."

            exit 1

          fi

          echo "Workspace           : OK"


          # ------------------------------------------------------
          # Sudo
          # ------------------------------------------------------

          sudo -u cynetadmin \
            sudo -n true

          echo "Passwordless sudo   : OK"


          # ------------------------------------------------------
          # Tailscale
          # ------------------------------------------------------

          TS_IP=$(sudo tailscale ip -4 2>/dev/null || true)

          if [ -z "$TS_IP" ]; then

            echo "ERROR: Tailscale IP unavailable."

            exit 1

          fi

          echo "Tailscale            : OK"
          echo "Tailscale IP         : $TS_IP"


          # ------------------------------------------------------
          # SSH port
          # ------------------------------------------------------

          if sudo ss -lnt | grep -q ':22 '; then

            echo "SSH port 22         : LISTENING"

          else

            echo "ERROR: SSH port 22 is not listening."

            exit 1

          fi


          echo ""
          echo "Server verification completed successfully."


      # ==========================================================
      # 18. INSPECT BEFORE SSH
      # ==============================================================

      - name: 18. Inspect Before SSH Session

        shell: bash

        run: |

          set +e

          echo ""
          echo "=================================================="
          echo "BEFORE SSH SESSION"
          echo "=================================================="
          echo ""

          echo "System:"
          uname -a

          echo ""

          echo "Ubuntu:"
          cat /etc/os-release

          echo ""

          echo "Disk:"
          df -h

          echo ""

          echo "Memory:"
          free -h

          echo ""

          echo "Installed manual APT packages:"
          echo "--------------------------------------------------"

          apt-mark showmanual |
            sort |
            head -500

          echo "--------------------------------------------------"

          echo ""

          echo "Workspace:"
          echo "--------------------------------------------------"

          sudo -u cynetadmin \
            find /home/cynetadmin/workspace \
            -maxdepth 4 \
            -printf '%p\n' \
            2>/dev/null |
            sort |
            head -1000

          echo "--------------------------------------------------"


      # ==========================================================
      # 19. KEEP SSH SERVER ALIVE
      #
      # 350 minutes
      # 60 second check
      # 5 minute notification
      # ==============================================================

      - name: 19. Server Keep-Alive

        id: keep_alive

        shell: bash

        run: |

          set -e

          TOTAL_MINUTES=350

          TOTAL_SECONDS=$(
            expr "$TOTAL_MINUTES" \* 60
          )

          INTERVAL_SECONDS=60

          NOTIFICATION_INTERVAL=300

          ELAPSED_SECONDS=0

          NEXT_NOTIFICATION=$NOTIFICATION_INTERVAL

          echo ""
          echo "=================================================="
          echo "       SSH SERVER IS NOW AVAILABLE"
          echo "=================================================="
          echo ""

          echo "Runtime       : ${TOTAL_MINUTES} minutes"
          echo "Check         : every 60 seconds"
          echo "Notification  : every 5 minutes"
          echo ""
          echo "Started       : $(date '+%Y-%m-%d %H:%M:%S')"
          echo ""

          while [ "$ELAPSED_SECONDS" -lt "$TOTAL_SECONDS" ]; do

            sleep "$INTERVAL_SECONDS"

            ELAPSED_SECONDS=$(
              expr "$ELAPSED_SECONDS" + "$INTERVAL_SECONDS"
            )

            if [ "$ELAPSED_SECONDS" -ge "$TOTAL_SECONDS" ]; then

              break

            fi

            if [ "$ELAPSED_SECONDS" -ge "$NEXT_NOTIFICATION" ]; then

              ELAPSED_MINUTES=$(
                expr "$ELAPSED_SECONDS" / 60
              )

              REMAINING_SECONDS=$(
                expr "$TOTAL_SECONDS" - "$ELAPSED_SECONDS"
              )

              REMAINING_MINUTES=$(
                expr "$REMAINING_SECONDS" / 60
              )

              echo ""
              echo "=================================================="
              echo "SSH SERVER STATUS"
              echo "=================================================="
              echo ""

              echo "Time       : $(date '+%Y-%m-%d %H:%M:%S')"
              echo "Elapsed    : ${ELAPSED_MINUTES} minutes"
              echo "Remaining  : ${REMAINING_MINUTES} minutes"
              echo ""
              echo "SSH server is still running."
              echo ""

              echo "=================================================="
              echo ""

              NEXT_NOTIFICATION=$(
                expr "$NEXT_NOTIFICATION" + "$NOTIFICATION_INTERVAL"
              )

            fi

          done

          echo ""
          echo "=================================================="
          echo "SSH SESSION COMPLETED"
          echo "=================================================="
          echo ""

          echo "Runtime: ${TOTAL_MINUTES} minutes"

          echo "Finished: $(date '+%Y-%m-%d %H:%M:%S')"


      # ==========================================================
      # 20. INSPECT AFTER SSH
      # ==============================================================

      - name: 20. Inspect After SSH Session

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set +e

          echo ""
          echo "=================================================="
          echo "AFTER SSH SESSION"
          echo "=================================================="
          echo ""

          echo "SSH:"
          sudo systemctl is-active ssh

          echo ""

          echo "Tailscale:"
          sudo tailscale status || true

          echo ""

          echo "Disk:"
          df -h

          echo ""

          echo "Workspace:"
          echo "--------------------------------------------------"

          sudo -u cynetadmin \
            find /home/cynetadmin/workspace \
            -type f \
            -printf '%p | %s bytes | %TY-%Tm-%Td %TH:%TM:%TS\n' \
            2>/dev/null |
            sort |
            head -1000

          echo "--------------------------------------------------"


      # ==========================================================
      # 21. CREATE APT PACKAGE SNAPSHOT
      # ==============================================================

      - name: 21. Snapshot APT Packages

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "SNAPSHOT APT PACKAGES"
          echo "=================================================="
          echo ""

          apt-mark showmanual |
            sort -u |
            grep -E '^[a-zA-Z0-9][a-zA-Z0-9+._-]*$' |
            grep -v '^ubuntu-minimal$' |
            grep -v '^ubuntu-standard$' \
            > "$STATE/apt-manual-packages.txt"

          echo "Saved package count:"

          wc -l \
            "$STATE/apt-manual-packages.txt"

          echo ""


      # ==========================================================
      # 22. SNAPSHOT PYTHON PACKAGES
      # ==============================================================

      - name: 22. Snapshot Python Packages

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set +e

          USERNAME="cynetadmin"

          echo ""
          echo "=================================================="
          echo "SNAPSHOT PYTHON PACKAGES"
          echo "=================================================="
          echo ""

          sudo -u "$USERNAME" \
            python3 -m pip freeze \
            --user \
            2>/dev/null |
            sort \
            > "$STATE/python-packages.txt"

          echo "Python package count:"

          wc -l \
            "$STATE/python-packages.txt"

          true


      # ==========================================================
      # 23. SNAPSHOT NPM GLOBAL PACKAGES
      # ==============================================================

      - name: 23. Snapshot NPM Global Packages

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set +e

          OUTPUT="$STATE/npm-global-packages.txt"

          echo ""
          echo "=================================================="
          echo "SNAPSHOT NPM GLOBAL PACKAGES"
          echo "=================================================="
          echo ""

          if ! command -v npm >/dev/null 2>&1; then

            echo "npm is not installed."

            : > "$OUTPUT"

            exit 0

          fi

          npm list \
            --global \
            --depth=0 \
            --parseable \
            2>/dev/null |
            while read -r PACKAGE_PATH; do

              if [ -d "$PACKAGE_PATH" ]; then

                PACKAGE_NAME=$(
                  basename "$PACKAGE_PATH"
                )

                if [ "$PACKAGE_NAME" != "node_modules" ]; then

                  echo "$PACKAGE_NAME"

                fi

              fi

            done |
            grep -E '^[a-zA-Z0-9@/_+.-]+$' |
            sort -u \
            > "$OUTPUT"

          echo "NPM package count:"

          wc -l "$OUTPUT"

          true


      # ==========================================================
      # 24. SNAPSHOT USER PROFILE
      #
      # IMPORTANT:
      # We exclude:
      #
      #   .ssh private keys
      #   cache directories
      #   browser caches
      #   npm cache
      #   pip cache
      #   temporary files
      #
      # This keeps the cache smaller and safer.
      # ==============================================================

      - name: 24. Snapshot User Profile

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          USERNAME="cynetadmin"
          HOME_DIR="/home/$USERNAME"

          PROFILE_ARCHIVE="$STATE/user-profile.tar.gz"

          echo ""
          echo "=================================================="
          echo "SNAPSHOT USER PROFILE"
          echo "=================================================="
          echo ""

          sudo tar \
            --create \
            --gzip \
            --file="$PROFILE_ARCHIVE" \
            --directory="$HOME_DIR" \
            --exclude='./.ssh/*' \
            --exclude='./.cache' \
            --exclude='./.cache/*' \
            --exclude='./.npm' \
            --exclude='./.npm/*' \
            --exclude='./.cache/pip' \
            --exclude='./.cache/pip/*' \
            --exclude='./workspace' \
            .

          echo "User profile archive created."

          ls -lh "$PROFILE_ARCHIVE"


      # ==========================================================
      # 25. SNAPSHOT SSH CLIENT CONFIG
      #
      # ONLY:
      #   ~/.ssh/config
      #   ~/.ssh/known_hosts
      #
      # NO private keys.
      # ==============================================================

      - name: 25. Snapshot SSH Client Configuration

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          USERNAME="cynetadmin"
          HOME_DIR="/home/$USERNAME"

          OUTPUT="$STATE/ssh-client-config.tar.gz"

          TEMP_DIR=$(mktemp -d)

          mkdir -p "$TEMP_DIR/.ssh"

          if [ -f "$HOME_DIR/.ssh/config" ]; then

            cp \
              "$HOME_DIR/.ssh/config" \
              "$TEMP_DIR/.ssh/config"

          fi

          if [ -f "$HOME_DIR/.ssh/known_hosts" ]; then

            cp \
              "$HOME_DIR/.ssh/known_hosts" \
              "$TEMP_DIR/.ssh/known_hosts"

          fi

          sudo tar \
            --create \
            --gzip \
            --file="$OUTPUT" \
            --directory="$TEMP_DIR" \
            .ssh

          rm -rf "$TEMP_DIR"

          echo "SSH client configuration saved."


      # ==========================================================
      # 26. SNAPSHOT SSH SERVER CONFIGURATION
      #
      # Only configuration files.
      # Host keys are intentionally NOT persisted.
      # ==============================================================

      - name: 26. Snapshot SSH Server Configuration

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          OUTPUT="$STATE/ssh-server-config.tar.gz"

          TEMP_DIR=$(mktemp -d)

          mkdir -p \
            "$TEMP_DIR/etc/ssh/sshd_config.d"

          if [ -f /etc/ssh/sshd_config ]; then

            cp \
              /etc/ssh/sshd_config \
              "$TEMP_DIR/etc/ssh/sshd_config"

          fi

          cp \
            /etc/ssh/sshd_config.d/*.conf \
            "$TEMP_DIR/etc/ssh/sshd_config.d/" \
            2>/dev/null ||
            true

          sudo tar \
            --create \
            --gzip \
            --file="$OUTPUT" \
            --directory="$TEMP_DIR" \
            etc/ssh/sshd_config \
            etc/ssh/sshd_config.d

          rm -rf "$TEMP_DIR"

          echo "SSH server configuration saved."


      # ==========================================================
      # 27. SNAPSHOT SUDO CONFIGURATION
      # ==============================================================

      - name: 27. Snapshot Sudo Configuration

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          OUTPUT="$STATE/sudo-config.tar.gz"

          TEMP_DIR=$(mktemp -d)

          mkdir -p "$TEMP_DIR/etc/sudoers.d"

          if [ -f /etc/sudoers.d/cynetadmin ]; then

            sudo cp \
              /etc/sudoers.d/cynetadmin \
              "$TEMP_DIR/etc/sudoers.d/cynetadmin"

          fi

          sudo tar \
            --create \
            --gzip \
            --file="$OUTPUT" \
            --directory="$TEMP_DIR" \
            etc/sudoers.d

          rm -rf "$TEMP_DIR"

          echo "Sudo configuration saved."


      # ==========================================================
      # 28. SNAPSHOT CRON
      # ==============================================================

      - name: 28. Snapshot Cron

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set +e

          USERNAME="cynetadmin"

          echo ""
          echo "=================================================="
          echo "SNAPSHOT CRON"
          echo "=================================================="
          echo ""

          sudo crontab \
            -u "$USERNAME" \
            -l \
            2>/dev/null \
            > "$STATE/cynetadmin-crontab"

          echo "User crontab saved."

          # ------------------------------------------------------
          # System cron files
          # ------------------------------------------------------

          OUTPUT="$STATE/cron-config.tar.gz"

          TEMP_DIR=$(mktemp -d)

          mkdir -p "$TEMP_DIR/etc"

          sudo cp \
            /etc/crontab \
            "$TEMP_DIR/etc/crontab" \
            2>/dev/null ||
            true

          if [ -d /etc/cron.d ]; then

            sudo cp -a \
              /etc/cron.d \
              "$TEMP_DIR/etc/"

          fi

          sudo tar \
            --create \
            --gzip \
            --file="$OUTPUT" \
            --directory="$TEMP_DIR" \
            etc

          rm -rf "$TEMP_DIR"

          true


      # ==========================================================
      # 29. SNAPSHOT CUSTOM SYSTEMD UNITS
      #
      # Only custom units created under /etc/systemd/system.
      # ==============================================================

      - name: 29. Snapshot Systemd Units

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          OUTPUT="$STATE/systemd-units.tar.gz"

          TEMP_DIR=$(mktemp -d)

          mkdir -p \
            "$TEMP_DIR/etc/systemd/system"

          sudo find \
            /etc/systemd/system \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.service' \
              -o \
              -name '*.timer' \
              -o \
              -name '*.socket' \
              -o \
              -name '*.path' \
            \) \
            -exec cp {} \
              "$TEMP_DIR/etc/systemd/system/" \;

          sudo tar \
            --create \
            --gzip \
            --file="$OUTPUT" \
            --directory="$TEMP_DIR" \
            etc/systemd/system

          rm -rf "$TEMP_DIR"

          echo "Systemd unit snapshot created."


      # ==========================================================
      # 30. SNAPSHOT SYSCTL CONFIGURATION
      # ==============================================================

      - name: 30. Snapshot Sysctl Configuration

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          OUTPUT="$STATE/sysctl-config.tar.gz"

          TEMP_DIR=$(mktemp -d)

          mkdir -p \
            "$TEMP_DIR/etc/sysctl.d"

          if [ -d /etc/sysctl.d ]; then

            sudo cp -a \
              /etc/sysctl.d/*.conf \
              "$TEMP_DIR/etc/sysctl.d/" \
              2>/dev/null ||
              true

          fi

          sudo tar \
            --create \
            --gzip \
            --file="$OUTPUT" \
            --directory="$TEMP_DIR" \
            etc/sysctl.d

          rm -rf "$TEMP_DIR"

          echo "Sysctl configuration saved."


      # ==========================================================
      # 31. SNAPSHOT /etc/environment
      # ==============================================================

      - name: 31. Snapshot Environment

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          if [ -f /etc/environment ]; then

            sudo cp \
              /etc/environment \
              "$STATE/environment"

          else

            : > "$STATE/environment"

          fi

          echo "/etc/environment saved."


      # ==========================================================
      # 32. SNAPSHOT USER WORKSPACE
      #
      # Workspace is already part of persistent-state only
      # indirectly if we copy it here.
      #
      # We intentionally make a separate copy.
      # ==============================================================

      - name: 32. Snapshot User Workspace

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          USERNAME="cynetadmin"

          SOURCE="/home/$USERNAME/workspace"

          TARGET="$STATE/workspace"

          echo ""
          echo "=================================================="
          echo "SNAPSHOT WORKSPACE"
          echo "=================================================="
          echo ""

          rm -rf "$TARGET"

          mkdir -p "$TARGET"

          if [ -d "$SOURCE" ]; then

            sudo rsync \
              -a \
              --delete \
              "$SOURCE/" \
              "$TARGET/"

          fi

          sudo chown -R \
            "$(id -u):$(id -g)" \
            "$TARGET"

          FILE_COUNT=$(
            find "$TARGET" \
              -type f \
              2>/dev/null |
              wc -l
          )

          echo "Workspace file count: $FILE_COUNT"


      # ==========================================================
      # 33. RESTORE WORKSPACE AFTER SNAPSHOT
      #
      # This is mostly for clarity and ensures the actual user's
      # workspace is populated from the persistent state directory.
      # ==============================================================

      - name: 33. Finalize User Workspace

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          USERNAME="cynetadmin"

          SOURCE="$STATE/workspace"

          TARGET="/home/$USERNAME/workspace"

          sudo mkdir -p "$TARGET"

          if [ -d "$SOURCE" ]; then

            sudo rsync \
              -a \
              --delete \
              "$SOURCE/" \
              "$TARGET/"

          fi

          sudo chown -R \
            "$USERNAME:$USERNAME" \
            "$TARGET"

          echo ""
          echo "Final workspace:"
          echo "--------------------------------------------------"

          sudo -u "$USERNAME" \
            find "$TARGET" \
            -maxdepth 4 \
            -printf '%p\n' \
            2>/dev/null |
            sort |
            head -1000

          echo "--------------------------------------------------"


      # ==========================================================
      # 34. VERIFY PERSISTENT STATE
      # ==============================================================

      - name: 34. Verify Persistent State

        id: verify_state

        if: steps.keep_alive.outcome == 'success'

        shell: bash

        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "PERSISTENT STATE VERIFICATION"
          echo "=================================================="
          echo ""

          if [ ! -d "$STATE" ]; then

            echo "ERROR: Persistent state directory missing."

            echo "STATE_VALID=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          FILE_COUNT=$(
            find "$STATE" \
              -type f \
              2>/dev/null |
              wc -l
          )

          TOTAL_SIZE=$(
            du -sh "$STATE" \
            2>/dev/null |
            awk '{print $1}'
          )

          echo "State file count : $FILE_COUNT"
          echo "State size       : $TOTAL_SIZE"
          echo ""

          echo "State files:"
          echo "--------------------------------------------------"

          find "$STATE" \
            -type f \
            -printf '%p | %s bytes\n' \
            2>/dev/null |
            sort |
            head -1000

          echo "--------------------------------------------------"

          if [ "$FILE_COUNT" -gt 0 ]; then

            echo "STATE_VALID=true" >> "$GITHUB_OUTPUT"

          else

            echo "STATE_VALID=false" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================================
      # 35. SAVE COMPLETE PARTIAL LINUX STATE
      # ==============================================================

      - name: 35. Save Linux State To GitHub Cache

        if: |
          steps.keep_alive.outcome == 'success' &&
          steps.verify_state.outputs.STATE_VALID == 'true'

        uses: actions/cache/save@v4

        with:

          path: ${{ github.workspace }}/persistent-state

          key: cynet-linux-state-${{ runner.os }}-${{ github.run_id }}


      # ==========================================================
      # 36. FINAL SUMMARY
      # ==============================================================

      - name: 36. Final Server Summary

        if: always()

        shell: bash

        run: |

          set +e

          echo ""
          echo "=================================================="
          echo "FINAL LINUX SSH SERVER SUMMARY"
          echo "=================================================="
          echo ""

          echo "Run ID              : $GITHUB_RUN_ID"
          echo "Runner OS           : $RUNNER_OS"
          echo ""

          echo "User                : cynetadmin"
          echo ""

          echo "Runtime             : 350 minutes"
          echo "Check interval      : 60 seconds"
          echo "Notification        : Every 5 minutes"
          echo ""

          echo "SSH result          : ${{ steps.keep_alive.outcome }}"
          echo "State verification  : ${{ steps.verify_state.outcome }}"
          echo ""

          echo "Persistent state:"
          echo "$STATE"
          echo ""

          if [ -d "$STATE" ]; then

            echo "Persistent state size:"

            du -sh "$STATE" 2>/dev/null || true

            echo ""

            echo "Persistent state files:"

            find "$STATE" \
              -type f \
              -printf '%p | %s bytes\n' \
              2>/dev/null |
              sort |
              head -1000

          fi

          echo ""
          echo "=================================================="

          true
