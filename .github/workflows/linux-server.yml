name: Permanent Linux SSH Server

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Prevent two scheduled/manual instances from modifying
# the OmniRoute backup simultaneously.
concurrency:
  group: permanent-linux-ssh-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      OMNIROUTE_PORT: 20128
      OMNIROUTE_BACKUP_PATH: backup/omniroute/omniroute-full-backup.tar.gz

    steps:

      # ============================================================
      # 1. Checkout Repository
      # ============================================================
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}
          persist-credentials: true

      # ============================================================
      # 2. Configure Git Identity
      # ============================================================
      - name: 2. Configure Git
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GIT_USERNAME:-}" ]; then
            echo "ERROR: GIT_USERNAME secret is empty."
            exit 1
          fi

          if [ -z "${GIT_TOKEN:-}" ]; then
            echo "ERROR: GIT_TOKEN secret is empty."
            exit 1
          fi

          git config user.name "$GIT_USERNAME"
          git config user.email "$GIT_USERNAME@users.noreply.github.com"

          echo "Git identity configured."

      # ============================================================
      # 3. Install Required Packages + OpenSSH
      # ============================================================
      - name: 3. Setup OpenSSH Server
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${RDP_USERNAME:-}" ]; then
            echo "ERROR: RDP_USERNAME secret is empty."
            exit 1
          fi

          if [ -z "${SSH_PASSWORD:-}" ]; then
            echo "ERROR: SSH_PASSWORD secret is empty."
            exit 1
          fi

          sudo apt-get update

          sudo apt-get install -y \
            openssh-server \
            curl \
            wget \
            git \
            ca-certificates \
            tar \
            gzip \
            sqlite3

          # --------------------------------------------------------
          # Create SSH user
          # --------------------------------------------------------
          if ! id "$RDP_USERNAME" >/dev/null 2>&1; then
            sudo useradd \
              -m \
              -s /bin/bash \
              "$RDP_USERNAME"
          fi

          # --------------------------------------------------------
          # Set SSH password
          # --------------------------------------------------------
          echo "$RDP_USERNAME:$SSH_PASSWORD" | sudo chpasswd

          # --------------------------------------------------------
          # Give sudo access
          # --------------------------------------------------------
          sudo usermod -aG sudo "$RDP_USERNAME"

          echo "$RDP_USERNAME ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee "/etc/sudoers.d/$RDP_USERNAME" >/dev/null

          sudo chmod 440 \
            "/etc/sudoers.d/$RDP_USERNAME"

          # --------------------------------------------------------
          # Enable SSH password authentication
          # --------------------------------------------------------
          sudo mkdir -p /etc/ssh/sshd_config.d

          echo "PasswordAuthentication yes" \
            | sudo tee \
            /etc/ssh/sshd_config.d/99-password-auth.conf \
            >/dev/null

          echo "PubkeyAuthentication yes" \
            | sudo tee \
            /etc/ssh/sshd_config.d/98-pubkey-auth.conf \
            >/dev/null

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          # --------------------------------------------------------
          # Workspace
          # --------------------------------------------------------
          sudo mkdir -p \
            "/home/$RDP_USERNAME/workspace"

          sudo chown -R \
            "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME/workspace"

          echo
          echo "SSH user:"
          echo "$RDP_USERNAME"

      # ============================================================
      # 4. Restore Workspace Cache
      # ============================================================
      - name: 4. Restore Persistent Workspace
        uses: actions/cache/restore@v4
        with:
          path: /home/${{ secrets.RDP_USERNAME }}/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
          restore-keys: |
            cynet-ssh-workspace-

      # ============================================================
      # 5. Fix Workspace Ownership
      # ============================================================
      - name: 5. Fix Workspace Ownership
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          set -euo pipefail

          sudo mkdir -p \
            "/home/$RDP_USERNAME/workspace"

          sudo chown -R \
            "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME/workspace"

      # ============================================================
      # 6. Install Node.js 22
      # ============================================================
      - name: 6. Install Node.js 22
        run: |
          set -euo pipefail

          echo "Installing Node.js 22..."

          curl -fsSL \
            https://deb.nodesource.com/setup_22.x \
            | sudo -E bash -

          sudo apt-get install -y nodejs

          echo
          echo "Node.js:"
          node --version

          echo
          echo "NPM:"
          npm --version

      # ============================================================
      # 7. Install OmniRoute
      # ============================================================
      - name: 7. Install OmniRoute
        run: |
          set -euo pipefail

          echo "Installing OmniRoute..."

          sudo npm install -g omniroute

          echo
          echo "OmniRoute executable:"
          command -v omniroute

          echo
          echo "OmniRoute version:"
          omniroute --version

      # ============================================================
      # 8. Check OmniRoute Backup In Git
      # ============================================================
      - name: 8. Check OmniRoute Backup
        id: check_backup
        run: |
          set -euo pipefail

          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          echo "Backup file:"
          echo "$BACKUP_FILE"

          if [ -f "$BACKUP_FILE" ]; then

            echo "backup_exists=true" \
              >> "$GITHUB_OUTPUT"

            echo
            echo "=================================================="
            echo "OmniRoute backup FOUND in repository"
            echo "=================================================="

            ls -lh "$BACKUP_FILE"

            echo
            echo "Validating archive..."

            tar -tzf "$BACKUP_FILE" >/dev/null

            echo "Archive is valid."

          else

            echo "backup_exists=false" \
              >> "$GITHUB_OUTPUT"

            echo
            echo "=================================================="
            echo "OmniRoute backup NOT FOUND"
            echo "Fresh OmniRoute installation will be created."
            echo "=================================================="

          fi

      # ============================================================
      # 9. Restore OmniRoute From Git Backup
      # ============================================================
      - name: 9. Restore OmniRoute Backup
        if: steps.check_backup.outputs.backup_exists == 'true'
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"
          RESTORE_TEMP="$RUNNER_TEMP/omniroute-restore"

          echo
          echo "=================================================="
          echo "OmniRoute Restore"
          echo "=================================================="

          echo "Source:"
          echo "$BACKUP_FILE"

          echo
          echo "Target:"
          echo "$OMNIROUTE_HOME"

          # --------------------------------------------------------
          # IMPORTANT:
          # If this runner already has an OmniRoute database,
          # do not overwrite it.
          # --------------------------------------------------------
          if [ -f "$OMNIROUTE_HOME/storage.sqlite" ]; then

            echo
            echo "Existing OmniRoute state detected."
            echo "Skipping restore."

          else

            echo
            echo "No local OmniRoute state detected."
            echo "Restoring Git backup..."

            sudo rm -rf "$RESTORE_TEMP"

            sudo mkdir -p "$RESTORE_TEMP"
            sudo mkdir -p "$OMNIROUTE_HOME"

            # ------------------------------------------------------
            # Extract archive
            # ------------------------------------------------------
            sudo tar \
              -xzf "$BACKUP_FILE" \
              -C "$RESTORE_TEMP"

            echo
            echo "Backup contents:"

            sudo find "$RESTORE_TEMP" \
              -maxdepth 4 \
              -type f \
              -printf '%P\n' \
              | head -200

            # ------------------------------------------------------
            # Detect archive structure
            # ------------------------------------------------------
            SOURCE_DIR="$RESTORE_TEMP"

            if [ -f "$RESTORE_TEMP/storage.sqlite" ]; then

              SOURCE_DIR="$RESTORE_TEMP"

            elif [ -f "$RESTORE_TEMP/.omniroute/storage.sqlite" ]; then

              SOURCE_DIR="$RESTORE_TEMP/.omniroute"

            else

              FOUND_DB=$(sudo find "$RESTORE_TEMP" \
                -type f \
                -name "storage.sqlite" \
                -print \
                -quit)

              if [ -n "${FOUND_DB:-}" ]; then
                SOURCE_DIR="$(dirname "$FOUND_DB")"
              fi

            fi

            echo
            echo "Detected source directory:"
            echo "$SOURCE_DIR"

            # ------------------------------------------------------
            # Validate OmniRoute database
            # ------------------------------------------------------
            if [ ! -f "$SOURCE_DIR/storage.sqlite" ]; then

              echo
              echo "ERROR:"
              echo "storage.sqlite was not found in the backup."

              echo
              echo "Full archive structure:"

              sudo find "$RESTORE_TEMP" \
                -maxdepth 6 \
                -print

              exit 1
            fi

            # ------------------------------------------------------
            # Copy complete OmniRoute state
            # ------------------------------------------------------
            sudo cp -a \
              "$SOURCE_DIR"/. \
              "$OMNIROUTE_HOME"/

            # ------------------------------------------------------
            # Fix ownership
            # ------------------------------------------------------
            sudo chown -R \
              "$RDP_USERNAME:$RDP_USERNAME" \
              "$OMNIROUTE_HOME"

            sudo chmod 700 \
              "$OMNIROUTE_HOME"

            if [ -f "$OMNIROUTE_HOME/.env" ]; then
              sudo chmod 600 \
                "$OMNIROUTE_HOME/.env"
            fi

            # ------------------------------------------------------
            # Cleanup
            # ------------------------------------------------------
            sudo rm -rf "$RESTORE_TEMP"

            echo
            echo "=================================================="
            echo "OmniRoute backup RESTORED successfully."
            echo "=================================================="

          fi

      # ============================================================
      # 10. Configure OmniRoute
      # ============================================================
      - name: 10. Configure OmniRoute
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          ENV_FILE="$OMNIROUTE_HOME/.env"

          sudo mkdir -p "$OMNIROUTE_HOME"

          # --------------------------------------------------------
          # Do NOT replace an existing .env.
          #
          # The backup may contain:
          # - STORAGE_ENCRYPTION_KEY
          # - JWT_SECRET
          # - API_KEY_SECRET
          # - database-related configuration
          #
          # Replacing these could make the restored database
          # unusable.
          # --------------------------------------------------------
          if [ ! -f "$ENV_FILE" ]; then
            sudo touch "$ENV_FILE"
          fi

          # --------------------------------------------------------
          # Helper
          # --------------------------------------------------------
          set_env() {
            KEY="$1"
            VALUE="$2"

            if sudo grep -q "^${KEY}=" "$ENV_FILE"; then

              sudo sed -i \
                "s|^${KEY}=.*|${KEY}=${VALUE}|" \
                "$ENV_FILE"

            else

              echo "${KEY}=${VALUE}" \
                | sudo tee -a "$ENV_FILE" \
                >/dev/null

            fi
          }

          # --------------------------------------------------------
          # Runtime configuration
          # --------------------------------------------------------
          set_env "NODE_ENV" "production"
          set_env "PORT" "${OMNIROUTE_PORT}"
          set_env "HOSTNAME" "0.0.0.0"
          set_env "DATA_DIR" "$OMNIROUTE_HOME"
          set_env \
            "NEXT_PUBLIC_BASE_URL" \
            "http://localhost:${OMNIROUTE_PORT}"

          # --------------------------------------------------------
          # Default password for fresh installations.
          #
          # IMPORTANT:
          # This does not overwrite an existing database password.
          # --------------------------------------------------------
          if ! sudo grep -q "^INITIAL_PASSWORD=" "$ENV_FILE"; then

            echo "INITIAL_PASSWORD=CHANGEME" \
              | sudo tee -a "$ENV_FILE" \
              >/dev/null

          fi

          # --------------------------------------------------------
          # Permissions
          # --------------------------------------------------------
          sudo chown \
            "$RDP_USERNAME:$RDP_USERNAME" \
            "$ENV_FILE"

          sudo chmod 600 "$ENV_FILE"

          echo
          echo "OmniRoute configuration prepared."

          echo
          echo "Runtime configuration:"

          sudo grep -E \
            '^(NODE_ENV|PORT|HOSTNAME|DATA_DIR|NEXT_PUBLIC_BASE_URL)=' \
            "$ENV_FILE" \
            || true

          echo
          echo "Sensitive variables:"

          for KEY in \
            JWT_SECRET \
            API_KEY_SECRET \
            STORAGE_ENCRYPTION_KEY \
            INITIAL_PASSWORD
          do

            if sudo grep -q "^${KEY}=" "$ENV_FILE"; then
              echo "$KEY = PRESENT"
            else
              echo "$KEY = NOT PRESENT"
            fi

          done

      # ============================================================
      # 11. Create OmniRoute systemd Service
      # ============================================================
      - name: 11. Create OmniRoute systemd Service
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          OMNIROUTE_BIN="$(command -v omniroute)"

          echo "OmniRoute executable:"
          echo "$OMNIROUTE_BIN"

          sudo tee \
            /etc/systemd/system/omniroute.service \
            >/dev/null <<EOF
          [Unit]
          Description=OmniRoute AI Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple

          User=$RDP_USERNAME
          Group=$RDP_USERNAME

          WorkingDirectory=$OMNIROUTE_HOME

          EnvironmentFile=$OMNIROUTE_HOME/.env

          ExecStart=$OMNIROUTE_BIN

          Restart=always
          RestartSec=5

          KillSignal=SIGTERM
          TimeoutStopSec=40

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo chmod 644 \
            /etc/systemd/system/omniroute.service

          sudo systemctl daemon-reload

          # --------------------------------------------------------
          # Start automatically on system boot
          # --------------------------------------------------------
          sudo systemctl enable \
            omniroute.service

          # --------------------------------------------------------
          # Start immediately
          # --------------------------------------------------------
          sudo systemctl restart \
            omniroute.service

          sleep 5

          echo
          echo "OmniRoute service:"
          sudo systemctl --no-pager status \
            omniroute.service \
            || true

      # ============================================================
      # 12. Verify OmniRoute
      # ============================================================
      - name: 12. Verify OmniRoute
        id: verify_omniroute
        run: |
          set -euo pipefail

          echo
          echo "Waiting for OmniRoute..."

          SUCCESS=0

          for i in {1..60}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              "http://127.0.0.1:${OMNIROUTE_PORT}" \
              >/dev/null 2>&1; then

              echo
              echo "OmniRoute is responding."

              SUCCESS=1
              break

            fi

            echo "Waiting... $i/60"

            sleep 2

          done

          if [ "$SUCCESS" -ne 1 ]; then

            echo
            echo "ERROR: OmniRoute failed to start."

            echo
            echo "Service status:"

            sudo systemctl --no-pager status \
              omniroute.service \
              || true

            echo
            echo "OmniRoute logs:"

            sudo journalctl \
              -u omniroute.service \
              --no-pager \
              -n 200 \
              || true

            exit 1
          fi

          echo
          echo "Listening port:"

          sudo ss -lntp \
            | grep ":${OMNIROUTE_PORT}" \
            || true

          echo
          echo "Process:"

          pgrep -af omniroute \
            || true

          echo
          echo "Recent logs:"

          sudo journalctl \
            -u omniroute.service \
            --no-pager \
            -n 50 \
            || true

      # ============================================================
      # 13. Connect Tailscale
      # ============================================================
      - name: 13. Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          set -euo pipefail

          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "ERROR: TAILSCALE_AUTHKEY secret is empty."
            exit 1
          fi

          echo "Installing Tailscale..."

          curl -fsSL \
            https://tailscale.com/install.sh \
            | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="cynet-linux-ssh"

          TS_IP="$(tailscale ip -4)"

          echo
          echo "=================================================="
          echo "      LINUX SSH + OMNIROUTE SERVER IS LIVE"
          echo "=================================================="
          echo
          echo "Tailscale IP:"
          echo "$TS_IP"
          echo
          echo "SSH Username:"
          echo "$RDP_USERNAME"
          echo
          echo "SSH Password:"
          echo "Stored in GitHub Secret SSH_PASSWORD"
          echo
          echo "--------------------------------------------------"
          echo "SSH:"
          echo "ssh $RDP_USERNAME@$TS_IP"
          echo
          echo "--------------------------------------------------"
          echo "OmniRoute:"
          echo "http://$TS_IP:${OMNIROUTE_PORT}"
          echo
          echo "OmniRoute API:"
          echo "http://$TS_IP:${OMNIROUTE_PORT}/v1"
          echo
          echo "--------------------------------------------------"
          echo "Workspace:"
          echo "/home/$RDP_USERNAME/workspace"
          echo
          echo "OmniRoute data:"
          echo "/home/$RDP_USERNAME/.omniroute"
          echo
          echo "=================================================="

      # ============================================================
      # 14. Final Health Check
      # ============================================================
      - name: 14. Final Health Check
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "FINAL HEALTH CHECK"
          echo "=================================================="

          echo
          echo "SSH:"
          sudo systemctl is-active ssh

          echo
          echo "OmniRoute:"
          sudo systemctl is-active \
            omniroute.service

          echo
          echo "OmniRoute port:"
          sudo ss -lntp \
            | grep ":${OMNIROUTE_PORT}"

          echo
          echo "Database:"
          ls -lh \
            "/home/$RDP_USERNAME/.omniroute/storage.sqlite"

          echo
          echo "OmniRoute directory:"
          sudo du -sh \
            "/home/$RDP_USERNAME/.omniroute"

          echo
          echo "=================================================="
          echo "HEALTH CHECK PASSED"
          echo "=================================================="

      # ============================================================
      # 15. Keep Server Alive
      # ============================================================
      - name: 15. Server Keep-Alive
        run: |
          set -euo pipefail

          for i in {1..355}; do

            sleep 60

            if (( i % 10 == 0 )); then

              echo
              echo "[$i/355] Server is active..."

              echo "OmniRoute:"
              sudo systemctl is-active \
                omniroute.service \
                || true

              echo "SSH:"
              sudo systemctl is-active \
                ssh \
                || true

              echo "Tailscale:"
              sudo tailscale status \
                --peers=false \
                || true

            fi

          done

      # ============================================================
      # 16. Create New OmniRoute Backup
      #
      # This step only runs when ALL previous steps succeeded.
      # Therefore a failed restore/startup will NOT overwrite
      # the existing Git backup.
      # ============================================================
      - name: 16. Create Updated OmniRoute Backup
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"
          TEMP_BACKUP="$BACKUP_FILE.tmp"

          echo
          echo "=================================================="
          echo "Creating Updated OmniRoute Backup"
          echo "=================================================="

          if [ ! -d "$OMNIROUTE_HOME" ]; then
            echo "ERROR: OmniRoute directory does not exist."
            exit 1
          fi

          if [ ! -f "$OMNIROUTE_HOME/storage.sqlite" ]; then
            echo "ERROR: storage.sqlite does not exist."
            exit 1
          fi

          # --------------------------------------------------------
          # Stop OmniRoute before SQLite backup.
          # --------------------------------------------------------
          echo "Stopping OmniRoute..."

          sudo systemctl stop \
            omniroute.service

          sleep 2

          # --------------------------------------------------------
          # Checkpoint SQLite WAL.
          # --------------------------------------------------------
          echo "Checkpointing SQLite..."

          sudo -u "$RDP_USERNAME" \
            sqlite3 \
            "$OMNIROUTE_HOME/storage.sqlite" \
            "PRAGMA wal_checkpoint(TRUNCATE);" \
            || true

          # --------------------------------------------------------
          # Make backup directory.
          # --------------------------------------------------------
          sudo mkdir -p \
            "$(dirname "$BACKUP_FILE")"

          # --------------------------------------------------------
          # Create archive atomically.
          # --------------------------------------------------------
          echo "Creating archive..."

          sudo tar \
            -czf "$TEMP_BACKUP" \
            -C "$OMNIROUTE_HOME" \
            .

          sudo mv \
            "$TEMP_BACKUP" \
            "$BACKUP_FILE"

          sudo chown \
            "$(id -u):$(id -g)" \
            "$BACKUP_FILE"

          # --------------------------------------------------------
          # Validate archive.
          # --------------------------------------------------------
          echo "Validating archive..."

          tar -tzf \
            "$BACKUP_FILE" \
            >/dev/null

          echo
          echo "Backup created successfully:"

          ls -lh "$BACKUP_FILE"

          # --------------------------------------------------------
          # Restart OmniRoute.
          # --------------------------------------------------------
          echo
          echo "Restarting OmniRoute..."

          sudo systemctl start \
            omniroute.service

          sleep 5

          sudo systemctl is-active \
            omniroute.service

          echo
          echo "OmniRoute restarted successfully."

      # ============================================================
      # 17. Pull Latest Git Changes Before Push
      # ============================================================
      - name: 17. Pull Latest Git Changes
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          echo
          echo "=================================================="
          echo "Preparing Git Push"
          echo "=================================================="

          if [ -z "${GIT_USERNAME:-}" ]; then
            echo "ERROR: GIT_USERNAME secret is empty."
            exit 1
          fi

          if [ -z "${GIT_TOKEN:-}" ]; then
            echo "ERROR: GIT_TOKEN secret is empty."
            exit 1
          fi

          git config user.name "$GIT_USERNAME"
          git config user.email \
            "$GIT_USERNAME@users.noreply.github.com"

          # --------------------------------------------------------
          # actions/checkout already configured authentication.
          #
          # Fetch latest remote state.
          # --------------------------------------------------------
          git fetch origin

          BRANCH="${GITHUB_REF_NAME}"

          echo
          echo "Branch:"
          echo "$BRANCH"

          # --------------------------------------------------------
          # Make sure current branch tracks origin.
          # --------------------------------------------------------
          git checkout "$BRANCH"

          # --------------------------------------------------------
          # Rebase local changes against latest remote state.
          #
          # At this point only the OmniRoute backup should be
          # modified.
          # --------------------------------------------------------
          git pull \
            --rebase \
            origin \
            "$BRANCH"

          echo
          echo "Latest Git state pulled successfully."

      # ============================================================
      # 18. Commit + Push OmniRoute Backup
      # ============================================================
      - name: 18. Push OmniRoute Backup To Git
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          BACKUP_FILE="$OMNIROUTE_BACKUP_PATH"
          BRANCH="${GITHUB_REF_NAME}"

          echo
          echo "=================================================="
          echo "Pushing OmniRoute Backup"
          echo "=================================================="

          if [ ! -f "$GITHUB_WORKSPACE/$BACKUP_FILE" ]; then

            echo "ERROR: Backup file does not exist:"
            echo "$BACKUP_FILE"

            exit 1
          fi

          # --------------------------------------------------------
          # Git identity
          # --------------------------------------------------------
          git config user.name "$GIT_USERNAME"
          git config user.email \
            "$GIT_USERNAME@users.noreply.github.com"

          # --------------------------------------------------------
          # Add only OmniRoute backup.
          # --------------------------------------------------------
          git add "$BACKUP_FILE"

          # --------------------------------------------------------
          # Nothing changed?
          # --------------------------------------------------------
          if git diff \
            --cached \
            --quiet \
            -- "$BACKUP_FILE"; then

            echo
            echo "OmniRoute backup has not changed."
            echo "Nothing to commit."

          else

            echo
            echo "OmniRoute backup changed."

            git commit \
              -m "chore: update OmniRoute backup"

            # ------------------------------------------------------
            # Push
            # ------------------------------------------------------
            git push \
              origin \
              "$BRANCH"

            echo
            echo "=================================================="
            echo "OmniRoute backup pushed successfully."
            echo "=================================================="

          fi

      # ============================================================
      # 19. Save Workspace Cache
      # ============================================================
      - name: 19. Save Workspace Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/${{ secrets.RDP_USERNAME }}/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}

      # ============================================================
      # 20. Final Service State
      # ============================================================
      - name: 20. Final Service State
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "FINAL SERVICE STATE"
          echo "=================================================="

          echo
          echo "SSH:"
          sudo systemctl --no-pager status ssh \
            || true

          echo
          echo "OmniRoute:"
          sudo systemctl --no-pager status \
            omniroute.service \
            || true

          echo
          echo "Recent OmniRoute logs:"

          sudo journalctl \
            -u omniroute.service \
            --no-pager \
            -n 100 \
            || true

