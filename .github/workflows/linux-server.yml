name: Permanent Linux SSH Server

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: permanent-linux-ssh-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: Mehdi
      OMNIROUTE_PORT: '20128'
      OMNIROUTE_BACKUP_PATH: backup/omniroute/omniroute-full-backup.tar.gz

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}
          persist-credentials: true

      - name: 2. Configure Git
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GIT_USERNAME:-}" || { echo "ERROR: GIT_USERNAME is empty."; exit 1; }
          test -n "${GIT_TOKEN:-}" || { echo "ERROR: GIT_TOKEN is empty."; exit 1; }
          git config user.name "$GIT_USERNAME"
          git config user.email "$GIT_USERNAME@users.noreply.github.com"

      - name: 3. Setup OpenSSH Server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "SETTING UP SSH"
          echo "=================================================="
          echo "Username: $RDP_USERNAME"
          echo "Home: /home/$RDP_USERNAME"

          test -n "${SSH_PASSWORD:-}" || {
            echo "ERROR: SSH_PASSWORD secret is empty."
            exit 1
          }

          sudo apt-get update
          sudo apt-get install -y \
            openssh-server \
            curl \
            wget \
            git \
            ca-certificates \
            tar \
            gzip \
            sqlite3

          # Required by sshd on GitHub's Ubuntu runner.
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd

          if id "$RDP_USERNAME" >/dev/null 2>&1; then
            echo "User already exists: $RDP_USERNAME"
          else
            echo "Creating user: $RDP_USERNAME"
            sudo useradd -m -s /bin/bash "$RDP_USERNAME"
          fi

          sudo passwd -u "$RDP_USERNAME" >/dev/null 2>&1 || true
          echo "$RDP_USERNAME:$SSH_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$RDP_USERNAME"

          echo "$RDP_USERNAME ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee "/etc/sudoers.d/$RDP_USERNAME" >/dev/null
          sudo chmod 440 "/etc/sudoers.d/$RDP_USERNAME"

          sudo mkdir -p /etc/ssh/sshd_config.d

          printf '%s\n' 'PasswordAuthentication yes' \
            | sudo tee /etc/ssh/sshd_config.d/99-password-auth.conf >/dev/null

          printf '%s\n' 'PubkeyAuthentication yes' \
            | sudo tee /etc/ssh/sshd_config.d/98-pubkey-auth.conf >/dev/null

          # Validate sshd configuration before restart.
          sudo sshd -t

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sudo systemctl is-active --quiet ssh || {
            echo "ERROR: ssh.service is not active."
            sudo journalctl -u ssh --no-pager -n 100 || true
            exit 1
          }

          sudo mkdir -p "/home/$RDP_USERNAME/workspace"
          sudo chown -R "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME/workspace"

          sudo mkdir -p "/home/$RDP_USERNAME/.omniroute"
          sudo chown -R "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME/.omniroute"
          sudo chmod 700 "/home/$RDP_USERNAME/.omniroute"

          echo "SSH setup completed successfully."

      - name: 4. Restore Persistent Workspace
        uses: actions/cache/restore@v4
        with:
          path: /home/Mehdi/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
          restore-keys: |
            cynet-ssh-workspace-

      - name: 5. Fix Workspace Ownership
        run: |
          set -euo pipefail
          sudo mkdir -p "/home/$RDP_USERNAME/workspace"
          sudo chown -R "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME/workspace"

      - name: 6. Install Node.js 22
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          echo "Node.js: $(node --version)"
          echo "NPM: $(npm --version)"

      - name: 7. Install OmniRoute
        run: |
          set -euo pipefail
          sudo npm install -g omniroute
          command -v omniroute
          omniroute --version

      - name: 8. Prepare OmniRoute Directory
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"

          sudo mkdir -p "$OMNIROUTE_HOME"
          sudo chown -R "$RDP_USERNAME:$RDP_USERNAME" "$OMNIROUTE_HOME"
          sudo chmod 700 "$OMNIROUTE_HOME"

          echo "OMNIROUTE_HOME=$OMNIROUTE_HOME" >> "$GITHUB_ENV"

      - name: 9. Check OmniRoute Backup
        id: check_backup
        run: |
          set -euo pipefail

          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          if [ -f "$BACKUP_FILE" ]; then
            echo "backup_exists=true" >> "$GITHUB_OUTPUT"

            echo "OmniRoute backup found:"
            ls -lh "$BACKUP_FILE"

            echo "Validating gzip archive..."
            gzip -t "$BACKUP_FILE"
            tar -tzf "$BACKUP_FILE" >/dev/null

            echo "Backup archive is valid."
          else
            echo "backup_exists=false" >> "$GITHUB_OUTPUT"
            echo "No OmniRoute backup found. Fresh state will be created."
          fi

      - name: 10. Restore OmniRoute Backup
        if: steps.check_backup.outputs.backup_exists == 'true'
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"
          RESTORE_TEMP="$RUNNER_TEMP/omniroute-restore"

          if sudo test -f "$OMNIROUTE_HOME/storage.sqlite"; then
            echo "Existing OmniRoute database detected. Skipping restore."
            exit 0
          fi

          sudo rm -rf "$RESTORE_TEMP"
          sudo mkdir -p "$RESTORE_TEMP"

          sudo tar -xzf "$BACKUP_FILE" -C "$RESTORE_TEMP"

          FOUND_DB="$(
            sudo find "$RESTORE_TEMP" \
              -type f \
              -name storage.sqlite \
              -print \
              -quit
          )"

          if [ -z "${FOUND_DB:-}" ]; then
            echo "ERROR: storage.sqlite was not found in backup."
            sudo find "$RESTORE_TEMP" -maxdepth 8 -print || true
            exit 1
          fi

          SOURCE_DIR="$(dirname "$FOUND_DB")"

          echo "Restoring from: $SOURCE_DIR"

          sudo cp -a "$SOURCE_DIR"/. "$OMNIROUTE_HOME"/

          sudo chown -R "$RDP_USERNAME:$RDP_USERNAME" "$OMNIROUTE_HOME"
          sudo chmod 700 "$OMNIROUTE_HOME"

          if sudo test -f "$OMNIROUTE_HOME/.env"; then
            sudo chmod 600 "$OMNIROUTE_HOME/.env"
          fi

          sudo test -f "$OMNIROUTE_HOME/storage.sqlite"

          sudo -u "$RDP_USERNAME" sqlite3 \
            "$OMNIROUTE_HOME/storage.sqlite" \
            "PRAGMA integrity_check;" | grep -qx 'ok'

          sudo rm -rf "$RESTORE_TEMP"

          echo "OmniRoute backup restored successfully."

      - name: 11. Configure OmniRoute
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          ENV_FILE="$OMNIROUTE_HOME/.env"

          sudo touch "$ENV_FILE"

          set_env() {
            local KEY="$1"
            local VALUE="$2"

            if sudo grep -q "^${KEY}=" "$ENV_FILE"; then
              sudo sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "$ENV_FILE"
            else
              printf '%s=%s\n' "$KEY" "$VALUE" \
                | sudo tee -a "$ENV_FILE" >/dev/null
            fi
          }

          set_env NODE_ENV production
          set_env PORT "$OMNIROUTE_PORT"
          set_env HOSTNAME 0.0.0.0
          set_env HOME "/home/$RDP_USERNAME"
          set_env DATA_DIR "$OMNIROUTE_HOME"
          set_env NEXT_PUBLIC_BASE_URL "http://localhost:$OMNIROUTE_PORT"

          # Only create an initial password marker for a fresh database.
          if ! sudo test -f "$OMNIROUTE_HOME/storage.sqlite"; then
            if ! sudo grep -q '^INITIAL_PASSWORD=' "$ENV_FILE"; then
              printf '%s\n' 'INITIAL_PASSWORD=CHANGEME' \
                | sudo tee -a "$ENV_FILE" >/dev/null
            fi
          fi

          sudo chown "$RDP_USERNAME:$RDP_USERNAME" "$ENV_FILE"
          sudo chmod 600 "$ENV_FILE"

          echo "OmniRoute runtime configuration:"
          sudo grep -E \
            '^(NODE_ENV|PORT|HOSTNAME|HOME|DATA_DIR|NEXT_PUBLIC_BASE_URL)=' \
            "$ENV_FILE" || true

          echo "Sensitive variables:"
          for KEY in JWT_SECRET API_KEY_SECRET STORAGE_ENCRYPTION_KEY INITIAL_PASSWORD; do
            if sudo grep -q "^${KEY}=" "$ENV_FILE"; then
              echo "$KEY = PRESENT"
            else
              echo "$KEY = NOT PRESENT"
            fi
          done

      - name: 12. Create OmniRoute systemd Service
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          OMNIROUTE_BIN="$(command -v omniroute)"

          test -n "$OMNIROUTE_BIN"

          sudo tee /etc/systemd/system/omniroute.service >/dev/null <<EOF
          [Unit]
          Description=OmniRoute AI Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$RDP_USERNAME
          Group=$RDP_USERNAME
          WorkingDirectory=$OMNIROUTE_HOME

          Environment=HOME=/home/$RDP_USERNAME
          Environment=DATA_DIR=$OMNIROUTE_HOME
          Environment=PORT=$OMNIROUTE_PORT
          Environment=HOSTNAME=0.0.0.0
          Environment=NODE_ENV=production
          Environment=NEXT_PUBLIC_BASE_URL=http://localhost:$OMNIROUTE_PORT
          EnvironmentFile=$OMNIROUTE_HOME/.env

          ExecStart=$OMNIROUTE_BIN

          Restart=always
          RestartSec=5
          KillSignal=SIGTERM
          TimeoutStopSec=40

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo chmod 644 /etc/systemd/system/omniroute.service
          sudo systemctl daemon-reload
          sudo systemctl enable omniroute.service
          sudo systemctl restart omniroute.service

          sleep 5

          sudo systemctl is-active --quiet omniroute.service || {
            echo "ERROR: OmniRoute service failed."
            sudo systemctl --no-pager status omniroute.service || true
            sudo journalctl -u omniroute.service --no-pager -n 250 || true
            exit 1
          }

          sudo systemctl --no-pager status omniroute.service || true

      - name: 13. Verify OmniRoute
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          DB_FILE="$OMNIROUTE_HOME/storage.sqlite"

          echo "Waiting for OmniRoute HTTP endpoint..."

          SUCCESS=0

          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:$OMNIROUTE_PORT" >/dev/null 2>&1; then
              SUCCESS=1
              break
            fi
            echo "Waiting... $i/60"
            sleep 2
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "ERROR: OmniRoute HTTP endpoint did not respond."
            sudo systemctl --no-pager status omniroute.service || true
            sudo journalctl -u omniroute.service --no-pager -n 250 || true
            exit 1
          fi

          echo "OmniRoute HTTP endpoint is responding."

          echo "Waiting for database (up to 120 s)..."
          for i in {1..120}; do
            if sudo test -f "$DB_FILE"; then
              echo "Database found after ${i}s"
              break
            fi
            if (( i % 10 == 0 )); then
              echo "Still waiting for database... $i/120"
            fi
            sleep 1
          done

          if ! sudo test -f "$DB_FILE"; then
            echo "ERROR: storage.sqlite was not created at:"
            echo "$DB_FILE"

            echo "Searching user home:"
            sudo find "/home/$RDP_USERNAME" \
              -type f -name storage.sqlite -print \
              2>/dev/null || true

            echo "OmniRoute environment:"
            sudo systemctl show omniroute.service -p Environment --no-pager || true

            echo "OmniRoute directory listing:"
            sudo ls -la "$OMNIROUTE_HOME" || true

            echo "OmniRoute logs:"
            sudo journalctl -u omniroute.service --no-pager -n 250 || true

            exit 1
          fi

          echo "Database exists:"
          sudo ls -lh "$DB_FILE"

          DB_CHECK="$(
            sudo -u "$RDP_USERNAME" \
              sqlite3 "$DB_FILE" \
              "PRAGMA integrity_check;"
          )"
          echo "SQLite integrity_check: $DB_CHECK"
          echo "$DB_CHECK" | grep -qx 'ok'

          echo "SQLite integrity: OK"

          sudo ss -lntp | grep ":$OMNIROUTE_PORT"
          pgrep -af omniroute || true
          sudo journalctl -u omniroute.service --no-pager -n 50 || true

      - name: 14. Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          test -n "${TAILSCALE_AUTHKEY:-}" || {
            echo "ERROR: TAILSCALE_AUTHKEY is empty."
            exit 1
          }

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="cynet-linux-ssh"

          TS_IP="$(tailscale ip -4)"

          echo "=================================================="
          echo "LINUX SSH + OMNIROUTE SERVER IS LIVE"
          echo "=================================================="
          echo "Tailscale IP: $TS_IP"
          echo "SSH: ssh $RDP_USERNAME@$TS_IP"
          echo "OmniRoute: http://$TS_IP:$OMNIROUTE_PORT"
          echo "OmniRoute API: http://$TS_IP:$OMNIROUTE_PORT/v1"
          echo "Workspace: /home/$RDP_USERNAME/workspace"
          echo "OmniRoute data: /home/$RDP_USERNAME/.omniroute"
          echo "=================================================="

      - name: 15. Final Health Check
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          DB_FILE="$OMNIROUTE_HOME/storage.sqlite"

          echo "=================================================="
          echo "FINAL HEALTH CHECK"
          echo "=================================================="

          echo "SSH:"
          sudo systemctl is-active --quiet ssh
          echo "active"

          echo "OmniRoute:"
          sudo systemctl is-active --quiet omniroute.service
          echo "active"

          echo "OmniRoute port:"
          sudo ss -lntp | grep ":$OMNIROUTE_PORT"

          echo "Database:"
          if ! sudo test -f "$DB_FILE"; then
            echo "ERROR: Database does not exist: $DB_FILE"
            sudo find "/home/$RDP_USERNAME" \
              -type f -name storage.sqlite -print \
              2>/dev/null || true
            exit 1
          fi

          sudo ls -lh "$DB_FILE"

          echo "Database integrity:"
          DB_CHECK="$(
            sudo -u "$RDP_USERNAME" \
              sqlite3 "$DB_FILE" \
              "PRAGMA integrity_check;"
          )"
          echo "$DB_CHECK"
          echo "$DB_CHECK" | grep -qx 'ok'
          echo "ok"

          echo "OmniRoute directory:"
          sudo du -sh "$OMNIROUTE_HOME"

          echo "=================================================="
          echo "HEALTH CHECK PASSED"
          echo "=================================================="

      - name: 16. Server Keep-Alive
        run: |
          set -euo pipefail

          for i in {1..355}; do
            sleep 60

            if (( i % 10 == 0 )); then
              echo "[$i/355] Server is active..."
              sudo systemctl is-active omniroute.service || true
              sudo systemctl is-active ssh || true
              sudo tailscale status --peers=false || true
            fi
          done

      - name: 17. Create Updated OmniRoute Backup
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"
          TEMP_BACKUP="$RUNNER_TEMP/omniroute-backup.tar.gz"

          sudo test -f "$OMNIROUTE_HOME/storage.sqlite"

          sudo systemctl stop omniroute.service

          for i in {1..20}; do
            if ! sudo systemctl is-active --quiet omniroute.service; then
              break
            fi
            sleep 1
          done

          if sudo systemctl is-active --quiet omniroute.service; then
            echo "ERROR: OmniRoute did not stop."
            exit 1
          fi

          sudo -u "$RDP_USERNAME" sqlite3 \
            "$OMNIROUTE_HOME/storage.sqlite" \
            "PRAGMA wal_checkpoint(TRUNCATE);" || true

          sudo -u "$RDP_USERNAME" sqlite3 \
            "$OMNIROUTE_HOME/storage.sqlite" \
            "PRAGMA integrity_check;" | grep -qx 'ok'

          mkdir -p "$(dirname "$BACKUP_FILE")"
          rm -f "$TEMP_BACKUP"

          sudo tar \
            -czf "$TEMP_BACKUP" \
            -C "$OMNIROUTE_HOME" \
            .

          gzip -t "$TEMP_BACKUP"
          tar -tzf "$TEMP_BACKUP" >/dev/null

          if ! tar -tzf "$TEMP_BACKUP" | grep -qx './storage.sqlite'; then
            echo "ERROR: storage.sqlite is missing from archive."
            exit 1
          fi

          mv "$TEMP_BACKUP" "$BACKUP_FILE"

          sudo systemctl start omniroute.service
          sleep 5
          sudo systemctl is-active --quiet omniroute.service

          echo "Backup created and OmniRoute restarted successfully."
          ls -lh "$BACKUP_FILE"

      - name: 18. Synchronize Git Before Push
        run: |
          set -euo pipefail

          BRANCH="$GITHUB_REF_NAME"
          TEMP_BACKUP="$RUNNER_TEMP/omniroute-git-backup.tar.gz"

          cp \
            "$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH" \
            "$TEMP_BACKUP"

          git fetch origin "$BRANCH"

          git reset --hard "origin/$BRANCH"

          mkdir -p "$(dirname "$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH")"

          cp \
            "$TEMP_BACKUP" \
            "$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          git status --short

      - name: 19. Commit + Push OmniRoute Backup
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          set -euo pipefail

          BRANCH="$GITHUB_REF_NAME"
          BACKUP_FILE="$OMNIROUTE_BACKUP_PATH"

          git config user.name "$GIT_USERNAME"
          git config user.email "$GIT_USERNAME@users.noreply.github.com"

          git add "$BACKUP_FILE"

          if git diff --cached --quiet -- "$BACKUP_FILE"; then
            echo "OmniRoute backup has not changed."
          else
            git commit -m "chore: update OmniRoute backup"
            git push origin "$BRANCH"
          fi

      - name: 20. Save Workspace Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/Mehdi/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}

      - name: 21. Final Service State
        if: always()
        run: |
          echo "=================================================="
          echo "FINAL SERVICE STATE"
          echo "=================================================="

          echo "SSH:"
          sudo systemctl --no-pager status ssh || true

          echo "OmniRoute:"
          sudo systemctl --no-pager status omniroute.service || true

          echo "Listening port:"
          sudo ss -lntp | grep ":$OMNIROUTE_PORT" || true

          echo "Recent OmniRoute logs:"
          sudo journalctl -u omniroute.service --no-pager -n 100 || true
