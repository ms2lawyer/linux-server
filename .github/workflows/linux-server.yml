name: Permanent Linux SSH Server

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Prevent two workflow runs from modifying the same
# OmniRoute backup at the same time.
concurrency:
  group: permanent-linux-ssh-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # ============================================================
    # GLOBAL JOB ENVIRONMENT
    #
    # IMPORTANT:
    # RDP_USERNAME must be defined here because every step
    # uses it.
    # ============================================================
    env:
      RDP_USERNAME: Mehdi
      OMNIROUTE_PORT: 20128
      OMNIROUTE_BACKUP_PATH: backup/omniroute/omniroute-full-backup.tar.gz

    steps:

      # ============================================================
      # 1. Checkout Repository
      # ============================================================
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}
          persist-credentials: true

      # ============================================================
      # 2. Configure Git
      # ============================================================
      - name: 2. Configure Git
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GIT_USERNAME:-}" ]; then
            echo "ERROR: GIT_USERNAME secret is empty."
            exit 1
          fi

          if [ -z "${GIT_TOKEN:-}" ]; then
            echo "ERROR: GIT_TOKEN secret is empty."
            exit 1
          fi

          git config user.name "$GIT_USERNAME"
          git config user.email "$GIT_USERNAME@users.noreply.github.com"

          echo
          echo "Git identity configured."

      # ============================================================
      # 3. Setup OpenSSH Server
      # ============================================================
      - name: 3. Setup OpenSSH Server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${RDP_USERNAME:-}" ]; then
            echo "ERROR: RDP_USERNAME is empty."
            exit 1
          fi

          if [ -z "${SSH_PASSWORD:-}" ]; then
            echo "ERROR: SSH_PASSWORD secret is empty."
            exit 1
          fi

          echo
          echo "=================================================="
          echo "SSH USER CONFIGURATION"
          echo "=================================================="

          echo "Username:"
          echo "$RDP_USERNAME"

          echo "Home:"
          echo "/home/$RDP_USERNAME"

          sudo apt-get update

          sudo apt-get install -y \
            openssh-server \
            curl \
            wget \
            git \
            ca-certificates \
            tar \
            gzip \
            sqlite3

          # --------------------------------------------------------
          # Create SSH user if necessary
          # --------------------------------------------------------
          if ! id "$RDP_USERNAME" >/dev/null 2>&1; then

            echo
            echo "Creating user $RDP_USERNAME..."

            sudo useradd \
              -m \
              -s /bin/bash \
              "$RDP_USERNAME"

          else

            echo
            echo "User $RDP_USERNAME already exists."

          fi

          # --------------------------------------------------------
          # Ensure home directory exists
          # --------------------------------------------------------
          sudo mkdir -p \
            "/home/$RDP_USERNAME"

          sudo chown \
            "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME"

          # --------------------------------------------------------
          # Set SSH password
          # --------------------------------------------------------
          echo "$RDP_USERNAME:$SSH_PASSWORD" \
            | sudo chpasswd

          # --------------------------------------------------------
          # Give sudo access
          # --------------------------------------------------------
          sudo usermod \
            -aG sudo \
            "$RDP_USERNAME"

          echo "$RDP_USERNAME ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee \
              "/etc/sudoers.d/$RDP_USERNAME" \
              >/dev/null

          sudo chmod 440 \
            "/etc/sudoers.d/$RDP_USERNAME"

          # --------------------------------------------------------
          # SSH configuration
          # --------------------------------------------------------
          sudo mkdir -p \
            /etc/ssh/sshd_config.d

          echo "PasswordAuthentication yes" \
            | sudo tee \
              /etc/ssh/sshd_config.d/99-password-auth.conf \
              >/dev/null

          echo "PubkeyAuthentication yes" \
            | sudo tee \
              /etc/ssh/sshd_config.d/98-pubkey-auth.conf \
              >/dev/null

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          # --------------------------------------------------------
          # Workspace
          # --------------------------------------------------------
          sudo mkdir -p \
            "/home/$RDP_USERNAME/workspace"

          sudo chown -R \
            "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME/workspace"

          echo
          echo "SSH setup completed."

      # ============================================================
      # 4. Restore Persistent Workspace
      # ============================================================
      - name: 4. Restore Persistent Workspace
        uses: actions/cache/restore@v4
        with:
          path: /home/${{ env.RDP_USERNAME }}/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
          restore-keys: |
            cynet-ssh-workspace-

      # ============================================================
      # 5. Fix Workspace Ownership
      # ============================================================
      - name: 5. Fix Workspace Ownership
        run: |
          set -euo pipefail

          echo
          echo "Fixing workspace ownership..."

          sudo mkdir -p \
            "/home/$RDP_USERNAME/workspace"

          sudo chown -R \
            "$RDP_USERNAME:$RDP_USERNAME" \
            "/home/$RDP_USERNAME/workspace"

          echo
          echo "Workspace:"
          echo "/home/$RDP_USERNAME/workspace"

      # ============================================================
      # 6. Install Node.js 22
      # ============================================================
      - name: 6. Install Node.js 22
        run: |
          set -euo pipefail

          echo
          echo "=================================================="
          echo "INSTALLING NODE.JS 22"
          echo "=================================================="

          curl -fsSL \
            https://deb.nodesource.com/setup_22.x \
            | sudo -E bash -

          sudo apt-get install -y nodejs

          echo
          echo "Node.js:"
          node --version

          echo
          echo "NPM:"
          npm --version

      # ============================================================
      # 7. Install OmniRoute
      # ============================================================
      - name: 7. Install OmniRoute
        run: |
          set -euo pipefail

          echo
          echo "=================================================="
          echo "INSTALLING OMNIROUTE"
          echo "=================================================="

          sudo npm install -g omniroute

          echo
          echo "OmniRoute executable:"
          command -v omniroute

          echo
          echo "OmniRoute version:"
          omniroute --version

          echo
          echo "Global npm root:"
          npm root -g

      # ============================================================
      # 8. Define Persistent Paths
      # ============================================================
      - name: 8. Define Persistent Paths
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"

          echo "OMNIROUTE_HOME=$OMNIROUTE_HOME" \
            >> "$GITHUB_ENV"

          echo "USER_HOME=/home/$RDP_USERNAME" \
            >> "$GITHUB_ENV"

          echo
          echo "RDP_USERNAME:"
          echo "$RDP_USERNAME"

          echo
          echo "USER_HOME:"
          echo "/home/$RDP_USERNAME"

          echo
          echo "OMNIROUTE_HOME:"
          echo "$OMNIROUTE_HOME"

          sudo mkdir -p \
            "$OMNIROUTE_HOME"

          sudo chown -R \
            "$RDP_USERNAME:$RDP_USERNAME" \
            "$OMNIROUTE_HOME"

          sudo chmod 700 \
            "$OMNIROUTE_HOME"

      # ============================================================
      # 9. Check OmniRoute Backup
      # ============================================================
      - name: 9. Check OmniRoute Backup
        id: check_backup
        run: |
          set -euo pipefail

          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          echo
          echo "=================================================="
          echo "CHECK OMNIROUTE BACKUP"
          echo "=================================================="

          echo
          echo "Backup file:"
          echo "$BACKUP_FILE"

          if [ -f "$BACKUP_FILE" ]; then

            echo "backup_exists=true" \
              >> "$GITHUB_OUTPUT"

            echo
            echo "OmniRoute backup FOUND."

            ls -lh \
              "$BACKUP_FILE"

            echo
            echo "Validating archive..."

            tar -tzf \
              "$BACKUP_FILE" \
              >/dev/null

            echo "Archive is valid."

          else

            echo "backup_exists=false" \
              >> "$GITHUB_OUTPUT"

            echo
            echo "OmniRoute backup NOT FOUND."

            echo "Fresh OmniRoute installation will be used."

          fi

      # ============================================================
      # 10. Restore OmniRoute Backup
      # ============================================================
      - name: 10. Restore OmniRoute Backup
        if: steps.check_backup.outputs.backup_exists == 'true'
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"
          RESTORE_TEMP="$RUNNER_TEMP/omniroute-restore"

          echo
          echo "=================================================="
          echo "OMNIROUTE RESTORE"
          echo "=================================================="

          echo
          echo "Target:"
          echo "$OMNIROUTE_HOME"

          # --------------------------------------------------------
          # Existing database
          # --------------------------------------------------------
          if [ -f "$OMNIROUTE_HOME/storage.sqlite" ]; then

            echo
            echo "Existing OmniRoute database detected."
            echo "Skipping Git restore."

          else

            echo
            echo "No local OmniRoute database detected."
            echo "Restoring Git backup..."

            sudo rm -rf \
              "$RESTORE_TEMP"

            sudo mkdir -p \
              "$RESTORE_TEMP"

            sudo mkdir -p \
              "$OMNIROUTE_HOME"

            # ------------------------------------------------------
            # Extract archive
            # ------------------------------------------------------
            sudo tar \
              -xzf "$BACKUP_FILE" \
              -C "$RESTORE_TEMP"

            echo
            echo "Backup contents:"

            sudo find \
              "$RESTORE_TEMP" \
              -maxdepth 5 \
              -type f \
              -printf '%P\n' \
              | head -300

            # ------------------------------------------------------
            # Locate database
            # ------------------------------------------------------
            FOUND_DB="$(
              sudo find \
                "$RESTORE_TEMP" \
                -type f \
                -name "storage.sqlite" \
                -print \
                -quit
            )"

            if [ -z "${FOUND_DB:-}" ]; then

              echo
              echo "ERROR: storage.sqlite was not found in backup."

              echo
              echo "Archive structure:"

              sudo find \
                "$RESTORE_TEMP" \
                -maxdepth 8 \
                -print

              exit 1

            fi

            SOURCE_DIR="$(dirname "$FOUND_DB")"

            echo
            echo "Database found:"
            echo "$FOUND_DB"

            echo
            echo "Detected source directory:"
            echo "$SOURCE_DIR"

            # ------------------------------------------------------
            # Restore complete OmniRoute state
            # ------------------------------------------------------
            sudo cp -a \
              "$SOURCE_DIR"/. \
              "$OMNIROUTE_HOME"/

            # ------------------------------------------------------
            # Ownership
            # ------------------------------------------------------
            sudo chown -R \
              "$RDP_USERNAME:$RDP_USERNAME" \
              "$OMNIROUTE_HOME"

            sudo chmod 700 \
              "$OMNIROUTE_HOME"

            if [ -f "$OMNIROUTE_HOME/.env" ]; then

              sudo chmod 600 \
                "$OMNIROUTE_HOME/.env"

            fi

            # ------------------------------------------------------
            # Validate database
            # ------------------------------------------------------
            if [ ! -f "$OMNIROUTE_HOME/storage.sqlite" ]; then

              echo
              echo "ERROR: Database was not restored correctly."

              exit 1

            fi

            sudo -u "$RDP_USERNAME" \
              sqlite3 \
              "$OMNIROUTE_HOME/storage.sqlite" \
              "PRAGMA integrity_check;" \
              | grep -qx "ok"

            echo
            echo "Restored SQLite database integrity: OK"

            sudo rm -rf \
              "$RESTORE_TEMP"

            echo
            echo "=================================================="
            echo "OMNIROUTE BACKUP RESTORED"
            echo "=================================================="

          fi

      # ============================================================
      # 11. Configure OmniRoute
      # ============================================================
      - name: 11. Configure OmniRoute
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          ENV_FILE="$OMNIROUTE_HOME/.env"

          sudo mkdir -p \
            "$OMNIROUTE_HOME"

          if [ ! -f "$ENV_FILE" ]; then

            sudo touch \
              "$ENV_FILE"

          fi

          # --------------------------------------------------------
          # Helper function
          # --------------------------------------------------------
          set_env() {

            local KEY="$1"
            local VALUE="$2"

            if sudo grep -q "^${KEY}=" "$ENV_FILE"; then

              sudo sed -i \
                "s|^${KEY}=.*|${KEY}=${VALUE}|" \
                "$ENV_FILE"

            else

              echo "${KEY}=${VALUE}" \
                | sudo tee -a "$ENV_FILE" \
                >/dev/null

            fi
          }

          # --------------------------------------------------------
          # Runtime configuration
          # --------------------------------------------------------
          set_env \
            "NODE_ENV" \
            "production"

          set_env \
            "PORT" \
            "${OMNIROUTE_PORT}"

          set_env \
            "HOSTNAME" \
            "0.0.0.0"

          set_env \
            "HOME" \
            "/home/$RDP_USERNAME"

          set_env \
            "DATA_DIR" \
            "$OMNIROUTE_HOME"

          set_env \
            "NEXT_PUBLIC_BASE_URL" \
            "http://localhost:${OMNIROUTE_PORT}"

          # --------------------------------------------------------
          # Fresh installation password only.
          # Never overwrite existing database credentials.
          # --------------------------------------------------------
          if [ ! -f "$OMNIROUTE_HOME/storage.sqlite" ]; then

            if ! sudo grep -q "^INITIAL_PASSWORD=" "$ENV_FILE"; then

              echo "INITIAL_PASSWORD=CHANGEME" \
                | sudo tee -a "$ENV_FILE" \
                >/dev/null

            fi

          fi

          # --------------------------------------------------------
          # Permissions
          # --------------------------------------------------------
          sudo chown \
            "$RDP_USERNAME:$RDP_USERNAME" \
            "$ENV_FILE"

          sudo chmod 600 \
            "$ENV_FILE"

          echo
          echo "=================================================="
          echo "OMNIROUTE CONFIGURATION"
          echo "=================================================="

          echo
          echo "Runtime variables:"

          sudo grep -E \
            '^(NODE_ENV|PORT|HOSTNAME|HOME|DATA_DIR|NEXT_PUBLIC_BASE_URL)=' \
            "$ENV_FILE" \
            || true

          echo
          echo "Sensitive variables:"

          for KEY in \
            JWT_SECRET \
            API_KEY_SECRET \
            STORAGE_ENCRYPTION_KEY \
            INITIAL_PASSWORD
          do

            if sudo grep -q "^${KEY}=" "$ENV_FILE"; then

              echo "$KEY = PRESENT"

            else

              echo "$KEY = NOT PRESENT"

            fi

          done

      # ============================================================
      # 12. Create OmniRoute systemd Service
      # ============================================================
      - name: 12. Create OmniRoute systemd Service
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          OMNIROUTE_BIN="$(command -v omniroute)"

          if [ -z "$OMNIROUTE_BIN" ]; then

            echo "ERROR: omniroute executable not found."

            exit 1

          fi

          echo
          echo "OmniRoute executable:"
          echo "$OMNIROUTE_BIN"

          sudo tee \
            /etc/systemd/system/omniroute.service \
            >/dev/null <<EOF
          [Unit]
          Description=OmniRoute AI Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple

          User=$RDP_USERNAME
          Group=$RDP_USERNAME

          WorkingDirectory=$OMNIROUTE_HOME

          Environment=HOME=/home/$RDP_USERNAME
          Environment=DATA_DIR=$OMNIROUTE_HOME
          Environment=PORT=$OMNIROUTE_PORT
          Environment=HOSTNAME=0.0.0.0
          Environment=NODE_ENV=production
          Environment=NEXT_PUBLIC_BASE_URL=http://localhost:$OMNIROUTE_PORT

          EnvironmentFile=$OMNIROUTE_HOME/.env

          ExecStart=$OMNIROUTE_BIN

          Restart=always
          RestartSec=5

          KillSignal=SIGTERM
          TimeoutStopSec=40

          NoNewPrivileges=false

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo chmod 644 \
            /etc/systemd/system/omniroute.service

          sudo systemctl daemon-reload

          sudo systemctl enable \
            omniroute.service

          sudo systemctl restart \
            omniroute.service

          sleep 5

          echo
          echo "OmniRoute systemd status:"

          sudo systemctl \
            --no-pager \
            status \
            omniroute.service \
            || true

      # ============================================================
      # 13. Verify OmniRoute
      # ============================================================
      - name: 13. Verify OmniRoute
        id: verify_omniroute
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"

          echo
          echo "=================================================="
          echo "VERIFYING OMNIROUTE"
          echo "=================================================="

          SUCCESS=0

          for i in {1..60}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              "http://127.0.0.1:${OMNIROUTE_PORT}" \
              >/dev/null 2>&1; then

              echo
              echo "OmniRoute HTTP endpoint is responding."

              SUCCESS=1

              break

            fi

            echo "Waiting for OmniRoute... $i/60"

            sleep 2

          done

          if [ "$SUCCESS" -ne 1 ]; then

            echo
            echo "ERROR: OmniRoute failed to respond."

            echo
            echo "Service status:"

            sudo systemctl \
              --no-pager \
              status \
              omniroute.service \
              || true

            echo
            echo "OmniRoute logs:"

            sudo journalctl \
              -u omniroute.service \
              --no-pager \
              -n 250 \
              || true

            exit 1

          fi

          # --------------------------------------------------------
          # Wait for database
          # --------------------------------------------------------
          echo
          echo "Waiting for database initialization..."

          DB_FOUND=0

          for i in {1..30}; do

            if [ -f "$OMNIROUTE_HOME/storage.sqlite" ]; then

              DB_FOUND=1

              break

            fi

            sleep 1

          done

          # --------------------------------------------------------
          # Expected location
          # --------------------------------------------------------
          if [ "$DB_FOUND" -eq 1 ]; then

            echo
            echo "Database found at expected location:"
            echo "$OMNIROUTE_HOME/storage.sqlite"

          else

            echo
            echo "WARNING: Database not found at expected location."

            echo
            echo "Searching entire user home..."

            FOUND_DATABASES="$(
              sudo find \
                "/home/$RDP_USERNAME" \
                -type f \
                -name "storage.sqlite" \
                -print \
                2>/dev/null \
                || true
            )"

            if [ -n "$FOUND_DATABASES" ]; then

              echo
              echo "Database(s) found elsewhere:"
              echo "$FOUND_DATABASES"

              echo
              echo "ERROR: OmniRoute is using an unexpected DATA_DIR."

              echo
              echo "Expected:"
              echo "$OMNIROUTE_HOME/storage.sqlite"

              echo
              echo "Systemd environment:"

              sudo systemctl show \
                omniroute.service \
                -p Environment \
                --no-pager \
                || true

              echo
              echo "OmniRoute .env:"

              sudo sed -E \
                's/^(JWT_SECRET|API_KEY_SECRET|STORAGE_ENCRYPTION_KEY|INITIAL_PASSWORD)=.*/\1=***REDACTED***/' \
                "$OMNIROUTE_HOME/.env"

              exit 1

            else

              echo
              echo "ERROR: storage.sqlite does not exist anywhere under user home."

              echo
              echo "OmniRoute directory:"

              sudo find \
                "$OMNIROUTE_HOME" \
                -maxdepth 4 \
                -print \
                2>/dev/null \
                || true

              echo
              echo "OmniRoute logs:"

              sudo journalctl \
                -u omniroute.service \
                --no-pager \
                -n 250 \
                || true

              exit 1

            fi

          fi

          # --------------------------------------------------------
          # SQLite integrity
          # --------------------------------------------------------
          echo
          echo "Checking SQLite integrity..."

          sudo -u "$RDP_USERNAME" \
            sqlite3 \
            "$OMNIROUTE_HOME/storage.sqlite" \
            "PRAGMA integrity_check;" \
            | grep -qx "ok"

          echo "SQLite integrity: OK"

          # --------------------------------------------------------
          # Port
          # --------------------------------------------------------
          echo
          echo "Listening port:"

          sudo ss -lntp \
            | grep ":${OMNIROUTE_PORT}"

          # --------------------------------------------------------
          # Process
          # --------------------------------------------------------
          echo
          echo "Process:"

          pgrep -af omniroute \
            || true

          # --------------------------------------------------------
          # Recent logs
          # --------------------------------------------------------
          echo
          echo "Recent logs:"

          sudo journalctl \
            -u omniroute.service \
            --no-pager \
            -n 50 \
            || true

      # ============================================================
      # 14. Connect Tailscale
      # ============================================================
      - name: 14. Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then

            echo "ERROR: TAILSCALE_AUTHKEY secret is empty."

            exit 1

          fi

          echo
          echo "Installing Tailscale..."

          curl -fsSL \
            https://tailscale.com/install.sh \
            | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="cynet-linux-ssh"

          TS_IP="$(tailscale ip -4)"

          echo
          echo "=================================================="
          echo "LINUX SSH + OMNIROUTE SERVER IS LIVE"
          echo "=================================================="

          echo
          echo "Tailscale IP:"
          echo "$TS_IP"

          echo
          echo "SSH Username:"
          echo "$RDP_USERNAME"

          echo
          echo "SSH Password:"
          echo "Stored in GitHub Secret SSH_PASSWORD"

          echo
          echo "--------------------------------------------------"
          echo "SSH:"
          echo "ssh $RDP_USERNAME@$TS_IP"

          echo
          echo "--------------------------------------------------"
          echo "OmniRoute:"
          echo "http://$TS_IP:${OMNIROUTE_PORT}"

          echo
          echo "OmniRoute API:"
          echo "http://$TS_IP:${OMNIROUTE_PORT}/v1"

          echo
          echo "--------------------------------------------------"
          echo "Workspace:"
          echo "/home/$RDP_USERNAME/workspace"

          echo
          echo "OmniRoute data:"
          echo "/home/$RDP_USERNAME/.omniroute"

          echo
          echo "=================================================="

      # ============================================================
      # 15. Final Health Check
      # ============================================================
      - name: 15. Final Health Check
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          DB_FILE="$OMNIROUTE_HOME/storage.sqlite"

          echo
          echo "=================================================="
          echo "FINAL HEALTH CHECK"
          echo "=================================================="

          # --------------------------------------------------------
          # SSH
          # --------------------------------------------------------
          echo
          echo "SSH:"

          SSH_STATE="$(
            sudo systemctl is-active ssh
          )"

          echo "$SSH_STATE"

          if [ "$SSH_STATE" != "active" ]; then

            echo "ERROR: SSH is not active."

            exit 1

          fi

          # --------------------------------------------------------
          # OmniRoute
          # --------------------------------------------------------
          echo
          echo "OmniRoute:"

          OMNI_STATE="$(
            sudo systemctl is-active \
              omniroute.service
          )"

          echo "$OMNI_STATE"

          if [ "$OMNI_STATE" != "active" ]; then

            echo "ERROR: OmniRoute is not active."

            exit 1

          fi

          # --------------------------------------------------------
          # Port
          # --------------------------------------------------------
          echo
          echo "OmniRoute port:"

          if ! sudo ss -lntp \
            | grep -q ":${OMNIROUTE_PORT}"; then

            echo "ERROR: OmniRoute port ${OMNIROUTE_PORT} is not listening."

            exit 1

          fi

          sudo ss -lntp \
            | grep ":${OMNIROUTE_PORT}"

          # --------------------------------------------------------
          # Database
          # --------------------------------------------------------
          echo
          echo "Database:"

          if [ ! -f "$DB_FILE" ]; then

            echo "ERROR: Database does not exist:"
            echo "$DB_FILE"

            echo
            echo "Searching for storage.sqlite..."

            sudo find \
              "/home/$RDP_USERNAME" \
              -type f \
              -name "storage.sqlite" \
              -print \
              2>/dev/null \
              || true

            exit 1

          fi

          ls -lh \
            "$DB_FILE"

          # --------------------------------------------------------
          # SQLite integrity
          # --------------------------------------------------------
          echo
          echo "Database integrity:"

          DB_CHECK="$(
            sudo -u "$RDP_USERNAME" \
              sqlite3 \
              "$DB_FILE" \
              "PRAGMA integrity_check;"
          )"

          echo "$DB_CHECK"

          if [ "$DB_CHECK" != "ok" ]; then

            echo "ERROR: SQLite integrity check failed."

            exit 1

          fi

          # --------------------------------------------------------
          # Ownership
          # --------------------------------------------------------
          echo
          echo "Database ownership:"

          stat \
            -c '%U:%G %a %n' \
            "$DB_FILE"

          # --------------------------------------------------------
          # OmniRoute directory
          # --------------------------------------------------------
          echo
          echo "OmniRoute directory:"

          sudo du -sh \
            "$OMNIROUTE_HOME"

          echo
          echo "=================================================="
          echo "HEALTH CHECK PASSED"
          echo "=================================================="

      # ============================================================
      # 16. Keep Server Alive
      # ============================================================
      - name: 16. Server Keep-Alive
        run: |
          set -euo pipefail

          for i in {1..355}; do

            sleep 60

            if (( i % 10 == 0 )); then

              echo
              echo "[$i/355] Server is active..."

              echo "OmniRoute:"
              sudo systemctl is-active \
                omniroute.service \
                || true

              echo "SSH:"
              sudo systemctl is-active \
                ssh \
                || true

              echo "Tailscale:"
              sudo tailscale status \
                --peers=false \
                || true

            fi

          done

      # ============================================================
      # 17. Create Updated OmniRoute Backup
      # ============================================================
      - name: 17. Create Updated OmniRoute Backup
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$RDP_USERNAME/.omniroute"
          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"
          TEMP_BACKUP="$BACKUP_FILE.tmp"

          echo
          echo "=================================================="
          echo "CREATING UPDATED OMNIROUTE BACKUP"
          echo "=================================================="

          # --------------------------------------------------------
          # Validate source
          # --------------------------------------------------------
          if [ ! -d "$OMNIROUTE_HOME" ]; then

            echo "ERROR: OmniRoute directory does not exist."

            exit 1

          fi

          if [ ! -f "$OMNIROUTE_HOME/storage.sqlite" ]; then

            echo "ERROR: storage.sqlite does not exist."

            exit 1

          fi

          # --------------------------------------------------------
          # Stop OmniRoute
          # --------------------------------------------------------
          echo
          echo "Stopping OmniRoute..."

          sudo systemctl stop \
            omniroute.service

          # --------------------------------------------------------
          # Wait until service is stopped
          # --------------------------------------------------------
          for i in {1..20}; do

            if ! sudo systemctl is-active \
              --quiet \
              omniroute.service; then

              break

            fi

            sleep 1

          done

          if sudo systemctl is-active \
            --quiet \
            omniroute.service; then

            echo "ERROR: OmniRoute did not stop."

            exit 1

          fi

          # --------------------------------------------------------
          # SQLite checkpoint
          # --------------------------------------------------------
          echo
          echo "Checkpointing SQLite..."

          sudo -u "$RDP_USERNAME" \
            sqlite3 \
            "$OMNIROUTE_HOME/storage.sqlite" \
            "PRAGMA wal_checkpoint(TRUNCATE);"

          # --------------------------------------------------------
          # Integrity check
          # --------------------------------------------------------
          echo
          echo "Checking database integrity before backup..."

          sudo -u "$RDP_USERNAME" \
            sqlite3 \
            "$OMNIROUTE_HOME/storage.sqlite" \
            "PRAGMA integrity_check;" \
            | grep -qx "ok"

          # --------------------------------------------------------
          # Backup directory
          # --------------------------------------------------------
          sudo mkdir -p \
            "$(dirname "$BACKUP_FILE")"

          sudo rm -f \
            "$TEMP_BACKUP"

          # --------------------------------------------------------
          # Create archive
          # --------------------------------------------------------
          echo
          echo "Creating archive..."

          sudo tar \
            -czf "$TEMP_BACKUP" \
            -C "$OMNIROUTE_HOME" \
            .

          # --------------------------------------------------------
          # Validate archive
          # --------------------------------------------------------
          echo
          echo "Validating archive..."

          tar -tzf \
            "$TEMP_BACKUP" \
            >/dev/null

          if ! tar -tzf "$TEMP_BACKUP" \
            | grep -qx './storage.sqlite'; then

            echo
            echo "ERROR: storage.sqlite is missing from backup archive."

            rm -f \
              "$TEMP_BACKUP"

            exit 1

          fi

          # --------------------------------------------------------
          # Replace backup atomically
          # --------------------------------------------------------
          mv \
            "$TEMP_BACKUP" \
            "$BACKUP_FILE"

          echo
          echo "Backup created successfully:"

          ls -lh \
            "$BACKUP_FILE"

          # --------------------------------------------------------
          # Restart OmniRoute
          # --------------------------------------------------------
          echo
          echo "Restarting OmniRoute..."

          sudo systemctl start \
            omniroute.service

          sleep 5

          sudo systemctl is-active \
            omniroute.service

          echo
          echo "OmniRoute restarted successfully."

      # ============================================================
      # 18. Synchronize Git With Remote
      # ============================================================
      - name: 18. Synchronize Git With Remote
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          echo
          echo "=================================================="
          echo "PREPARING GIT PUSH"
          echo "=================================================="

          if [ -z "${GIT_USERNAME:-}" ]; then

            echo "ERROR: GIT_USERNAME secret is empty."

            exit 1

          fi

          if [ -z "${GIT_TOKEN:-}" ]; then

            echo "ERROR: GIT_TOKEN secret is empty."

            exit 1

          fi

          git config user.name \
            "$GIT_USERNAME"

          git config user.email \
            "$GIT_USERNAME@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME}"

          echo
          echo "Branch:"
          echo "$BRANCH"

          # --------------------------------------------------------
          # Fetch latest remote branch
          # --------------------------------------------------------
          git fetch \
            origin \
            "$BRANCH"

          # --------------------------------------------------------
          # Save newly-created backup
          # --------------------------------------------------------
          TEMP_GIT_BACKUP="$RUNNER_TEMP/omniroute-git-backup.tar.gz"

          cp \
            "$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH" \
            "$TEMP_GIT_BACKUP"

          # --------------------------------------------------------
          # Reset to latest remote.
          #
          # This prevents binary backup rebase conflicts.
          # --------------------------------------------------------
          git reset \
            --hard \
            "origin/$BRANCH"

          # --------------------------------------------------------
          # Restore newly-created backup
          # --------------------------------------------------------
          mkdir -p \
            "$(dirname "$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH")"

          cp \
            "$TEMP_GIT_BACKUP" \
            "$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          echo
          echo "Latest remote state synchronized."

          echo
          echo "Git status:"

          git status \
            --short

      # ============================================================
      # 19. Commit + Push OmniRoute Backup
      # ============================================================
      - name: 19. Push OmniRoute Backup To Git
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          BACKUP_FILE="$OMNIROUTE_BACKUP_PATH"
          BRANCH="${GITHUB_REF_NAME}"

          echo
          echo "=================================================="
          echo "PUSHING OMNIROUTE BACKUP"
          echo "=================================================="

          if [ ! -f "$GITHUB_WORKSPACE/$BACKUP_FILE" ]; then

            echo "ERROR: Backup file does not exist:"
            echo "$BACKUP_FILE"

            exit 1

          fi

          git config user.name \
            "$GIT_USERNAME"

          git config user.email \
            "$GIT_USERNAME@users.noreply.github.com"

          # --------------------------------------------------------
          # Add ONLY the OmniRoute backup.
          # --------------------------------------------------------
          git add \
            "$BACKUP_FILE"

          # --------------------------------------------------------
          # Check whether backup changed.
          # --------------------------------------------------------
          if git diff \
            --cached \
            --quiet \
            -- "$BACKUP_FILE"; then

            echo
            echo "OmniRoute backup has not changed."
            echo "Nothing to commit."

          else

            echo
            echo "OmniRoute backup changed."

            git commit \
              -m "chore: update OmniRoute backup"

            git push \
              origin \
              "$BRANCH"

            echo
            echo "=================================================="
            echo "OMNIROUTE BACKUP PUSHED SUCCESSFULLY"
            echo "=================================================="

          fi

      # ============================================================
      # 20. Save Workspace Cache
      # ============================================================
      - name: 20. Save Workspace Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/${{ env.RDP_USERNAME }}/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}

      # ============================================================
      # 21. Final Service State
      # ============================================================
      - name: 21. Final Service State
        if: always()
        run: |
          echo
          echo "=================================================="
          echo "FINAL SERVICE STATE"
          echo "=================================================="

          echo
          echo "SSH:"
          sudo systemctl \
            --no-pager \
            status ssh \
            || true

          echo
          echo "OmniRoute:"
          sudo systemctl \
            --no-pager \
            status \
            omniroute.service \
            || true

          echo
          echo "Listening ports:"

          sudo ss -lntp \
            | grep -E ":${OMNIROUTE_PORT}\b" \
            || true

          echo
          echo "Recent OmniRoute logs:"

          sudo journalctl \
            -u omniroute.service \
            --no-pager \
            -n 100 \
            || true
