name: Linux Omniroute Server

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: permanent-linux-ssh-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      OMNIROUTE_PORT: '20128'
      OMNIROUTE_BACKUP_PATH: backup/omniroute/omniroute-full-backup.tar.gz

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}
          persist-credentials: true


      # ============================================================
      # 2. CONFIGURE GIT
      # ============================================================

      - name: 2. Configure Git
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${GIT_USERNAME:-}" || {
            echo "ERROR: GIT_USERNAME is empty."
            exit 1
          }

          test -n "${GIT_TOKEN:-}" || {
            echo "ERROR: GIT_TOKEN is empty."
            exit 1
          }

          git config user.name "$GIT_USERNAME"
          git config user.email "$GIT_USERNAME@users.noreply.github.com"


      # ============================================================
      # 3. INSTALL SYSTEM PACKAGES + SSH
      # ============================================================

      - name: 3. Setup OpenSSH Server
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${SSH_USERNAME:-}" || {
            echo "ERROR: SSH_USERNAME is empty."
            exit 1
          }

          test -n "${SSH_PASSWORD:-}" || {
            echo "ERROR: SSH_PASSWORD is empty."
            exit 1
          }

          echo "=================================================="
          echo "SETTING UP SSH"
          echo "=================================================="

          echo "Username: $SSH_USERNAME"
          echo "Home: /home/$SSH_USERNAME"

          sudo apt-get update

          sudo apt-get install -y \
            openssh-server \
            curl \
            wget \
            git \
            ca-certificates \
            tar \
            gzip \
            sqlite3 \
            jq

          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd

          if id "$SSH_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            sudo useradd \
              -m \
              -s /bin/bash \
              "$SSH_USERNAME"
          fi

          sudo passwd -u "$SSH_USERNAME" >/dev/null 2>&1 || true

          echo "$SSH_USERNAME:$SSH_PASSWORD" \
            | sudo chpasswd

          sudo usermod -aG sudo "$SSH_USERNAME"

          echo "$SSH_USERNAME ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee "/etc/sudoers.d/$SSH_USERNAME" >/dev/null

          sudo chmod 440 \
            "/etc/sudoers.d/$SSH_USERNAME"

          sudo mkdir -p /etc/ssh/sshd_config.d

          printf '%s\n' \
            'PasswordAuthentication yes' \
            | sudo tee /etc/ssh/sshd_config.d/99-password-auth.conf >/dev/null

          printf '%s\n' \
            'PubkeyAuthentication yes' \
            | sudo tee /etc/ssh/sshd_config.d/98-pubkey-auth.conf >/dev/null

          sudo sshd -t

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sudo systemctl is-active --quiet ssh

          sudo mkdir -p \
            "/home/$SSH_USERNAME/workspace"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "/home/$SSH_USERNAME/workspace"

          sudo mkdir -p \
            "/home/$SSH_USERNAME/.omniroute"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "/home/$SSH_USERNAME/.omniroute"

          sudo chmod 700 \
            "/home/$SSH_USERNAME/.omniroute"

          echo "SSH setup complete."


      # ============================================================
      # 4. RESTORE WORKSPACE CACHE
      # ============================================================

      - name: 4. Restore Persistent Workspace
        uses: actions/cache/restore@v4
        with:
          path: /home/${{ secrets.SSH_USERNAME }}/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
          restore-keys: |
            cynet-ssh-workspace-


      # ============================================================
      # 5. FIX WORKSPACE OWNERSHIP
      # ============================================================

      - name: 5. Fix Workspace Ownership
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          sudo mkdir -p \
            "/home/$SSH_USERNAME/workspace"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "/home/$SSH_USERNAME/workspace"


      # ============================================================
      # 6. INSTALL NODE.JS 22
      # ============================================================

      - name: 6. Install Node.js 22
        run: |
          set -euo pipefail

          curl -fsSL \
            https://deb.nodesource.com/setup_22.x \
            | sudo -E bash -

          sudo apt-get install -y nodejs

          echo "Node: $(node --version)"
          echo "NPM:  $(npm --version)"


      # ============================================================
      # 7. INSTALL OMNIROUTE
      # ============================================================

      - name: 7. Install OmniRoute
        run: |
          set -euo pipefail

          sudo npm install -g omniroute

          command -v omniroute
          omniroute --version


      # ============================================================
      # 8. PREPARE OMNIROUTE
      # ============================================================

      - name: 8. Prepare OmniRoute Directory
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          sudo mkdir -p "$OMNIROUTE_HOME"

          sudo chown -R \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$OMNIROUTE_HOME"

          sudo chmod 700 \
            "$OMNIROUTE_HOME"

          echo "OMNIROUTE_HOME=$OMNIROUTE_HOME" >> "$GITHUB_ENV"


      # ============================================================
      # 9. DETECT RESTORE SOURCE
      # ============================================================

      - name: 9. Detect OmniRoute Restore Source
        id: restore_source
        run: |
          set -euo pipefail

          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          LEGACY_JSON="$GITHUB_WORKSPACE/omniroute-legacy-backup-2026-08-30T14-27-50-814Z.json"

          echo "=================================================="
          echo "DETECTING RESTORE SOURCE"
          echo "=================================================="

          if [ -f "$BACKUP_FILE" ]; then

            echo "SQLite backup found:"
            ls -lh "$BACKUP_FILE"

            gzip -t "$BACKUP_FILE"

            tar -tzf "$BACKUP_FILE" >/dev/null

            if ! tar -tzf "$BACKUP_FILE" \
              | grep -qx './storage.sqlite'
            then
              echo "ERROR: Backup does not contain storage.sqlite."
              exit 1
            fi

            echo "source=sqlite" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "$LEGACY_JSON" ]; then

            echo "Legacy JSON backup found:"
            ls -lh "$LEGACY_JSON"

            jq empty "$LEGACY_JSON"

            echo "source=legacy-json" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "source=fresh" >> "$GITHUB_OUTPUT"

          echo "No existing OmniRoute backup found."
          echo "Fresh initialization will be used."


      # ============================================================
      # 10. RESTORE SQLITE BACKUP
      # ============================================================

      - name: 10. Restore OmniRoute SQLite Database
        if: steps.restore_source.outputs.source == 'sqlite'
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          RESTORE_TEMP="$RUNNER_TEMP/omniroute-restore"

          sudo rm -rf "$RESTORE_TEMP"
          sudo mkdir -p "$RESTORE_TEMP"

          sudo tar \
            -xzf "$BACKUP_FILE" \
            -C "$RESTORE_TEMP"

          FOUND_DB="$(
            sudo find "$RESTORE_TEMP" \
              -type f \
              -name storage.sqlite \
              -print \
              -quit
          )"

          test -n "${FOUND_DB:-}"

          sudo cp \
            "$FOUND_DB" \
            "$OMNIROUTE_HOME/storage.sqlite"

          sudo chown \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$OMNIROUTE_HOME/storage.sqlite"

          sudo chmod 600 \
            "$OMNIROUTE_HOME/storage.sqlite"

          echo "Checking SQLite integrity..."

          sudo -u "$SSH_USERNAME" \
            sqlite3 "$OMNIROUTE_HOME/storage.sqlite" \
            "PRAGMA integrity_check;" \
            | grep -qx 'ok'

          echo "SQLite integrity: OK"

          sudo rm -rf "$RESTORE_TEMP"


      # ============================================================
      # 11. LEGACY JSON MIGRATION
      #
      # IMPORTANT:
      # We DO NOT attempt to manually parse provider credentials.
      #
      # OmniRoute has a legacy JSON -> SQLite migration path.
      # The application itself must perform that migration so the
      # correct provider schemas and encryption behavior are applied.
      # ============================================================

      - name: 11. Prepare Legacy JSON Migration
        if: steps.restore_source.outputs.source == 'legacy-json'
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          LEGACY_JSON="$GITHUB_WORKSPACE/omniroute-legacy-backup-2026-08-30T14-27-50-814Z.json"

          test -f "$LEGACY_JSON"

          jq empty "$LEGACY_JSON"

          sudo cp \
            "$LEGACY_JSON" \
            "$OMNIROUTE_HOME/omniroute-legacy-backup.json"

          sudo chown \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$OMNIROUTE_HOME/omniroute-legacy-backup.json"

          sudo chmod 600 \
            "$OMNIROUTE_HOME/omniroute-legacy-backup.json"

          echo "Legacy JSON placed in OmniRoute DATA_DIR."

          echo "IMPORTANT:"
          echo "OmniRoute itself will perform the legacy JSON migration at startup."


      # ============================================================
      # 12. CONFIGURE ENVIRONMENT
      # ============================================================

      - name: 12. Configure OmniRoute Environment
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          ENV_FILE="$OMNIROUTE_HOME/.env"

          test -n "${API_KEY_SECRET:-}" || {
            echo "ERROR: API_KEY_SECRET is empty."
            exit 1
          }

          test -n "${JWT_SECRET:-}" || {
            echo "ERROR: JWT_SECRET is empty."
            exit 1
          }

          test -n "${STORAGE_ENCRYPTION_KEY:-}" || {
            echo "ERROR: STORAGE_ENCRYPTION_KEY is empty."
            exit 1
          }

          # Keep only unmanaged values from an old .env.
          TEMP_ENV="$RUNNER_TEMP/omniroute.env"

          if sudo test -f "$ENV_FILE"; then
            sudo awk '
              !/^(NODE_ENV|PORT|HOSTNAME|HOME|DATA_DIR|NEXT_PUBLIC_BASE_URL|API_KEY_SECRET|JWT_SECRET|STORAGE_ENCRYPTION_KEY|INITIAL_PASSWORD|STORAGE_ENCRYPTION_KEY_VERSION)=/
            ' "$ENV_FILE" \
              | sudo tee "$TEMP_ENV" >/dev/null
          else
            : > "$TEMP_ENV"
          fi

          # Runtime values.
          printf '%s\n' \
            'NODE_ENV=production' \
            "PORT=$OMNIROUTE_PORT" \
            'HOSTNAME=0.0.0.0' \
            "HOME=/home/$SSH_USERNAME" \
            "DATA_DIR=$OMNIROUTE_HOME" \
            "NEXT_PUBLIC_BASE_URL=http://localhost:$OMNIROUTE_PORT" \
            'STORAGE_ENCRYPTION_KEY_VERSION=v1' \
            "API_KEY_SECRET=$API_KEY_SECRET" \
            "JWT_SECRET=$JWT_SECRET" \
            "STORAGE_ENCRYPTION_KEY=$STORAGE_ENCRYPTION_KEY" \
            | sudo tee -a "$TEMP_ENV" >/dev/null

          sudo cp \
            "$TEMP_ENV" \
            "$ENV_FILE"

          rm -f "$TEMP_ENV"

          sudo chown \
            "$SSH_USERNAME:$SSH_USERNAME" \
            "$ENV_FILE"

          sudo chmod 600 \
            "$ENV_FILE"

          echo "OmniRoute environment configured."


      # ============================================================
      # 13. CREATE SYSTEMD SERVICE
      # ============================================================

      - name: 13. Create OmniRoute systemd Service
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          OMNIROUTE_BIN="$(command -v omniroute)"

          test -n "$OMNIROUTE_BIN"

          sudo tee /etc/systemd/system/omniroute.service >/dev/null <<EOF
          [Unit]
          Description=OmniRoute AI Gateway
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple

          User=$SSH_USERNAME
          Group=$SSH_USERNAME

          WorkingDirectory=$OMNIROUTE_HOME

          Environment=HOME=/home/$SSH_USERNAME
          Environment=DATA_DIR=$OMNIROUTE_HOME
          Environment=PORT=$OMNIROUTE_PORT
          Environment=HOSTNAME=0.0.0.0
          Environment=NODE_ENV=production
          Environment=NEXT_PUBLIC_BASE_URL=http://localhost:$OMNIROUTE_PORT

          EnvironmentFile=$OMNIROUTE_HOME/.env

          ExecStart=$OMNIROUTE_BIN

          Restart=always
          RestartSec=5

          KillSignal=SIGTERM
          TimeoutStopSec=40

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo chmod 644 \
            /etc/systemd/system/omniroute.service

          sudo systemctl daemon-reload

          sudo systemctl enable \
            omniroute.service

          sudo systemctl restart \
            omniroute.service


      # ============================================================
      # 14. WAIT FOR OMNIROUTE
      # ============================================================

      - name: 14. Wait for OmniRoute
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          DB_FILE="$OMNIROUTE_HOME/storage.sqlite"

          echo "Waiting for OmniRoute..."

          HTTP_OK=0

          for i in {1..90}; do

            if curl \
              -fsS \
              "http://127.0.0.1:$OMNIROUTE_PORT" \
              >/dev/null 2>&1
            then
              HTTP_OK=1
              echo "OmniRoute HTTP endpoint is ready."
              break
            fi

            echo "Waiting for HTTP endpoint... $i/90"

            sleep 2
          done

          if [ "$HTTP_OK" -ne 1 ]; then

            echo "ERROR: OmniRoute did not start."

            sudo systemctl \
              --no-pager \
              status omniroute.service || true

            sudo journalctl \
              -u omniroute.service \
              --no-pager \
              -n 300 || true

            exit 1
          fi

          # Wait for DB because legacy migration may create it.
          for i in {1..180}; do

            if sudo test -f "$DB_FILE"; then
              echo "Database exists."
              break
            fi

            sleep 1

          done

          if ! sudo test -f "$DB_FILE"; then

            echo "ERROR: storage.sqlite not found."

            sudo find \
              "$OMNIROUTE_HOME" \
              -maxdepth 3 \
              -type f \
              -print \
              || true

            sudo journalctl \
              -u omniroute.service \
              --no-pager \
              -n 300 || true

            exit 1
          fi


      # ============================================================
      # 15. VERIFY DATABASE STRUCTURE
      # ============================================================

      - name: 15. Verify OmniRoute Database
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          DB_FILE="/home/$SSH_USERNAME/.omniroute/storage.sqlite"

          sudo test -f "$DB_FILE"

          echo "SQLite integrity:"

          sudo -u "$SSH_USERNAME" \
            sqlite3 "$DB_FILE" \
            "PRAGMA integrity_check;" \
            | grep -qx 'ok'

          echo "OK"

          echo "Checking required tables..."

          TABLES="$(
            sudo -u "$SSH_USERNAME" \
              sqlite3 "$DB_FILE" \
              "SELECT name FROM sqlite_master WHERE type='table';"
          )"

          REQUIRED_TABLES=(
            provider_connections
            provider_nodes
            combos
            api_keys
          )

          for TABLE in "${REQUIRED_TABLES[@]}"; do

            if ! printf '%s\n' "$TABLES" \
              | grep -qx "$TABLE"
            then

              echo "ERROR: Required table missing: $TABLE"
              exit 1
            fi

            echo "FOUND: $TABLE"

          done

          echo "Database schema validation passed."


      # ============================================================
      # 16. VERIFY PROVIDERS + API KEYS
      #
      # We deliberately don't print credential values.
      #
      # The goal is to verify:
      #   - provider records exist
      #   - provider connections are present
      #   - api_keys table exists
      #   - encrypted credential records exist
      # ============================================================

      - name: 16. Verify Providers and Credentials
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          DB_FILE="/home/$SSH_USERNAME/.omniroute/storage.sqlite"

          echo "=================================================="
          echo "PROVIDER / CREDENTIAL VALIDATION"
          echo "=================================================="

          PROVIDER_COUNT="$(
            sudo -u "$SSH_USERNAME" \
              sqlite3 "$DB_FILE" \
              "SELECT COUNT(*) FROM provider_connections;"
          )"

          API_KEY_COUNT="$(
            sudo -u "$SSH_USERNAME" \
              sqlite3 "$DB_FILE" \
              "SELECT COUNT(*) FROM api_keys;"
          )"

          echo "Provider connections: $PROVIDER_COUNT"
          echo "OmniRoute API keys:   $API_KEY_COUNT"

          if [ "$PROVIDER_COUNT" -eq 0 ]; then
            echo "WARNING: No provider connections found."
          fi

          # Show provider names/status only.
          sudo -u "$SSH_USERNAME" \
            sqlite3 -header -column "$DB_FILE" \
            "SELECT
               provider,
               name,
               auth_type,
               is_active
             FROM provider_connections
             ORDER BY provider, name;" \
            || true

          echo ""
          echo "Credential presence must be checked through the running application,"
          echo "not by printing encrypted secrets from SQLite."


      # ============================================================
      # 17. API HEALTH
      # ============================================================

      - name: 17. OmniRoute API Health
        run: |
          set -euo pipefail

          echo "Monitoring health:"

          HTTP_CODE="$(
            curl \
              -sS \
              -o "$RUNNER_TEMP/omniroute-health.json" \
              -w '%{http_code}' \
              "http://127.0.0.1:$OMNIROUTE_PORT/api/monitoring/health" \
              || true
          )"

          echo "HTTP status: $HTTP_CODE"

          cat "$RUNNER_TEMP/omniroute-health.json" \
            2>/dev/null \
            | jq . || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: monitoring health endpoint did not return 200."
          fi


      # ============================================================
      # 18. TAILSCALE
      # ============================================================

      - name: 18. Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          test -n "${TAILSCALE_AUTHKEY:-}" || {
            echo "ERROR: TAILSCALE_AUTHKEY is empty."
            exit 1
          }

          curl -fsSL \
            https://tailscale.com/install.sh \
            | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="cynet-linux-ssh"

          TS_IP="$(tailscale ip -4)"

          test -n "$TS_IP"

          echo "=================================================="
          echo "LINUX SSH + OMNIROUTE SERVER IS LIVE"
          echo "=================================================="

          echo "Tailscale IP: $TS_IP"
          echo "SSH: ssh $SSH_USERNAME@$TS_IP"
          echo "OmniRoute: http://$TS_IP:$OMNIROUTE_PORT"
          echo "OmniRoute API: http://$TS_IP:$OMNIROUTE_PORT/v1"
          echo "Workspace: /home/$SSH_USERNAME/workspace"
          echo "OmniRoute data: /home/$SSH_USERNAME/.omniroute"

          echo "=================================================="


      # ============================================================
      # 19. FINAL STARTUP HEALTH CHECK
      # ============================================================

      - name: 19. Final Startup Health Check
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          DB_FILE="$OMNIROUTE_HOME/storage.sqlite"

          echo "=================================================="
          echo "FINAL STARTUP CHECK"
          echo "=================================================="

          sudo systemctl is-active --quiet ssh
          echo "SSH: active"

          sudo systemctl is-active --quiet omniroute.service
          echo "OmniRoute: active"

          sudo ss -lntp \
            | grep ":$OMNIROUTE_PORT"

          echo "OmniRoute port: listening"

          sudo test -f "$DB_FILE"

          echo "Database: present"

          sudo -u "$SSH_USERNAME" \
            sqlite3 "$DB_FILE" \
            "PRAGMA integrity_check;" \
            | grep -qx 'ok'

          echo "Database integrity: OK"

          echo "=================================================="
          echo "STARTUP HEALTH CHECK PASSED"
          echo "=================================================="


      # ============================================================
      # 20. KEEP RUNNER ALIVE FOR ~6 HOURS
      # ============================================================

      - name: 20. Server Keep-Alive
        run: |
          set -euo pipefail

          # GitHub timeout = 360 minutes.
          # Keep-alive for ~5h55m, leaving time for backup/push.

          for i in {1..350}; do

            sleep 60

            if (( i % 10 == 0 )); then

              echo "[$i/350] Server is active..."

              sudo systemctl \
                is-active \
                omniroute.service || true

              sudo systemctl \
                is-active \
                ssh || true

              sudo tailscale \
                status \
                --peers=false || true

            fi

          done


      # ============================================================
      # 21. CREATE FINAL SQLITE BACKUP
      # ============================================================

      - name: 21. Create Final OmniRoute Backup
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          OMNIROUTE_HOME="/home/$SSH_USERNAME/.omniroute"

          DB_FILE="$OMNIROUTE_HOME/storage.sqlite"

          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          TEMP_BACKUP="$RUNNER_TEMP/omniroute-backup.tar.gz"

          echo "=================================================="
          echo "CREATING FINAL BACKUP"
          echo "=================================================="

          sudo test -f "$DB_FILE"

          # ----------------------------------------------------------
          # STOP SERVICE
          # ----------------------------------------------------------

          echo "Stopping OmniRoute..."

          sudo systemctl stop omniroute.service

          for i in {1..30}; do

            if ! sudo systemctl is-active --quiet omniroute.service; then
              break
            fi

            sleep 1

          done

          if sudo systemctl is-active --quiet omniroute.service; then

            echo "ERROR: OmniRoute did not stop."
            exit 1

          fi

          # ----------------------------------------------------------
          # WAL CHECKPOINT
          # ----------------------------------------------------------

          echo "Running WAL checkpoint..."

          sudo -u "$SSH_USERNAME" \
            sqlite3 "$DB_FILE" \
            "PRAGMA wal_checkpoint(TRUNCATE);" || true

          # ----------------------------------------------------------
          # DATABASE INTEGRITY
          # ----------------------------------------------------------

          sudo -u "$SSH_USERNAME" \
            sqlite3 "$DB_FILE" \
            "PRAGMA integrity_check;" \
            | grep -qx 'ok'

          echo "SQLite integrity: OK"

          # ----------------------------------------------------------
          # CREATE DIRECTORY
          # ----------------------------------------------------------

          mkdir -p \
            "$(dirname "$BACKUP_FILE")"

          rm -f "$TEMP_BACKUP"

          # ----------------------------------------------------------
          # BACKUP ONLY PRIMARY DATABASE
          # ----------------------------------------------------------

          sudo tar \
            -czf "$TEMP_BACKUP" \
            -C "$OMNIROUTE_HOME" \
            storage.sqlite

          # ----------------------------------------------------------
          # VALIDATE ARCHIVE
          # ----------------------------------------------------------

          gzip -t "$TEMP_BACKUP"

          tar \
            -tzf "$TEMP_BACKUP" \
            >/dev/null

          if ! tar \
            -tzf "$TEMP_BACKUP" \
            | grep -qx './storage.sqlite'
          then

            echo "ERROR: storage.sqlite missing."

            tar \
              -tzf "$TEMP_BACKUP"

            exit 1

          fi

          # ----------------------------------------------------------
          # ATOMICALLY REPLACE REPOSITORY BACKUP
          # ----------------------------------------------------------

          mv \
            "$TEMP_BACKUP" \
            "$BACKUP_FILE"

          echo "Final backup:"
          ls -lh "$BACKUP_FILE"

          # ----------------------------------------------------------
          # RESTART
          # ----------------------------------------------------------

          sudo systemctl start omniroute.service

          for i in {1..30}; do

            if sudo systemctl is-active --quiet omniroute.service; then
              echo "OmniRoute restarted."
              break
            fi

            sleep 1

          done

          sudo systemctl is-active --quiet omniroute.service


      # ============================================================
      # 22. FINAL BACKUP VALIDATION BEFORE GIT PUSH
      # ============================================================

      - name: 22. Validate Final Backup
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -euo pipefail

          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          test -f "$BACKUP_FILE"

          gzip -t "$BACKUP_FILE"

          tar -tzf "$BACKUP_FILE" \
            | tee "$RUNNER_TEMP/backup-list.txt"

          grep -qx \
            './storage.sqlite' \
            "$RUNNER_TEMP/backup-list.txt"

          echo "Final backup archive validation: OK"

          # Extract once more into a temporary location and validate DB.
          TEST_DIR="$RUNNER_TEMP/backup-test"

          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          tar \
            -xzf "$BACKUP_FILE" \
            -C "$TEST_DIR"

          test -f "$TEST_DIR/storage.sqlite"

          sqlite3 \
            "$TEST_DIR/storage.sqlite" \
            "PRAGMA integrity_check;" \
            | grep -qx 'ok'

          echo "Extracted SQLite validation: OK"


      # ============================================================
      # 23. SYNCHRONIZE WITH REMOTE BRANCH
      # ============================================================

      - name: 23. Synchronize Git Before Push
        run: |
          set -euo pipefail

          BRANCH="$GITHUB_REF_NAME"

          BACKUP_FILE="$GITHUB_WORKSPACE/$OMNIROUTE_BACKUP_PATH"

          TEMP_BACKUP="$RUNNER_TEMP/final-backup-to-push.tar.gz"

          cp \
            "$BACKUP_FILE" \
            "$TEMP_BACKUP"

          git fetch origin "$BRANCH"

          git reset --hard \
            "origin/$BRANCH"

          mkdir -p \
            "$(dirname "$BACKUP_FILE")"

          cp \
            "$TEMP_BACKUP" \
            "$BACKUP_FILE"

          git status --short


      # ============================================================
      # 24. COMMIT + PUSH
      # ============================================================

      - name: 24. Commit and Push OmniRoute Backup
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          set -euo pipefail

          BRANCH="$GITHUB_REF_NAME"

          BACKUP_FILE="$OMNIROUTE_BACKUP_PATH"

          git config \
            user.name \
            "$GIT_USERNAME"

          git config \
            user.email \
            "$GIT_USERNAME@users.noreply.github.com"

          git add "$BACKUP_FILE"

          if git diff \
            --cached \
            --quiet \
            -- "$BACKUP_FILE"
          then

            echo "Backup unchanged."

          else

            git commit \
              -m "chore: update OmniRoute backup"

            git push \
              origin \
              "$BRANCH"

            echo "Backup pushed successfully."

          fi


      # ============================================================
      # 25. SAVE WORKSPACE
      # ============================================================

      - name: 25. Save Workspace Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/${{ secrets.SSH_USERNAME }}/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}


      # ============================================================
      # 26. FINAL SERVICE STATE
      # ============================================================

      - name: 26. Final Service State
        if: always()
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          echo "=================================================="
          echo "FINAL SERVICE STATE"
          echo "=================================================="

          echo ""
          echo "SSH:"
          sudo systemctl \
            --no-pager \
            status ssh || true

          echo ""
          echo "OmniRoute:"
          sudo systemctl \
            --no-pager \
            status omniroute.service || true

          echo ""
          echo "Listening port:"
          sudo ss -lntp \
            | grep ":$OMNIROUTE_PORT" || true

          echo ""
          echo "OmniRoute files:"
          sudo find \
            "/home/$SSH_USERNAME/.omniroute" \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            2>/dev/null || true

          echo ""
          echo "Recent OmniRoute logs:"
          sudo journalctl \
            -u omniroute.service \
            --no-pager \
            -n 100 || true

          echo ""
          echo "=================================================="
          echo "WORKFLOW FINISHED"
          echo "=================================================="
