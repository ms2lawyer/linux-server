# ==============================================================
# Windows Cloud RDP — Persistent Desktop
#
# Runtime:
#   350 minutes
#
# Keep-alive:
#   Check every 60 seconds
#
# User notification:
#   Every 5 minutes
#
# Persistence:
#   GitHub Actions Cache
#
# RDP:
#   Tailscale + Windows Remote Desktop
# ==============================================================

name: Windows Cloud RDP

on:

  schedule:
    # GitHub Actions cron does not support every 2 minutes.
    # Run every 5 minutes.
    - cron: '*/5 * * * *'

  workflow_dispatch:


# ==============================================================
# Prevent multiple RDP sessions from running simultaneously
#
# IMPORTANT:
# Without this, the */5 cron can create overlapping runners.
# ==============================================================

concurrency:
  group: windows-cloud-rdp
  cancel-in-progress: false


jobs:

  rdp-server:

    runs-on: windows-latest

    # 350 minutes requested.
    # 360 minutes gives approximately 10 minutes for workflow
    # startup/shutdown and other steps.
    timeout-minutes: 360

    permissions:
      contents: read
      actions: write


    steps:

      # ==========================================================
      # 1. Checkout Repository
      # ==========================================================

      - name: 1. Checkout Repository
        uses: actions/checkout@v5


      # ==========================================================
      # 2. Restore Previous Persistent Workspace
      # ==========================================================

      - name: 2. Restore Previous Workspace
        id: restore_workspace

        uses: actions/cache/restore@v5

        with:

          path: ${{ github.workspace }}\workspace

          key: cynet-rdp-workspace-${{ runner.os }}-${{ github.run_id }}

          restore-keys: |
            cynet-rdp-workspace-${{ runner.os }}-


      # ==========================================================
      # 3. Restore CynetAdmin Desktop
      #
      # The previous workspace cache contains:
      #
      # workspace/
      #   Desktop/
      #
      # We restore this into the new runner's
      # C:\Users\CynetAdmin\Desktop later.
      # ==========================================================

      - name: 3. Display Restored Workspace
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "RESTORED PERSISTENT WORKSPACE"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Workspace      : $Workspace"
          Write-Host "Desktop Backup : $DesktopBackup"
          Write-Host ""

          Write-Host "Cache restore information:"
          Write-Host "--------------------------------------------------"

          Write-Host "Exact cache hit : ${{ steps.restore_workspace.outputs.cache-hit }}"
          Write-Host "Matched cache   : ${{ steps.restore_workspace.outputs.cache-matched-key }}"

          Write-Host "--------------------------------------------------"
          Write-Host ""

          if (-not (Test-Path -LiteralPath $Workspace)) {

              Write-Host "No previous workspace found."

              New-Item `
                -ItemType Directory `
                -Path $Workspace `
                -Force |
                Out-Null
          }

          if (-not (Test-Path -LiteralPath $DesktopBackup)) {

              Write-Host "No previous Desktop backup found."

              New-Item `
                -ItemType Directory `
                -Path $DesktopBackup `
                -Force |
                Out-Null
          }

          Write-Host ""
          Write-Host "Restored workspace contents:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            -LiteralPath $Workspace `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 4. Enable Remote Desktop
      # ==========================================================

      - name: 4. Enable Remote Desktop
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Keep Network Level Authentication enabled.

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          $Service = Get-Service -Name 'TermService'

          Write-Host "TermService status: $($Service.Status)"

          if ($Service.Status -ne 'Running') {

              throw "Remote Desktop service is not running."
          }

          Write-Host "Remote Desktop enabled successfully."

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 5. Create / Configure CynetAdmin
      # ==========================================================

      - name: 5. Create RDP Administrator Account
        shell: powershell

        env:

          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |

          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {

              throw "GitHub Secret RDP_PASSWORD is not configured."
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Write-Host "Configuring user: $Username"

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $ExistingUser) {

              Write-Host "Creating local user..."

              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description 'GitHub Actions RDP Administrator' |
                Out-Null
          }
          else {

              Write-Host "User already exists."

              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword

              Enable-LocalUser `
                -Name $Username
          }

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "User information:"

          Get-LocalUser `
            -Name $Username |
            Select-Object Name, Enabled, SID, LastLogon |
            Format-List

          Write-Host ""
          Write-Host "RDP user configured successfully."

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 6. Initialize CynetAdmin Windows Profile
      # ==========================================================

      - name: 6. Initialize CynetAdmin Windows Profile
        shell: powershell

        env:

          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |

          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {

              throw "RDP_PASSWORD is empty."
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $Credential = New-Object `
            System.Management.Automation.PSCredential(
              $Username,
              $SecurePassword
            )

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "INITIALIZING CynetAdmin WINDOWS PROFILE"
          Write-Host "==================================================" -ForegroundColor Cyan

          $ExistingProfile = Get-CimInstance Win32_UserProfile |
            Where-Object {

              $_.SID -eq (
                Get-LocalUser -Name $Username
              ).SID.Value

            } |
            Select-Object -First 1

          if ($null -ne $ExistingProfile) {

              Write-Host "Profile already exists:"
              Write-Host $ExistingProfile.LocalPath

          }
          else {

              Write-Host "Profile does not exist."
              Write-Host "Creating Windows user profile..."

              $Process = Start-Process `
                -FilePath "$env:SystemRoot\System32\cmd.exe" `
                -ArgumentList '/c exit 0' `
                -Credential $Credential `
                -LoadUserProfile `
                -WindowStyle Hidden `
                -Wait `
                -PassThru

              Write-Host "Profile initialization exit code: $($Process.ExitCode)"

              if ($Process.ExitCode -ne 0) {

                  throw "CynetAdmin profile initialization failed. Exit code: $($Process.ExitCode)"
              }
          }

          Start-Sleep -Seconds 2

          $User = Get-LocalUser `
            -Name $Username `
            -ErrorAction Stop

          $Sid = $User.SID.Value

          $Profile = Get-CimInstance Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1

          if ($null -eq $Profile) {

              throw "Windows did not create a profile for CynetAdmin."
          }

          Write-Host ""
          Write-Host "CynetAdmin profile successfully initialized."
          Write-Host "SID       : $Sid"
          Write-Host "Profile   : $($Profile.LocalPath)"
          Write-Host "Loaded    : $($Profile.Loaded)"

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 7. Restore CynetAdmin Desktop
      # ==========================================================

      - name: 7. Restore CynetAdmin Desktop
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          $User = Get-LocalUser `
            -Name $Username `
            -ErrorAction Stop

          $Sid = $User.SID.Value

          $Profile = Get-CimInstance Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1

          if ($null -eq $Profile) {

              throw "CynetAdmin profile does not exist."
          }

          $UserProfile = $Profile.LocalPath
          $Desktop = Join-Path $UserProfile 'Desktop'

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "RESTORING CynetAdmin DESKTOP"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""

          Write-Host "Profile : $UserProfile"
          Write-Host "Source  : $DesktopBackup"
          Write-Host "Target  : $Desktop"
          Write-Host ""

          if (-not (Test-Path -LiteralPath $Desktop)) {

              New-Item `
                -ItemType Directory `
                -Path $Desktop `
                -Force |
                Out-Null
          }

          if (-not (Test-Path -LiteralPath $DesktopBackup)) {

              New-Item `
                -ItemType Directory `
                -Path $DesktopBackup `
                -Force |
                Out-Null
          }

          robocopy `
            $DesktopBackup `
            $Desktop `
            /MIR `
            /COPY:DAT `
            /DCOPY:DAT `
            /R:2 `
            /W:1 `
            /XJ

          $RobocopyExitCode = $LASTEXITCODE

          Write-Host ""
          Write-Host "Robocopy restore exit code: $RobocopyExitCode"

          if ($RobocopyExitCode -gt 7) {

              throw "Desktop restore failed. Robocopy exit code: $RobocopyExitCode"
          }

          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "Desktop restore completed successfully."

          Write-Host ""
          Write-Host "Current CynetAdmin Desktop:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            -LiteralPath $Desktop `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"


      # ==========================================================
      # 8. Install Tailscale
      # ==========================================================

      - name: 8. Install Tailscale
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $Installer = 'C:\tailscale.msi'
          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $Installer

          if (-not (Test-Path -LiteralPath $Installer)) {

              throw "Tailscale installer download failed."
          }

          Write-Host "Installing Tailscale..."

          $InstallProcess = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList @(
              '/i',
              $Installer,
              '/quiet',
              '/norestart'
            ) `
            -Wait `
            -PassThru

          if ($InstallProcess.ExitCode -ne 0) {

              throw "Tailscale installation failed. Exit code: $($InstallProcess.ExitCode)"
          }

          Write-Host "Tailscale installation completed."

          $TimeoutSeconds = 60
          $ElapsedSeconds = 0

          while (-not (Test-Path -LiteralPath $Tailscale)) {

              if ($ElapsedSeconds -ge $TimeoutSeconds) {

                  throw "Tailscale executable was not found."
              }

              Start-Sleep -Seconds 2
              $ElapsedSeconds += 2
          }

          Write-Host "Tailscale executable found."

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 9. Connect Tailscale
      # ==========================================================

      - name: 9. Connect Tailscale
        shell: powershell

        env:

          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY_WIN_1 }}

        run: |

          $ErrorActionPreference = 'Stop'

          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {

              throw "GitHub Secret TAILSCALE_AUTHKEY_WIN_1 is not configured."
          }

          Write-Host "Starting Tailscale service..."

          Start-Service `
            -Name 'Tailscale' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $Hostname = "github-rdp-$env:GITHUB_RUN_ID"

          Write-Host "Tailscale hostname: $Hostname"
          Write-Host "Connecting to Tailscale..."

          & $Tailscale up `
            --auth-key="$env:TAILSCALE_AUTHKEY" `
            --hostname="$Hostname" `
            --accept-dns=true `
            --unattended=true

          $TailscaleExitCode = $LASTEXITCODE

          if ($TailscaleExitCode -ne 0) {

              throw "Tailscale connection failed. Exit code: $TailscaleExitCode"
          }

          $global:LASTEXITCODE = 0

          Write-Host "Tailscale connection established."

          $TailscaleIP = ''

          for ($i = 1; $i -le 15; $i++) {

              $TailscaleIP = (
                & $Tailscale ip -4 2>$null
              ).Trim()

              if (-not [string]::IsNullOrWhiteSpace($TailscaleIP)) {

                  break
              }

              Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($TailscaleIP)) {

              throw "Tailscale did not provide an IPv4 address."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "             RDP SERVER IS READY" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host "Tailscale IP : $TailscaleIP" -ForegroundColor Yellow
          Write-Host "Hostname     : $Hostname" -ForegroundColor Yellow
          Write-Host "Username     : CynetAdmin" -ForegroundColor Yellow

          Write-Host ""
          Write-Host "RDP command:" -ForegroundColor Cyan
          Write-Host "mstsc /v:$TailscaleIP" -ForegroundColor Magenta

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host "Tailscale status:"

          & $Tailscale status

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 10. Verify RDP
      # ==========================================================

      - name: 10. Verify RDP
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host "Checking RDP configuration..."

          $RdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($RdpDenied -ne 0) {

              throw "RDP is disabled."
          }

          $TermService = Get-Service `
            -Name 'TermService'

          if ($TermService.Status -ne 'Running') {

              throw "TermService is not running."
          }

          Write-Host "RDP registry : OK"
          Write-Host "TermService  : RUNNING"

          Write-Host ""
          Write-Host "Remote Desktop firewall rules:"

          Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq 'True' |
            Select-Object DisplayName, Enabled, Profile |
            Format-Table -AutoSize

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 11. Inspect Before RDP
      # ==========================================================

      - name: 11. Inspect Before RDP Session
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "BEFORE RDP SESSION"
          Write-Host "==================================================" -ForegroundColor Cyan

          Write-Host ""
          Write-Host "Windows profiles:"
          Write-Host "--------------------------------------------------"

          Get-CimInstance Win32_UserProfile |
            Where-Object {
              $_.LocalPath -like 'C:\Users\*'
            } |
            Select-Object SID, LocalPath, Loaded, Special |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Logged-on sessions:"
          Write-Host "--------------------------------------------------"

          quser 2>&1

          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "CynetAdmin Desktop:"
          Write-Host "--------------------------------------------------"

          if (Test-Path 'C:\Users\CynetAdmin\Desktop') {

              Get-ChildItem `
                'C:\Users\CynetAdmin\Desktop' `
                -Force `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize

          }
          else {

              Write-Host "CynetAdmin Desktop does not exist."
          }

          Write-Host "--------------------------------------------------"


      # ==========================================================
      # 12. Keep RDP Server Alive
      #
      # TOTAL:
      #   350 minutes
      #
      # CHECK:
      #   Every 60 seconds
      #
      # NOTIFICATION:
      #   Every 5 minutes
      #
      # 350 minutes = 21,000 seconds
      # ==========================================================

      - name: 12. Keep RDP Server Alive
        id: keep_alive
        shell: powershell

        run: |

          $TotalMinutes = 350
          $TotalSeconds = $TotalMinutes * 60

          $IntervalSeconds = 60
          $NotificationIntervalSeconds = 300

          $StartTime = Get-Date

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       RDP SERVER IS NOW AVAILABLE" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host "Session duration : $TotalMinutes minutes"
          Write-Host "Session seconds  : $TotalSeconds seconds"
          Write-Host "Check interval   : $IntervalSeconds seconds"
          Write-Host "Notification     : Every 5 minutes"
          Write-Host ""

          Write-Host "Started at       : $StartTime"
          Write-Host "Expected end     : $($StartTime.AddMinutes($TotalMinutes))"

          Write-Host ""

          $ElapsedSeconds = 0
          $NextNotification = $NotificationIntervalSeconds

          while ($ElapsedSeconds -lt $TotalSeconds) {

              Start-Sleep -Seconds $IntervalSeconds

              $ElapsedSeconds += $IntervalSeconds

              if ($ElapsedSeconds -ge $TotalSeconds) {

                  break
              }

              # --------------------------------------------------
              # Notify every 5 minutes
              # --------------------------------------------------

              if ($ElapsedSeconds -ge $NextNotification) {

                  $RemainingSeconds = $TotalSeconds - $ElapsedSeconds

                  $ElapsedMinutes = [math]::Floor(
                    $ElapsedSeconds / 60
                  )

                  $RemainingMinutes = [math]::Ceiling(
                    $RemainingSeconds / 60
                  )

                  $CurrentTime = Get-Date

                  Write-Host ""
                  Write-Host "==================================================" -ForegroundColor Cyan
                  Write-Host "RDP SERVER STATUS" -ForegroundColor Cyan
                  Write-Host "==================================================" -ForegroundColor Cyan

                  Write-Host ""
                  Write-Host "Current time       : $CurrentTime"
                  Write-Host "Elapsed            : $ElapsedMinutes minutes"
                  Write-Host "Remaining          : $RemainingMinutes minutes"
                  Write-Host "Total duration     : $TotalMinutes minutes"

                  Write-Host ""
                  Write-Host "RDP server is still running." -ForegroundColor Green
                  Write-Host "==================================================" -ForegroundColor Cyan
                  Write-Host ""

                  $NextNotification += $NotificationIntervalSeconds
              }
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "RDP SESSION WINDOW COMPLETED" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host "Total requested runtime : $TotalMinutes minutes"
          Write-Host "Actual elapsed seconds  : $ElapsedSeconds"
          Write-Host "Finished at             : $(Get-Date)"
          Write-Host ""

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 13. Inspect After RDP
      # ==========================================================

      - name: 13. Inspect After RDP Session
        if: steps.keep_alive.outcome == 'success'
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "AFTER RDP SESSION"
          Write-Host "==================================================" -ForegroundColor Cyan

          Write-Host ""
          Write-Host "Logged-on sessions:"
          Write-Host "--------------------------------------------------"

          quser 2>&1

          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "Windows profiles:"
          Write-Host "--------------------------------------------------"

          Get-CimInstance Win32_UserProfile |
            Where-Object {
              $_.LocalPath -like 'C:\Users\*'
            } |
            Select-Object SID, LocalPath, Loaded, Special |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "All user Desktop files:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            'C:\Users\*\Desktop' `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"


      # ==========================================================
      # 14. Save CynetAdmin Desktop
      # ==========================================================

      - name: 14. Save CynetAdmin Desktop
        id: save_desktop

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          $User = Get-LocalUser `
            -Name $Username `
            -ErrorAction Stop

          $Sid = $User.SID.Value

          $Profile = Get-CimInstance Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "SAVING CynetAdmin DESKTOP"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""

          if ($null -eq $Profile) {

              Write-Host "WARNING: CynetAdmin profile does not exist."
              Write-Host ""
              Write-Host "No RDP login appears to have created the profile."
              Write-Host "Existing persistent backup will be preserved."
              Write-Host ""

              "PERSISTENCE_UPDATED=false" >> $env:GITHUB_OUTPUT

              $global:LASTEXITCODE = 0

              return
          }

          $UserProfile = $Profile.LocalPath
          $Desktop = Join-Path $UserProfile 'Desktop'

          Write-Host "Profile : $UserProfile"
          Write-Host "Source  : $Desktop"
          Write-Host "Target  : $DesktopBackup"
          Write-Host ""

          if (-not (Test-Path -LiteralPath $Desktop)) {

              Write-Host "WARNING: CynetAdmin Desktop does not exist."
              Write-Host "Existing backup will be preserved."

              "PERSISTENCE_UPDATED=false" >> $env:GITHUB_OUTPUT

              $global:LASTEXITCODE = 0

              return
          }

          if (-not (Test-Path -LiteralPath $DesktopBackup)) {

              New-Item `
                -ItemType Directory `
                -Path $DesktopBackup `
                -Force |
                Out-Null
          }

          $Files = Get-ChildItem `
            -LiteralPath $Desktop `
            -Force `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          Write-Host "Current CynetAdmin Desktop file count: $($Files.Count)"

          if ($Files.Count -eq 0) {

              Write-Host ""
              Write-Host "WARNING: CynetAdmin Desktop is EMPTY." -ForegroundColor Yellow
              Write-Host ""
              Write-Host "Existing persistent backup will NOT be overwritten."

              "PERSISTENCE_UPDATED=false" >> $env:GITHUB_OUTPUT

              $global:LASTEXITCODE = 0

          }
          else {

              Write-Host ""
              Write-Host "Synchronizing Desktop..."

              robocopy `
                $Desktop `
                $DesktopBackup `
                /MIR `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:2 `
                /W:1 `
                /XJ

              $RobocopyExitCode = $LASTEXITCODE

              Write-Host ""
              Write-Host "Robocopy save exit code: $RobocopyExitCode"

              if ($RobocopyExitCode -gt 7) {

                  throw "Desktop backup failed. Robocopy exit code: $RobocopyExitCode"
              }

              $global:LASTEXITCODE = 0

              Write-Host ""
              Write-Host "Desktop saved successfully."

              "PERSISTENCE_UPDATED=true" >> $env:GITHUB_OUTPUT
          }

          Write-Host ""
          Write-Host "FILES CURRENTLY STORED IN PERSISTENT BACKUP:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            -LiteralPath $DesktopBackup `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 15. Verify Persistent Backup
      # ==========================================================

      - name: 15. Verify Persistent Backup
        id: verify_backup

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "PERSISTENCE VERIFICATION"
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          if (-not (Test-Path -LiteralPath $DesktopBackup)) {

              Write-Host "WARNING: Desktop backup directory does not exist."
              Write-Host "No new cache will be created."

              "BACKUP_VALID=false" >> $env:GITHUB_OUTPUT

              $global:LASTEXITCODE = 0

              return
          }

          $Files = Get-ChildItem `
            -LiteralPath $DesktopBackup `
            -Force `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          Write-Host "Persistent file count: $($Files.Count)"
          Write-Host ""

          if ($Files.Count -eq 0) {

              Write-Host "WARNING: Persistent Desktop backup is empty." -ForegroundColor Yellow
              Write-Host "No new cache will be created."

              "BACKUP_VALID=false" >> $env:GITHUB_OUTPUT
          }
          else {

              Write-Host "Persisted files:"
              Write-Host "--------------------------------------------------"

              $Files |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize

              Write-Host "--------------------------------------------------"

              "BACKUP_VALID=true" >> $env:GITHUB_OUTPUT
          }

          $global:LASTEXITCODE = 0


      # ==========================================================
      # 16. Save Workspace To GitHub Actions Cache
      # ==========================================================

      - name: 16. Save Workspace For Next Run

        if: |
          steps.keep_alive.outcome == 'success' &&
          steps.verify_backup.outputs.BACKUP_VALID == 'true'

        uses: actions/cache/save@v5

        with:

          path: ${{ github.workspace }}\workspace

          key: cynet-rdp-workspace-${{ runner.os }}-${{ github.run_id }}


      # ==========================================================
      # 17. Final Summary
      # ==========================================================

      - name: 17. Final Persistence Summary

        if: always()

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "FINAL RDP WORKFLOW SUMMARY"
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host "Run ID              : $env:GITHUB_RUN_ID"
          Write-Host "Runner OS           : $env:RUNNER_OS"
          Write-Host "RDP User            : CynetAdmin"
          Write-Host ""

          Write-Host "Requested Runtime   : 350 minutes"
          Write-Host "Keep-Alive Interval  : 60 seconds"
          Write-Host "Notification        : Every 5 minutes"
          Write-Host ""

          Write-Host "RDP Session Result  : ${{ steps.keep_alive.outcome }}"
          Write-Host "Desktop Save Result : ${{ steps.save_desktop.outcome }}"
          Write-Host "Backup Verify       : ${{ steps.verify_backup.outcome }}"
          Write-Host ""

          Write-Host "==================================================" -ForegroundColor Green

          $global:LASTEXITCODE = 0
