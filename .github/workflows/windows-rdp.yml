# ================================================================
# Windows Cloud RDP — Persistent Application/User State
#
# Persistence strategy:
#
#   NOT a full Windows image restore.
#
#   Instead persists:
#
#     - Installed application manifest
#     - winget application export
#     - Windows application registry
#     - selected HKLM registry settings
#     - selected HKCU registry settings
#     - CynetAdmin profile
#     - Desktop
#     - Documents
#     - Downloads
#     - AppData\Roaming
#     - selected AppData\Local
#     - ProgramData application configuration
#     - environment variables
#     - PowerShell profile
#     - Git configuration
#     - SSH configuration
#
#   On the next runner:
#
#     1. Windows Server Backup is installed
#     2. Persistent state is restored
#     3. Applications are reinstalled using winget
#     4. Registry/configuration is restored
#     5. RDP is enabled
#     6. Tailscale is connected
#
# IMPORTANT:
#
# This does NOT perform bare-metal Windows recovery.
# The GitHub runner always starts from Microsoft's fresh image.
#
# The goal is to reconstruct the user's working environment.
# ================================================================

name: Windows Cloud RDP


on:

  schedule:

    # GitHub Actions cron does not guarantee exact execution time.
    # Run approximately every 5 minutes.

    - cron: '*/5 * * * *'

  workflow_dispatch:


jobs:

  rdp-server:

    runs-on: windows-latest

    timeout-minutes: 15

    permissions:

      contents: read

      actions: write


    steps:


      # ============================================================
      # 1. Checkout Repository
      # ============================================================
      - name: 1. Checkout Repository

        uses: actions/checkout@v5


      # ============================================================
      # 2. Restore Previous Persistent State
      #
      # This must happen before Windows Server Backup installation
      # because this is where our persistent state package lives.
      # ============================================================
      - name: 2. Restore Previous Persistent State

        id: restore_state

        uses: actions/cache/restore@v5

        with:

          path: ${{ github.workspace }}\persistent-state

          key: cynet-rdp-state-${{ runner.os }}-${{ github.run_id }}

          restore-keys: |
            cynet-rdp-state-${{ runner.os }}-


      # ============================================================
      # 3. Install Windows Server Backup
      #
      # This is intentionally BEFORE state restore.
      #
      # We use Windows Server Backup tools for:
      #
      #   - System State inspection
      #   - registry/state backup support
      #   - wbadmin availability
      #
      # We do NOT attempt bare-metal recovery.
      # ============================================================
      - name: 3. Install Windows Server Backup

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'


          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "INSTALLING WINDOWS SERVER BACKUP"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""


          $Feature = Get-WindowsFeature `
            -Name Windows-Server-Backup `
            -ErrorAction Stop


          if (-not $Feature.Installed) {

              Write-Host "Installing Windows Server Backup..."


              Install-WindowsFeature `
                -Name Windows-Server-Backup `
                -IncludeManagementTools `
                -ErrorAction Stop |
                Format-List

          }
          else {

              Write-Host `
                "Windows Server Backup is already installed."
          }


          $Wbadmin = Get-Command `
            wbadmin.exe `
            -ErrorAction SilentlyContinue


          if ($null -eq $Wbadmin) {

              throw `
                "wbadmin.exe was not found."
          }


          Write-Host ""
          Write-Host `
            "wbadmin path: $($Wbadmin.Source)"

          Write-Host ""
          Write-Host `
            "Windows Server Backup installation completed."


      # ============================================================
      # 4. Prepare Persistent State
      #
      # At this point the Windows Server Backup tools exist.
      #
      # We DO NOT restore the entire Windows image.
      #
      # We restore application/user state instead.
      # ============================================================
      - name: 4. Prepare Persistent State

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $ProfileBackup = Join-Path `
            $StateRoot `
            'CynetAdmin'


          $RegistryBackup = Join-Path `
            $StateRoot `
            'Registry'


          $ApplicationsBackup = Join-Path `
            $StateRoot `
            'Applications'


          $ConfigBackup = Join-Path `
            $StateRoot `
            'Configuration'


          $ProgramDataBackup = Join-Path `
            $StateRoot `
            'ProgramData'


          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "PERSISTENT STATE"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""


          Write-Host "State root       : $StateRoot"
          Write-Host "Profile backup   : $ProfileBackup"
          Write-Host "Registry backup  : $RegistryBackup"
          Write-Host "Applications     : $ApplicationsBackup"
          Write-Host "Configuration    : $ConfigBackup"
          Write-Host "ProgramData      : $ProgramDataBackup"
          Write-Host ""


          foreach ($Directory in @(
              $StateRoot,
              $ProfileBackup,
              $RegistryBackup,
              $ApplicationsBackup,
              $ConfigBackup,
              $ProgramDataBackup
          )) {

              if (-not (Test-Path -LiteralPath $Directory)) {

                  New-Item `
                    -ItemType Directory `
                    -Path $Directory `
                    -Force |
                    Out-Null
              }
          }


          Write-Host ""
          Write-Host "Previous persistent state:"


          Get-ChildItem `
            -LiteralPath $StateRoot `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object `
              FullName,
              Length,
              LastWriteTime |
            Format-Table -AutoSize


      # ============================================================
      # 5. Create / Configure CynetAdmin
      # ============================================================
      - name: 5. Create RDP Administrator Account

        shell: powershell

        env:

          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |

          $ErrorActionPreference = 'Stop'


          $Username = 'CynetAdmin'


          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {

              throw `
                "GitHub Secret RDP_PASSWORD is not configured."
          }


          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force


          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue


          if ($null -eq $ExistingUser) {

              Write-Host "Creating CynetAdmin..."


              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description 'GitHub Actions RDP Administrator' |
                Out-Null
          }
          else {

              Write-Host `
                "CynetAdmin already exists."


              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword


              Enable-LocalUser `
                -Name $Username
          }


          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $Username `
            -ErrorAction SilentlyContinue


          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $Username `
            -ErrorAction SilentlyContinue


          Get-LocalUser `
            -Name $Username |
            Select-Object `
              Name,
              Enabled,
              SID,
              LastLogon |
            Format-List


      # ============================================================
      # 6. Initialize CynetAdmin Profile
      # ============================================================
      - name: 6. Initialize CynetAdmin Windows Profile

        shell: powershell

        env:

          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |

          $ErrorActionPreference = 'Stop'


          $Username = 'CynetAdmin'


          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force


          $Credential = New-Object `
            System.Management.Automation.PSCredential(
              $Username,
              $SecurePassword
            )


          $User = Get-LocalUser `
            -Name $Username `
            -ErrorAction Stop


          $Sid = $User.SID.Value


          $Profile = Get-CimInstance `
            Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1


          if ($null -eq $Profile) {

              Write-Host `
                "Creating CynetAdmin Windows profile..."


              $Process = Start-Process `
                -FilePath "$env:SystemRoot\System32\cmd.exe" `
                -ArgumentList '/c exit 0' `
                -Credential $Credential `
                -LoadUserProfile `
                -WindowStyle Hidden `
                -Wait `
                -PassThru


              if ($Process.ExitCode -ne 0) {

                  throw `
                    "Profile initialization failed."
              }
          }


          Start-Sleep -Seconds 2


          $Profile = Get-CimInstance `
            Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1


          if ($null -eq $Profile) {

              throw `
                "CynetAdmin profile was not created."
          }


          Write-Host ""
          Write-Host "CynetAdmin profile:"
          Write-Host $Profile.LocalPath


      # ============================================================
      # 7. Restore User Profile
      #
      # Restore:
      #
      #   Desktop
      #   Documents
      #   Downloads
      #   AppData\Roaming
      #   selected AppData\Local
      #
      # We intentionally DO NOT blindly overwrite all of C:\Users
      # because that can overwrite files currently in use.
      # ============================================================
      - name: 7. Restore CynetAdmin User Profile

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $ProfileBackup = Join-Path `
            $StateRoot `
            'CynetAdmin'


          $User = Get-LocalUser `
            -Name 'CynetAdmin' `
            -ErrorAction Stop


          $Sid = $User.SID.Value


          $Profile = Get-CimInstance `
            Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1


          if ($null -eq $Profile) {

              throw `
                "CynetAdmin profile does not exist."
          }


          $UserProfile = $Profile.LocalPath


          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "RESTORING USER PROFILE"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "Target: $UserProfile"


          $Directories = @(
              'Desktop',
              'Documents',
              'Downloads',
              'AppData\Roaming',
              'AppData\Local\Microsoft\Windows\PowerShell'
          )


          foreach ($RelativePath in $Directories) {

              $Source = Join-Path `
                $ProfileBackup `
                $RelativePath


              $Target = Join-Path `
                $UserProfile `
                $RelativePath


              if (-not (Test-Path -LiteralPath $Source)) {

                  Write-Host `
                    "No persistent data: $RelativePath"

                  continue
              }


              if (-not (Test-Path -LiteralPath $Target)) {

                  New-Item `
                    -ItemType Directory `
                    -Path $Target `
                    -Force |
                    Out-Null
              }


              Write-Host ""
              Write-Host `
                "Restoring: $RelativePath"


              robocopy `
                $Source `
                $Target `
                /E `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:2 `
                /W:1 `
                /XJ `
                /NFL `
                /NDL


              $Code = $LASTEXITCODE


              if ($Code -gt 7) {

                  throw `
                    "Failed to restore $RelativePath. Robocopy code: $Code"
              }


              $global:LASTEXITCODE = 0
          }


          Write-Host ""
          Write-Host `
            "User profile restoration completed."


      # ============================================================
      # 8. Restore User Environment Variables
      # ============================================================
      - name: 8. Restore User Environment Variables

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $EnvironmentFile = Join-Path `
            $StateRoot `
            'Configuration\UserEnvironment.json'


          if (-not (Test-Path -LiteralPath $EnvironmentFile)) {

              Write-Host `
                "No previous user environment found."

              return
          }


          $Variables = Get-Content `
            -LiteralPath $EnvironmentFile `
            -Raw |
            ConvertFrom-Json


          foreach ($Property in $Variables.PSObject.Properties) {

              $Name = $Property.Name

              $Value = [string]$Property.Value


              if ($Name -eq 'Path') {

                  Write-Host `
                    "Restoring PATH..."

                  [Environment]::SetEnvironmentVariable(
                    'Path',
                    $Value,
                    'User'
                  )

                  continue
              }


              Write-Host `
                "Restoring environment variable: $Name"


              [Environment]::SetEnvironmentVariable(
                $Name,
                $Value,
                'User'
              )
          }


          Write-Host `
            "User environment restoration completed."


      # ============================================================
      # 9. Restore Registry
      #
      # We restore application/user configuration rather than the
      # entire SYSTEM registry.
      #
      # SYSTEM hive replacement is deliberately avoided because it
      # can corrupt the fresh runner.
      # ============================================================
      - name: 9. Restore Application And User Registry

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $RegistryRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state\Registry'


          if (-not (Test-Path -LiteralPath $RegistryRoot)) {

              Write-Host `
                "No previous registry backup found."

              return
          }


          $RegistryFiles = @(
              'HKCU-Software.reg',
              'HKCU-Environment.reg',
              'HKCU-Explorer.reg',
              'HKCU-Terminal.reg',
              'HKLM-Software-Applications.reg'
          )


          foreach ($FileName in $RegistryFiles) {

              $File = Join-Path `
                $RegistryRoot `
                $FileName


              if (-not (Test-Path -LiteralPath $File)) {

                  Write-Host `
                    "Registry backup not found: $FileName"

                  continue
              }


              Write-Host ""
              Write-Host `
                "Importing registry: $FileName"


              reg.exe import `
                $File `
                /reg:64


              $Code = $LASTEXITCODE


              if ($Code -ne 0) {

                  Write-Warning `
                    "Registry import returned code $Code for $FileName"
              }


              $global:LASTEXITCODE = 0
          }


          Write-Host ""
          Write-Host `
            "Registry restoration completed."


      # ============================================================
      # 10. Restore Application Configuration
      #
      # Selected ProgramData is restored.
      #
      # This is configuration only. It does NOT pretend that copying
      # Program Files is equivalent to installing the application.
      # ============================================================
      - name: 10. Restore Application Configuration

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $SourceRoot = Join-Path `
            $StateRoot `
            'ProgramData'


          if (-not (Test-Path -LiteralPath $SourceRoot)) {

              Write-Host `
                "No ProgramData backup found."

              return
          }


          $TargetRoot = 'C:\ProgramData'


          Get-ChildItem `
            -LiteralPath $SourceRoot `
            -Directory `
            -ErrorAction SilentlyContinue |
            ForEach-Object {

                $Source = $_.FullName

                $Target = Join-Path `
                  $TargetRoot `
                  $_.Name


                Write-Host ""
                Write-Host `
                  "Restoring ProgramData: $($_.Name)"


                if (-not (Test-Path -LiteralPath $Target)) {

                    New-Item `
                      -ItemType Directory `
                      -Path $Target `
                      -Force |
                      Out-Null
                }


                robocopy `
                  $Source `
                  $Target `
                  /E `
                  /COPY:DAT `
                  /DCOPY:DAT `
                  /R:1 `
                  /W:1 `
                  /XJ `
                  /NFL `
                  /NDL


                $Code = $LASTEXITCODE


                if ($Code -gt 7) {

                    Write-Warning `
                      "ProgramData restore failed for $($_.Name). Code: $Code"
                }


                $global:LASTEXITCODE = 0
            }


          Write-Host ""
          Write-Host `
            "Application configuration restoration completed."


      # ============================================================
      # 11. Restore Git / SSH / PowerShell Configuration
      # ============================================================
      - name: 11. Restore Developer Configuration

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $User = Get-LocalUser `
            -Name 'CynetAdmin'


          $Sid = $User.SID.Value


          $Profile = Get-CimInstance `
            Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1


          if ($null -eq $Profile) {

              throw `
                "CynetAdmin profile not found."
          }


          $UserProfile = $Profile.LocalPath


          $DeveloperRoot = Join-Path `
            $StateRoot `
            'CynetAdmin\Developer'


          if (-not (Test-Path -LiteralPath $DeveloperRoot)) {

              Write-Host `
                "No developer configuration found."

              return
          }


          $Mappings = @(
              @{
                  Name = 'GitConfig'
                  Source = Join-Path $DeveloperRoot '.gitconfig'
                  Target = Join-Path $UserProfile '.gitconfig'
              },
              @{
                  Name = 'SSH'
                  Source = Join-Path $DeveloperRoot '.ssh'
                  Target = Join-Path $UserProfile '.ssh'
              },
              @{
                  Name = 'PowerShellProfile'
                  Source = Join-Path $DeveloperRoot 'PowerShell'
                  Target = Join-Path $UserProfile 'Documents\WindowsPowerShell'
              }
          )


          foreach ($Mapping in $Mappings) {

              $Source = $Mapping.Source

              $Target = $Mapping.Target


              if (-not (Test-Path -LiteralPath $Source)) {

                  continue
              }


              Write-Host ""
              Write-Host `
                "Restoring $($Mapping.Name)"


              if (-not (Test-Path -LiteralPath $Target)) {

                  New-Item `
                    -ItemType Directory `
                    -Path $Target `
                    -Force |
                    Out-Null
              }


              if ((Get-Item -LiteralPath $Source).PSIsContainer) {

                  robocopy `
                    $Source `
                    $Target `
                    /E `
                    /COPY:DAT `
                    /DCOPY:DAT `
                    /R:1 `
                    /W:1 `
                    /XJ `
                    /NFL `
                    /NDL
              }
              else {

                  Copy-Item `
                    -LiteralPath $Source `
                    -Destination $Target `
                    -Force
              }


              $global:LASTEXITCODE = 0
          }


      # ============================================================
      # 12. Reinstall Applications
      #
      # winget restores the APPLICATIONS, rather than copying
      # C:\Program Files.
      #
      # This is the correct approach for an ephemeral runner.
      # ============================================================
      - name: 12. Reinstall Applications From Persistent Manifest

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $ApplicationsRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state\Applications'


          $WingetExport = Join-Path `
            $ApplicationsRoot `
            'winget-export.json'


          if (-not (Test-Path -LiteralPath $WingetExport)) {

              Write-Host ""
              Write-Host `
                "No previous winget application export found."

              return
          }


          $Winget = Get-Command `
            winget.exe `
            -ErrorAction SilentlyContinue


          if ($null -eq $Winget) {

              Write-Warning `
                "winget.exe is not available."

              return
          }


          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "RESTORING APPLICATIONS"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host `
            "Export: $WingetExport"


          winget import `
            --import-file "$WingetExport" `
            --accept-source-agreements `
            --accept-package-agreements `
            --ignore-unavailable


          $Code = $LASTEXITCODE


          Write-Host ""
          Write-Host `
            "winget import exit code: $Code"


          # winget can return non-zero when an application from the
          # previous runner is no longer available.
          #
          # Do not destroy the whole RDP workflow because one package
          # could not be installed.

          $global:LASTEXITCODE = 0


      # ============================================================
      # 13. Enable Remote Desktop
      # ============================================================
      - name: 13. Enable Remote Desktop

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'


          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0


          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1


          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'


          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic


          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue


          Start-Sleep -Seconds 2


          $Service = Get-Service `
            -Name 'TermService'


          if ($Service.Status -ne 'Running') {

              throw `
                "Remote Desktop service is not running."
          }


          Write-Host `
            "Remote Desktop enabled successfully."


      # ============================================================
      # 14. Install Tailscale
      # ============================================================
      - name: 14. Install Tailscale

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'


          $Installer = 'C:\tailscale.msi'

          $Tailscale = `
            'C:\Program Files\Tailscale\tailscale.exe'


          Write-Host `
            "Downloading Tailscale..."


          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $Installer


          if (-not (Test-Path -LiteralPath $Installer)) {

              throw `
                "Tailscale installer download failed."
          }


          Write-Host `
            "Installing Tailscale..."


          $InstallProcess = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList @(
              '/i',
              $Installer,
              '/quiet',
              '/norestart'
            ) `
            -Wait `
            -PassThru


          if ($InstallProcess.ExitCode -ne 0) {

              throw `
                "Tailscale installation failed. Exit code: $($InstallProcess.ExitCode)"
          }


          $TimeoutSeconds = 60

          $ElapsedSeconds = 0


          while (-not (Test-Path -LiteralPath $Tailscale)) {

              if ($ElapsedSeconds -ge $TimeoutSeconds) {

                  throw `
                    "Tailscale executable was not found."
              }


              Start-Sleep -Seconds 2

              $ElapsedSeconds += 2
          }


          Write-Host `
            "Tailscale executable found."


      # ============================================================
      # 15. Connect Tailscale
      # ============================================================
      - name: 15. Connect Tailscale

        shell: powershell

        env:

          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY_WIN_1 }}

        run: |

          $ErrorActionPreference = 'Stop'


          $Tailscale = `
            'C:\Program Files\Tailscale\tailscale.exe'


          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {

              throw `
                "TAILSCALE_AUTHKEY_WIN_1 is not configured."
          }


          Start-Service `
            -Name 'Tailscale' `
            -ErrorAction SilentlyContinue


          Start-Sleep -Seconds 5


          $Hostname = `
            "github-rdp-$env:GITHUB_RUN_ID"


          & $Tailscale up `
            --auth-key="$env:TAILSCALE_AUTHKEY" `
            --hostname="$Hostname" `
            --accept-dns=true `
            --unattended=true


          if ($LASTEXITCODE -ne 0) {

              throw `
                "Tailscale connection failed."
          }


          $global:LASTEXITCODE = 0


          $TailscaleIP = ''


          for ($i = 1; $i -le 15; $i++) {

              $TailscaleIP = `
                (& $Tailscale ip -4 2>$null).Trim()


              if (-not [string]::IsNullOrWhiteSpace($TailscaleIP)) {

                  break
              }


              Start-Sleep -Seconds 2
          }


          if ([string]::IsNullOrWhiteSpace($TailscaleIP)) {

              throw `
                "Tailscale did not provide an IPv4 address."
          }


          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "             RDP SERVER IS READY"
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host `
            "Tailscale IP : $TailscaleIP" `
            -ForegroundColor Yellow

          Write-Host `
            "Hostname     : $Hostname" `
            -ForegroundColor Yellow

          Write-Host `
            "Username     : CynetAdmin" `
            -ForegroundColor Yellow

          Write-Host ""

          Write-Host `
            "mstsc /v:$TailscaleIP" `
            -ForegroundColor Magenta

          Write-Host ""


          & $Tailscale status


          $global:LASTEXITCODE = 0


      # ============================================================
      # 16. Verify RDP
      # ============================================================
      - name: 16. Verify RDP

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'


          $RdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'


          if ($RdpDenied -ne 0) {

              throw `
                "RDP is disabled."
          }


          $TermService = Get-Service `
            -Name 'TermService'


          if ($TermService.Status -ne 'Running') {

              throw `
                "TermService is not running."
          }


          Write-Host `
            "RDP registry : OK"

          Write-Host `
            "TermService  : RUNNING"


      # ============================================================
      # 17. Keep RDP Server Alive
      # ============================================================
      - name: 17. Keep RDP Server Alive

        id: keep_alive

        shell: powershell

        run: |

          $TotalSeconds = 200

          $IntervalSeconds = 10


          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       RDP SERVER IS NOW AVAILABLE"
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""


          for (
            $Elapsed = 0;
            $Elapsed -lt $TotalSeconds;
            $Elapsed += $IntervalSeconds
          ) {

              $Remaining = `
                $TotalSeconds - $Elapsed


              Write-Host `
                "RDP server running - $Remaining seconds remaining..."


              Start-Sleep `
                -Seconds $IntervalSeconds
          }


          Write-Host ""
          Write-Host `
            "RDP session window completed."


      # ============================================================
      # 18. Capture Current Application Manifest
      #
      # This happens AFTER the RDP session because you may have
      # installed software during the session.
      # ============================================================
      - name: 18. Capture Installed Applications

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $ApplicationsRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state\Applications'


          if (-not (Test-Path -LiteralPath $ApplicationsRoot)) {

              New-Item `
                -ItemType Directory `
                -Path $ApplicationsRoot `
                -Force |
                Out-Null
          }


          $Winget = Get-Command `
            winget.exe `
            -ErrorAction SilentlyContinue


          if ($null -ne $Winget) {

              Write-Host ""
              Write-Host `
                "Exporting installed applications with winget..."


              winget export `
                --output "$ApplicationsRoot\winget-export.json" `
                --include-versions `
                --accept-source-agreements


              $global:LASTEXITCODE = 0
          }
          else {

              Write-Warning `
                "winget.exe is not available."
          }


          Write-Host ""
          Write-Host `
            "Capturing installed-program registry..."


          $UninstallFile = Join-Path `
            $ApplicationsRoot `
            'installed-programs.json'


          $Programs = @()


          foreach ($RegistryPath in @(
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )) {

              $Programs += `
                Get-ItemProperty `
                  $RegistryPath `
                  -ErrorAction SilentlyContinue |
                Where-Object {
                  -not [string]::IsNullOrWhiteSpace($_.DisplayName)
                } |
                Select-Object `
                  DisplayName,
                  DisplayVersion,
                  Publisher,
                  InstallLocation,
                  UninstallString
          }


          $Programs |
            Sort-Object DisplayName, DisplayVersion -Unique |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              -LiteralPath $UninstallFile `
              -Encoding UTF8


          Write-Host `
            "Application manifest captured."


      # ============================================================
      # 19. Backup User Profile
      # ============================================================
      - name: 19. Backup CynetAdmin Profile

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $ProfileBackup = Join-Path `
            $StateRoot `
            'CynetAdmin'


          $User = Get-LocalUser `
            -Name 'CynetAdmin' `
            -ErrorAction Stop


          $Sid = $User.SID.Value


          $Profile = Get-CimInstance `
            Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1


          if ($null -eq $Profile) {

              Write-Warning `
                "CynetAdmin profile not found."

              return
          }


          $UserProfile = $Profile.LocalPath


          foreach ($RelativePath in @(
              'Desktop',
              'Documents',
              'Downloads',
              'AppData\Roaming',
              'AppData\Local\Microsoft\Windows\PowerShell'
          )) {

              $Source = Join-Path `
                $UserProfile `
                $RelativePath


              $Target = Join-Path `
                $ProfileBackup `
                $RelativePath


              if (-not (Test-Path -LiteralPath $Source)) {

                  continue
              }


              if (-not (Test-Path -LiteralPath $Target)) {

                  New-Item `
                    -ItemType Directory `
                    -Path $Target `
                    -Force |
                    Out-Null
              }


              Write-Host ""
              Write-Host `
                "Backing up: $RelativePath"


              robocopy `
                $Source `
                $Target `
                /MIR `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:1 `
                /W:1 `
                /XJ `
                /NFL `
                /NDL


              if ($LASTEXITCODE -gt 7) {

                  Write-Warning `
                    "Backup failed for $RelativePath."
              }


              $global:LASTEXITCODE = 0
          }


      # ============================================================
      # 20. Backup Developer Configuration
      # ============================================================
      - name: 20. Backup Developer Configuration

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $DeveloperRoot = Join-Path `
            $StateRoot `
            'CynetAdmin\Developer'


          if (-not (Test-Path -LiteralPath $DeveloperRoot)) {

              New-Item `
                -ItemType Directory `
                -Path $DeveloperRoot `
                -Force |
                Out-Null
          }


          $User = Get-LocalUser `
            -Name 'CynetAdmin'


          $Sid = $User.SID.Value


          $Profile = Get-CimInstance `
            Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1


          $UserProfile = $Profile.LocalPath


          # Git

          $GitConfig = Join-Path `
            $UserProfile `
            '.gitconfig'


          if (Test-Path -LiteralPath $GitConfig) {

              Copy-Item `
                -LiteralPath $GitConfig `
                -Destination (
                  Join-Path $DeveloperRoot '.gitconfig'
                ) `
                -Force
          }


          # SSH

          $SSHSource = Join-Path `
            $UserProfile `
            '.ssh'


          $SSHTarget = Join-Path `
            $DeveloperRoot `
            '.ssh'


          if (Test-Path -LiteralPath $SSHSource) {

              if (Test-Path -LiteralPath $SSHTarget) {

                  Remove-Item `
                    -LiteralPath $SSHTarget `
                    -Recurse `
                    -Force
              }


              robocopy `
                $SSHSource `
                $SSHTarget `
                /MIR `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:1 `
                /W:1 `
                /XJ `
                /NFL `
                /NDL


              $global:LASTEXITCODE = 0
          }


          # PowerShell profile

          $PowerShellSource = Join-Path `
            $UserProfile `
            'Documents\WindowsPowerShell'


          $PowerShellTarget = Join-Path `
            $DeveloperRoot `
            'PowerShell'


          if (Test-Path -LiteralPath $PowerShellSource) {

              if (-not (Test-Path -LiteralPath $PowerShellTarget)) {

                  New-Item `
                    -ItemType Directory `
                    -Path $PowerShellTarget `
                    -Force |
                    Out-Null
              }


              robocopy `
                $PowerShellSource `
                $PowerShellTarget `
                /MIR `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:1 `
                /W:1 `
                /XJ `
                /NFL `
                /NDL


              $global:LASTEXITCODE = 0
          }


      # ============================================================
      # 21. Backup User Environment
      # ============================================================
      - name: 21. Backup User Environment Variables

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $ConfigRoot = Join-Path `
            $StateRoot `
            'Configuration'


          if (-not (Test-Path -LiteralPath $ConfigRoot)) {

              New-Item `
                -ItemType Directory `
                -Path $ConfigRoot `
                -Force |
                Out-Null
          }


          $Variables = @{}

          $UserEnvironment = `
            [Environment]::GetEnvironmentVariables('User')


          foreach ($Key in $UserEnvironment.Keys) {

              $Variables[$Key] = `
                [string]$UserEnvironment[$Key]
          }


          $Variables |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              -LiteralPath (
                Join-Path `
                  $ConfigRoot `
                  'UserEnvironment.json'
              ) `
              -Encoding UTF8


          Write-Host `
            "User environment variables backed up."


      # ============================================================
      # 22. Backup Registry
      #
      # We deliberately export configuration rather than SYSTEM hive.
      # ============================================================
      - name: 22. Backup Application And User Registry

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $RegistryRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state\Registry'


          if (-not (Test-Path -LiteralPath $RegistryRoot)) {

              New-Item `
                -ItemType Directory `
                -Path $RegistryRoot `
                -Force |
                Out-Null
          }


          Write-Host ""
          Write-Host `
            "Exporting HKCU Software..."


          reg.exe export `
            'HKCU\Software' `
            (
              Join-Path `
                $RegistryRoot `
                'HKCU-Software.reg'
            ) `
            /y


          Write-Host ""
          Write-Host `
            "Exporting HKCU Environment..."


          reg.exe export `
            'HKCU\Environment' `
            (
              Join-Path `
                $RegistryRoot `
                'HKCU-Environment.reg'
            ) `
            /y


          Write-Host ""
          Write-Host `
            "Exporting HKCU Explorer..."


          reg.exe export `
            'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer' `
            (
              Join-Path `
                $RegistryRoot `
                'HKCU-Explorer.reg'
            ) `
            /y


          Write-Host ""
          Write-Host `
            "Exporting Windows Terminal settings..."


          reg.exe export `
            'HKCU\Software\Microsoft\Windows Terminal' `
            (
              Join-Path `
                $RegistryRoot `
                'HKCU-Terminal.reg'
            ) `
            /y


          Write-Host ""
          Write-Host `
            "Exporting application-related HKLM registry..."


          reg.exe export `
            'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall' `
            (
              Join-Path `
                $RegistryRoot `
                'HKLM-Software-Applications.reg'
            ) `
            /y


          $global:LASTEXITCODE = 0


          Write-Host ""
          Write-Host `
            "Registry backup completed."


      # ============================================================
      # 23. Backup Selected ProgramData
      #
      # Only configuration directories are copied.
      #
      # We intentionally avoid copying huge/binary runtime data.
      # ============================================================
      - name: 23. Backup Application Configuration

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $ProgramDataBackup = Join-Path `
            $StateRoot `
            'ProgramData'


          if (-not (Test-Path -LiteralPath $ProgramDataBackup)) {

              New-Item `
                -ItemType Directory `
                -Path $ProgramDataBackup `
                -Force |
                Out-Null
          }


          # --------------------------------------------------------
          # Add application-specific ProgramData directories here.
          #
          # Example:
          #
          # 'C:\ProgramData\SomeApplication'
          #
          # Do NOT blindly copy all of C:\ProgramData.
          # --------------------------------------------------------

          $ProgramDataPaths = @(
          )


          foreach ($Source in $ProgramDataPaths) {

              if (-not (Test-Path -LiteralPath $Source)) {

                  continue
              }


              $Name = Split-Path `
                $Source `
                -Leaf


              $Target = Join-Path `
                $ProgramDataBackup `
                $Name


              Write-Host ""
              Write-Host `
                "Backing up ProgramData: $Name"


              robocopy `
                $Source `
                $Target `
                /MIR `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:1 `
                /W:1 `
                /XJ `
                /NFL `
                /NDL


              $global:LASTEXITCODE = 0
          }


      # ============================================================
      # 24. Create State Manifest
      # ============================================================
      - name: 24. Create Persistent State Manifest

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          $Manifest = [ordered]@{

              CreatedUtc = `
                [DateTime]::UtcNow.ToString('o')

              RunnerOS = `
                $env:RUNNER_OS

              RunnerImage = `
                $env:ImageVersion

              WindowsVersion = `
                (Get-ComputerInfo).WindowsVersion

              WindowsBuild = `
                (Get-ComputerInfo).OsBuildNumber

              User = `
                'CynetAdmin'

              RunId = `
                $env:GITHUB_RUN_ID

              Strategy = `
                'User/Application State Persistence'

              BareMetalRestore = `
                $false
          }


          $Manifest |
            ConvertTo-Json -Depth 10 |
            Set-Content `
              -LiteralPath (
                Join-Path `
                  $StateRoot `
                  'manifest.json'
            ) `
            -Encoding UTF8


          Write-Host ""
          Write-Host "Persistent state manifest:"
          Write-Host ""


          $Manifest |
            ConvertTo-Json -Depth 10


      # ============================================================
      # 25. Verify Persistent State
      # ============================================================
      - name: 25. Verify Persistent State

        id: verify_state

        if: steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'


          $StateRoot = Join-Path `
            $env:GITHUB_WORKSPACE `
            'persistent-state'


          if (-not (Test-Path -LiteralPath $StateRoot)) {

              throw `
                "Persistent state directory does not exist."
          }


          $Manifest = Join-Path `
            $StateRoot `
            'manifest.json'


          if (-not (Test-Path -LiteralPath $Manifest)) {

              throw `
                "Persistent state manifest was not created."
          }


          $Files = Get-ChildItem `
            -LiteralPath $StateRoot `
            -Force `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue


          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "PERSISTENT STATE VERIFICATION"
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""


          Write-Host `
            "Persistent files: $($Files.Count)"


          Write-Host ""


          $Files |
            Select-Object `
              FullName,
              Length,
              LastWriteTime |
            Format-Table -AutoSize


          if ($Files.Count -eq 0) {

              throw `
                "Persistent state is empty."
          }


          "STATE_VALID=true" `
            >> $env:GITHUB_OUTPUT


          $global:LASTEXITCODE = 0


      # ============================================================
      # 26. Save Persistent State To GitHub Actions Cache
      # ============================================================
      - name: 26. Save Persistent State

        if: |
          steps.keep_alive.outcome == 'success' &&
          steps.verify_state.outputs.STATE_VALID == 'true'

        uses: actions/cache/save@v5

        with:

          path: ${{ github.workspace }}\persistent-state

          key: cynet-rdp-state-${{ runner.os }}-${{ github.run_id }}


      # ============================================================
      # 27. Final Summary
      # ============================================================
      - name: 27. Final Summary

        if: always()

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'


          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "FINAL RDP WORKFLOW SUMMARY"
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""


          Write-Host `
            "Run ID                    : $env:GITHUB_RUN_ID"

          Write-Host `
            "Runner OS                 : $env:RUNNER_OS"

          Write-Host `
            "RDP User                  : CynetAdmin"

          Write-Host ""

          Write-Host `
            "RDP Session               : ${{ steps.keep_alive.outcome }}"

          Write-Host `
            "State Verification        : ${{ steps.verify_state.outcome }}"

          Write-Host ""

          Write-Host "Persistence includes:"
          Write-Host "  - User profile"
          Write-Host "  - Desktop"
          Write-Host "  - Documents"
          Write-Host "  - Downloads"
          Write-Host "  - AppData"
          Write-Host "  - Git configuration"
          Write-Host "  - SSH configuration"
          Write-Host "  - PowerShell configuration"
          Write-Host "  - User environment variables"
          Write-Host "  - User registry"
          Write-Host "  - Application registry"
          Write-Host "  - Installed application manifest"
          Write-Host "  - Application configuration"
          Write-Host ""

          Write-Host "==================================================" -ForegroundColor Green


          $global:LASTEXITCODE = 0
