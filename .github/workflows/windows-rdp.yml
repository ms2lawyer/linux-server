name: Windows Cloud RDP

on:
  schedule:
    # GitHub Actions scheduled workflows cannot run every 2 minutes.
    # 5 minutes is the minimum cron interval.
    - cron: '*/5 * * * *'

  # Allow manual execution
  workflow_dispatch:

jobs:
  rdp-server:
    runs-on: windows-latest

    # We only need approximately 2 minutes of server lifetime,
    # but allow enough time for installation/setup.
    timeout-minutes: 5

    steps:

      # ============================================================
      # 1. Checkout Repository
      # ============================================================
      - name: 1. Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Restore Workspace From Previous Run
      # ============================================================
      - name: 2. Restore Persistent Workspace
        uses: actions/cache/restore@v4
        with:
          # IMPORTANT:
          # This is a Windows path.
          path: ${{ github.workspace }}\workspace

          # Current run gets its own unique cache key.
          # This key normally does NOT exist yet.
          key: cynet-rdp-workspace-${{ runner.os }}-${{ github.run_id }}

          # If the current key doesn't exist, GitHub searches
          # for the newest previous cache beginning with this prefix.
          restore-keys: |
            cynet-rdp-workspace-${{ runner.os }}-

      # ============================================================
      # 3. Prepare Workspace
      # ============================================================
      - name: 3. Prepare Workspace
        shell: powershell
        run: |
          $Workspace = "${{ github.workspace }}\workspace"

          Write-Host "=============================================="
          Write-Host "Workspace"
          Write-Host "=============================================="
          Write-Host $Workspace
          Write-Host ""

          if (-not (Test-Path $Workspace)) {
              Write-Host "Workspace does not exist. Creating it..."

              New-Item `
                -ItemType Directory `
                -Path $Workspace `
                -Force | Out-Null
          }
          else {
              Write-Host "Workspace restored successfully."
          }

          Write-Host ""
          Write-Host "Workspace contents:"
          Write-Host "----------------------------------------------"

          Get-ChildItem `
            -Path $Workspace `
            -Force `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime, Mode

          Write-Host "----------------------------------------------"


      # ============================================================
      # 4. Enable Remote Desktop
      # ============================================================
      - name: 4. Enable Remote Desktop
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          # Enable Windows Firewall RDP rules.
          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          # Make Remote Desktop service automatic.
          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          # Start Remote Desktop service.
          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop enabled."

          Write-Host ""
          Write-Host "Remote Desktop service:"
          Get-Service -Name 'TermService' |
            Select-Object Name, Status, StartType


      # ============================================================
      # 5. Create RDP Administrator Account
      # ============================================================
      - name: 5. Create RDP Administrator Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $Username = 'CynetAdmin'

          if ([string]::IsNullOrWhiteSpace($Env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD GitHub Secret is not configured."
          }

          $Password = ConvertTo-SecureString `
            $Env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Write-Host "Configuring user: $Username"

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $ExistingUser) {

              Write-Host "Creating user..."

              New-LocalUser `
                -Name $Username `
                -Password $Password `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description 'GitHub Actions RDP Administrator'

          }
          else {

              Write-Host "User already exists."

              # Update password in case the secret changed.
              Set-LocalUser `
                -Name $Username `
                -Password $Password

              Enable-LocalUser `
                -Name $Username
          }

          # Add to Administrators.
          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          # Add to Remote Desktop Users.
          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "User configured successfully."

          Write-Host ""
          Write-Host "Account:"
          Get-LocalUser -Name $Username |
            Select-Object Name, Enabled, PasswordNeverExpires


      # ============================================================
      # 6. Install Tailscale
      # ============================================================
      - name: 6. Install Tailscale
        shell: powershell
        run: |
          $Installer = 'C:\tailscale.msi'
          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $Installer

          if (-not (Test-Path $Installer)) {
              throw "Tailscale installer was not downloaded."
          }

          Write-Host "Installing Tailscale..."

          $Process = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList @(
              '/i',
              $Installer,
              '/quiet',
              '/norestart'
            ) `
            -Wait `
            -PassThru

          if ($Process.ExitCode -ne 0) {
              throw "Tailscale installation failed with exit code $($Process.ExitCode)"
          }

          Write-Host "Tailscale MSI installation completed."

          # Wait for tailscale.exe.
          $Timeout = 60
          $Elapsed = 0

          while (-not (Test-Path $Tailscale)) {

              if ($Elapsed -ge $Timeout) {
                  throw "Tailscale executable was not found after $Timeout seconds."
              }

              Start-Sleep -Seconds 2

              $Elapsed += 2
          }

          Write-Host "Tailscale executable found."


      # ============================================================
      # 7. Connect Tailscale
      # ============================================================
      - name: 7. Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY_WIN_1 }}
        run: |
          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          if ([string]::IsNullOrWhiteSpace($Env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY_WIN_1 GitHub Secret is not configured."
          }

          Write-Host "Starting Tailscale service..."

          Start-Service `
            -Name 'Tailscale' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host "Connecting to Tailscale..."

          & $Tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname='github-rdp-server' `
            --accept-dns=true

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed with exit code $LASTEXITCODE"
          }

          Write-Host "Waiting for Tailscale..."

          Start-Sleep -Seconds 8

          # Get Tailscale IPv4 address.
          $ts_ip = (& $Tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ts_ip)) {
              throw "Unable to obtain Tailscale IPv4 address."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "             RDP SERVER IS READY" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Hostname     : github-rdp-server" -ForegroundColor Yellow
          Write-Host "Username     : CynetAdmin" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "RDP command:" -ForegroundColor Cyan
          Write-Host "mstsc /v:$ts_ip" -ForegroundColor Magenta
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host "Tailscale status:"
          & $Tailscale status


      # ============================================================
      # 8. Verify RDP
      # ============================================================
      - name: 8. Verify RDP
        shell: powershell
        run: |
          Write-Host "Checking RDP configuration..."

          $RdpDisabled = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($RdpDisabled -ne 0) {
              throw "RDP is disabled."
          }

          Write-Host "RDP registry configuration: OK"

          $TermService = Get-Service `
            -Name 'TermService'

          if ($TermService.Status -ne 'Running') {
              throw "Remote Desktop service is not running."
          }

          Write-Host "Remote Desktop service: RUNNING"

          Write-Host ""
          Write-Host "Enabled RDP firewall rules:"

          Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq 'True' |
            Select-Object DisplayName, Enabled, Profile


      # ============================================================
      # 9. Keep Server Alive For 2 Minutes
      # ============================================================
      - name: 9. Keep Server Alive For 2 Minutes
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "        WINDOWS RDP SERVER IS RUNNING" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          $TotalSeconds = 120
          $Interval = 10

          for ($Elapsed = 0; $Elapsed -lt $TotalSeconds; $Elapsed += $Interval) {

              $Remaining = $TotalSeconds - $Elapsed

              Write-Host "Server running - $Remaining seconds remaining..."

              Start-Sleep -Seconds $Interval
          }

          Write-Host ""
          Write-Host "2 minutes completed."
          Write-Host "Workflow will now save the workspace."


      # ============================================================
      # 10. Save Workspace For Next Run
      # ============================================================
      - name: 10. Save Workspace For Next Run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\workspace

          # IMPORTANT:
          # Every run has a unique key because GitHub caches are immutable.
          # The next run's Step 2 will find this cache using restore-keys.
          key: cynet-rdp-workspace-${{ runner.os }}-${{ github.run_id }}
