# Windows Cloud RDP — Final Workflow
name: Windows Cloud RDP

on:
  schedule:
    # GitHub Actions cron does not support every 2 minutes.
    # Run every 5 minutes.
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  rdp-server:

    runs-on: windows-latest

    # Includes:
    # checkout
    # cache restore
    # RDP setup
    # Tailscale installation
    # Tailscale connection
    # RDP session
    # desktop backup
    # cache save
    timeout-minutes: 15

    permissions:
      contents: read
      actions: write

    steps:

      # ============================================================
      # 1. Checkout Repository
      # ============================================================
      - name: 1. Checkout Repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. Restore Previous Persistent Workspace
      # ============================================================
      - name: 2. Restore Previous Workspace
        id: restore_workspace
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}\workspace

          # Every run gets a new immutable cache key.
          key: cynet-rdp-workspace-${{ runner.os }}-${{ github.run_id }}

          # Restore the newest available previous workspace.
          restore-keys: |
            cynet-rdp-workspace-${{ runner.os }}-


      # ============================================================
      # 3. Prepare Persistent Workspace
      # ============================================================
      - name: 3. Prepare Persistent Workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "PERSISTENT WORKSPACE"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "Workspace      : $Workspace"
          Write-Host "Desktop Backup : $DesktopBackup"
          Write-Host ""

          if (-not (Test-Path -LiteralPath $Workspace)) {
              New-Item `
                -ItemType Directory `
                -Path $Workspace `
                -Force | Out-Null
          }

          if (-not (Test-Path -LiteralPath $DesktopBackup)) {
              New-Item `
                -ItemType Directory `
                -Path $DesktopBackup `
                -Force | Out-Null
          }

          Write-Host "Restore information:"
          Write-Host "--------------------------------------------------"
          Write-Host "Exact cache hit : ${{ steps.restore_workspace.outputs.cache-hit }}"
          Write-Host "Matched cache   : ${{ steps.restore_workspace.outputs.cache-matched-key }}"
          Write-Host "--------------------------------------------------"

          Write-Host ""
          Write-Host "Restored workspace:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            -LiteralPath $Workspace `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"


      # ============================================================
      # 4. Enable Remote Desktop
      # ============================================================
      - name: 4. Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          $Service = Get-Service -Name 'TermService'

          Write-Host "TermService status: $($Service.Status)"

          if ($Service.Status -ne 'Running') {
              throw "Remote Desktop service is not running."
          }

          Write-Host "Remote Desktop enabled successfully."


      # ============================================================
      # 5. Create / Configure RDP Administrator Account
      # ============================================================
      - name: 5. Create RDP Administrator Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "GitHub Secret RDP_PASSWORD is not configured."
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Write-Host "Configuring user: $Username"

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $ExistingUser) {

              Write-Host "Creating local user..."

              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description 'GitHub Actions RDP Administrator' |
                Out-Null
          }
          else {

              Write-Host "User already exists."

              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword

              Enable-LocalUser `
                -Name $Username
          }

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "User information:"

          Get-LocalUser -Name $Username |
            Select-Object Name, Enabled, SID, LastLogon |
            Format-List

          Write-Host ""
          Write-Host "RDP user configured successfully."


      # ============================================================
      # 6. Restore CynetAdmin Desktop
      #
      # If the profile already exists, restore the saved Desktop.
      #
      # If the profile does not exist yet, Windows will create it
      # during the first RDP login.
      # ============================================================
      - name: 6. Restore CynetAdmin Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          $User = Get-LocalUser `
            -Name $Username `
            -ErrorAction Stop

          $Sid = $User.SID.Value

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "RESTORING CynetAdmin DESKTOP"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "Backup : $DesktopBackup"
          Write-Host ""

          if (-not (Test-Path -LiteralPath $DesktopBackup)) {
              New-Item `
                -ItemType Directory `
                -Path $DesktopBackup `
                -Force | Out-Null
          }

          $Profile = Get-CimInstance Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1

          if ($null -eq $Profile) {

              Write-Host "CynetAdmin profile does not exist yet."
              Write-Host "Skipping Desktop restore."
              Write-Host "Windows will create the profile during RDP login."

          }
          else {

              $UserProfile = $Profile.LocalPath
              $Desktop = Join-Path $UserProfile 'Desktop'

              Write-Host "Profile : $UserProfile"
              Write-Host "Target  : $Desktop"
              Write-Host ""

              if (-not (Test-Path -LiteralPath $Desktop)) {
                  New-Item `
                    -ItemType Directory `
                    -Path $Desktop `
                    -Force | Out-Null
              }

              robocopy `
                $DesktopBackup `
                $Desktop `
                /MIR `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:2 `
                /W:1 `
                /XJ

              $RobocopyExitCode = $LASTEXITCODE

              Write-Host ""
              Write-Host "Robocopy restore exit code: $RobocopyExitCode"

              # Robocopy:
              # 0 = Nothing copied
              # 1 = Files copied successfully
              # 2-7 = Successful/non-fatal differences
              # 8+ = Failure
              if ($RobocopyExitCode -gt 7) {
                  throw "Desktop restore failed. Robocopy exit code: $RobocopyExitCode"
              }

              # IMPORTANT:
              # Robocopy exit code 1 is SUCCESS.
              # Reset LASTEXITCODE so GitHub Actions does not mark
              # this PowerShell step as failed.
              $global:LASTEXITCODE = 0

              Write-Host ""
              Write-Host "Desktop restore completed successfully."

              Write-Host ""
              Write-Host "Restored Desktop contents:"
              Write-Host "--------------------------------------------------"

              Get-ChildItem `
                -LiteralPath $Desktop `
                -Force `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize

              Write-Host "--------------------------------------------------"
          }


      # ============================================================
      # 7. Install Tailscale
      # ============================================================
      - name: 7. Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Installer = 'C:\tailscale.msi'
          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $Installer

          if (-not (Test-Path -LiteralPath $Installer)) {
              throw "Tailscale installer download failed."
          }

          Write-Host "Installing Tailscale..."

          $InstallProcess = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList @(
              '/i',
              $Installer,
              '/quiet',
              '/norestart'
            ) `
            -Wait `
            -PassThru

          if ($InstallProcess.ExitCode -ne 0) {
              throw "Tailscale installation failed. Exit code: $($InstallProcess.ExitCode)"
          }

          Write-Host "Tailscale installation completed."

          $TimeoutSeconds = 60
          $ElapsedSeconds = 0

          while (-not (Test-Path -LiteralPath $Tailscale)) {

              if ($ElapsedSeconds -ge $TimeoutSeconds) {
                  throw "Tailscale executable was not found."
              }

              Start-Sleep -Seconds 2
              $ElapsedSeconds += 2
          }

          Write-Host "Tailscale executable found."


      # ============================================================
      # 8. Connect Tailscale
      #
      # IMPORTANT:
      # Do NOT use --ephemeral.
      # ============================================================
      - name: 8. Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY_WIN_1 }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "GitHub Secret TAILSCALE_AUTHKEY_WIN_1 is not configured."
          }

          Write-Host "Starting Tailscale service..."

          Start-Service `
            -Name 'Tailscale' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          # Every GitHub runner is temporary.
          # Use a unique hostname per workflow run.
          $Hostname = "github-rdp-$env:GITHUB_RUN_ID"

          Write-Host "Tailscale hostname: $Hostname"
          Write-Host "Connecting to Tailscale..."

          & $Tailscale up `
            --auth-key="$env:TAILSCALE_AUTHKEY" `
            --hostname="$Hostname" `
            --accept-dns=true `
            --unattended=true

          $TailscaleUpExitCode = $LASTEXITCODE

          if ($TailscaleUpExitCode -ne 0) {
              throw "Tailscale connection failed. Exit code: $TailscaleUpExitCode"
          }

          $global:LASTEXITCODE = 0

          Write-Host "Tailscale connection established."

          # Wait for IPv4 address.
          $TailscaleIP = ''

          for ($i = 1; $i -le 15; $i++) {

              $TailscaleIP = (& $Tailscale ip -4 2>$null).Trim()

              if (-not [string]::IsNullOrWhiteSpace($TailscaleIP)) {
                  break
              }

              Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($TailscaleIP)) {
              throw "Tailscale did not provide an IPv4 address."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "             RDP SERVER IS READY" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Tailscale IP : $TailscaleIP" -ForegroundColor Yellow
          Write-Host "Hostname     : $Hostname" -ForegroundColor Yellow
          Write-Host "Username     : CynetAdmin" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "RDP command:" -ForegroundColor Cyan
          Write-Host "mstsc /v:$TailscaleIP" -ForegroundColor Magenta
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host "Tailscale status:"
          & $Tailscale status

          # Tailscale status can return a non-zero code in some
          # circumstances. Do not let it poison the PowerShell step.
          $global:LASTEXITCODE = 0


      # ============================================================
      # 9. Verify RDP
      # ============================================================
      - name: 9. Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Checking RDP configuration..."

          $RdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($RdpDenied -ne 0) {
              throw "RDP is disabled."
          }

          $TermService = Get-Service `
            -Name 'TermService'

          if ($TermService.Status -ne 'Running') {
              throw "TermService is not running."
          }

          Write-Host "RDP registry : OK"
          Write-Host "TermService  : RUNNING"

          Write-Host ""
          Write-Host "Remote Desktop firewall rules:"

          Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq 'True' |
            Select-Object DisplayName, Enabled, Profile |
            Format-Table -AutoSize


      # ============================================================
      # 10. Inspect Desktop Before RDP Session
      # ============================================================
      - name: 10. Inspect Desktop Before RDP Session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "DESKTOP STATE BEFORE RDP SESSION"
          Write-Host "==================================================" -ForegroundColor Cyan

          Write-Host ""
          Write-Host "Logged-on sessions:"
          Write-Host "--------------------------------------------------"

          quser 2>&1

          # quser is diagnostic only.
          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "All user Desktop files:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            'C:\Users\*\Desktop' `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"


      # ============================================================
      # 11. Keep RDP Server Alive
      #
      # 200 seconds = 3 minutes 20 seconds.
      # ============================================================
      - name: 11. Keep RDP Server Alive
        id: keep_alive
        shell: powershell
        run: |
          $TotalSeconds = 200
          $IntervalSeconds = 10

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       RDP SERVER IS NOW AVAILABLE" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Session duration: $TotalSeconds seconds"
          Write-Host ""

          for ($Elapsed = 0; $Elapsed -lt $TotalSeconds; $Elapsed += $IntervalSeconds) {

              $Remaining = $TotalSeconds - $Elapsed

              Write-Host "RDP server running - $Remaining seconds remaining..."

              Start-Sleep -Seconds $IntervalSeconds
          }

          Write-Host ""
          Write-Host "RDP session window completed successfully."


      # ============================================================
      # 12. Inspect Desktop After RDP Session
      #
      # This proves where files created through RDP actually exist.
      # ============================================================
      - name: 12. Inspect Desktop After RDP Session
        if: steps.keep_alive.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "DESKTOP STATE AFTER RDP SESSION"
          Write-Host "==================================================" -ForegroundColor Cyan

          Write-Host ""
          Write-Host "Logged-on sessions:"
          Write-Host "--------------------------------------------------"

          quser 2>&1
          $global:LASTEXITCODE = 0

          Write-Host ""
          Write-Host "All Windows profiles:"
          Write-Host "--------------------------------------------------"

          Get-CimInstance Win32_UserProfile |
            Where-Object {
              $_.LocalPath -like 'C:\Users\*'
            } |
            Select-Object SID, LocalPath, Loaded, Special |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "All user Desktop files:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            'C:\Users\*\Desktop' `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"

          Write-Host ""
          Write-Host "CynetAdmin Desktop:"
          Write-Host "--------------------------------------------------"

          $CynetUser = Get-LocalUser `
            -Name 'CynetAdmin' `
            -ErrorAction Stop

          $CynetSid = $CynetUser.SID.Value

          $CynetProfile = Get-CimInstance Win32_UserProfile |
            Where-Object {
              $_.SID -eq $CynetSid
            } |
            Select-Object -First 1

          if ($null -eq $CynetProfile) {
              throw "CynetAdmin Windows profile does not exist."
          }

          $CynetDesktop = Join-Path $CynetProfile.LocalPath 'Desktop'

          Write-Host "Profile : $($CynetProfile.LocalPath)"
          Write-Host "Desktop : $CynetDesktop"
          Write-Host ""

          if (-not (Test-Path -LiteralPath $CynetDesktop)) {
              throw "CynetAdmin Desktop does not exist."
          }

          Get-ChildItem `
            -LiteralPath $CynetDesktop `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"


      # ============================================================
      # 13. Save CynetAdmin Desktop
      #
      # IMPORTANT:
      #
      # Robocopy exit code 1 means SUCCESS.
      #
      # We explicitly reset LASTEXITCODE after successful Robocopy
      # so GitHub Actions does not report:
      #
      #   Process completed with exit code 1
      #
      # Also:
      #
      # If the Desktop is unexpectedly empty, do NOT overwrite the
      # previous persistent backup.
      # ============================================================
      - name: 13. Save CynetAdmin Desktop
        id: save_desktop
        if: steps.keep_alive.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          $User = Get-LocalUser `
            -Name $Username `
            -ErrorAction Stop

          $Sid = $User.SID.Value

          $Profile = Get-CimInstance Win32_UserProfile |
            Where-Object {
              $_.SID -eq $Sid
            } |
            Select-Object -First 1

          if ($null -eq $Profile) {
              throw "CynetAdmin Windows profile does not exist after RDP session."
          }

          $UserProfile = $Profile.LocalPath
          $Desktop = Join-Path $UserProfile 'Desktop'

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "SAVING CynetAdmin DESKTOP"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "Profile : $UserProfile"
          Write-Host "Source  : $Desktop"
          Write-Host "Target  : $DesktopBackup"
          Write-Host ""

          if (-not (Test-Path -LiteralPath $Desktop)) {
              throw "CynetAdmin Desktop does not exist."
          }

          if (-not (Test-Path -LiteralPath $DesktopBackup)) {
              New-Item `
                -ItemType Directory `
                -Path $DesktopBackup `
                -Force | Out-Null
          }

          $Files = Get-ChildItem `
            -LiteralPath $Desktop `
            -Force `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          Write-Host "Current CynetAdmin Desktop file count: $($Files.Count)"

          if ($Files.Count -eq 0) {

              Write-Host ""
              Write-Host "WARNING: CynetAdmin Desktop is EMPTY." -ForegroundColor Yellow
              Write-Host ""
              Write-Host "The existing persistent backup will NOT be overwritten."
              Write-Host "This protects the previous cache from an incorrect RDP session."
              Write-Host ""

              $ExistingBackupFiles = Get-ChildItem `
                -LiteralPath $DesktopBackup `
                -Force `
                -Recurse `
                -File `
                -ErrorAction SilentlyContinue

              Write-Host "Existing backup file count: $($ExistingBackupFiles.Count)"

              # The step itself is successful.
              # We simply tell the next step that no update occurred.
              "PERSISTENCE_UPDATED=false" >> $env:GITHUB_OUTPUT

              # Make absolutely sure no previous native exit code
              # can escape the PowerShell step.
              $global:LASTEXITCODE = 0

          }
          else {

              Write-Host ""
              Write-Host "Synchronizing Desktop..."

              robocopy `
                $Desktop `
                $DesktopBackup `
                /MIR `
                /COPY:DAT `
                /DCOPY:DAT `
                /R:2 `
                /W:1 `
                /XJ

              $RobocopyExitCode = $LASTEXITCODE

              Write-Host ""
              Write-Host "Robocopy save exit code: $RobocopyExitCode"

              # 0-7 are successful/non-fatal Robocopy results.
              # 8+ means failure.
              if ($RobocopyExitCode -gt 7) {
                  throw "Desktop backup failed. Robocopy exit code: $RobocopyExitCode"
              }

              # CRITICAL:
              # Robocopy code 1 means files were copied successfully.
              # Reset it before PowerShell exits.
              $global:LASTEXITCODE = 0

              Write-Host ""
              Write-Host "Desktop saved successfully."

              "PERSISTENCE_UPDATED=true" >> $env:GITHUB_OUTPUT
          }

          Write-Host ""
          Write-Host "FILES CURRENTLY STORED IN PERSISTENT BACKUP:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            -LiteralPath $DesktopBackup `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"

          # Explicitly finish with a clean native exit state.
          $global:LASTEXITCODE = 0


      # ============================================================
      # 14. Verify Persistent Backup
      #
      # We consider the backup valid when it contains at least one
      # file.
      #
      # desktop.ini counts as a file, so a newly-created Windows
      # Desktop will normally be considered valid.
      # ============================================================
      - name: 14. Verify Persistent Backup
        id: verify_backup
        if: steps.keep_alive.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "PERSISTENCE VERIFICATION"
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          if (-not (Test-Path -LiteralPath $DesktopBackup)) {
              throw "Desktop backup directory does not exist."
          }

          $Files = Get-ChildItem `
            -LiteralPath $DesktopBackup `
            -Force `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          Write-Host "Persisted file count: $($Files.Count)"
          Write-Host ""

          if ($Files.Count -eq 0) {

              Write-Host "WARNING: Persistent Desktop backup contains zero files." -ForegroundColor Yellow
              Write-Host "No new cache will be created from this run."

              "BACKUP_VALID=false" >> $env:GITHUB_OUTPUT

          }
          else {

              Write-Host "Persisted files:"
              Write-Host "--------------------------------------------------"

              $Files |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize

              Write-Host "--------------------------------------------------"

              "BACKUP_VALID=true" >> $env:GITHUB_OUTPUT
          }

          $global:LASTEXITCODE = 0


      # ============================================================
      # 15. Save Persistent Workspace To GitHub Actions Cache
      #
      # Only save a valid backup.
      # ============================================================
      - name: 15. Save Workspace For Next Run
        if: |
          steps.keep_alive.outcome == 'success' &&
          steps.verify_backup.outputs.BACKUP_VALID == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}\workspace

          # Cache entries are immutable.
          key: cynet-rdp-workspace-${{ runner.os }}-${{ github.run_id }}


      # ============================================================
      # 16. Final Persistence Summary
      # ============================================================
      - name: 16. Final Persistence Summary
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "FINAL RDP WORKFLOW SUMMARY"
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host "Run ID              : $env:GITHUB_RUN_ID"
          Write-Host "Runner OS           : $env:RUNNER_OS"
          Write-Host "RDP User            : CynetAdmin"
          Write-Host ""
          Write-Host "RDP Session Result  : ${{ steps.keep_alive.outcome }}"
          Write-Host "Desktop Save Result : ${{ steps.save_desktop.outcome }}"
          Write-Host "Backup Verify       : ${{ steps.verify_backup.outcome }}"
          Write-Host ""

          Write-Host "==================================================" -ForegroundColor Green

          # Do not allow diagnostic commands to poison this step.
          $global:LASTEXITCODE = 0
