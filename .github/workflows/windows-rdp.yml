# ============================================================================
# Windows Cloud RDP — Persistent Disk Image via GitHub Release
#
# Persistence test workflow
#
# FIRST RUN:
#   1. GitHub Windows runner starts.
#   2. Configure RDP.
#   3. Configure Tailscale.
#   4. Create a timestamped test file on Desktop with random content.
#   5. Keep the Windows environment alive.
#   6. Capture the runner system disk using Disk2vhd.
#   7. Compress + encrypt the VHDX.
#   8. Split archive into <= 2,000,000,000 byte parts.
#   9. Upload parts + manifest to one fixed GitHub Release.
#
# NEXT RUN:
#   1. Detect persistent Release.
#   2. Download manifest.
#   3. Download all matching archive parts.
#   4. Reassemble archive.
#   5. Verify SHA256.
#   6. Extract VHDX.
#   7. Boot VHDX using QEMU.
#   8. Expose guest RDP through Tailscale.
#   9. The previous Desktop persistence-test file should exist
#      inside the restored Windows image.
#
# IMPORTANT:
#   A GitHub-hosted runner cannot be physically powered off and then continue
#   executing later workflow steps. Therefore Step 14 captures the live runner
#   using Disk2vhd/VSS. This is the correct test model for this workflow.
# ============================================================================

name: Windows Cloud RDP - Release Persistence

on:
  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

concurrency:
  group: windows-cloud-rdp
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  BACKUP_RELEASE_TAG: windows-rdp-persistent
  BACKUP_MANIFEST_NAME: windows-rdp-manifest.json

  # Must remain below GitHub's individual release asset limit.
  BACKUP_PART_BYTES: '2000000000'

  BACKUP_ROOT: C:\WindowsRdpPersistence

  # QEMU guest RDP is exposed through this host port.
  QEMU_RDP_PORT: '33989'

  # QEMU QMP control port.
  QEMU_QMP_PORT: '4444'

  # Current test duration.
  SESSION_MINUTES: '350'

  TAILSCALE_HOSTNAME: github-rdp-host


jobs:

  # ==========================================================================
  # MAIN WINDOWS RDP JOB
  # ==========================================================================

  rdp-server:

    runs-on: windows-latest

    timeout-minutes: 360

    steps:

      # ======================================================================
      # 1. Checkout Repository
      # ======================================================================

      - name: 1. Checkout Repository
        uses: actions/checkout@v5


      # ======================================================================
      # 2. Prepare Persistence Workspace
      # ======================================================================

      - name: 2. Prepare Persistence Workspace
        shell: powershell
        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'PREPARING PERSISTENCE WORKSPACE' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          New-Item `
            -ItemType Directory `
            -Path $env:BACKUP_ROOT `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$env:BACKUP_ROOT\download" `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$env:BACKUP_ROOT\parts" `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$env:BACKUP_ROOT\image" `
            -Force |
            Out-Null

          Write-Host "Persistence root: $env:BACKUP_ROOT"

          Write-Host ''
          Write-Host 'Current C: disk space:'

          Get-PSDrive -Name C |
            Select-Object Name, Used, Free |
            Format-Table -AutoSize


      # ======================================================================
      # 3. Detect Existing Persistent Backup
      #
      # IMPORTANT:
      # gh.exe writes "release not found" to stderr and PowerShell can treat
      # that stderr output as a NativeCommandError.
      #
      # Therefore gh is executed through cmd.exe and stderr is redirected.
      # A missing release is treated as NORMAL FIRST RUN.
      # ======================================================================

      - name: 3. Detect Persistent Backup
        id: detect_backup
        shell: powershell

        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $ErrorActionPreference = 'Stop'

          $manifestPath = Join-Path `
            $env:BACKUP_ROOT `
            "download\$env:BACKUP_MANIFEST_NAME"

          $releaseJsonPath = Join-Path `
            $env:BACKUP_ROOT `
            'release.json'

          $releaseErrorPath = Join-Path `
            $env:BACKUP_ROOT `
            'release-error.txt'

          $hasBackup = $false

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'CHECKING PERSISTENT BACKUP' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host "Release tag: $env:BACKUP_RELEASE_TAG"

          # --------------------------------------------------------------
          # Execute gh through CMD.
          #
          # This prevents PowerShell from converting gh stderr into a
          # terminating NativeCommandError.
          # --------------------------------------------------------------

          $command = 'gh release view "{0}" --json isDraft,isPrerelease,assets > "{1}" 2> "{2}"' -f `
            $env:BACKUP_RELEASE_TAG,
            $releaseJsonPath,
            $releaseErrorPath

          cmd.exe /c $command

          $releaseExitCode = $LASTEXITCODE

          Write-Host "gh exit code: $releaseExitCode"

          # --------------------------------------------------------------
          # Release exists
          # --------------------------------------------------------------

          if ($releaseExitCode -eq 0) {

              Write-Host 'Persistent release found.'

              if (-not (Test-Path -LiteralPath $releaseJsonPath)) {
                  throw 'GitHub release command succeeded but release.json was not created.'
              }

              try {

                  $release = Get-Content `
                    -LiteralPath $releaseJsonPath `
                    -Raw |
                    ConvertFrom-Json

              }
              catch {

                  throw "GitHub release information could not be parsed: $($_.Exception.Message)"
              }

              $manifestAsset = $release.assets |
                  Where-Object {
                      $_.name -eq $env:BACKUP_MANIFEST_NAME
                  } |
                  Select-Object -First 1

              if ($null -ne $manifestAsset) {

                  $hasBackup = $true

                  Write-Host ''
                  Write-Host 'Persistent backup manifest found.' -ForegroundColor Green

              }
              else {

                  Write-Host ''
                  Write-Host 'Release exists, but backup manifest is missing.' -ForegroundColor Yellow
                  Write-Host 'Treating this as FIRST RUN.' -ForegroundColor Yellow
              }
          }

          # --------------------------------------------------------------
          # Release does not exist.
          #
          # This is EXPECTED on the first run.
          # --------------------------------------------------------------

          else {

              Write-Host ''
              Write-Host 'No persistent release exists.' -ForegroundColor Yellow
              Write-Host 'This is the FIRST RUN.' -ForegroundColor Yellow
              Write-Host 'A new Windows persistence image will be created.' -ForegroundColor Yellow

              if (Test-Path -LiteralPath $releaseErrorPath) {

                  $errorText = Get-Content `
                    -LiteralPath $releaseErrorPath `
                    -Raw `
                    -ErrorAction SilentlyContinue

                  if (-not [string]::IsNullOrWhiteSpace($errorText)) {
                      Write-Host "gh message: $($errorText.Trim())" -ForegroundColor DarkYellow
                  }
              }
          }

          # --------------------------------------------------------------
          # Export result to GitHub Actions.
          # --------------------------------------------------------------

          "HAS_BACKUP=$($hasBackup.ToString().ToLowerInvariant())" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          Write-Host ''
          Write-Host "Existing persistent backup: $hasBackup" -ForegroundColor Green

          # CRITICAL:
          # Always finish this step successfully.
          $global:LASTEXITCODE = 0


      # ======================================================================
      # 4. Download and Reassemble Previous Image
      # ======================================================================

      - name: 4. Download and Reassemble Previous Image
        if: steps.detect_backup.outputs.HAS_BACKUP == 'true'
        shell: powershell

        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}

        run: |

          $ErrorActionPreference = 'Stop'

          $manifestPath = `
            "$env:BACKUP_ROOT\download\$env:BACKUP_MANIFEST_NAME"

          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          $generation = [string]$manifest.generation

          $partCount = [int]$manifest.part_count

          $prefix = "windows-rdp-$generation-part-"

          $downloadDir = "$env:BACKUP_ROOT\download"

          $archivePath = `
            "$env:BACKUP_ROOT\image\windows-rdp.vhdx.7z"

          $imagePath = `
            "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'RESTORING PREVIOUS BACKUP' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host "Generation : $generation"
          Write-Host "Part count : $partCount"
          Write-Host "SHA256     : $($manifest.sha256)"

          # Remove old downloaded parts.

          Get-ChildItem `
            -LiteralPath $downloadDir `
            -Filter "$prefix*" `
            -ErrorAction SilentlyContinue |
            Remove-Item `
              -Force `
              -ErrorAction SilentlyContinue

          # Download all parts.

          gh release download `
            $env:BACKUP_RELEASE_TAG `
            --pattern "$prefix*" `
            --dir "$downloadDir" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to download backup archive parts.'
          }

          # Get parts in numerical order.

          $parts = Get-ChildItem `
            -LiteralPath $downloadDir `
            -Filter "$prefix*" |
            Sort-Object {
                [int](
                    (
                        $_.Name `
                        -replace '^.*-part-(\d+)$','$1'
                    )
                )
            }

          if ($parts.Count -ne $partCount) {
              throw "Expected $partCount backup parts, but downloaded $($parts.Count)."
          }

          Write-Host "Downloaded parts: $($parts.Count)"

          # Reassemble.

          Write-Host 'Reassembling encrypted archive...'

          $out = [System.IO.File]::Open(
              $archivePath,
              [System.IO.FileMode]::Create,
              [System.IO.FileAccess]::Write
          )

          try {

              foreach ($part in $parts) {

                  Write-Host "Appending $($part.Name) - $($part.Length) bytes"

                  $in = [System.IO.File]::OpenRead(
                      $part.FullName
                  )

                  try {
                      $in.CopyTo($out)
                  }
                  finally {
                      $in.Dispose()
                  }
              }
          }
          finally {
              $out.Dispose()
          }

          # Verify archive SHA256.

          $sha = (
              Get-FileHash `
                -Algorithm SHA256 `
                -LiteralPath $archivePath
          ).Hash.ToLowerInvariant()

          if ($sha -ne [string]$manifest.sha256) {
              throw "Archive SHA256 mismatch. Expected $($manifest.sha256), got $sha."
          }

          Write-Host 'Archive SHA256 verified.' -ForegroundColor Green

          # Install 7-Zip.

          choco install 7zip -y --no-progress

          $sevenZip = Join-Path `
            $env:ProgramFiles `
            '7-Zip\7z.exe'

          if (-not (Test-Path -LiteralPath $sevenZip)) {
              throw '7-Zip executable was not found.'
          }

          if ([string]::IsNullOrWhiteSpace(
              $env:BACKUP_ENCRYPTION_PASSWORD
          )) {
              throw 'Secret BACKUP_ENCRYPTION_PASSWORD is required.'
          }

          # Extract VHDX.

          Write-Host 'Extracting encrypted VHDX...'

          & $sevenZip `
            x `
            $archivePath `
            "-o$($env:BACKUP_ROOT)\image" `
            "-p$($env:BACKUP_ENCRYPTION_PASSWORD)" `
            -y

          if ($LASTEXITCODE -ne 0) {
              throw '7-Zip extraction failed.'
          }

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw "Restored VHDX was not found: $imagePath"
          }

          Write-Host "Restored VHDX: $imagePath"
          Write-Host "Size: $((Get-Item $imagePath).Length) bytes"


      # ======================================================================
      # 5. Install QEMU
      #
      # FIRST RUN:
      #   Skipped.
      #
      # RESTORE RUN:
      #   Runs and boots the persisted VHDX.
      # ======================================================================

      - name: 5. Install QEMU
        if: steps.detect_backup.outputs.HAS_BACKUP == 'true'
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'INSTALLING QEMU' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          choco install qemu -y --no-progress

          $qemu = Get-Command `
            qemu-system-x86_64.exe `
            -ErrorAction Stop

          Write-Host "QEMU: $($qemu.Source)"

          $ovmf = Get-ChildItem `
            -Path 'C:\Program Files','C:\ProgramData\chocolatey\lib' `
            -Filter 'OVMF_CODE*.fd' `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $ovmf) {
              throw 'OVMF_CODE firmware was not found after installing QEMU.'
          }

          "QEMU_PATH=$($qemu.Source)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "OVMF_CODE=$($ovmf.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "OVMF: $($ovmf.FullName)"


      # ======================================================================
      # 6. Boot Restored Windows Image
      # ======================================================================

      - name: 6. Boot Restored Windows Image in QEMU
        id: boot_vm
        if: steps.detect_backup.outputs.HAS_BACKUP == 'true'
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $imagePath = `
            "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          $logPath = `
            "$env:BACKUP_ROOT\qemu.log"

          $errorLogPath = `
            "$env:BACKUP_ROOT\qemu-error.log"

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw "VHDX not found: $imagePath"
          }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'STARTING RESTORED WINDOWS GUEST' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          $args = @(
              '-display','none',
              '-machine','q35',
              '-accel','tcg,thread=multi',
              '-m','4096',
              '-smp','2',
              '-bios',"$env:OVMF_CODE",
              '-drive',"file=$imagePath,format=vhdx,if=ide,cache=writeback",
              '-netdev',"user,id=n1,hostfwd=tcp:0.0.0.0:$env:QEMU_RDP_PORT-:3389",
              '-device','e1000,netdev=n1',
              '-qmp',"tcp:127.0.0.1:$env:QEMU_QMP_PORT,server=on,wait=off",
              '-nodefaults',
              '-serial','none',
              '-monitor','none',
              '-no-reboot'
          )

          $process = Start-Process `
            -FilePath $env:QEMU_PATH `
            -ArgumentList $args `
            -RedirectStandardOutput $logPath `
            -RedirectStandardError $errorLogPath `
            -PassThru

          "QEMU_PID=$($process.Id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "QEMU PID: $($process.Id)"

          Write-Host "Waiting for guest RDP port $env:QEMU_RDP_PORT..."

          $ready = $false

          for ($i = 1; $i -le 180; $i++) {

              Start-Sleep -Seconds 2

              if ($process.HasExited) {

                  Write-Host ''
                  Write-Host 'QEMU exited during boot.' -ForegroundColor Red
                  Write-Host "Exit code: $($process.ExitCode)"

                  Get-Content `
                    $logPath `
                    -Tail 100 `
                    -ErrorAction SilentlyContinue

                  Get-Content `
                    $errorLogPath `
                    -Tail 100 `
                    -ErrorAction SilentlyContinue

                  throw 'QEMU exited before guest RDP became available.'
              }

              $check = Test-NetConnection `
                -ComputerName 127.0.0.1 `
                -Port ([int]$env:QEMU_RDP_PORT) `
                -WarningAction SilentlyContinue

              if ($check.TcpTestSucceeded) {

                  $ready = $true
                  break
              }

              if (($i % 10) -eq 0) {

                  Write-Host `
                    "Still waiting for guest RDP... elapsed $($i * 2)s"
              }
          }

          if (-not $ready) {

              Get-Content `
                $logPath `
                -Tail 100 `
                -ErrorAction SilentlyContinue

              Get-Content `
                $errorLogPath `
                -Tail 100 `
                -ErrorAction SilentlyContinue

              throw 'Guest RDP port did not become available.'
          }

          Write-Host ''
          Write-Host 'Restored Windows guest is ONLINE.' -ForegroundColor Green


      # ======================================================================
      # 7. Enable Remote Desktop on First Run
      # ======================================================================

      - name: 7. Enable Remote Desktop on First Run
        if: steps.detect_backup.outputs.HAS_BACKUP != 'true'
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'CONFIGURING FIRST-RUN WINDOWS RDP' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          $service = Get-Service `
            -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw 'TermService is not running.'
          }

          Write-Host 'Remote Desktop enabled.' -ForegroundColor Green


      # ======================================================================
      # 8. Create / Configure CynetAdmin
      # ======================================================================

      - name: 8. Create CynetAdmin on First Run
        if: steps.detect_backup.outputs.HAS_BACKUP != 'true'
        shell: powershell

        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}

        run: |

          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace(
              $env:RDP_PASSWORD
          )) {
              throw 'GitHub Secret RDP_PASSWORD is not configured.'
          }

          $username = 'CynetAdmin'

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description 'GitHub Actions RDP Administrator' |
                Out-Null
          }
          else {

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Enable-LocalUser `
                -Name $username
          }

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "Configured local user: $username" -ForegroundColor Green


      # ======================================================================
      # 9. Install and Connect Tailscale
      #
      # Runs on BOTH first-run host and restored host.
      # ======================================================================

      - name: 9. Install and Connect Tailscale
        shell: powershell

        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY_WIN_1 }}

        run: |

          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace(
              $env:TAILSCALE_AUTHKEY
          )) {
              throw 'GitHub Secret TAILSCALE_AUTHKEY_WIN_1 is not configured.'
          }

          $installer = 'C:\tailscale.msi'

          $tailscale = `
            'C:\Program Files\Tailscale\tailscale.exe'

          if (-not (Test-Path -LiteralPath $tailscale)) {

              Write-Host 'Downloading Tailscale...'

              Invoke-WebRequest `
                -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
                -OutFile $installer

              Write-Host 'Installing Tailscale...'

              $p = Start-Process `
                -FilePath 'msiexec.exe' `
                -ArgumentList `
                  '/i',
                  $installer,
                  '/quiet',
                  '/norestart' `
                -Wait `
                -PassThru

              if ($p.ExitCode -ne 0) {
                  throw "Tailscale install failed: $($p.ExitCode)"
              }
          }

          Start-Service `
            -Name 'Tailscale' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host 'Connecting Tailscale...'

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTHKEY" `
            --hostname="$env:TAILSCALE_HOSTNAME-$env:GITHUB_RUN_ID" `
            --accept-dns=true `
            --unattended=true

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed: $LASTEXITCODE"
          }

          $ip = ''

          for ($i = 1; $i -le 20; $i++) {

              $ip = (
                  & $tailscale ip -4 2>$null
              ).Trim()

              if (-not [string]::IsNullOrWhiteSpace($ip)) {
                  break
              }

              Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {
              throw 'Could not determine Tailscale IPv4 address.'
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ''
          Write-Host "Tailscale IP: $ip" -ForegroundColor Green


      # ======================================================================
      # 10. Create Windows Persistence Test File
      #
      # FIRST RUN ONLY
      #
      # This intentionally avoids PowerShell here-string syntax to prevent
      # the parser error encountered previously.
      # ======================================================================

      - name: 10. Create Windows Persistence Test File
        if: steps.detect_backup.outputs.HAS_BACKUP != 'true'
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'CREATING WINDOWS PERSISTENCE TEST FILE' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          # --------------------------------------------------------------
          # Get current user's Desktop.
          # --------------------------------------------------------------

          $desktop = [Environment]::GetFolderPath('Desktop')

          if ([string]::IsNullOrWhiteSpace($desktop)) {
              throw 'Could not determine Windows Desktop path.'
          }

          if (-not (Test-Path -LiteralPath $desktop)) {

              New-Item `
                -ItemType Directory `
                -Path $desktop `
                -Force |
                Out-Null
          }

          # --------------------------------------------------------------
          # Current date/time.
          # --------------------------------------------------------------

          $now = Get-Date

          # --------------------------------------------------------------
          # Windows filename-safe timestamp.
          #
          # Example:
          #
          # WindowsPersistence_2026-08-20_10-35-42.txt
          # --------------------------------------------------------------

          $timestamp = `
            $now.ToString('yyyy-MM-dd_HH-mm-ss')

          # --------------------------------------------------------------
          # Random value.
          # --------------------------------------------------------------

          $randomText = `
            [Guid]::NewGuid().ToString()

          # --------------------------------------------------------------
          # Filename.
          # --------------------------------------------------------------

          $fileName = `
            "WindowsPersistence_$timestamp.txt"

          $filePath = `
            Join-Path $desktop $fileName

          # --------------------------------------------------------------
          # File content.
          #
          # IMPORTANT:
          # No here-string is used here.
          # --------------------------------------------------------------

          $lines = @(
              'WINDOWS PERSISTENCE TEST'
              ''
              "Created at: $($now.ToString('yyyy-MM-dd HH:mm:ss'))"
              "Random text: $randomText"
              "Computer: $env:COMPUTERNAME"
              "User: $env:USERNAME"
              "GitHub Run ID: $env:GITHUB_RUN_ID"
              "Runner OS: $env:RUNNER_OS"
              ''
              'This file was created during the FIRST RUN.'
              'It should survive inside the captured VHDX.'
              'The next workflow run will restore the VHDX.'
              'After restoration this file should still exist.'
          )

          $content = $lines -join [Environment]::NewLine

          # --------------------------------------------------------------
          # Write file.
          # --------------------------------------------------------------

          Set-Content `
            -LiteralPath $filePath `
            -Value $content `
            -Encoding UTF8

          # --------------------------------------------------------------
          # Verify file.
          # --------------------------------------------------------------

          if (-not (Test-Path -LiteralPath $filePath)) {
              throw "Persistence test file was not created: $filePath"
          }

          $fileInfo = `
            Get-Item -LiteralPath $filePath

          Write-Host ''
          Write-Host 'TEST FILE CREATED SUCCESSFULLY' -ForegroundColor Green
          Write-Host ''
          Write-Host "Desktop : $desktop"
          Write-Host "File    : $($fileInfo.FullName)"
          Write-Host "Size    : $($fileInfo.Length) bytes"
          Write-Host ''

          Write-Host 'File content:' -ForegroundColor Yellow
          Write-Host '--------------------------------------------------'

          Get-Content `
            -LiteralPath $filePath

          Write-Host '--------------------------------------------------'
          Write-Host ''

          Write-Host 'Persistence test file is ready.' -ForegroundColor Green


      # ======================================================================
      # 11. Verify RDP
      #
      # First run: verify host RDP.
      # Restore run: QEMU guest RDP was already verified in Step 6.
      # ======================================================================

      - name: 11. Verify RDP Availability
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $backupExists = `
            '${{ steps.detect_backup.outputs.HAS_BACKUP }}'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'VERIFYING RDP' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          if ($backupExists -eq 'true') {

              Write-Host 'Restored guest RDP was verified in Step 6.'

              $portCheck = Test-NetConnection `
                -ComputerName 127.0.0.1 `
                -Port ([int]$env:QEMU_RDP_PORT) `
                -WarningAction SilentlyContinue

              if (-not $portCheck.TcpTestSucceeded) {
                  throw 'Restored guest RDP port is no longer available.'
              }

              Write-Host `
                "Guest RDP port $env:QEMU_RDP_PORT is available." `
                -ForegroundColor Green
          }

          else {

              $rdpDenied = Get-ItemPropertyValue `
                -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                -Name 'fDenyTSConnections'

              if ($rdpDenied -ne 0) {
                  throw 'RDP is disabled.'
              }

              if (
                  (Get-Service -Name TermService).Status `
                  -ne 'Running'
              ) {
                  throw 'TermService is not running.'
              }

              Write-Host `
                "First-run host RDP is ready at $env:TAILSCALE_IP`:3389" `
                -ForegroundColor Green
          }


      # ======================================================================
      # 12. Display Connection Information
      # ======================================================================

      - name: 12. Display RDP Connection Information
        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'

          $tailscale = `
            'C:\Program Files\Tailscale\tailscale.exe'

          $backupExists = `
            '${{ steps.detect_backup.outputs.HAS_BACKUP }}'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'RDP SERVER IS READY' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green

          if ($backupExists -eq 'true') {

              if (-not (Test-Path -LiteralPath $tailscale)) {

                  Write-Host `
                    'Tailscale executable is not present.' `
                    -ForegroundColor Yellow
              }

              else {

                  Start-Service `
                    -Name Tailscale `
                    -ErrorAction SilentlyContinue

                  $hostIp = (
                      & $tailscale ip -4 2>$null
                  ).Trim()

                  if (-not [string]::IsNullOrWhiteSpace($hostIp)) {

                      "TAILSCALE_IP=$hostIp" |
                        Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                      Write-Host `
                        "Tailscale IP : $hostIp" `
                        -ForegroundColor Yellow

                      Write-Host `
                        "RDP endpoint : $hostIp`:$env:QEMU_RDP_PORT" `
                        -ForegroundColor Yellow

                      Write-Host `
                        "RDP command  : mstsc /v:$hostIp`:$env:QEMU_RDP_PORT" `
                        -ForegroundColor Magenta
                  }

                  else {

                      Write-Host `
                        'Tailscale host IP not available.' `
                        -ForegroundColor Yellow
                  }
              }
          }

          else {

              Write-Host `
                "Tailscale IP : $env:TAILSCALE_IP" `
                -ForegroundColor Yellow

              Write-Host `
                "RDP endpoint : $env:TAILSCALE_IP`:3389" `
                -ForegroundColor Yellow

              Write-Host `
                "RDP command  : mstsc /v:$env:TAILSCALE_IP" `
                -ForegroundColor Magenta
          }

          Write-Host ''


      # ======================================================================
      # 13. Keep Session Alive
      #
      # During this period the user can connect using RDP.
      # ======================================================================

      - name: 13. Keep RDP Session Alive
        id: keep_alive
        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'

          $totalMinutes = `
            [int]$env:SESSION_MINUTES

          $intervalSeconds = 60

          $totalSeconds = `
            $totalMinutes * 60

          $elapsed = 0

          $nextNotification = 300

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'RDP SESSION STARTED' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host `
            "Session runtime: $totalMinutes minutes"

          while ($elapsed -lt $totalSeconds) {

              Start-Sleep `
                -Seconds $intervalSeconds

              $elapsed += $intervalSeconds

              if ($elapsed -ge $nextNotification) {

                  $remaining = [math]::Ceiling(
                      ($totalSeconds - $elapsed) / 60
                  )

                  Write-Host `
                    "[$(Get-Date)] RDP running. Elapsed: $([math]::Floor($elapsed / 60))m; Remaining: $remaining m"

                  $nextNotification += 300
              }
          }

          Write-Host ''
          Write-Host 'RDP session window completed.' -ForegroundColor Green

          $global:LASTEXITCODE = 0


      # ======================================================================
      # 14. Capture First-Run System Disk With Disk2vhd
      #
      # FIRST RUN ONLY.
      #
      # This is the actual persistence test.
      #
      # We do NOT call shutdown.exe here because that would terminate the
      # GitHub Actions runner before the remaining backup steps execute.
      #
      # Disk2vhd captures the live Windows volumes using VSS.
      # ======================================================================

      - name: 14. Capture First-Run System Disk With Disk2vhd
        id: capture_image

        if: steps.detect_backup.outputs.HAS_BACKUP != 'true' && steps.keep_alive.outcome == 'success'

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'STEP 14 - CAPTURE WINDOWS SYSTEM DISK' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host ''
          Write-Host 'Windows session has completed.'
          Write-Host 'Backup phase is starting now.'
          Write-Host ''
          Write-Host 'IMPORTANT: The runner itself cannot be physically shut down'
          Write-Host 'before this step because that would terminate the workflow.'
          Write-Host 'Disk2vhd/VSS will capture the live Windows system instead.'
          Write-Host ''

          # --------------------------------------------------------------
          # Paths.
          # --------------------------------------------------------------

          $disk2vhdZip = `
            "$env:BACKUP_ROOT\disk2vhd.zip"

          $disk2vhdDir = `
            "$env:BACKUP_ROOT\disk2vhd"

          $imagePath = `
            "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          # --------------------------------------------------------------
          # Show Desktop test file before capture.
          # --------------------------------------------------------------

          $desktop = `
            [Environment]::GetFolderPath('Desktop')

          Write-Host 'Checking persistence test file before VHDX capture...'

          if (Test-Path -LiteralPath $desktop) {

              $testFiles = Get-ChildItem `
                -LiteralPath $desktop `
                -Filter 'WindowsPersistence_*.txt' `
                -File `
                -ErrorAction SilentlyContinue

              if ($testFiles.Count -gt 0) {

                  foreach ($file in $testFiles) {

                      Write-Host ''
                      Write-Host "TEST FILE: $($file.FullName)" -ForegroundColor Green

                      Get-Content `
                        -LiteralPath $file.FullName
                  }
              }
              else {

                  Write-Host `
                    'WARNING: No persistence test file found on Desktop.' `
                    -ForegroundColor Yellow
              }
          }

          # --------------------------------------------------------------
          # Download Disk2vhd.
          # --------------------------------------------------------------

          Write-Host ''
          Write-Host 'Downloading Microsoft Sysinternals Disk2vhd...'

          Invoke-WebRequest `
            -Uri 'https://download.sysinternals.com/files/Disk2vhd.zip' `
            -OutFile $disk2vhdZip

          if (-not (Test-Path -LiteralPath $disk2vhdZip)) {
              throw 'Disk2vhd ZIP was not downloaded.'
          }

          # --------------------------------------------------------------
          # Extract.
          # --------------------------------------------------------------

          if (Test-Path -LiteralPath $disk2vhdDir) {

              Remove-Item `
                -LiteralPath $disk2vhdDir `
                -Recurse `
                -Force
          }

          Expand-Archive `
            -Path $disk2vhdZip `
            -DestinationPath $disk2vhdDir `
            -Force

          $disk2vhd = Get-ChildItem `
            -LiteralPath $disk2vhdDir `
            -Filter 'disk2vhd64.exe' `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $disk2vhd) {
              throw 'disk2vhd64.exe was not found.'
          }

          Write-Host `
            "Disk2vhd: $($disk2vhd.FullName)"

          # --------------------------------------------------------------
          # Check disk space.
          # --------------------------------------------------------------

          Write-Host ''
          Write-Host 'Checking free disk space before capture...'

          $disk = Get-PSDrive `
            -Name C

          $free = `
            [int64]$disk.Free

          Write-Host `
            "Free C: space = $free bytes"

          if ($free -lt 5000000000) {

              throw `
                'Less than 5 GB free space is available. Full-system VHDX capture cannot safely proceed.'
          }

          # --------------------------------------------------------------
          # Remove previous image.
          # --------------------------------------------------------------

          if (Test-Path -LiteralPath $imagePath) {

              Remove-Item `
                -LiteralPath $imagePath `
                -Force
          }

          # --------------------------------------------------------------
          # Capture ALL volumes.
          #
          # '*' tells Disk2vhd to capture all volumes.
          # --------------------------------------------------------------

          Write-Host ''
          Write-Host 'Creating full-system VHDX...'
          Write-Host 'This can take several minutes.'

          & $disk2vhd.FullName `
            '*' `
            $imagePath

          $disk2vhdExitCode = $LASTEXITCODE

          Write-Host `
            "Disk2vhd exit code: $disk2vhdExitCode"

          if ($disk2vhdExitCode -ne 0) {
              throw "Disk2vhd failed with exit code $disk2vhdExitCode"
          }

          # --------------------------------------------------------------
          # Verify image.
          # --------------------------------------------------------------

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw 'Disk2vhd did not create the VHDX.'
          }

          $imageBytes = `
            (Get-Item -LiteralPath $imagePath).Length

          Write-Host ''
          Write-Host 'VHDX CAPTURE COMPLETED' -ForegroundColor Green
          Write-Host ''
          Write-Host "Image path : $imagePath"
          Write-Host "Image size : $imageBytes bytes"

          if ($imageBytes -le 0) {
              throw 'VHDX file exists but is empty.'
          }


      # ======================================================================
      # 15. Verify Restored VHDX
      #
      # RESTORE RUN ONLY.
      # ======================================================================

      - name: 15. Verify Restored VHDX
        if: steps.detect_backup.outputs.HAS_BACKUP == 'true' && steps.keep_alive.outcome == 'success'
        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $imagePath = `
            "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw 'Restored VHDX is missing.'
          }

          $size = `
            (Get-Item -LiteralPath $imagePath).Length

          Write-Host ''
          Write-Host 'RESTORED VHDX VERIFIED' -ForegroundColor Green
          Write-Host "Size: $size bytes"


      # ======================================================================
      # 16. Encrypt and Compress Image
      # ======================================================================

      - name: 16. Encrypt and Compress Image

        id: pack_image

        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')

        shell: powershell

        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}

        run: |

          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace(
              $env:BACKUP_ENCRYPTION_PASSWORD
          )) {
              throw 'Secret BACKUP_ENCRYPTION_PASSWORD is required.'
          }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'ENCRYPTING AND COMPRESSING VHDX' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          choco install 7zip -y --no-progress

          $sevenZip = `
            Join-Path $env:ProgramFiles '7-Zip\7z.exe'

          if (-not (Test-Path -LiteralPath $sevenZip)) {
              throw '7-Zip executable was not found.'
          }

          $imagePath = `
            "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          $archivePath = `
            "$env:BACKUP_ROOT\windows-rdp.vhdx.7z"

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw "Image not found: $imagePath"
          }

          if (Test-Path -LiteralPath $archivePath) {

              Remove-Item `
                -LiteralPath $archivePath `
                -Force
          }

          Write-Host 'Creating encrypted 7-Zip archive...'

          & $sevenZip `
            a `
            -t7z `
            -mx=1 `
            -mhe=on `
            "-p$($env:BACKUP_ENCRYPTION_PASSWORD)" `
            $archivePath `
            $imagePath

          if ($LASTEXITCODE -ne 0) {
              throw "7-Zip archive creation failed: $LASTEXITCODE"
          }

          $sha = (
              Get-FileHash `
                -Algorithm SHA256 `
                -LiteralPath $archivePath
          ).Hash.ToLowerInvariant()

          $bytes = `
            (Get-Item -LiteralPath $archivePath).Length

          "ARCHIVE_SHA256=$sha" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "ARCHIVE_BYTES=$bytes" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ''
          Write-Host "Encrypted archive size : $bytes bytes"
          Write-Host "Encrypted archive SHA256 : $sha"


      # ======================================================================
      # 17. Split Archive Into <= 2 GB Parts
      # ======================================================================

      - name: 17. Split Archive Into 2 GB Parts

        id: split_archive

        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $archivePath = `
            "$env:BACKUP_ROOT\windows-rdp.vhdx.7z"

          $partBytes = `
            [int64]$env:BACKUP_PART_BYTES

          $generation = `
            "$env:GITHUB_RUN_ID"

          $partsDir = `
            "$env:BACKUP_ROOT\parts"

          $prefix = `
            "windows-rdp-$generation-part-"

          if (Test-Path -LiteralPath $partsDir) {

              Remove-Item `
                -LiteralPath $partsDir `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $partsDir `
            -Force |
            Out-Null

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'SPLITTING ARCHIVE' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          $input = `
            [System.IO.File]::OpenRead($archivePath)

          try {

              $buffer = `
                New-Object byte[] (4MB)

              $partIndex = 1

              while ($input.Position -lt $input.Length) {

                  $partPath = Join-Path `
                    $partsDir `
                    ("{0}{1:D5}" -f $prefix, $partIndex)

                  $output = `
                    [System.IO.File]::Open(
                        $partPath,
                        [System.IO.FileMode]::CreateNew,
                        [System.IO.FileAccess]::Write
                    )

                  try {

                      $remaining = $partBytes

                      while (
                          $remaining -gt 0 `
                          -and `
                          $input.Position -lt $input.Length
                      ) {

                          $want = `
                            [int][Math]::Min(
                                $buffer.Length,
                                $remaining
                            )

                          $read = `
                            $input.Read(
                                $buffer,
                                0,
                                $want
                            )

                          if ($read -le 0) {
                              break
                          }

                          $output.Write(
                              $buffer,
                              0,
                              $read
                          )

                          $remaining -= $read
                      }
                  }

                  finally {
                      $output.Dispose()
                  }

                  $size = `
                    (Get-Item -LiteralPath $partPath).Length

                  Write-Host `
                    "Created part $partIndex : $size bytes"

                  if ($size -gt $partBytes) {
                      throw "Part exceeds maximum size: $partPath"
                  }

                  $partIndex++
              }
          }

          finally {
              $input.Dispose()
          }

          $parts = Get-ChildItem `
            -LiteralPath $partsDir `
            -File |
            Sort-Object Name

          if ($parts.Count -lt 1) {
              throw 'No archive parts were created.'
          }

          "BACKUP_GENERATION=$generation" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "BACKUP_PREFIX=$prefix" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "BACKUP_PART_COUNT=$($parts.Count)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ''
          Write-Host "Total parts: $($parts.Count)" -ForegroundColor Green


      # ======================================================================
      # 18. Build Manifest
      # ======================================================================

      - name: 18. Build Backup Manifest

        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')

        shell: powershell

        run: |

          $ErrorActionPreference = 'Stop'

          $partsDir = `
            "$env:BACKUP_ROOT\parts"

          $parts = Get-ChildItem `
            -LiteralPath $partsDir `
            -File |
            Sort-Object Name

          $manifest = [ordered]@{

              schema_version = 1

              generation = `
                [string]$env:BACKUP_GENERATION

              archive_name = `
                'windows-rdp.vhdx.7z'

              archive_bytes = `
                [int64]$env:ARCHIVE_BYTES

              sha256 = `
                [string]$env:ARCHIVE_SHA256

              part_bytes_max = `
                [int64]$env:BACKUP_PART_BYTES

              part_count = `
                [int]$parts.Count

              created_utc = `
                (Get-Date).ToUniversalTime().ToString('o')

              image_name = `
                'windows-rdp.vhdx'

              notes = `
                'Full-system VHDX captured from the GitHub-hosted Windows runner and persisted as a QEMU guest image.'
          }

          $manifestPath = `
            "$env:BACKUP_ROOT\$env:BACKUP_MANIFEST_NAME"

          $manifest |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              -LiteralPath $manifestPath `
              -Encoding utf8

          Write-Host ''
          Write-Host 'BACKUP MANIFEST:' -ForegroundColor Cyan
          Write-Host '--------------------------------------------------'

          Get-Content `
            -LiteralPath $manifestPath

          Write-Host '--------------------------------------------------'


      # ======================================================================
      # 19. Create Fixed GitHub Release If Needed
      # ======================================================================

      - name: 19. Create Fixed GitHub Release

        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')

        shell: powershell

        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $ErrorActionPreference = 'Stop'

          # Check release without allowing "not found" to terminate step.

          cmd.exe /c `
            "gh release view `"$env:BACKUP_RELEASE_TAG`" > nul 2> nul"

          $releaseExitCode = $LASTEXITCODE

          if ($releaseExitCode -ne 0) {

              Write-Host 'Persistent release does not exist.'
              Write-Host 'Creating release...'

              gh release create `
                $env:BACKUP_RELEASE_TAG `
                --title 'Windows RDP Persistent Backup' `
                --notes 'Encrypted persistent Windows disk image for the Windows RDP workflow.'

              if ($LASTEXITCODE -ne 0) {
                  throw 'Failed to create GitHub Release.'
              }
          }

          else {

              Write-Host 'Persistent release already exists.'
          }


      # ======================================================================
      # 20. Upload New Backup Parts and Manifest
      # ======================================================================

      - name: 20. Upload New Backup Parts

        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')

        shell: powershell

        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $ErrorActionPreference = 'Stop'

          $partsDir = `
            "$env:BACKUP_ROOT\parts"

          $manifestPath = `
            "$env:BACKUP_ROOT\$env:BACKUP_MANIFEST_NAME"

          $parts = Get-ChildItem `
            -LiteralPath $partsDir `
            -File |
            Sort-Object Name

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'UPLOADING BACKUP PARTS' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host "Uploading $($parts.Count) parts..."

          foreach ($part in $parts) {

              Write-Host ''
              Write-Host "Uploading: $($part.Name)"
              Write-Host "Size: $($part.Length) bytes"

              gh release upload `
                $env:BACKUP_RELEASE_TAG `
                $part.FullName `
                --clobber

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to upload $($part.Name)"
              }
          }

          Write-Host ''
          Write-Host 'Uploading manifest...'

          gh release upload `
            $env:BACKUP_RELEASE_TAG `
            $manifestPath `
            --clobber

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to upload backup manifest.'
          }

          Write-Host ''
          Write-Host 'All backup assets uploaded.' -ForegroundColor Green


      # ======================================================================
      # 21. Remove Stale Backup Assets
      # ======================================================================

      - name: 21. Remove Stale Backup Assets

        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')

        shell: powershell

        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $ErrorActionPreference = 'Continue'

          $currentGeneration = `
            [string]$env:BACKUP_GENERATION

          $releaseJson = `
            gh release view `
              $env:BACKUP_RELEASE_TAG `
              --json assets

          if ($LASTEXITCODE -ne 0) {

              Write-Host `
                'Could not read release assets for cleanup.' `
                -ForegroundColor Yellow

              exit 0
          }

          $release = `
            $releaseJson |
            ConvertFrom-Json

          foreach ($asset in $release.assets) {

              $name = `
                [string]$asset.name

              if (
                  $name -like 'windows-rdp-*-part-*' `
                  -and `
                  $name -notlike "windows-rdp-$currentGeneration-part-*"
              ) {

                  Write-Host `
                    "Deleting stale asset: $name"

                  gh release delete-asset `
                    $env:BACKUP_RELEASE_TAG `
                    $name `
                    --yes
              }
          }

          Write-Host 'Stale asset cleanup completed.'


      # ======================================================================
      # 22. Verify Published Backup
      # ======================================================================

      - name: 22. Verify Published Backup

        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')

        shell: powershell

        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          $ErrorActionPreference = 'Stop'

          $release = `
            gh release view `
              $env:BACKUP_RELEASE_TAG `
              --json assets |
            ConvertFrom-Json

          $manifestAsset = `
            $release.assets |
            Where-Object {
                $_.name -eq $env:BACKUP_MANIFEST_NAME
            }

          if ($null -eq $manifestAsset) {
              throw 'Published release manifest was not found.'
          }

          $prefix = `
            [string]$env:BACKUP_PREFIX

          $parts = `
            $release.assets |
            Where-Object {
                $_.name -like "$prefix*"
            }

          if ($parts.Count -ne [int]$env:BACKUP_PART_COUNT) {

              throw `
                "Published part count mismatch. Expected $env:BACKUP_PART_COUNT, found $($parts.Count)."
          }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'PUBLISHED BACKUP VERIFIED' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green

          Write-Host "Generation : $env:BACKUP_GENERATION"
          Write-Host "Parts      : $($parts.Count)"
          Write-Host "SHA256     : $env:ARCHIVE_SHA256"


      # ======================================================================
      # 23. Cleanup Large Local Files
      # ======================================================================

      - name: 23. Cleanup Large Local Files

        if: always()

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'CLEANUP' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host 'Cleaning local image/archive files...'

          Remove-Item `
            "$env:BACKUP_ROOT\windows-rdp.vhdx.7z" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$env:BACKUP_ROOT\image\windows-rdp.vhdx" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$env:BACKUP_ROOT\download" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$env:BACKUP_ROOT\parts" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host 'Cleanup completed.'


      # ======================================================================
      # 24. Final Summary
      # ======================================================================

      - name: 24. Final Summary

        if: always()

        shell: powershell

        run: |

          $ErrorActionPreference = 'Continue'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'FINAL WINDOWS RDP WORKFLOW SUMMARY' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green

          Write-Host "Run ID             : $env:GITHUB_RUN_ID"
          Write-Host "Runner OS          : $env:RUNNER_OS"

          Write-Host `
            "Existing Backup    : ${{ steps.detect_backup.outputs.HAS_BACKUP }}"

          Write-Host `
            "Keep Alive         : ${{ steps.keep_alive.outcome }}"

          Write-Host `
            "Image Capture      : ${{ steps.capture_image.outcome }}"

          Write-Host `
            "Release Tag        : $env:BACKUP_RELEASE_TAG"

          Write-Host `
            "Part Size Maximum  : $env:BACKUP_PART_BYTES bytes"

          Write-Host `
            "Backup Generation  : $env:BACKUP_GENERATION"

          Write-Host ''
          Write-Host 'Persistence model:'
