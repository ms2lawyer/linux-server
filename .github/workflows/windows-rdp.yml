name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
      - name: 2. Restore Persistent Workspace
        uses: actions/cache@v4
        with:
          path: /home/cynetadmin/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
          restore-keys: |
            cynet-ssh-workspace-

      - name: 3. Enable Remote Desktop and Firewall
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0

      - name: 4. Create Admin Account
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString 'Cynet@2026' -AsPlainText -Force

          New-LocalUser `
            -Name 'CynetAdmin' `
            -Password $Password `
            -PasswordNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member 'CynetAdmin' `
            -ErrorAction SilentlyContinue

          net user runneradmin 'Cynet@2026'

      - name: 5. Install and Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY_WIN_1 }}
        run: |
          Write-Host 'Downloading Tailscale...'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile 'C:\tailscale.msi'

          Write-Host 'Installing Tailscale...'

          Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList '/i C:\tailscale.msi /quiet /norestart' `
            -Wait

          Start-Sleep -Seconds 5

          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          Write-Host 'Connecting to Tailscale...'

          & $Tailscale up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname='github-rdp-server'

          Start-Sleep -Seconds 8

          $ts_ip = & $Tailscale ip -4

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host '       RDP SERVER IS READY' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host 'Username     : CynetAdmin' -ForegroundColor Yellow
          Write-Host 'Password     : Cynet@2026' -ForegroundColor Yellow
          Write-Host "Connect with : mstsc /v:$ts_ip" -ForegroundColor Magenta
          Write-Host '==================================================' -ForegroundColor Green

      - name: 6. Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/360] Server running..."
          }      
      - name: 7. Save Workspace to Cloud
        uses: actions/cache@v4
        if: always()
        with:
          path: /home/cynetadmin/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
