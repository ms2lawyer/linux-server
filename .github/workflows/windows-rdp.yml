name: Windows Cloud RDP

on:
  schedule:
    # GitHub Actions scheduled workflows cannot reliably run every 2 minutes.
    # 5 minutes is the minimum cron interval.
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  rdp-server:

    runs-on: windows-latest

    # Setup + RDP session + workspace synchronization + cache save.
    timeout-minutes: 15

    permissions:
      contents: read
      actions: write

    steps:

      # ============================================================
      # 1. Checkout Repository
      # ============================================================
      - name: 1. Checkout Repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. Restore Previous Persistent Workspace
      # ============================================================
      - name: 2. Restore Persistent Workspace
        id: restore_workspace
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}\workspace

          # Every workflow run gets a unique cache key.
          #
          # GitHub Actions caches are immutable, so we CANNOT
          # reuse the same key when saving.
          key: cynet-rdp-workspace-${{ runner.os }}-${{ github.run_id }}

          # Find the newest previous workspace cache.
          restore-keys: |
            cynet-rdp-workspace-${{ runner.os }}-


      # ============================================================
      # 3. Prepare Persistent Workspace
      # ============================================================
      - name: 3. Prepare Persistent Workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "PERSISTENT WORKSPACE"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "Workspace     : $Workspace"
          Write-Host "Desktop Backup: $DesktopBackup"
          Write-Host ""

          # Create workspace if it does not exist.
          if (-not (Test-Path -LiteralPath $Workspace)) {
              New-Item `
                -ItemType Directory `
                -Path $Workspace `
                -Force | Out-Null
          }

          # Create Desktop backup directory.
          if (-not (Test-Path -LiteralPath $DesktopBackup)) {
              New-Item `
                -ItemType Directory `
                -Path $DesktopBackup `
                -Force | Out-Null
          }

          Write-Host "Cache restore result:"
          Write-Host "Exact cache hit: ${{ steps.restore_workspace.outputs.cache-hit }}"
          Write-Host "Restored key   : ${{ steps.restore_workspace.outputs.cache-matched-key }}"
          Write-Host ""

          Write-Host "Persistent workspace contents:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            -LiteralPath $Workspace `
            -Force `
            -ErrorAction SilentlyContinue |
            Select-Object Mode, Length, LastWriteTime, Name |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"


      # ============================================================
      # 4. Enable Remote Desktop
      # ============================================================
      - name: 4. Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Enabling Remote Desktop..."

          # Enable RDP.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          # Enable RDP firewall rules.
          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          # Start Remote Desktop service.
          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 2

          $Service = Get-Service -Name 'TermService'

          Write-Host "TermService status: $($Service.Status)"

          if ($Service.Status -ne 'Running') {
              throw "Remote Desktop service is not running."
          }

          Write-Host "Remote Desktop enabled successfully."


      # ============================================================
      # 5. Create RDP Administrator Account
      # ============================================================
      - name: 5. Create RDP Administrator Account
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "GitHub Secret RDP_PASSWORD is not configured."
          }

          $SecurePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Write-Host "Configuring user: $Username"

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $ExistingUser) {

              Write-Host "Creating local user..."

              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description 'GitHub Actions RDP Administrator' |
                Out-Null
          }
          else {

              Write-Host "User already exists."

              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword

              Enable-LocalUser `
                -Name $Username
          }

          # Administrator privileges.
          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          # Explicit RDP permission.
          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured successfully."


      # ============================================================
      # 6. Prepare CynetAdmin Desktop
      # ============================================================
      - name: 6. Prepare CynetAdmin Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          $UserProfile = Join-Path 'C:\Users' $Username
          $Desktop = Join-Path $UserProfile 'Desktop'

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "CynetAdmin DESKTOP RESTORE"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "User profile : $UserProfile"
          Write-Host "Desktop      : $Desktop"
          Write-Host "Backup       : $DesktopBackup"
          Write-Host ""

          # Make sure the user profile directory exists.
          if (-not (Test-Path -LiteralPath $UserProfile)) {
              New-Item `
                -ItemType Directory `
                -Path $UserProfile `
                -Force | Out-Null
          }

          # Make sure Desktop exists.
          if (-not (Test-Path -LiteralPath $Desktop)) {
              New-Item `
                -ItemType Directory `
                -Path $Desktop `
                -Force | Out-Null
          }

          # Make sure backup exists.
          if (-not (Test-Path -LiteralPath $DesktopBackup)) {
              New-Item `
                -ItemType Directory `
                -Path $DesktopBackup `
                -Force | Out-Null
          }

          Write-Host "Restoring Desktop from persistent workspace..."

          # /MIR makes the Desktop match the saved Desktop exactly.
          #
          # /E       = copy subdirectories
          # /COPY:DAT = data, attributes, timestamps
          # /DCOPY:DAT = directory data, attributes, timestamps
          # /R:2     = retry twice
          # /W:1     = wait 1 second between retries
          #
          # The backup is ONLY the user's Desktop.
          # It does not affect the rest of the workspace.
          robocopy `
            $DesktopBackup `
            $Desktop `
            /MIR `
            /COPY:DAT `
            /DCOPY:DAT `
            /R:2 `
            /W:1 `
            /XJ

          # Robocopy exit codes 0-7 are normally successful.
          if ($LASTEXITCODE -gt 7) {
              throw "Desktop restore failed. Robocopy exit code: $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Desktop restored successfully."

          Write-Host ""
          Write-Host "Current CynetAdmin Desktop:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            -LiteralPath $Desktop `
            -Force `
            -ErrorAction SilentlyContinue |
            Select-Object Mode, Length, LastWriteTime, Name |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"


      # ============================================================
      # 7. Install Tailscale
      # ============================================================
      - name: 7. Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Installer = 'C:\tailscale.msi'
          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $Installer

          if (-not (Test-Path -LiteralPath $Installer)) {
              throw "Tailscale installer download failed."
          }

          Write-Host "Installing Tailscale..."

          $InstallProcess = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList @(
              '/i',
              $Installer,
              '/quiet',
              '/norestart'
            ) `
            -Wait `
            -PassThru

          if ($InstallProcess.ExitCode -ne 0) {
              throw "Tailscale installation failed. Exit code: $($InstallProcess.ExitCode)"
          }

          Write-Host "Tailscale installation completed."

          # Wait for tailscale.exe.
          $TimeoutSeconds = 60
          $ElapsedSeconds = 0

          while (-not (Test-Path -LiteralPath $Tailscale)) {

              if ($ElapsedSeconds -ge $TimeoutSeconds) {
                  throw "Tailscale executable was not found."
              }

              Start-Sleep -Seconds 2
              $ElapsedSeconds += 2
          }

          Write-Host "Tailscale executable found."


      # ============================================================
      # 8. Connect Tailscale
      # ============================================================
      - name: 8. Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY_WIN_1 }}
        run: |
          $ErrorActionPreference = 'Stop'

          $Tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "GitHub Secret TAILSCALE_AUTHKEY_WIN_1 is not configured."
          }

          Write-Host "Starting Tailscale service..."

          Start-Service `
            -Name 'Tailscale' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host "Connecting to Tailscale..."

          # --ephemeral is important here.
          #
          # GitHub-hosted runners are temporary machines.
          # Without --ephemeral, every new runner can leave a
          # stale Windows device in your Tailscale network.
          & $Tailscale up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname='github-rdp-server' `
            --accept-dns=true `
            --ephemeral

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed. Exit code: $LASTEXITCODE"
          }

          Write-Host "Tailscale connection established."

          # Wait for IPv4.
          $TailscaleIP = ''

          for ($i = 1; $i -le 15; $i++) {

              $TailscaleIP = (& $Tailscale ip -4 2>$null).Trim()

              if (-not [string]::IsNullOrWhiteSpace($TailscaleIP)) {
                  break
              }

              Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($TailscaleIP)) {
              throw "Tailscale did not provide an IPv4 address."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "             RDP SERVER IS READY" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Tailscale IP : $TailscaleIP" -ForegroundColor Yellow
          Write-Host "Hostname     : github-rdp-server" -ForegroundColor Yellow
          Write-Host "Username     : CynetAdmin" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "RDP command:" -ForegroundColor Cyan
          Write-Host "mstsc /v:$TailscaleIP" -ForegroundColor Magenta
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          Write-Host "Tailscale status:"
          & $Tailscale status


      # ============================================================
      # 9. Verify RDP
      # ============================================================
      - name: 9. Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Checking RDP configuration..."

          $RdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($RdpDenied -ne 0) {
              throw "RDP is disabled."
          }

          $TermService = Get-Service `
            -Name 'TermService'

          if ($TermService.Status -ne 'Running') {
              throw "TermService is not running."
          }

          Write-Host "RDP registry: OK"
          Write-Host "TermService: RUNNING"

          Write-Host ""
          Write-Host "Remote Desktop firewall rules:"

          Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq 'True' |
            Select-Object DisplayName, Enabled, Profile |
            Format-Table -AutoSize


      # ============================================================
      # 10. Keep RDP Server Alive For 2 Minutes
      # ============================================================
      - name: 10. Keep RDP Server Alive For 2 Minutes
        shell: powershell
        run: |
          $TotalSeconds = 120
          $IntervalSeconds = 10

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       RDP SERVER IS NOW AVAILABLE" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          for ($Elapsed = 0; $Elapsed -lt $TotalSeconds; $Elapsed += $IntervalSeconds) {

              $Remaining = $TotalSeconds - $Elapsed

              Write-Host "RDP server running - $Remaining seconds remaining..."

              Start-Sleep -Seconds $IntervalSeconds
          }

          Write-Host ""
          Write-Host "2-minute RDP session completed."


      # ============================================================
      # 11. Save CynetAdmin Desktop To Persistent Workspace
      # ============================================================
      - name: 11. Save Desktop To Persistent Workspace
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'CynetAdmin'

          $UserProfile = Join-Path 'C:\Users' $Username
          $Desktop = Join-Path $UserProfile 'Desktop'

          $Workspace = Join-Path $env:GITHUB_WORKSPACE 'workspace'
          $DesktopBackup = Join-Path $Workspace 'Desktop'

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "SAVING CynetAdmin DESKTOP"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "Source : $Desktop"
          Write-Host "Target : $DesktopBackup"
          Write-Host ""

          if (-not (Test-Path -LiteralPath $Desktop)) {
              Write-Host "Desktop does not exist. Creating it..."

              New-Item `
                -ItemType Directory `
                -Path $Desktop `
                -Force | Out-Null
          }

          if (-not (Test-Path -LiteralPath $DesktopBackup)) {
              New-Item `
                -ItemType Directory `
                -Path $DesktopBackup `
                -Force | Out-Null
          }

          Write-Host "Synchronizing Desktop..."

          # /MIR ensures that deletions on the Desktop are also
          # reflected in the persistent backup.
          robocopy `
            $Desktop `
            $DesktopBackup `
            /MIR `
            /COPY:DAT `
            /DCOPY:DAT `
            /R:2 `
            /W:1 `
            /XJ

          # Robocopy exit codes 0-7 are successful.
          if ($LASTEXITCODE -gt 7) {
              throw "Desktop backup failed. Robocopy exit code: $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "Desktop saved successfully."

          Write-Host ""
          Write-Host "Files being persisted:"
          Write-Host "--------------------------------------------------"

          Get-ChildItem `
            -LiteralPath $DesktopBackup `
            -Force `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "--------------------------------------------------"


      # ============================================================
      # 12. Save Persistent Workspace To GitHub Cache
      # ============================================================
      - name: 12. Save Workspace For Next Run
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}\workspace

          # IMPORTANT:
          #
          # GitHub Actions cache entries are immutable.
          # Therefore every run receives a unique cache key.
          #
          # The next workflow run uses restore-keys to find
          # this cache and restore it.
          key: cynet-rdp-workspace-${{ runner.os }}-${{ github.run_id }}
