# ============================================================================
# Windows Cloud RDP — Persistent Disk Image via GitHub Release
#
# TEST VERSION
#
# Purpose:
#   Test whether a Windows runner can be captured into a VHDX and restored
#   on a future GitHub Actions runner.
#
# First run:
#   1. Start Windows runner.
#   2. Configure RDP.
#   3. Create a uniquely named test file on Desktop.
#   4. Keep runner alive for 2 minutes.
#   5. Capture complete Windows system disk with Disk2vhd.
#   6. Compress + encrypt VHDX.
#   7. Split archive into <= 2,000,000,000 byte parts.
#   8. Upload parts + manifest to one fixed GitHub Release.
#
# Subsequent run:
#   1. Detect persistent GitHub Release.
#   2. Download manifest + archive parts.
#   3. Reassemble archive.
#   4. Verify SHA256.
#   5. Decrypt/extract VHDX.
#   6. Boot restored Windows in QEMU.
#   7. Expose guest RDP through host Tailscale.
#
# IMPORTANT:
#   This is a TEST workflow.
#   SESSION_MINUTES is intentionally only 2 minutes.
#
# ============================================================================

name: Windows Cloud RDP - Persistence Test

on:
  workflow_dispatch:

  # Temporary test schedule.
  # Every 30 minutes instead of every 5 minutes to avoid overlapping
  # persistence tests while debugging.
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: windows-cloud-rdp
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  BACKUP_RELEASE_TAG: windows-rdp-persistent
  BACKUP_MANIFEST_NAME: windows-rdp-manifest.json

  # GitHub Release asset safety limit.
  # Keep each part below 2 GiB.
  BACKUP_PART_BYTES: '2000000000'

  BACKUP_ROOT: C:\WindowsRdpPersistence

  # Host -> QEMU guest RDP forwarding.
  QEMU_RDP_PORT: '33989'

  # QEMU QMP control port.
  QEMU_QMP_PORT: '4444'

  # TEST ONLY:
  # Keep the Windows runner alive for only 2 minutes before backup.
  SESSION_MINUTES: '2'

  TAILSCALE_HOSTNAME: github-rdp-host

jobs:

  # ==========================================================================
  # JOB
  # ==========================================================================

  rdp-server:

    runs-on: windows-latest

    # Give enough time for:
    # - Windows startup
    # - Disk2vhd
    # - 7-Zip
    # - upload
    #
    # The session itself is only 2 minutes.
    timeout-minutes: 30

    steps:

      # ======================================================================
      # 1. Checkout Repository
      # ======================================================================

      - name: 1. Checkout Repository
        uses: actions/checkout@v5


      # ======================================================================
      # 2. Prepare Persistence Workspace
      # ======================================================================

      - name: 2. Prepare Persistence Workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'PREPARING PERSISTENCE WORKSPACE' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          New-Item `
            -ItemType Directory `
            -Path $env:BACKUP_ROOT `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$env:BACKUP_ROOT\download" `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$env:BACKUP_ROOT\parts" `
            -Force |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Path "$env:BACKUP_ROOT\image" `
            -Force |
            Out-Null

          Write-Host "Persistence root: $env:BACKUP_ROOT"

          Write-Host ''
          Write-Host 'Current disk space:'

          Get-PSDrive -Name C |
            Select-Object Name, Used, Free |
            Format-List


      # ======================================================================
      # 3. Detect Existing Persistent Backup
      #
      # IMPORTANT:
      #
      # Missing release is NORMAL on first run.
      #
      # We deliberately execute gh through cmd.exe because Windows
      # PowerShell 5.1 can turn native stderr into NativeCommandError when
      # ErrorActionPreference = Stop.
      # ======================================================================

      - name: 3. Detect Existing Persistent Backup
        id: detect_backup
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifestPath = "$env:BACKUP_ROOT\download\$env:BACKUP_MANIFEST_NAME"
          $releaseJsonPath = "$env:BACKUP_ROOT\release.json"

          $hasBackup = $false

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'CHECKING PERSISTENT BACKUP' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host "Release tag: $env:BACKUP_RELEASE_TAG"

          # ------------------------------------------------------------------
          # Execute gh through CMD.
          #
          # If release does not exist:
          #
          #   gh exit code = 1
          #
          # That is expected and means FIRST RUN.
          # ------------------------------------------------------------------

          cmd.exe /c "gh release view `"$env:BACKUP_RELEASE_TAG`" --json isDraft,isPrerelease,assets > `"$releaseJsonPath`" 2>nul"

          $releaseExitCode = $LASTEXITCODE

          Write-Host "gh exit code: $releaseExitCode"

          # ------------------------------------------------------------------
          # Release exists
          # ------------------------------------------------------------------

          if ($releaseExitCode -eq 0) {

              Write-Host 'Persistent release found.'

              if (-not (Test-Path -LiteralPath $releaseJsonPath)) {
                  throw 'GitHub returned success but release information was not created.'
              }

              try {
                  $release = Get-Content `
                    -LiteralPath $releaseJsonPath `
                    -Raw |
                    ConvertFrom-Json
              }
              catch {
                  throw "Could not parse GitHub release information: $($_.Exception.Message)"
              }

              $manifestAsset = $release.assets |
                Where-Object {
                    $_.name -eq $env:BACKUP_MANIFEST_NAME
                } |
                Select-Object -First 1

              if ($null -ne $manifestAsset) {

                  $hasBackup = $true

                  Write-Host 'Persistent backup manifest found.'
                  Write-Host 'Existing backup will be restored.'

              }
              else {

                  Write-Host 'Release exists, but backup manifest is missing.'
                  Write-Host 'Treating this as FIRST RUN.'
              }
          }

          # ------------------------------------------------------------------
          # Release does not exist
          # ------------------------------------------------------------------

          else {

              Write-Host ''
              Write-Host '==================================================' -ForegroundColor Yellow
              Write-Host 'NO PERSISTENT BACKUP FOUND' -ForegroundColor Yellow
              Write-Host '==================================================' -ForegroundColor Yellow

              Write-Host "Release '$env:BACKUP_RELEASE_TAG' does not exist."
              Write-Host 'This is the FIRST RUN.'
              Write-Host 'Continuing with first-run initialization.'
          }

          # ------------------------------------------------------------------
          # Export output for all following steps.
          # ------------------------------------------------------------------

          "HAS_BACKUP=$($hasBackup.ToString().ToLowerInvariant())" |
            Out-File `
              -FilePath $env:GITHUB_OUTPUT `
              -Append `
              -Encoding utf8

          # Never propagate gh's exit code.
          $global:LASTEXITCODE = 0

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'BACKUP DETECTION RESULT' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host "Has backup : $hasBackup"
          Write-Host "First run  : $(-not $hasBackup)"
          Write-Host '==================================================' -ForegroundColor Green


      # ======================================================================
      # 4. Download and Reassemble Previous Image
      # ======================================================================

      - name: 4. Download and Reassemble Previous Image
        if: steps.detect_backup.outputs.HAS_BACKUP == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifestPath = "$env:BACKUP_ROOT\download\$env:BACKUP_MANIFEST_NAME"
          $manifest = Get-Content `
            -LiteralPath $manifestPath `
            -Raw |
            ConvertFrom-Json

          $generation = [string]$manifest.generation
          $partCount = [int]$manifest.part_count

          $prefix = "windows-rdp-$generation-part-"

          $downloadDir = "$env:BACKUP_ROOT\download"
          $archivePath = "$env:BACKUP_ROOT\image\windows-rdp.7z"
          $imagePath = "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'DOWNLOADING PREVIOUS BACKUP' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host "Generation : $generation"
          Write-Host "Part count : $partCount"
          Write-Host "SHA256     : $($manifest.sha256)"

          Get-ChildItem `
            -LiteralPath $downloadDir `
            -Filter "$prefix*" `
            -ErrorAction SilentlyContinue |
            Remove-Item `
              -Force `
              -ErrorAction SilentlyContinue

          gh release download $env:BACKUP_RELEASE_TAG `
            --pattern "$prefix*" `
            --dir "$downloadDir" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to download backup parts.'
          }

          $parts = Get-ChildItem `
            -LiteralPath $downloadDir `
            -Filter "$prefix*" |
            Sort-Object {
                [int](($_.Name -replace '^.*-part-(\d+)$', '$1'))
            }

          if ($parts.Count -ne $partCount) {
              throw "Expected $partCount backup parts, but downloaded $($parts.Count)."
          }

          # ------------------------------------------------------------------
          # Reassemble archive
          # ------------------------------------------------------------------

          if (Test-Path -LiteralPath $archivePath) {
              Remove-Item `
                -LiteralPath $archivePath `
                -Force
          }

          $out = [System.IO.File]::Open(
              $archivePath,
              [System.IO.FileMode]::Create,
              [System.IO.FileAccess]::Write
          )

          try {

              foreach ($part in $parts) {

                  Write-Host "Appending $($part.Name) ($($part.Length) bytes)"

                  $in = [System.IO.File]::OpenRead($part.FullName)

                  try {
                      $in.CopyTo($out)
                  }
                  finally {
                      $in.Dispose()
                  }
              }
          }
          finally {
              $out.Dispose()
          }

          # ------------------------------------------------------------------
          # Verify SHA256
          # ------------------------------------------------------------------

          $sha = (
              Get-FileHash `
                -Algorithm SHA256 `
                -LiteralPath $archivePath
          ).Hash.ToLowerInvariant()

          if ($sha -ne [string]$manifest.sha256) {
              throw "Archive SHA256 mismatch. Expected $($manifest.sha256), got $sha."
          }

          Write-Host "Archive SHA256 verified: $sha"

          # ------------------------------------------------------------------
          # Install 7-Zip
          # ------------------------------------------------------------------

          choco install 7zip -y --no-progress

          $sevenZip = Join-Path `
            $env:ProgramFiles `
            '7-Zip\7z.exe'

          if (-not (Test-Path -LiteralPath $sevenZip)) {
              throw '7-Zip executable was not found.'
          }

          if ([string]::IsNullOrWhiteSpace($env:BACKUP_ENCRYPTION_PASSWORD)) {
              throw 'Secret BACKUP_ENCRYPTION_PASSWORD is required.'
          }

          # ------------------------------------------------------------------
          # Extract VHDX
          # ------------------------------------------------------------------

          Write-Host 'Extracting encrypted VHDX...'

          & $sevenZip x `
            $archivePath `
            "-o$($env:BACKUP_ROOT)\image" `
            "-p$env:BACKUP_ENCRYPTION_PASSWORD" `
            -y

          if ($LASTEXITCODE -ne 0) {
              throw "7-Zip extraction failed with exit code $LASTEXITCODE."
          }

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw "Restored VHDX was not found: $imagePath"
          }

          Write-Host "Restored VHDX: $imagePath"
          Write-Host "Restored VHDX size: $((Get-Item $imagePath).Length) bytes"


      # ======================================================================
      # 5. Install QEMU
      # ======================================================================

      - name: 5. Install QEMU
        if: steps.detect_backup.outputs.HAS_BACKUP == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Installing QEMU...'

          choco install qemu -y --no-progress

          $qemu = Get-Command `
            qemu-system-x86_64.exe `
            -ErrorAction Stop

          Write-Host "QEMU: $($qemu.Source)"

          $ovmf = Get-ChildItem `
            -Path 'C:\Program Files','C:\ProgramData\chocolatey\lib' `
            -Filter 'OVMF_CODE*.fd' `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $ovmf) {
              throw 'OVMF_CODE firmware was not found after installing QEMU.'
          }

          "QEMU_PATH=$($qemu.Source)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "OVMF_CODE=$($ovmf.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "OVMF: $($ovmf.FullName)"


      # ======================================================================
      # 6. Boot Restored Windows Image in QEMU
      # ======================================================================

      - name: 6. Boot Restored Windows Image in QEMU
        id: boot_vm
        if: steps.detect_backup.outputs.HAS_BACKUP == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $imagePath = "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          $logPath = "$env:BACKUP_ROOT\qemu.log"
          $errorLogPath = "$env:BACKUP_ROOT\qemu-error.log"

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw "VHDX not found: $imagePath"
          }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'STARTING RESTORED WINDOWS VM' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          $args = @(
            '-display','none',
            '-machine','q35',
            '-accel','tcg,thread=multi',
            '-m','4096',
            '-smp','2',
            '-bios',"$env:OVMF_CODE",
            '-drive',"file=$imagePath,format=vhdx,if=ide,cache=writeback",
            '-netdev',"user,id=n1,hostfwd=tcp:0.0.0.0:$env:QEMU_RDP_PORT-:3389",
            '-device','e1000,netdev=n1',
            '-qmp',"tcp:127.0.0.1:$env:QEMU_QMP_PORT,server=on,wait=off",
            '-nodefaults',
            '-serial','none',
            '-monitor','none',
            '-no-reboot'
          )

          $process = Start-Process `
            -FilePath $env:QEMU_PATH `
            -ArgumentList $args `
            -RedirectStandardOutput $logPath `
            -RedirectStandardError $errorLogPath `
            -PassThru

          "QEMU_PID=$($process.Id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "QEMU PID: $($process.Id)"

          Write-Host "Waiting for guest RDP port $env:QEMU_RDP_PORT..."

          $ready = $false

          # Maximum wait:
          # 180 x 2 seconds = 360 seconds

          for ($i = 1; $i -le 180; $i++) {

              Start-Sleep -Seconds 2

              if ($process.HasExited) {

                  Get-Content `
                    -LiteralPath $logPath `
                    -Tail 100 `
                    -ErrorAction SilentlyContinue

                  Get-Content `
                    -LiteralPath $errorLogPath `
                    -Tail 100 `
                    -ErrorAction SilentlyContinue

                  throw "QEMU exited during boot. Exit code: $($process.ExitCode)"
              }

              $check = Test-NetConnection `
                -ComputerName 127.0.0.1 `
                -Port ([int]$env:QEMU_RDP_PORT) `
                -WarningAction SilentlyContinue

              if ($check.TcpTestSucceeded) {
                  $ready = $true
                  break
              }

              if (($i % 10) -eq 0) {
                  Write-Host "Still waiting for guest RDP... elapsed $($i * 2)s"
              }
          }

          if (-not $ready) {

              Write-Host ''
              Write-Host 'QEMU STDOUT:' -ForegroundColor Yellow

              Get-Content `
                -LiteralPath $logPath `
                -Tail 100 `
                -ErrorAction SilentlyContinue

              Write-Host ''
              Write-Host 'QEMU STDERR:' -ForegroundColor Yellow

              Get-Content `
                -LiteralPath $errorLogPath `
                -Tail 100 `
                -ErrorAction SilentlyContinue

              throw 'Guest RDP port did not become available within 360 seconds.'
          }

          Write-Host ''
          Write-Host 'Restored Windows guest appears to be online.' -ForegroundColor Green


      # ======================================================================
      # 7. Enable RDP on First Run
      # ======================================================================

      - name: 7. Enable Remote Desktop on First Run Host
        if: steps.detect_backup.outputs.HAS_BACKUP != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host 'Enabling Windows Remote Desktop...'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          $service = Get-Service -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw 'TermService is not running.'
          }

          Write-Host 'Remote Desktop enabled.'


      # ======================================================================
      # 8. Create CynetAdmin on First Run
      # ======================================================================

      - name: 8. Create CynetAdmin on First Run
        if: steps.detect_backup.outputs.HAS_BACKUP != 'true'
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw 'GitHub Secret RDP_PASSWORD is not configured.'
          }

          $username = 'CynetAdmin'

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description 'GitHub Actions RDP Administrator' |
                Out-Null
          }
          else {

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Enable-LocalUser `
                -Name $username
          }

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "Configured local user: $username"


      # ======================================================================
      # 9. Install and Connect Tailscale
      #
      # On first run:
      #   Install + authenticate.
      #
      # On restored run:
      #   Try to use the restored Tailscale installation.
      #
      # ======================================================================

      - name: 9. Install and Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY_WIN_1 }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw 'GitHub Secret TAILSCALE_AUTHKEY_WIN_1 is not configured.'
          }

          $installer = 'C:\tailscale.msi'
          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          # ------------------------------------------------------------------
          # Install Tailscale only if it is not already present.
          # ------------------------------------------------------------------

          if (-not (Test-Path -LiteralPath $tailscale)) {

              Write-Host 'Downloading Tailscale...'

              Invoke-WebRequest `
                -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
                -OutFile $installer

              $p = Start-Process `
                -FilePath 'msiexec.exe' `
                -ArgumentList '/i',$installer,'/quiet','/norestart' `
                -Wait `
                -PassThru

              if ($p.ExitCode -ne 0) {
                  throw "Tailscale installation failed: $($p.ExitCode)"
              }
          }

          if (-not (Test-Path -LiteralPath $tailscale)) {
              throw 'Tailscale executable was not found.'
          }

          Start-Service `
            -Name 'Tailscale' `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          # ------------------------------------------------------------------
          # Authenticate.
          #
          # We use --force-reauthentication so the temporary runner/host
          # receives a valid current Tailscale session.
          # ------------------------------------------------------------------

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTHKEY" `
            --hostname="$env:TAILSCALE_HOSTNAME-$env:GITHUB_RUN_ID" `
            --accept-dns=true `
            --unattended=true

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed: $LASTEXITCODE"
          }

          $ip = ''

          for ($i = 1; $i -le 20; $i++) {

              $ip = (& $tailscale ip -4 2>$null).Trim()

              if (-not [string]::IsNullOrWhiteSpace($ip)) {
                  break
              }

              Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {
              throw 'Could not determine Tailscale IPv4 address.'
          }

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Tailscale IPv4: $ip"


      # ======================================================================
      # 10. Verify First Run RDP
      # ======================================================================

      - name: 10. Verify First-Run Host RDP
        if: steps.detect_backup.outputs.HAS_BACKUP != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $rdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($rdpDenied -ne 0) {
              throw 'RDP is disabled.'
          }

          if ((Get-Service -Name TermService).Status -ne 'Running') {
              throw 'TermService is not running.'
          }

          Write-Host "First-run RDP is ready at $env:TAILSCALE_IP:3389"


      # ======================================================================
      # 10.5 Create Persistence Test File
      #
      # THIS IS THE IMPORTANT TEST.
      #
      # The file is created BEFORE Disk2vhd capture.
      #
      # If the persistence mechanism works, this exact file should be present
      # in the restored Windows system on a later workflow run.
      # ======================================================================

      - name: 10.5 Create Persistence Test File
        if: steps.detect_backup.outputs.HAS_BACKUP != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $desktop = [Environment]::GetFolderPath('Desktop')

          if ([string]::IsNullOrWhiteSpace($desktop)) {
              throw 'Could not determine Windows Desktop path.'
          }

          if (-not (Test-Path -LiteralPath $desktop)) {
              throw "Desktop directory does not exist: $desktop"
          }

          $timestamp = Get-Date -Format 'yyyy-MM-dd_HH-mm-ss'

          $randomText = -join (
              (48..57) +
              (65..90) +
              (97..122) |
              Get-Random -Count 32 |
              ForEach-Object {
                  [char]$_
              }
          )

          $fileName = "RDP-PERSISTENCE-TEST-$timestamp.txt"

          $filePath = Join-Path `
            $desktop `
            $fileName

          $content = @"Windows persistence test Created at:
          $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss.fff zzz')
          Runner:
          $env:RUNNER_NAME
          Run ID:
          $env:GITHUB_RUN_ID
          Repository:
          $env:GITHUB_REPOSITORY
          Random test value:
          $randomText
          Message:
          سیس ویندوز خاموش شده و مراحل پشتیبان گیری شروع شود

          Purpose:
          This file was intentionally created BEFORE Disk2vhd capture.

          Expected result:
          If Windows persistence works correctly, this exact file should
          still exist after the VHDX is restored and Windows is booted again.    "@

          Set-Content `
            -LiteralPath $filePath `
            -Value $content `
            -Encoding UTF8

          if (-not (Test-Path -LiteralPath $filePath)) {
              throw "Test file was not created: $filePath"
          }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'PERSISTENCE TEST FILE CREATED' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green

          Write-Host "Desktop : $desktop"
          Write-Host "File    : $fileName"
          Write-Host "Path    : $filePath"

          Write-Host ''
          Write-Host 'File content:'
          Write-Host '--------------------------------------------------'

          Get-Content `
            -LiteralPath $filePath

          Write-Host '--------------------------------------------------'

          Write-Host ''
          Write-Host 'The file will now be included in the Windows image.'
          Write-Host '==================================================' -ForegroundColor Green


      # ======================================================================
      # 11. Display Connection Information
      # ======================================================================

      - name: 11. Display RDP Connection Information
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'

          $backupExists = '${{ steps.detect_backup.outputs.HAS_BACKUP }}'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'RDP SERVER IS READY' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green

          if ($backupExists -eq 'true') {

              if (-not (Test-Path -LiteralPath $tailscale)) {

                  Write-Host `
                    'Host Tailscale executable is not present; host networking is not configured.' `
                    -ForegroundColor Yellow
              }
              else {

                  Start-Service `
                    -Name Tailscale `
                    -ErrorAction SilentlyContinue

                  $hostIp = (
                      & $tailscale ip -4 2>$null
                  ).Trim()

                  if (-not [string]::IsNullOrWhiteSpace($hostIp)) {

                      "TAILSCALE_IP=$hostIp" |
                        Out-File `
                          -FilePath $env:GITHUB_ENV `
                          -Append `
                          -Encoding utf8

                      Write-Host "Tailscale IP : $hostIp" -ForegroundColor Yellow
                      Write-Host "RDP endpoint : $hostIp`:$env:QEMU_RDP_PORT" -ForegroundColor Yellow
                      Write-Host "RDP command  : mstsc /v:$hostIp`:$env:QEMU_RDP_PORT" -ForegroundColor Magenta
                  }
                  else {

                      Write-Host `
                        'Tailscale host IP not available.' `
                        -ForegroundColor Yellow
                  }
              }
          }
          else {

              Write-Host "Tailscale IP : $env:TAILSCALE_IP" -ForegroundColor Yellow
              Write-Host "RDP endpoint : $env:TAILSCALE_IP`:3389" -ForegroundColor Yellow
              Write-Host "RDP command  : mstsc /v:$env:TAILSCALE_IP" -ForegroundColor Magenta
          }

          Write-Host ''


      # ======================================================================
      # 12. Keep RDP Session Alive
      #
      # TEST MODE:
      #   SESSION_MINUTES = 2
      #
      # After this step finishes, backup begins.
      # ======================================================================

      - name: 12. Keep RDP Session Alive
        id: keep_alive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          $totalMinutes = [int]$env:SESSION_MINUTES

          $intervalSeconds = 30

          $totalSeconds = $totalMinutes * 60

          $elapsed = 0

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'TEST SESSION STARTED' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host "Session runtime: $totalMinutes minutes"

          while ($elapsed -lt $totalSeconds) {

              Start-Sleep -Seconds $intervalSeconds

              $elapsed += $intervalSeconds

              $remainingSeconds = $totalSeconds - $elapsed

              if ($remainingSeconds -lt 0) {
                  $remainingSeconds = 0
              }

              Write-Host `
                "RDP running... elapsed=$elapsed sec; remaining=$remainingSeconds sec"
          }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'TEST SESSION FINISHED' -ForegroundColor Green
          Write-Host 'BACKUP PROCESS WILL NOW START' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green

          $global:LASTEXITCODE = 0


      # ======================================================================
      # 13. Gracefully Shutdown Restored Guest
      #
      # Only applies to second/subsequent runs where QEMU is running.
      # ======================================================================

      - name: 13. Gracefully Shutdown Restored Guest
        if: steps.detect_backup.outputs.HAS_BACKUP == 'true' && steps.keep_alive.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          if ([string]::IsNullOrWhiteSpace($env:QEMU_PID)) {
              throw 'QEMU PID is not available.'
          }

          Write-Host 'Sending ACPI powerdown to restored guest...'

          try {

              $client = New-Object `
                System.Net.Sockets.TcpClient(
                    '127.0.0.1',
                    [int]$env:QEMU_QMP_PORT
                )

              $stream = $client.GetStream()

              $buffer = New-Object byte[] 4096

              $null = $stream.Read(
                  $buffer,
                  0,
                  $buffer.Length
              )

              $command = '{"execute":"system_powerdown"}' + "`n"

              $bytes = [System.Text.Encoding]::ASCII.GetBytes($command)

              $stream.Write(
                  $bytes,
                  0,
                  $bytes.Length
              )

              $stream.Flush()

              $stream.Dispose()
              $client.Dispose()
          }
          catch {

              Write-Host `
                "QMP powerdown request failed: $($_.Exception.Message)" `
                -ForegroundColor Yellow
          }

          $deadline = (Get-Date).AddSeconds(120)

          while ((Get-Date) -lt $deadline) {

              $p = Get-Process `
                -Id ([int]$env:QEMU_PID) `
                -ErrorAction SilentlyContinue

              if ($null -eq $p) {

                  Write-Host 'QEMU exited after guest shutdown.'

                  break
              }

              Start-Sleep -Seconds 5
          }

          $p = Get-Process `
            -Id ([int]$env:QEMU_PID) `
            -ErrorAction SilentlyContinue

          if ($null -ne $p) {

              Write-Host `
                'Guest did not shut down within 120 seconds; stopping QEMU.' `
                -ForegroundColor Yellow

              Stop-Process `
                -Id ([int]$env:QEMU_PID) `
                -Force

              Start-Sleep -Seconds 3
          }


      # ======================================================================
      # 14. Capture First-Run Windows System Disk
      #
      # IMPORTANT:
      #   -accepteula is required for the first execution of Disk2vhd.
      # ======================================================================

      - name: 14. Capture First-Run System Disk With Disk2vhd
        id: capture_image
        if: steps.detect_backup.outputs.HAS_BACKUP != 'true' && steps.keep_alive.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $disk2vhdZip = "$env:BACKUP_ROOT\disk2vhd.zip"

          $disk2vhdDir = "$env:BACKUP_ROOT\disk2vhd"

          $imagePath = "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'DOWNLOADING DISK2VHD' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Invoke-WebRequest `
            -Uri 'https://download.sysinternals.com/files/Disk2vhd.zip' `
            -OutFile $disk2vhdZip

          if (-not (Test-Path -LiteralPath $disk2vhdZip)) {
              throw 'Disk2vhd ZIP was not downloaded.'
          }

          if (Test-Path -LiteralPath $disk2vhdDir) {

              Remove-Item `
                -LiteralPath $disk2vhdDir `
                -Recurse `
                -Force
          }

          Expand-Archive `
            -Path $disk2vhdZip `
            -DestinationPath $disk2vhdDir `
            -Force

          $disk2vhd = Get-ChildItem `
            -LiteralPath $disk2vhdDir `
            -Filter 'disk2vhd64.exe' `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $disk2vhd) {
              throw 'disk2vhd64.exe was not found.'
          }

          Write-Host "Disk2vhd executable: $($disk2vhd.FullName)"

          # ------------------------------------------------------------------
          # Check disk space
          # ------------------------------------------------------------------

          Write-Host ''
          Write-Host 'Checking free disk space...'

          $free = (Get-PSDrive -Name C).Free

          Write-Host "Free C: space = $free bytes"
          Write-Host "Free C: space = $([math]::Round($free / 1GB, 2)) GB"

          if ($free -lt 5000000000) {
              throw 'Less than 5 GB free space is available.'
          }

          # ------------------------------------------------------------------
          # Remove previous local image
          # ------------------------------------------------------------------

          if (Test-Path -LiteralPath $imagePath) {

              Remove-Item `
                -LiteralPath $imagePath `
                -Force
          }

          # ------------------------------------------------------------------
          # Capture
          # ------------------------------------------------------------------

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'STARTING DISK2VHD SYSTEM CAPTURE' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host "Output: $imagePath"

          # IMPORTANT:
          # -accepteula prevents first-run EULA failure.
          #
          # '*' means capture all available volumes.
          #
          & $disk2vhd.FullName `
            -accepteula `
            '*' `
            $imagePath

          $disk2vhdExitCode = $LASTEXITCODE

          Write-Host ''
          Write-Host "Disk2vhd exit code: $disk2vhdExitCode"

          if ($disk2vhdExitCode -ne 0) {
              throw "Disk2vhd failed with exit code $disk2vhdExitCode."
          }

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw "Disk2vhd completed but VHDX was not created: $imagePath"
          }

          $imageBytes = (
              Get-Item -LiteralPath $imagePath
          ).Length

          if ($imageBytes -le 0) {
              throw 'Disk2vhd created an empty VHDX.'
          }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'DISK2VHD CAPTURE COMPLETED' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host "VHDX path : $imagePath"
          Write-Host "VHDX size : $imageBytes bytes"
          Write-Host "VHDX size : $([math]::Round($imageBytes / 1GB, 2)) GB"
          Write-Host '==================================================' -ForegroundColor Green


      # ======================================================================
      # 15. Verify Restored VHDX
      # ======================================================================

      - name: 15. Verify Restored VHDX After Guest Shutdown
        if: steps.detect_backup.outputs.HAS_BACKUP == 'true' && steps.keep_alive.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $imagePath = "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw 'Restored VHDX is missing after guest shutdown.'
          }

          $size = (
              Get-Item -LiteralPath $imagePath
          ).Length

          Write-Host "Current restored VHDX size: $size bytes"


      # ======================================================================
      # 16. Encrypt and Compress Image
      # ======================================================================

      - name: 16. Encrypt and Compress Image
        id: pack_image
        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')
        shell: powershell
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:BACKUP_ENCRYPTION_PASSWORD)) {
              throw 'Secret BACKUP_ENCRYPTION_PASSWORD is required.'
          }

          choco install 7zip -y --no-progress

          $sevenZip = Join-Path `
            $env:ProgramFiles `
            '7-Zip\7z.exe'

          if (-not (Test-Path -LiteralPath $sevenZip)) {
              throw '7-Zip executable was not found.'
          }

          $imagePath = "$env:BACKUP_ROOT\image\windows-rdp.vhdx"

          $archivePath = "$env:BACKUP_ROOT\windows-rdp.vhdx.7z"

          if (-not (Test-Path -LiteralPath $imagePath)) {
              throw "Image not found: $imagePath"
          }

          if (Test-Path -LiteralPath $archivePath) {

              Remove-Item `
                -LiteralPath $archivePath `
                -Force
          }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'CREATING ENCRYPTED 7-ZIP ARCHIVE' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          & $sevenZip `
            a `
            -t7z `
            -mx=1 `
            -mhe=on `
            "-p$env:BACKUP_ENCRYPTION_PASSWORD" `
            $archivePath `
            $imagePath

          if ($LASTEXITCODE -ne 0) {
              throw "7-Zip archive creation failed: $LASTEXITCODE"
          }

          $sha = (
              Get-FileHash `
                -Algorithm SHA256 `
                -LiteralPath $archivePath
          ).Hash.ToLowerInvariant()

          $bytes = (
              Get-Item -LiteralPath $archivePath
          ).Length

          "ARCHIVE_SHA256=$sha" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "ARCHIVE_BYTES=$bytes" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host ''
          Write-Host "Encrypted archive size: $bytes bytes"
          Write-Host "Encrypted archive SHA256: $sha"


      # ======================================================================
      # 17. Split Archive Into <= 2 GB Parts
      # ======================================================================

      - name: 17. Split Archive Into 2 GB Parts
        id: split_archive
        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $archivePath = "$env:BACKUP_ROOT\windows-rdp.vhdx.7z"

          $partBytes = [int64]$env:BACKUP_PART_BYTES

          $generation = "$env:GITHUB_RUN_ID"

          $partsDir = "$env:BACKUP_ROOT\parts"

          $prefix = "windows-rdp-$generation-part-"

          if (Test-Path -LiteralPath $partsDir) {

              Remove-Item `
                -LiteralPath $partsDir `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $partsDir `
            -Force |
            Out-Null

          $input = [System.IO.File]::OpenRead($archivePath)

          try {

              $buffer = New-Object byte[] (4MB)

              $partIndex = 1

              while ($input.Position -lt $input.Length) {

                  $partPath = Join-Path `
                    $partsDir `
                    ("{0}{1:D5}" -f $prefix, $partIndex)

                  $output = [System.IO.File]::Open(
                      $partPath,
                      [System.IO.FileMode]::CreateNew,
                      [System.IO.FileAccess]::Write
                  )

                  try {

                      $remaining = $partBytes

                      while (
                          $remaining -gt 0 -and
                          $input.Position -lt $input.Length
                      ) {

                          $want = [int][Math]::Min(
                              $buffer.Length,
                              $remaining
                          )

                          $read = $input.Read(
                              $buffer,
                              0,
                              $want
                          )

                          if ($read -le 0) {
                              break
                          }

                          $output.Write(
                              $buffer,
                              0,
                              $read
                          )

                          $remaining -= $read
                      }
                  }
                  finally {

                      $output.Dispose()
                  }

                  $createdSize = (
                      Get-Item -LiteralPath $partPath
                  ).Length

                  Write-Host `
                    "Created part $partIndex : $partPath ($createdSize bytes)"

                  $partIndex++
              }
          }
          finally {

              $input.Dispose()
          }

          $parts = Get-ChildItem `
            -LiteralPath $partsDir `
            -File |
            Sort-Object Name

          if ($parts.Count -lt 1) {
              throw 'No archive parts were created.'
          }

          foreach ($part in $parts) {

              if ($part.Length -gt $partBytes) {
                  throw "Part exceeds configured maximum: $($part.Name)"
              }
          }

          "BACKUP_GENERATION=$generation" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "BACKUP_PREFIX=$prefix" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "BACKUP_PART_COUNT=$($parts.Count)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Total parts: $($parts.Count)"


      # ======================================================================
      # 18. Build Manifest
      # ======================================================================

      - name: 18. Build Backup Manifest
        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $partsDir = "$env:BACKUP_ROOT\parts"

          $parts = Get-ChildItem `
            -LiteralPath $partsDir `
            -File |
            Sort-Object Name

          $manifest = [ordered]@{

              schema_version = 1

              generation = [string]$env:BACKUP_GENERATION

              archive_name = 'windows-rdp.vhdx.7z'

              archive_bytes = [int64]$env:ARCHIVE_BYTES

              sha256 = [string]$env:ARCHIVE_SHA256

              part_bytes_max = [int64]$env:BACKUP_PART_BYTES

              part_count = [int]$parts.Count

              created_utc = (
                  Get-Date
              ).ToUniversalTime().ToString('o')

              image_name = 'windows-rdp.vhdx'

              notes = 'Persistence test: Windows runner system disk captured with Disk2vhd, encrypted, split, and stored in GitHub Release.'
          }

          $manifestPath = "$env:BACKUP_ROOT\$env:BACKUP_MANIFEST_NAME"

          $manifest |
            ConvertTo-Json -Depth 5 |
            Set-Content `
              -LiteralPath $manifestPath `
              -Encoding utf8

          Write-Host ''
          Write-Host 'Backup manifest:'
          Write-Host '--------------------------------------------------'

          Get-Content `
            -LiteralPath $manifestPath

          Write-Host '--------------------------------------------------'


      # ======================================================================
      # 19. Create Fixed GitHub Release If Needed
      # ======================================================================

      - name: 19. Create Fixed GitHub Release If Needed
        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          cmd.exe /c "gh release view `"$env:BACKUP_RELEASE_TAG`" >nul 2>nul"

          $releaseExitCode = $LASTEXITCODE

          if ($releaseExitCode -ne 0) {

              Write-Host 'Persistent release does not exist.'
              Write-Host 'Creating it now...'

              gh release create `
                $env:BACKUP_RELEASE_TAG `
                --title 'Windows RDP Persistent Backup' `
                --notes 'Latest encrypted Windows persistence-test image.'

              if ($LASTEXITCODE -ne 0) {
                  throw 'Failed to create persistent GitHub Release.'
              }
          }
          else {

              Write-Host 'Persistent GitHub Release already exists.'
          }


      # ======================================================================
      # 20. Upload New Backup Parts and Manifest
      # ======================================================================

      - name: 20. Upload New Backup Parts
        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $partsDir = "$env:BACKUP_ROOT\parts"

          $manifestPath = "$env:BACKUP_ROOT\$env:BACKUP_MANIFEST_NAME"

          $parts = Get-ChildItem `
            -LiteralPath $partsDir `
            -File |
            Sort-Object Name

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Cyan
          Write-Host 'UPLOADING BACKUP' -ForegroundColor Cyan
          Write-Host '==================================================' -ForegroundColor Cyan

          Write-Host "Uploading $($parts.Count) parts..."

          foreach ($part in $parts) {

              Write-Host "Uploading: $($part.Name)"

              gh release upload `
                $env:BACKUP_RELEASE_TAG `
                $part.FullName `
                --clobber

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to upload $($part.Name)"
              }
          }

          Write-Host "Uploading manifest..."

          gh release upload `
            $env:BACKUP_RELEASE_TAG `
            $manifestPath `
            --clobber

          if ($LASTEXITCODE -ne 0) {
              throw 'Failed to upload backup manifest.'
          }

          Write-Host 'Backup upload completed.'


      # ======================================================================
      # 21. Remove Stale Backup Assets
      # ======================================================================

      - name: 21. Remove Stale Backup Assets
        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'

          $currentGeneration = [string]$env:BACKUP_GENERATION

          $release = (
              gh release view `
                $env:BACKUP_RELEASE_TAG `
                --json assets |
              ConvertFrom-Json
          )

          foreach ($asset in $release.assets) {

              $name = [string]$asset.name

              if (
                  $name -like 'windows-rdp-*-part-*' -and
                  $name -notlike "windows-rdp-$currentGeneration-part-*"
              ) {

                  Write-Host "Deleting stale asset: $name"

                  gh release delete-asset `
                    $env:BACKUP_RELEASE_TAG `
                    $name `
                    --yes
              }
          }


      # ======================================================================
      # 22. Verify Published Backup
      # ======================================================================

      - name: 22. Verify Published Backup
        if: steps.keep_alive.outcome == 'success' && (steps.detect_backup.outputs.HAS_BACKUP == 'true' || steps.capture_image.outcome == 'success')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $release = (
              gh release view `
                $env:BACKUP_RELEASE_TAG `
                --json assets |
              ConvertFrom-Json
          )

          $manifestAsset = $release.assets |
            Where-Object {
                $_.name -eq $env:BACKUP_MANIFEST_NAME
            }

          if ($null -eq $manifestAsset) {
              throw 'Published release manifest was not found.'
          }

          $prefix = [string]$env:BACKUP_PREFIX

          $parts = $release.assets |
            Where-Object {
                $_.name -like "$prefix*"
            }

          if ($parts.Count -ne [int]$env:BACKUP_PART_COUNT) {
              throw "Published part count mismatch. Expected $env:BACKUP_PART_COUNT, found $($parts.Count)."
          }

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'PUBLISHED BACKUP VERIFIED' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green

          Write-Host "Release    : $env:BACKUP_RELEASE_TAG"
          Write-Host "Generation : $env:BACKUP_GENERATION"
          Write-Host "Parts      : $($parts.Count)"
          Write-Host "SHA256     : $env:ARCHIVE_SHA256"
          Write-Host '==================================================' -ForegroundColor Green


      # ======================================================================
      # 23. Cleanup Large Local Files
      # ======================================================================

      - name: 23. Cleanup Large Local Files
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ''
          Write-Host 'Cleaning local large files...'

          Remove-Item `
            "$env:BACKUP_ROOT\windows-rdp.vhdx.7z" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$env:BACKUP_ROOT\image\windows-rdp.vhdx" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$env:BACKUP_ROOT\download" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$env:BACKUP_ROOT\parts" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host 'Cleanup completed.'


      # ======================================================================
      # 24. Final Summary
      # ======================================================================

      - name: 24. Final Summary
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host ''
          Write-Host '==================================================' -ForegroundColor Green
          Write-Host 'FINAL WINDOWS RDP PERSISTENCE TEST SUMMARY' -ForegroundColor Green
          Write-Host '==================================================' -ForegroundColor Green

          Write-Host "Run ID             : $env:GITHUB_RUN_ID"
          Write-Host "Runner              : $env:RUNNER_OS"

          Write-Host "Existing Backup     : ${{ steps.detect_backup.outputs.HAS_BACKUP }}"

          Write-Host "Keep Alive          : ${{ steps.keep_alive.outcome }}"

          Write-Host "Image Capture       : ${{ steps.capture_image.outcome }}"

          Write-Host "Release Tag         : $env:BACKUP_RELEASE_TAG"

          Write-Host "Session Minutes     : $env:SESSION_MINUTES"

          Write-Host "Part Size Maximum   : $env:BACKUP_PART_BYTES bytes"

          Write-Host "Backup Generation   : $env:BACKUP_GENERATION"

          Write-Host ''
          Write-Host 'Persistence test:'

          if ('${{ steps.detect_backup.outputs.HAS_BACKUP }}' -eq 'true') {

              Write-Host '  RESTORE MODE' -ForegroundColor Cyan
              Write-Host '  The previous Windows image was restored into QEMU.'
              Write-Host '  The Desktop persistence test file should exist inside the guest.'
          }
          else {

              Write-Host '  FIRST-RUN MODE' -ForegroundColor Cyan
              Write-Host '  A Desktop persistence test file was created.'
              Write-Host '  The file was included in the VHDX capture.'
          }

          Write-Host '==================================================' -ForegroundColor Green
