name: OmniRoute CI Gateway Win (GitHub Windows 2022)

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

  push:
    branches:
      - "Omniroute_Windows"

concurrency:
  group: omniroute-ci-gateway-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-omniroute:

    # GitHub-hosted Windows runner.
    # NOT self-hosted.
    runs-on: windows-2022

    # GitHub-hosted jobs have a maximum execution time of 6 hours.
    timeout-minutes: 360

    steps:

      # ==============================================================
      # 1. Checkout Repository
      # ==============================================================

      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GIT_TOKEN || github.token }}

      # ==============================================================
      # 2. Verify Windows Host Prerequisites
      # ==============================================================

      - name: 2. Verify Windows Host Prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING GITHUB-HOSTED WINDOWS RUNNER"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber |
            Format-List

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Architecture:"
          Write-Host `
            ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "Git LFS:"
          git lfs version

          Write-Host ""
          Write-Host "Docker:"
          docker --version

          Write-Host ""
          Write-Host "Docker Compose:"
          docker compose version

          Write-Host ""
          Write-Host "SQLite:"
          if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {
              sqlite3 --version
          }
          else {
              Write-Warning `
                "sqlite3.exe was not found. WAL checkpoint will be skipped."
          }

          Write-Host ""
          Write-Host "Docker Engine:"
          docker info |
            Select-String "Server Version|Operating System|OSType"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "HOST PREREQUISITES VERIFIED"
          Write-Host "=================================================="

      # ==============================================================
      # 3. Connect Tailscale
      # ==============================================================

      - name: 3. Connect Tailscale VPN
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: omniroute-ci-gateway

      # ==============================================================
      # 3A. Verify Tailscale
      # ==============================================================

      - name: 3A. Verify Tailscale Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING TAILSCALE"
          Write-Host "=================================================="

          $tailscale = Get-Command `
            tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
              throw "tailscale.exe was not found."
          }

          Write-Host ""
          Write-Host "Tailscale version:"
          tailscale version

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          $tailscaleIp = (
              & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
              throw "Unable to determine Tailscale IPv4 address."
          }

          Write-Host $tailscaleIp

          Write-Host ""
          Write-Host "Tailscale status:"
          tailscale status --peers=false

          Write-Host ""
          Write-Host "MagicDNS hostname:"
          Write-Host "omniroute-ci-gateway"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "TAILSCALE CONNECTED"
          Write-Host "=================================================="
          
      # ==============================================================
      # 4. Enable SSH Access
      # ==============================================================

      - name: 4. Enable SSH Access
        shell: powershell
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "CONFIGURING WINDOWS OPENSSH"
          Write-Host "=================================================="

          # ------------------------------------------------------------
          # Validate secrets
          # ------------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($env:SSH_USERNAME)) {
              throw "SSH_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:SSH_PASSWORD)) {
              throw "SSH_PASSWORD secret is missing."
          }

          # ------------------------------------------------------------
          # Validate password against Windows complexity requirements
          # ------------------------------------------------------------

          $password = $env:SSH_PASSWORD

          if ($password.Length -lt 16) {
              throw "SSH_PASSWORD must be at least 16 characters long. Recommended: 20-24 characters."
          }

          if ($password -notmatch '[A-Z]') {
              throw "SSH_PASSWORD must contain at least one uppercase letter."
          }

          if ($password -notmatch '[a-z]') {
              throw "SSH_PASSWORD must contain at least one lowercase letter."
          }

          if ($password -notmatch '\d') {
              throw "SSH_PASSWORD must contain at least one number."
          }

          if ($password -notmatch '[^a-zA-Z0-9]') {
              throw "SSH_PASSWORD must contain at least one special character."
          }

          Write-Host "SSH password policy pre-check: PASSED"

          # ------------------------------------------------------------
          # Install OpenSSH Server
          # ------------------------------------------------------------

          $sshCapability = Get-WindowsCapability -Online |
              Where-Object {
                  $_.Name -eq "OpenSSH.Server~~~~0.0.1.0"
              }

          if ($null -eq $sshCapability) {
              throw "OpenSSH Server capability was not found."
          }

          if ($sshCapability.State -ne "Installed") {

              Write-Host "Installing OpenSSH Server..."

              Add-WindowsCapability `
                  -Online `
                  -Name "OpenSSH.Server~~~~0.0.1.0"

              if ($LASTEXITCODE -ne 0) {
                  throw "OpenSSH Server installation failed."
              }
          }
          else {

              Write-Host "OpenSSH Server already installed."
          }

          # ------------------------------------------------------------
          # OpenSSH paths
          # ------------------------------------------------------------

          $sshRoot = Join-Path $env:ProgramData "ssh"
          $configFile = Join-Path $sshRoot "sshd_config"
          $logDirectory = Join-Path $sshRoot "logs"

          $sshdExe = Join-Path `
              $env:WINDIR `
              "System32\OpenSSH\sshd.exe"

          $sshKeygenExe = Join-Path `
              $env:WINDIR `
              "System32\OpenSSH\ssh-keygen.exe"

          if (-not (Test-Path $sshdExe)) {
              throw "sshd.exe was not found at $sshdExe"
          }

          # ------------------------------------------------------------
          # Create directories
          # ------------------------------------------------------------

          New-Item `
              -ItemType Directory `
              -Path $sshRoot `
              -Force |
              Out-Null

          New-Item `
              -ItemType Directory `
              -Path $logDirectory `
              -Force |
              Out-Null

          # ------------------------------------------------------------
          # Create or update SSH user
          # ------------------------------------------------------------

          $securePassword = ConvertTo-SecureString `
              $env:SSH_PASSWORD `
              -AsPlainText `
              -Force

          $existingUser = Get-LocalUser `
              -Name $env:SSH_USERNAME `
              -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

              Write-Host "Creating SSH user..."

              New-LocalUser `
                  -Name $env:SSH_USERNAME `
                  -Password $securePassword `
                  -Description "GitHub Actions OmniRoute SSH user" `
                  -AccountNeverExpires `
                  -PasswordNeverExpires |
                  Out-Null
          }
          else {

              Write-Host "Updating SSH user password..."

              Set-LocalUser `
                  -Name $env:SSH_USERNAME `
                  -Password $securePassword

              Enable-LocalUser `
                  -Name $env:SSH_USERNAME
          }

          # ------------------------------------------------------------
          # Add SSH user to Administrators
          # ------------------------------------------------------------

          $adminGroup = Get-LocalGroup `
              -SID "S-1-5-32-544"

          $isAdmin = Get-LocalGroupMember `
              -Group $adminGroup.Name `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -eq "$env:COMPUTERNAME\$env:SSH_USERNAME"
              }

          if ($null -eq $isAdmin) {

              Write-Host "Adding SSH user to Administrators..."

              Add-LocalGroupMember `
                  -Group $adminGroup.Name `
                  -Member $env:SSH_USERNAME
          }

          # ------------------------------------------------------------
          # Generate OpenSSH host keys
          #
          # ssh-keygen -A generates missing host keys automatically.
          # ------------------------------------------------------------

          Write-Host ""
          Write-Host "Generating OpenSSH host keys..."

          & $sshKeygenExe -A

          if ($LASTEXITCODE -ne 0) {
              throw "OpenSSH host key generation failed."
          }

          # ------------------------------------------------------------
          # Create complete sshd_config
          #
          # Do NOT rely on the automatically generated configuration.
          # Do NOT use KbdInteractiveAuthentication because the
          # Microsoft Windows OpenSSH build does not support it.
          # ------------------------------------------------------------

          $configContent = @"
          Port 22
          ListenAddress 0.0.0.0

          PubkeyAuthentication yes
          PasswordAuthentication yes

          PermitEmptyPasswords no

          MaxAuthTries 3
          LoginGraceTime 30

          AllowTcpForwarding no
          AllowAgentForwarding no

          HostKey C:/ProgramData/ssh/ssh_host_rsa_key
          HostKey C:/ProgramData/ssh/ssh_host_ecdsa_key
          HostKey C:/ProgramData/ssh/ssh_host_ed25519_key

          Subsystem sftp sftp-server.exe
          "@

          Write-Host ""
          Write-Host "Writing OpenSSH configuration..."

          Set-Content `
              -Path $configFile `
              -Value $configContent `
              -Encoding ascii `
              -Force

          # ------------------------------------------------------------
          # Show configuration path
          # ------------------------------------------------------------

          Write-Host ""
          Write-Host "OpenSSH configuration:"
          Write-Host $configFile

          # ------------------------------------------------------------
          # Validate configuration explicitly with -f
          # ------------------------------------------------------------

          Write-Host ""
          Write-Host "Validating OpenSSH configuration..."

          & $sshdExe `
              -t `
              -f $configFile

          if ($LASTEXITCODE -ne 0) {
              throw "OpenSSH configuration validation failed."
          }

          Write-Host `
              "OpenSSH configuration validation: PASSED" `
              -ForegroundColor Green

          # ------------------------------------------------------------
          # Configure OpenSSH service
          # ------------------------------------------------------------

          Set-Service `
              -Name sshd `
              -StartupType Automatic

          # ------------------------------------------------------------
          # Start / restart SSH service
          # ------------------------------------------------------------

          $sshService = Get-Service `
              -Name sshd `
              -ErrorAction SilentlyContinue

          if ($null -eq $sshService) {
              throw "sshd service was not found."
          }

          if ($sshService.Status -eq "Running") {

              Write-Host "Restarting sshd..."

              Restart-Service `
                  -Name sshd `
                  -Force
          }
          else {

              Write-Host "Starting sshd..."

              Start-Service `
                  -Name sshd
          }

          Start-Sleep -Seconds 2

          $sshService = Get-Service `
              -Name sshd

          if ($sshService.Status -ne "Running") {
              throw "OpenSSH service failed to start."
          }

          # ------------------------------------------------------------
          # Configure Windows Firewall
          # ------------------------------------------------------------

          $firewallRule = Get-NetFirewallRule `
              -Name "OpenSSH-Server-In-TCP" `
              -ErrorAction SilentlyContinue

          if ($null -eq $firewallRule) {

              Write-Host "Creating SSH firewall rule..."

              New-NetFirewallRule `
                  -Name "OpenSSH-Server-In-TCP" `
                  -DisplayName "OpenSSH Server (TCP 22)" `
                  -Enabled True `
                  -Direction Inbound `
                  -Protocol TCP `
                  -LocalPort 22 `
                  -Action Allow |
                  Out-Null
          }
          else {

              Enable-NetFirewallRule `
                  -Name "OpenSSH-Server-In-TCP"
          }

          # ------------------------------------------------------------
          # Verify port 22
          # ------------------------------------------------------------

          Write-Host ""
          Write-Host "Checking TCP port 22..."

          $sshPort = $null

          for ($i = 1; $i -le 15; $i++) {

              $sshPort = Get-NetTCPConnection `
                  -LocalPort 22 `
                  -State Listen `
                  -ErrorAction SilentlyContinue

              if ($null -ne $sshPort) {
                  break
              }

              Start-Sleep -Seconds 1
          }

          if ($null -eq $sshPort) {

              Write-Host ""
              Write-Host "sshd service:"
              Get-Service sshd

              Write-Host ""
              Write-Host "OpenSSH logs:"

              if (Test-Path $logDirectory) {
                  Get-ChildItem $logDirectory -ErrorAction SilentlyContinue |
                      Select-Object Name, Length, LastWriteTime |
                      Format-Table
              }

              throw "OpenSSH is running but TCP port 22 is not listening."
          }

          # ------------------------------------------------------------
          # Final result
          # ------------------------------------------------------------

          Write-Host ""
          Write-Host "==================================================" `
              -ForegroundColor Green

          Write-Host "OPENSSH READY" `
              -ForegroundColor Green

          Write-Host "==================================================" `
              -ForegroundColor Green

          Write-Host ""
          Write-Host "SSH service : $($sshService.Status)"
          Write-Host "SSH port    : 22 LISTENING"
          Write-Host "SSH user    : $env:SSH_USERNAME"
          Write-Host "SSH host    : omniroute-ci-gateway"

          Write-Host ""
          Write-Host "SSH command:"
          Write-Host "ssh $env:SSH_USERNAME@omniroute-ci-gateway"
          
      # ==============================================================
      # 4A. Enable Remote Desktop
      # ==============================================================

      - name: 4A. Enable Remote Desktop
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "CONFIGURING WINDOWS REMOTE DESKTOP"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
              throw "RDP_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          # ------------------------------------------------------------
          # Validate password
          # ------------------------------------------------------------

          $password = $env:RDP_PASSWORD

          if ($password.Length -lt 16) {
              throw "RDP_PASSWORD must be at least 16 characters long. Recommended: 20-24 characters."
          }

          if ($password -notmatch '[A-Z]') {
              throw "RDP_PASSWORD must contain at least one uppercase letter."
          }

          if ($password -notmatch '[a-z]') {
              throw "RDP_PASSWORD must contain at least one lowercase letter."
          }

          if ($password -notmatch '\d') {
              throw "RDP_PASSWORD must contain at least one number."
          }

          if ($password -notmatch '[^a-zA-Z0-9]') {
              throw "RDP_PASSWORD must contain at least one special character."
          }

          Write-Host "RDP password policy pre-check: PASSED"

          # ------------------------------------------------------------
          # Enable Remote Desktop
          # ------------------------------------------------------------

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          # ------------------------------------------------------------
          # Enable firewall rules
          # ------------------------------------------------------------

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          # ------------------------------------------------------------
          # Configure service
          # ------------------------------------------------------------

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          $service = Get-Service `
            -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw "TermService is not running."
          }

          # ------------------------------------------------------------
          # Create/update RDP account
          # ------------------------------------------------------------

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

              Write-Host "Creating RDP user..."

              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description "GitHub Actions RDP Administrator" |
                Out-Null
          }
          else {

              Write-Host "Updating RDP user password..."

              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword

              Enable-LocalUser `
                -Name $env:RDP_USERNAME
          }

          # ------------------------------------------------------------
          # Add to Administrators
          # ------------------------------------------------------------

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          # ------------------------------------------------------------
          # Add to Remote Desktop Users
          # ------------------------------------------------------------

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Remote Desktop enabled." -ForegroundColor Green
          Write-Host "RDP user: $env:RDP_USERNAME"

      # ==============================================================
      # 4B. Verify Remote Desktop
      # ==============================================================

      - name: 4B. Verify Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING REMOTE DESKTOP"
          Write-Host "=================================================="

          $rdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($rdpDenied -ne 0) {
              throw "RDP is disabled."
          }

          $nla = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication'

          if ($nla -ne 1) {
              throw "RDP Network Level Authentication is not enabled."
          }

          $service = Get-Service `
            -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw "TermService is not running."
          }

          $firewallRules = Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq 'True'

          if ($null -eq $firewallRules) {
              throw "Remote Desktop firewall rules are not enabled."
          }

          $rdpPort = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $rdpPort) {
              throw "TCP 3389 is not listening."
          }

          Write-Host "RDP service : Running" -ForegroundColor Green
          Write-Host "RDP registry: Enabled" -ForegroundColor Green
          Write-Host "RDP NLA     : Enabled" -ForegroundColor Green
          Write-Host "RDP firewall: Enabled" -ForegroundColor Green
          Write-Host "RDP port    : Listening" -ForegroundColor Green

      # ==============================================================
      # 4C. Display RDP Connection Information
      # ==============================================================

      - name: 4C. Display Remote Desktop Connection Information
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "REMOTE DESKTOP IS READY"
          Write-Host "==================================================" -ForegroundColor Green

          $tailscale = Get-Command `
            tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
              throw "tailscale.exe was not found."
          }

          $tailscaleIp = (
              & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
              throw "Tailscale IP could not be detected."
          }

          Write-Host ""
          Write-Host "Tailscale IP : $tailscaleIp" -ForegroundColor Yellow
          Write-Host "RDP endpoint : ${tailscaleIp}:3389" -ForegroundColor Yellow
          Write-Host "RDP hostname : omniroute-ci-gateway" -ForegroundColor Yellow

          Write-Host ""
          Write-Host "RDP command:" -ForegroundColor Magenta
          Write-Host "mstsc /v:omniroute-ci-gateway" -ForegroundColor Magenta

          Write-Host ""
          Write-Host "RDP Username : $env:RDP_USERNAME"

          Write-Host ""
          Write-Host "WARNING:"
          Write-Host "This is an ephemeral GitHub-hosted VM."
          Write-Host "RDP exists only while this workflow job is alive."

      # ==============================================================
      # 5. Start Redis
      # ==============================================================

      - name: 5. Start Redis Container
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING REDIS"
          Write-Host "=================================================="

          docker rm -f omniroute-redis 2>$null

          if ($LASTEXITCODE -ne 0) {
              $global:LASTEXITCODE = 0
          }

          docker run -d `
            --name omniroute-redis `
            --restart unless-stopped `
            -p 6379:6379 `
            --health-cmd "redis-cli ping" `
            --health-interval 10s `
            --health-timeout 5s `
            --health-retries 3 `
            redis:7-alpine

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to start Redis."
          }

          Write-Host "Waiting for Redis..."

          $redisReady = $false

          for ($i = 1; $i -le 30; $i++) {

              $health = docker inspect `
                --format "{{.State.Health.Status}}" `
                omniroute-redis `
                2>$null

              if ($health -eq "healthy") {

                  $redisReady = $true
                  break
              }

              Start-Sleep -Seconds 2
          }

          if (-not $redisReady) {

              Write-Host "Redis failed to become healthy."

              docker ps -a `
                --filter "name=omniroute-redis"

              docker logs omniroute-redis

              throw "Redis health check failed."
          }

          docker ps `
            --filter "name=omniroute-redis"

          Write-Host "Redis is healthy." -ForegroundColor Green

      # ==============================================================
      # 6. Start OmniRoute
      # ==============================================================

      - name: 6. Start OmniRoute Container
        shell: powershell
        env:
          OMNI_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OMNI_API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          OMNI_STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING OMNIROUTE"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:OMNI_JWT_SECRET)) {
              throw "JWT_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_API_KEY_SECRET)) {
              throw "API_KEY_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_STORAGE_ENCRYPTION_KEY)) {
              throw "STORAGE_ENCRYPTION_KEY secret is missing."
          }

          docker rm -f omniroute 2>$null

          if ($LASTEXITCODE -ne 0) {
              $global:LASTEXITCODE = 0
          }

          $workspace = "${{ github.workspace }}"

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $workspace

          docker run -d `
            --name omniroute `
            --restart unless-stopped `
            -p 20128:20128 `
            -e "NODE_ENV=production" `
            -e "JWT_SECRET=$env:OMNI_JWT_SECRET" `
            -e "API_KEY_SECRET=$env:OMNI_API_KEY_SECRET" `
            -e "STORAGE_ENCRYPTION_KEY=$env:OMNI_STORAGE_ENCRYPTION_KEY" `
            -e "REDIS_URL=redis://host.docker.internal:6379" `
            --add-host=host.docker.internal:host-gateway `
            -v "${workspace}:/root/.omniroute" `
            -v "${workspace}:/app/data" `
            diegosouzapw/omniroute:latest

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to start OmniRoute."
          }

          Write-Host ""
          Write-Host "OmniRoute container started."

          docker ps `
            --filter "name=omniroute"

      # ==============================================================
      # 6A. Verify OmniRoute Container
      # ==============================================================

      - name: 6A. Verify OmniRoute Container
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING OMNIROUTE CONTAINER"
          Write-Host "=================================================="

          $running = docker inspect `
            --format "{{.State.Running}}" `
            omniroute `
            2>$null

          if ($running -ne "true") {

              Write-Host "OmniRoute is not running."

              docker ps -a `
                --filter "name=omniroute"

              docker logs omniroute

              throw "OmniRoute container is not running."
          }

          Write-Host `
            "OmniRoute container: Running" `
            -ForegroundColor Green

      # ==============================================================
      # 7. Verify OmniRoute HTTP Health
      # ==============================================================

      - name: 7. Verify OmniRoute Health
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "WAITING FOR OMNIROUTE GATEWAY"
          Write-Host "=================================================="

          $success = $false

          for ($i = 1; $i -le 60; $i++) {

              try {

                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:20128" `
                    -UseBasicParsing `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  if (
                    $response.StatusCode -ge 200 -and
                    $response.StatusCode -lt 500
                  ) {

                      $success = $true
                      break
                  }
              }
              catch {
                  # Still initializing.
              }

              Write-Host "Waiting... ($i/60)"
              Start-Sleep -Seconds 2
          }

          if (-not $success) {

              Write-Host ""
              Write-Host "OmniRoute initialization failed."

              docker ps -a `
                --filter "name=omniroute"

              Write-Host ""
              Write-Host "OmniRoute logs:"

              docker logs omniroute

              throw "OmniRoute health check failed."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "OMNIROUTE GATEWAY LIVE"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Dashboard:"
          Write-Host "http://omniroute-ci-gateway:20128"

          Write-Host ""
          Write-Host "API Endpoint:"
          Write-Host "http://omniroute-ci-gateway:20128/v1"

          Write-Host ""
          Write-Host "Local Endpoint:"
          Write-Host "http://localhost:20128/v1"

          Write-Host ""
          Write-Host "=================================================="

      # ==============================================================
      # 8. Keep Alive + SQLite Persistence
      #
      # IMPORTANT:
      # SQLite is pushed to Git every 5 minutes.
      # This protects against normal workflow cancellation.
      # ==============================================================

      - name: 8. Keep-Alive + Periodic SQLite Persistence
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          $workspace = "${{ github.workspace }}"
          $dbFile = Join-Path $workspace "storage.sqlite"
          $archive = Join-Path `
            $workspace `
            "backup/omniroute/omniroute-full-backup.tar.gz"

          $syncIntervalMinutes = 5
          $syncCounter = 0
          $totalMinutes = 355

          # ------------------------------------------------------------
          # Git identity
          # ------------------------------------------------------------

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
              $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $workspace "backup/omniroute") `
            -Force |
            Out-Null

          function Sync-OmniRouteState {

              Write-Host ""
              Write-Host "==================================================" `
                -ForegroundColor Cyan

              Write-Host "PERSISTING OMNIROUTE STATE" `
                -ForegroundColor Cyan

              Write-Host "==================================================" `
                -ForegroundColor Cyan

              if (-not (Test-Path $dbFile)) {

                  Write-Warning `
                    "storage.sqlite does not exist yet."

                  return
              }

              # --------------------------------------------------------
              # SQLite WAL checkpoint
              # --------------------------------------------------------

              if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

                  Write-Host "Running SQLite WAL checkpoint..."

                  sqlite3 `
                    $dbFile `
                    "PRAGMA wal_checkpoint(TRUNCATE);"

                  if ($LASTEXITCODE -ne 0) {

                      Write-Warning `
                        "SQLite WAL checkpoint failed."
                  }
                  else {

                      Write-Host `
                        "SQLite WAL checkpoint completed." `
                        -ForegroundColor Green
                  }
              }
              else {

                  Write-Warning `
                    "sqlite3.exe unavailable. WAL checkpoint skipped."
              }

              # --------------------------------------------------------
              # Create backup archive
              # --------------------------------------------------------

              $tarItems = @()

              if (Test-Path "storage.sqlite") {
                  $tarItems += "storage.sqlite"
              }

              if (Test-Path "storage.sqlite-wal") {
                  $tarItems += "storage.sqlite-wal"
              }

              if (Test-Path "storage.sqlite-shm") {
                  $tarItems += "storage.sqlite-shm"
              }

              if (Test-Path "db_backups") {
                  $tarItems += "db_backups"
              }

              if ($tarItems.Count -gt 0) {

                  Remove-Item `
                    $archive `
                    -Force `
                    -ErrorAction SilentlyContinue

                  tar -czf $archive `
                    --exclude=logs `
                    --exclude=call_logs `
                    --exclude=server `
                    @tarItems

                  if ($LASTEXITCODE -ne 0) {

                      Write-Warning `
                        "Backup archive creation failed."
                  }
              }

              # --------------------------------------------------------
              # Stage files
              # --------------------------------------------------------

              git add `
                .gitattributes `
                storage.sqlite `
                storage.sqlite-wal `
                storage.sqlite-shm `
                backup/omniroute/omniroute-full-backup.tar.gz `
                db_backups/ `
                2>$null

              git diff --cached --quiet

              $hasChanges = ($LASTEXITCODE -ne 0)

              if (-not $hasChanges) {

                  Write-Host `
                    "No SQLite changes detected."

                  return
              }

              # --------------------------------------------------------
              # Commit locally first
              # --------------------------------------------------------

              git commit `
                -m "chore: persist OmniRoute SQLite state [skip ci]" `
                2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning `
                    "Git commit failed."

                  return
              }

              # --------------------------------------------------------
              # Fetch remote branch
              # --------------------------------------------------------

              git fetch origin "${{ github.ref_name }}" 2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning `
                    "git fetch failed."

                  return
              }

              # --------------------------------------------------------
              # Rebase local state over remote
              # --------------------------------------------------------

              git rebase `
                "origin/${{ github.ref_name }}" `
                2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning `
                    "Git rebase failed."

                  git rebase --abort 2>$null

                  return
              }

              # --------------------------------------------------------
              # Push
              # --------------------------------------------------------

              git push `
                origin `
                "HEAD:${{ github.ref_name }}" `
                2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning `
                    "Git push failed."
              }
              else {

                  Write-Host ""
                  Write-Host `
                    "SQLite state successfully persisted to GitHub." `
                    -ForegroundColor Green
              }
          }

          Write-Host ""
          Write-Host "==================================================" `
            -ForegroundColor Green

          Write-Host "355-MINUTE KEEP-ALIVE STARTED" `
            -ForegroundColor Green

          Write-Host "SQLite persistence interval: 5 minutes" `
            -ForegroundColor Green

          Write-Host "==================================================" `
            -ForegroundColor Green

          for ($minute = 1; $minute -le $totalMinutes; $minute++) {

              Start-Sleep -Seconds 60

              $syncCounter++

              # --------------------------------------------------------
              # Persist every 5 minutes
              # --------------------------------------------------------

              if ($syncCounter -ge $syncIntervalMinutes) {

                  $syncCounter = 0

                  Sync-OmniRouteState
              }

              # --------------------------------------------------------
              # Diagnostics every 10 minutes
              # --------------------------------------------------------

              if (($minute % 10) -eq 0) {

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] OmniRoute:"

                  docker ps `
                    --filter "name=omniroute" `
                    --format "Status: {{.Status}}" `
                    2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] Redis:"

                  docker ps `
                    --filter "name=omniroute-redis" `
                    --format "Status: {{.Status}}" `
                    2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] Tailscale:"

                  tailscale status `
                    --peers=false `
                    2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] RDP:"

                  $rdpService = Get-Service `
                    -Name 'TermService' `
                    -ErrorAction SilentlyContinue

                  if ($null -ne $rdpService) {

                      Write-Host `
                        "TermService: $($rdpService.Status)"
                  }

                  $rdpPort = Get-NetTCPConnection `
                    -LocalPort 3389 `
                    -State Listen `
                    -ErrorAction SilentlyContinue

                  if ($null -ne $rdpPort) {

                      Write-Host `
                        "RDP TCP 3389: LISTENING"
                  }
                  else {

                      Write-Warning `
                        "RDP TCP 3389 is not listening."
                  }
              }
          }

          # Final sync before normal completion.
          Sync-OmniRouteState

      # ==============================================================
      # 9. Final Shutdown
      #
      # always() gives us a final cancellation-time persistence attempt.
      # ==============================================================

      - name: 9. Final SQLite Checkpoint and Shutdown
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "==================================================" `
            -ForegroundColor Yellow

          Write-Host "FINAL SQLITE CHECKPOINT + SHUTDOWN" `
            -ForegroundColor Yellow

          Write-Host "==================================================" `
            -ForegroundColor Yellow

          # ------------------------------------------------------------
          # Stop OmniRoute
          # ------------------------------------------------------------

          Write-Host ""
          Write-Host "Stopping OmniRoute..."

          docker stop omniroute 2>$null

          docker rm omniroute 2>$null

          # ------------------------------------------------------------
          # Stop Redis
          # ------------------------------------------------------------

          Write-Host ""
          Write-Host "Stopping Redis..."

          docker stop omniroute-redis 2>$null

          docker rm omniroute-redis 2>$null

          # ------------------------------------------------------------
          # Final SQLite checkpoint
          # ------------------------------------------------------------

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          if (Test-Path $dbFile) {

              Write-Host ""
              Write-Host "SQLite database found."

              Get-Item $dbFile |
                Select-Object FullName, Length, LastWriteTime |
                Format-List

              if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

                  Write-Host ""
                  Write-Host "Running final WAL checkpoint..."

                  sqlite3 `
                    $dbFile `
                    "PRAGMA wal_checkpoint(TRUNCATE);"

                  if ($LASTEXITCODE -eq 0) {

                      Write-Host `
                        "Final SQLite checkpoint completed." `
                        -ForegroundColor Green
                  }
                  else {

                      Write-Warning `
                        "Final SQLite checkpoint failed."
                  }
              }
              else {

                  Write-Warning `
                    "sqlite3.exe was not found."
              }
          }
          else {

              Write-Warning `
                "storage.sqlite was not found."
          }

      # ==============================================================
      # 10. Final GitHub Persistence
      #
      # This is the last attempt after normal completion,
      # failure, or cancellation.
      # ==============================================================

      - name: 10. Final GitHub Persistence
        if: always()
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "==================================================" `
            -ForegroundColor Yellow

          Write-Host "FINAL GITHUB SQLITE PUSH" `
            -ForegroundColor Yellow

          Write-Host "==================================================" `
            -ForegroundColor Yellow

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
              $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          New-Item `
            -ItemType Directory `
            -Path "backup/omniroute" `
            -Force |
            Out-Null

          # ------------------------------------------------------------
          # SQLite checkpoint one last time
          # ------------------------------------------------------------

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          if (Test-Path $dbFile) {

              if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

                  sqlite3 `
                    $dbFile `
                    "PRAGMA wal_checkpoint(TRUNCATE);"
              }
          }

          # ------------------------------------------------------------
          # Create final archive
          # ------------------------------------------------------------

          $archive = `
            "backup/omniroute/omniroute-full-backup.tar.gz"

          $tarItems = @()

          if (Test-Path "storage.sqlite") {
              $tarItems += "storage.sqlite"
          }

          if (Test-Path "storage.sqlite-wal") {
              $tarItems += "storage.sqlite-wal"
          }

          if (Test-Path "storage.sqlite-shm") {
              $tarItems += "storage.sqlite-shm"
          }

          if (Test-Path "db_backups") {
              $tarItems += "db_backups"
          }

          if ($tarItems.Count -gt 0) {

              Remove-Item `
                $archive `
                -Force `
                -ErrorAction SilentlyContinue

              tar -czf $archive `
                --exclude=logs `
                --exclude=call_logs `
                --exclude=server `
                @tarItems
          }

          # ------------------------------------------------------------
          # Stage
          # ------------------------------------------------------------

          git add `
            .gitattributes `
            storage.sqlite `
            storage.sqlite-wal `
            storage.sqlite-shm `
            backup/omniroute/omniroute-full-backup.tar.gz `
            db_backups/ `
            2>$null

          git diff --cached --quiet

          $hasChanges = ($LASTEXITCODE -ne 0)

          if (-not $hasChanges) {

              Write-Host ""
              Write-Host `
                "No final database changes detected."

              exit 0
          }

          # ------------------------------------------------------------
          # Commit
          # ------------------------------------------------------------

          git commit `
            -m "chore: final OmniRoute DB state backup [skip ci]" `
            2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                "Final Git commit failed."

              exit 0
          }

          # ------------------------------------------------------------
          # Fetch remote branch
          # ------------------------------------------------------------

          git fetch origin "${{ github.ref_name }}" 2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                "Final git fetch failed."

              exit 0
          }

          # ------------------------------------------------------------
          # Rebase
          # ------------------------------------------------------------

          git rebase `
            "origin/${{ github.ref_name }}" `
            2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                "Final git rebase failed."

              git rebase --abort 2>$null

              exit 0
          }

          # ------------------------------------------------------------
          # Push
          # ------------------------------------------------------------

          git push `
            origin `
            "HEAD:${{ github.ref_name }}" `
            2>$null

          if ($LASTEXITCODE -eq 0) {

              Write-Host ""
              Write-Host "==================================================" `
                -ForegroundColor Green

              Write-Host `
                "FINAL SQLITE STATE PUSHED SUCCESSFULLY" `
                -ForegroundColor Green

              Write-Host "=================================================="
          }
          else {

              Write-Warning `
                "Final GitHub push failed."
          }

      # ==============================================================
      # 11. Final Diagnostics
      # ==============================================================

      - name: 11. Final Diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "FINAL DIAGNOSTICS"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Git:"
          git status --short

          Write-Host ""
          Write-Host "Docker containers:"

          docker ps -a `
            --filter "name=omniroute"

          docker ps -a `
            --filter "name=omniroute-redis"

          Write-Host ""
          Write-Host "Tailscale:"
          tailscale status --peers=false 2>$null

          Write-Host ""
          Write-Host "SSH service:"

          Get-Service `
            -Name 'sshd' `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Status, StartType |
            Format-Table

          Write-Host ""
          Write-Host "RDP service:"

          Get-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Status, StartType |
            Format-Table

          Write-Host ""
          Write-Host "RDP port:"

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table

          Write-Host ""
          Write-Host "OmniRoute database:"

          Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Filter "storage.sqlite*" `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Format-Table

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "WORKFLOW FINISHED"
          Write-Host "=================================================="
