
name: OmniRoute Windows Gateway Win

on:
  workflow_dispatch:
    inputs:
      force_json_restore:
        description: "Force legacy JSON settings import even when existing database state is present"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - Omniroute_Windows

concurrency:
  group: omniroute-windows-gateway
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET_BRANCH: Omniroute_Windows

  OMNIROUTE_PORT: 20128
  RDP_PORT: 3389

  SQLITE_SYNC_INTERVAL_MINUTES: 5

  LEGACY_BACKUP_BRANCH: Omniroute_Windows
  LEGACY_BACKUP_PATH: db_backups/omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json

jobs:

  run-omniroute:

    runs-on: windows-2022

    timeout-minutes: 360

    steps:

      # ==============================================================
      # 1. Checkout repository
      # ==============================================================

      - name: 1. Checkout Omniroute_Windows
        uses: actions/checkout@v4
        with:
          ref: Omniroute_Windows
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GIT_TOKEN || github.token }}

      # ==============================================================
      # 2. Verify Windows Host
      # ==============================================================

      - name: 2. Verify Windows Host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING GITHUB WINDOWS RUNNER"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Windows:"

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber |
            Format-List

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Architecture:"

          Write-Host (
            [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          )

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "Git LFS:"
          git lfs version

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "HOST VERIFIED"
          Write-Host "=================================================="

      # ==============================================================
      # 3. Connect Tailscale
      # ==============================================================

      - name: 3. Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: omniroute-ci-gateway

      # ==============================================================
      # 3A. Verify Tailscale
      # ==============================================================

      - name: 3A. Verify Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = Get-Command `
            tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
            throw "tailscale.exe was not found."
          }

          $tailscaleIp = (
            & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
            throw "Unable to determine Tailscale IPv4."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "TAILSCALE READY"
          Write-Host "=================================================="

          Write-Host "Hostname : omniroute-ci-gateway"
          Write-Host "IPv4     : $tailscaleIp"

          Write-Host ""
          tailscale status --peers=false

      # ==============================================================
      # 4. Enable Remote Desktop
      # ==============================================================

      - name: 4. Enable Remote Desktop
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "CONFIGURING REMOTE DESKTOP"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
            throw "RDP_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $password = $env:RDP_PASSWORD

          if ($password.Length -lt 16) {
            throw "RDP_PASSWORD must be at least 16 characters."
          }

          if ($password -notmatch '[A-Z]') {
            throw "RDP_PASSWORD must contain an uppercase letter."
          }

          if ($password -notmatch '[a-z]') {
            throw "RDP_PASSWORD must contain a lowercase letter."
          }

          if ($password -notmatch '\d') {
            throw "RDP_PASSWORD must contain a number."
          }

          if ($password -notmatch '[^a-zA-Z0-9]') {
            throw "RDP_PASSWORD must contain a special character."
          }

          if (
            $password.IndexOf(
              $env:RDP_USERNAME,
              [System.StringComparison]::OrdinalIgnoreCase
            ) -ge 0
          ) {
            throw "RDP_PASSWORD must not contain RDP_USERNAME."
          }

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          $service = Get-Service `
            -Name 'TermService'

          if ($service.Status -ne 'Running') {
            throw "TermService is not running."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

            Write-Host "Creating RDP user..."

            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -Description "OmniRoute GitHub Actions RDP User" |
              Out-Null
          }
          else {

            Write-Host "Updating RDP user..."

            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword

            Enable-LocalUser `
              -Name $env:RDP_USERNAME
          }

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Remote Desktop configured." `
            -ForegroundColor Green

      # ==============================================================
      # 4A. Verify Remote Desktop
      # ==============================================================

      - name: 4A. Verify Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING REMOTE DESKTOP"
          Write-Host "=================================================="

          $rdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($rdpDenied -ne 0) {
            throw "RDP is disabled."
          }

          $nla = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication'

          if ($nla -ne 1) {
            throw "RDP NLA is disabled."
          }

          $service = Get-Service `
            -Name 'TermService'

          if ($service.Status -ne 'Running') {
            throw "TermService is not running."
          }

          $firewallRules = Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq 'True'

          if ($null -eq $firewallRules) {
            throw "Remote Desktop firewall rules are not enabled."
          }

          $port = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $port) {
            throw "TCP 3389 is not listening."
          }

          Write-Host ""
          Write-Host "RDP service : Running" -ForegroundColor Green
          Write-Host "RDP NLA     : Enabled" -ForegroundColor Green
          Write-Host "RDP firewall: Enabled" -ForegroundColor Green
          Write-Host "RDP 3389    : Listening" -ForegroundColor Green

      # ==============================================================
      # 4B. Display RDP Information
      # ==============================================================

      - name: 4B. Display RDP Information
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = Get-Command `
            tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
            throw "tailscale.exe was not found."
          }

          $tailscaleIp = (
            & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
            throw "Tailscale IP could not be detected."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "REMOTE DESKTOP READY"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Tailscale IP : $tailscaleIp"
          Write-Host "Hostname     : omniroute-ci-gateway"
          Write-Host "RDP Port     : 3389"

          Write-Host ""
          Write-Host "RDP command:"
          Write-Host "mstsc /v:omniroute-ci-gateway"

          Write-Host ""
          Write-Host "RDP Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "The GitHub-hosted VM is ephemeral."
          Write-Host "RDP exists only while this job is running."

      # ==============================================================
      # 5. Install Node.js LTS + Latest npm + OmniRoute
      #
      # IMPORTANT:
      # - Docker is intentionally not used.
      # - Node 24.x is the recommended OmniRoute runtime.
      # - npm is upgraded to the latest available release.
      # - OmniRoute postinstall warm-up is disabled for CI.
      # ==============================================================

      - name: 5. Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          check-latest: true
          cache: "npm"

      - name: 5A. Update npm and Install OmniRoute
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "INSTALLING NODE.JS LTS + LATEST NPM + OMNIROUTE"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Node.js:"
          node --version

          Write-Host ""
          Write-Host "npm before update:"
          npm --version

          Write-Host ""
          Write-Host "Updating npm to latest..."

          npm install --global npm@latest `
            --no-audit `
            --no-fund

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to update npm to the latest version."
          }

          Write-Host ""
          Write-Host "Node.js after npm update:"
          node --version

          Write-Host ""
          Write-Host "npm after update:"
          npm --version

          Write-Host ""
          Write-Host "Configuring OmniRoute for CI installation..."

          $env:OMNIROUTE_SKIP_POSTINSTALL = "1"

          npm config set audit false
          npm config set fund false

          Write-Host ""
          Write-Host "Installing latest OmniRoute..."

          npm install `
            --global `
            omniroute@latest `
            --no-audit `
            --no-fund `
            --loglevel warn

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install OmniRoute."
          }

          Write-Host ""
          Write-Host "Locating OmniRoute executable..."

          $omnirouteCommand = Get-Command `
            omniroute.cmd `
            -ErrorAction SilentlyContinue

          if ($null -eq $omnirouteCommand) {
            $omnirouteCommand = Get-Command `
              omniroute `
              -ErrorAction SilentlyContinue
          }

          if ($null -eq $omnirouteCommand) {
            throw "OmniRoute executable was not found after npm installation."
          }

          Write-Host ""
          Write-Host "OmniRoute executable:"
          Write-Host $omnirouteCommand.Source

          Write-Host ""
          Write-Host "OmniRoute version:"

          & $omnirouteCommand.Source --version

          if ($LASTEXITCODE -ne 0) {
            throw "OmniRoute executable could not be executed."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "NODE + NPM + OMNIROUTE READY"
          Write-Host "=================================================="

      # ==============================================================
      # 6. Configure OmniRoute repository-backed storage
      # ==============================================================

      - name: 6. Configure OmniRoute Storage
        shell: powershell
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = "${{ github.workspace }}"

          Write-Host "=================================================="
          Write-Host "CONFIGURING OMNIROUTE STORAGE"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:JWT_SECRET)) {
            throw "JWT_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:API_KEY_SECRET)) {
            throw "API_KEY_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:STORAGE_ENCRYPTION_KEY)) {
            throw "STORAGE_ENCRYPTION_KEY secret is missing."
          }

          $env:DATA_DIR = $workspace
          $env:PORT = "$env:OMNIROUTE_PORT"
          $env:HOSTNAME = "0.0.0.0"
          $env:NODE_ENV = "production"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "DATA_DIR=$workspace"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "OMNIROUTE_STORAGE_DIR=$workspace"

          Write-Host ""
          Write-Host "DATA_DIR:"
          Write-Host $env:DATA_DIR

          Write-Host ""
          Write-Host "Repository database files:"

          Get-ChildItem `
            -Path $workspace `
            -Filter "storage.sqlite*" `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Format-Table

          Write-Host ""
          Write-Host "Repository backup directory:"

          if (Test-Path (Join-Path $workspace "backup\omniroute")) {
            Get-ChildItem `
              -Path (Join-Path $workspace "backup\omniroute") `
              -ErrorAction SilentlyContinue |
              Select-Object Name, Length, LastWriteTime |
              Format-Table
          }
          else {
            Write-Host "backup\omniroute does not exist yet."
          }

      # ==============================================================
      # 7. Verify existing repository database
      # ==============================================================

      - name: 7. Verify Repository Database
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = "${{ github.workspace }}"
          $dbFile = Join-Path $workspace "storage.sqlite"

          Write-Host "=================================================="
          Write-Host "VERIFYING REPOSITORY DATABASE"
          Write-Host "=================================================="

          if (-not (Test-Path $dbFile)) {

            Write-Host ""
            Write-Host "storage.sqlite does not exist."
            Write-Host "Initial database will be created by OmniRoute."
          }
          else {

            $db = Get-Item $dbFile

            Write-Host ""
            Write-Host "Database found:"
            Write-Host "Path : $($db.FullName)"
            Write-Host "Size : $($db.Length) bytes"

            if ($db.Length -lt 100) {
              throw (
                "storage.sqlite exists but is suspiciously small: " +
                "$($db.Length) bytes."
              )
            }
          }

          Write-Host ""
          Write-Host "Repository database check complete."

      # ==============================================================
      # 8. Download legacy JSON backup
      # ==============================================================

      - name: 8. Download Legacy OmniRoute JSON
        shell: powershell
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "DOWNLOADING LEGACY OMNIROUTE JSON"
          Write-Host "=================================================="

          $backupDir = Join-Path `
            "${{ github.workspace }}" `
            "db_backups"

          $backupName = Split-Path `
            "$env:LEGACY_BACKUP_PATH" `
            -Leaf

          $backupFile = Join-Path `
            $backupDir `
            $backupName

          New-Item `
            -ItemType Directory `
            -Path $backupDir `
            -Force |
            Out-Null

          $apiUrl =
            "https://api.github.com/repos/ms2lawyer/linux-server/contents/" +
            "$env:LEGACY_BACKUP_PATH" +
            "?ref=" +
            "$env:LEGACY_BACKUP_BRANCH"

          $headers = @{
            "Accept" = "application/vnd.github.raw+json"
            "Authorization" = "Bearer $env:GIT_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "OmniRoute-Windows-Gateway"
          }

          Invoke-WebRequest `
            -Uri $apiUrl `
            -Headers $headers `
            -OutFile $backupFile `
            -UseBasicParsing

          if (-not (Test-Path $backupFile)) {
            throw "Legacy JSON download failed."
          }

          $info = Get-Item $backupFile

          Write-Host ""
          Write-Host "Legacy backup:"
          Write-Host "Path : $($info.FullName)"
          Write-Host "Size : $($info.Length) bytes"

          if ($info.Length -lt 10) {
            throw (
              "Legacy JSON is suspiciously small: " +
              "$($info.Length) bytes."
            )
          }

          try {

            Get-Content `
              -Path $backupFile `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json |
              Out-Null
          }
          catch {

            throw (
              "Legacy JSON validation failed: " +
              "$($_.Exception.Message)"
            )
          }

          Write-Host ""
          Write-Host "Legacy JSON validation: PASSED" `
            -ForegroundColor Green

      # ==============================================================
      # 9. Start OmniRoute natively with npm
      # ==============================================================

      - name: 9. Start OmniRoute
        shell: powershell
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $workspace = "${{ github.workspace }}"
          $logFile = Join-Path $env:RUNNER_TEMP "omniroute.log"
          $errorLogFile = Join-Path $env:RUNNER_TEMP "omniroute-error.log"

          Write-Host "=================================================="
          Write-Host "STARTING OMNIROUTE VIA NPM"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:JWT_SECRET)) {
            throw "JWT_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:API_KEY_SECRET)) {
            throw "API_KEY_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:STORAGE_ENCRYPTION_KEY)) {
            throw "STORAGE_ENCRYPTION_KEY secret is missing."
          }

          $env:DATA_DIR = $workspace
          $env:PORT = "$env:OMNIROUTE_PORT"
          $env:HOSTNAME = "0.0.0.0"
          $env:NODE_ENV = "production"

          $omnirouteCommand = Get-Command `
            omniroute.cmd `
            -ErrorAction SilentlyContinue

          if ($null -eq $omnirouteCommand) {
            $omnirouteCommand = Get-Command `
              omniroute `
              -ErrorAction SilentlyContinue
          }

          if ($null -eq $omnirouteCommand) {
            throw "OmniRoute executable was not found."
          }

          Write-Host ""
          Write-Host "Executable:"
          Write-Host $omnirouteCommand.Source

          Write-Host ""
          Write-Host "DATA_DIR:"
          Write-Host $env:DATA_DIR

          if (Test-Path $logFile) {
            Remove-Item $logFile -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path $errorLogFile) {
            Remove-Item $errorLogFile -Force -ErrorAction SilentlyContinue
          }

          $process = Start-Process `
            -FilePath $omnirouteCommand.Source `
            -ArgumentList @("--port", "$env:OMNIROUTE_PORT") `
            -WorkingDirectory $workspace `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $errorLogFile `
            -PassThru

          if ($null -eq $process) {
            throw "Failed to start OmniRoute process."
          }

          Write-Host ""
          Write-Host "OmniRoute PID:"
          Write-Host $process.Id

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "OMNIROUTE_PID=$($process.Id)"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "OMNIROUTE_LOG_FILE=$logFile"

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "OMNIROUTE_ERROR_LOG_FILE=$errorLogFile"

          Write-Host ""
          Write-Host "OmniRoute process started."

      # ==============================================================
      # 9A. Wait for OmniRoute
      # ==============================================================

      - name: 9A. Wait For OmniRoute
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "WAITING FOR OMNIROUTE"
          Write-Host "=================================================="

          $healthy = $false

          for ($i = 1; $i -le 60; $i++) {

            $response = $null

            try {

              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:$env:OMNIROUTE_PORT" `
                -UseBasicParsing `
                -TimeoutSec 5 `
                -ErrorAction Stop

              if (
                $response.StatusCode -ge 200 -and
                $response.StatusCode -lt 500
              ) {

                $healthy = $true
                break
              }
            }
            catch {
            }

            Write-Host "Waiting... ($i/60)"

            if (
              ($i -ge 5) -and
              (Test-Path $env:OMNIROUTE_ERROR_LOG_FILE)
            ) {

              $errorContent = Get-Content `
                $env:OMNIROUTE_ERROR_LOG_FILE `
                -Tail 10 `
                -ErrorAction SilentlyContinue

              if ($errorContent) {
                Write-Host ""
                Write-Host "Recent OmniRoute errors:"
                $errorContent
              }
            }

            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {

            Write-Host ""
            Write-Host "OmniRoute output:"

            if (Test-Path $env:OMNIROUTE_LOG_FILE) {
              Get-Content `
                $env:OMNIROUTE_LOG_FILE `
                -Tail 100 `
                -ErrorAction SilentlyContinue
            }

            Write-Host ""
            Write-Host "OmniRoute errors:"

            if (Test-Path $env:OMNIROUTE_ERROR_LOG_FILE) {
              Get-Content `
                $env:OMNIROUTE_ERROR_LOG_FILE `
                -Tail 100 `
                -ErrorAction SilentlyContinue
            }

            throw "OmniRoute did not become healthy."
          }

          Write-Host ""
          Write-Host "OmniRoute is healthy." `
            -ForegroundColor Green

      # ==============================================================
      # 10. Determine whether JSON import is required
      # ==============================================================

      - name: 10. Determine JSON Import Requirement
        shell: powershell
        env:
          FORCE_JSON_RESTORE: ${{ inputs.force_json_restore || false }}
        run: |
          $ErrorActionPreference = "Stop"

          $force =
            "$env:FORCE_JSON_RESTORE".ToLowerInvariant() -eq "true"

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          $backupFile = Join-Path `
            "${{ github.workspace }}" `
            "db_backups\omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json"

          Write-Host "=================================================="
          Write-Host "DETERMINING JSON IMPORT REQUIREMENT"
          Write-Host "=================================================="

          if (-not (Test-Path $backupFile)) {
            throw "Legacy JSON backup does not exist."
          }

          if ($force) {

            Write-Host "Forced JSON restore requested."

            Add-Content `
              -Path $env:GITHUB_ENV `
              -Value "OMNIROUTE_JSON_IMPORT_REQUIRED=true"

            exit 0
          }

          if (-not (Test-Path $dbFile)) {

            Write-Host "storage.sqlite does not exist."
            Write-Host "JSON restore is required."

            Add-Content `
              -Path $env:GITHUB_ENV `
              -Value "OMNIROUTE_JSON_IMPORT_REQUIRED=true"

            exit 0
          }

          $db = Get-Item $dbFile

          if ($db.Length -lt 100) {

            Write-Host "storage.sqlite is empty or invalid."
            Write-Host "JSON restore is required."

            Add-Content `
              -Path $env:GITHUB_ENV `
              -Value "OMNIROUTE_JSON_IMPORT_REQUIRED=true"

            exit 0
          }

          Write-Host "Existing storage.sqlite detected."
          Write-Host "Existing repository database will be preserved."
          Write-Host "Legacy JSON import will be skipped."

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "OMNIROUTE_JSON_IMPORT_REQUIRED=false"

      # ==============================================================
      # 11. Import Legacy JSON Settings
      # ==============================================================

      - name: 11. Import Legacy JSON Settings
        if: env.OMNIROUTE_JSON_IMPORT_REQUIRED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "IMPORTING LEGACY OMNIROUTE JSON"
          Write-Host "=================================================="

          $backupFile = Join-Path `
            "${{ github.workspace }}" `
            "db_backups\omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json"

          if (-not (Test-Path $backupFile)) {
            throw "Legacy JSON backup was not found."
          }

          $jsonBody = Get-Content `
            -Path $backupFile `
            -Raw `
            -Encoding UTF8

          if ([string]::IsNullOrWhiteSpace($jsonBody)) {
            throw "Legacy JSON backup is empty."
          }

          $uri =
            "http://127.0.0.1:$env:OMNIROUTE_PORT/api/settings/import-json"

          Write-Host ""
          Write-Host "POST $uri"

          try {

            $response = Invoke-WebRequest `
              -Uri $uri `
              -Method POST `
              -ContentType "application/json" `
              -Body $jsonBody `
              -UseBasicParsing `
              -TimeoutSec 120 `
              -ErrorAction Stop

            Write-Host ""
            Write-Host "HTTP status: $($response.StatusCode)"

            $parsed = $response.Content |
              ConvertFrom-Json

            Write-Host ""
            Write-Host "Import response:"
            Write-Host $response.Content

            $success = $false

            if ($null -ne $parsed.success) {
              $success = [bool]$parsed.success
            }

            $apiKeys = 0

            if ($null -ne $parsed.apiKeys) {

              [int]::TryParse(
                "$($parsed.apiKeys)",
                [ref]$apiKeys
              ) | Out-Null
            }

            Write-Host ""
            Write-Host "success : $success"
            Write-Host "apiKeys : $apiKeys"

            if (-not $success) {
              throw "OmniRoute returned success=false."
            }

            if ($apiKeys -gt 0) {

              Write-Host ""
              Write-Host `
                "API keys imported successfully." `
                -ForegroundColor Green
            }
            else {

              Write-Warning `
                "Import returned apiKeys=0."

              Write-Warning `
                "Verify API_KEY_SECRET and STORAGE_ENCRYPTION_KEY."
            }
          }
          catch {

            $statusCode = 0

            if ($null -ne $_.Exception.Response) {

              try {

                $statusCode =
                  [int]$_.Exception.Response.StatusCode
              }
              catch {

                $statusCode = 0
              }
            }

            if ($statusCode -eq 401) {

              throw (
                "OmniRoute returned HTTP 401 for:`n" +
                "POST /api/settings/import-json`n" +
                "The installed OmniRoute instance requires authentication " +
                "for this endpoint."
              )
            }

            throw (
              "Legacy JSON import failed: " +
              "$($_.Exception.Message)"
            )
          }

      # ==============================================================
      # 11A. Verify JSON restore result
      # ==============================================================

      - name: 11A. Verify JSON Restore Result
        if: env.OMNIROUTE_JSON_IMPORT_REQUIRED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          Write-Host "=================================================="
          Write-Host "VERIFYING JSON RESTORE"
          Write-Host "=================================================="

          if (-not (Test-Path $dbFile)) {

            throw "storage.sqlite does not exist after JSON import."
          }

          $db = Get-Item $dbFile

          if ($db.Length -lt 100) {

            throw (
              "storage.sqlite still appears invalid after JSON import. " +
              "Size: $($db.Length) bytes."
            )
          }

          Write-Host ""
          Write-Host "storage.sqlite exists after JSON import."
          Write-Host "Size: $($db.Length) bytes"

      # ==============================================================
      # 12. Verify OmniRoute
      # ==============================================================

      - name: 12. Verify OmniRoute
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:20128" `
            -UseBasicParsing `
            -TimeoutSec 10 `
            -ErrorAction Stop

          if (
            $response.StatusCode -lt 200 -or
            $response.StatusCode -ge 500
          ) {

            throw "OmniRoute is unhealthy."
          }

          $process = Get-Process `
            -Id $env:OMNIROUTE_PID `
            -ErrorAction SilentlyContinue

          if ($null -eq $process) {

            throw (
              "OmniRoute process $env:OMNIROUTE_PID is no longer running."
            )
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "OMNIROUTE READY"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "PID:"
          Write-Host $process.Id

          Write-Host ""
          Write-Host "Dashboard:"
          Write-Host "http://omniroute-ci-gateway:20128"

          Write-Host ""
          Write-Host "API:"
          Write-Host "http://omniroute-ci-gateway:20128/v1"

          Write-Host ""
          Write-Host "Data directory:"
          Write-Host $env:DATA_DIR

      # ==============================================================
      # 13. Keep Alive + Git Persistence
      # ==============================================================

      - name: 13. Keep Alive + Git Persistence
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          $workspace = "${{ github.workspace}}"

          $dbFile = Join-Path `
            $workspace `
            "storage.sqlite"

          $archive = Join-Path `
            $workspace `
            "backup\omniroute\omniroute-full-backup.tar.gz"

          $interval = [int]$env:SQLITE_SYNC_INTERVAL_MINUTES
          $counter = 0
          $totalMinutes = 355

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
            $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $workspace "backup\omniroute") `
            -Force |
            Out-Null

          function Sync-OmniRouteState {

            Write-Host ""
            Write-Host "==================================================" `
              -ForegroundColor Cyan

            Write-Host "PERSISTING OMNIROUTE REPOSITORY STATE" `
              -ForegroundColor Cyan

            Write-Host "==================================================" `
              -ForegroundColor Cyan

            if (-not (Test-Path $dbFile)) {

              Write-Warning `
                "storage.sqlite does not exist."

              return
            }

            $db = Get-Item $dbFile

            Write-Host ""
            Write-Host "Database:"
            Write-Host "Path : $($db.FullName)"
            Write-Host "Size : $($db.Length) bytes"

            # ----------------------------------------------------------
            # Create repository backup archive
            # ----------------------------------------------------------

            $tarItems = @()

            if (Test-Path "storage.sqlite") {
              $tarItems += "storage.sqlite"
            }

            if (Test-Path "storage.sqlite-wal") {
              $tarItems += "storage.sqlite-wal"
            }

            if (Test-Path "storage.sqlite-shm") {
              $tarItems += "storage.sqlite-shm"
            }

            if (Test-Path "db_backups") {
              $tarItems += "db_backups"
            }

            if ($tarItems.Count -gt 0) {

              Remove-Item `
                $archive `
                -Force `
                -ErrorAction SilentlyContinue

              tar -czf $archive `
                --exclude=logs `
                --exclude=call_logs `
                --exclude=server `
                @tarItems

              if ($LASTEXITCODE -ne 0) {

                Write-Warning `
                  "Backup archive creation failed."
              }
              else {

                Write-Host ""
                Write-Host "Repository backup archive created." `
                  -ForegroundColor Green
              }
            }

            # ----------------------------------------------------------
            # Stage database state
            # ----------------------------------------------------------

            git add `
              .gitattributes `
              storage.sqlite `
              storage.sqlite-wal `
              storage.sqlite-shm `
              backup/omniroute/omniroute-full-backup.tar.gz `
              db_backups/ `
              2>$null

            git diff --cached --quiet

            $hasChanges = ($LASTEXITCODE -ne 0)

            if (-not $hasChanges) {

              Write-Host "No database changes."

              return
            }

            # ----------------------------------------------------------
            # Commit
            # ----------------------------------------------------------

            git commit `
              -m "chore: persist OmniRoute SQLite state [skip ci]" `
              2>$null

            if ($LASTEXITCODE -ne 0) {

              Write-Warning "Git commit failed."

              return
            }

            # ----------------------------------------------------------
            # Synchronize with remote
            # ----------------------------------------------------------

            git fetch origin "$env:TARGET_BRANCH" 2>$null

            if ($LASTEXITCODE -ne 0) {

              Write-Warning "Git fetch failed."

              return
            }

            git rebase `
              "origin/$env:TARGET_BRANCH" `
              2>$null

            if ($LASTEXITCODE -ne 0) {

              Write-Warning "Git rebase failed."

              git rebase --abort 2>$null

              return
            }

            # ----------------------------------------------------------
            # Push
            # ----------------------------------------------------------

            git push `
              origin `
              "HEAD:$env:TARGET_BRANCH" `
              2>$null

            if ($LASTEXITCODE -eq 0) {

              Write-Host ""
              Write-Host `
                "OmniRoute state pushed successfully." `
                -ForegroundColor Green
            }
            else {

              Write-Warning `
                "GitHub push failed."
            }
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "KEEP-ALIVE STARTED"
          Write-Host "Duration: 355 minutes"
          Write-Host "Persistence interval: $interval minutes"
          Write-Host "=================================================="

          for ($minute = 1; $minute -le $totalMinutes; $minute++) {

            Start-Sleep -Seconds 60

            $counter++

            if ($counter -ge $interval) {

              $counter = 0

              Sync-OmniRouteState
            }

            if (($minute % 10) -eq 0) {

              Write-Host ""
              Write-Host "[$minute/$totalMinutes min] OmniRoute"

              $process = Get-Process `
                -Id $env:OMNIROUTE_PID `
                -ErrorAction SilentlyContinue

              if ($null -ne $process) {

                Write-Host "PID    : $($process.Id)"
                Write-Host "Status : Running"
              }
              else {

                Write-Warning "OmniRoute process is not running."
              }

              Write-Host ""
              Write-Host "[$minute/$totalMinutes min] HTTP"

              try {

                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:20128" `
                  -UseBasicParsing `
                  -TimeoutSec 5 `
                  -ErrorAction Stop

                Write-Host "HTTP   : $($response.StatusCode)"
              }
              catch {

                Write-Warning "OmniRoute HTTP check failed."
              }

              Write-Host ""
              Write-Host "[$minute/$totalMinutes min] RDP"

              $rdpPort = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($null -ne $rdpPort) {

                Write-Host "RDP: LISTENING"
              }
              else {

                Write-Warning "RDP: NOT LISTENING"
              }

              Write-Host ""
              Write-Host "[$minute/$totalMinutes min] Database"

              if (Test-Path $dbFile) {

                $db = Get-Item $dbFile

                Write-Host "SQLite : EXISTS"
                Write-Host "Size   : $($db.Length) bytes"
              }
              else {

                Write-Warning "SQLite database is missing."
              }
            }
          }

          # Final normal persistence.
          Sync-OmniRouteState

      # ==============================================================
      # 14. Final Shutdown
      # ==============================================================

      - name: 14. Final Shutdown
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=================================================="
          Write-Host "FINAL SHUTDOWN"
          Write-Host "=================================================="

          if (-not [string]::IsNullOrWhiteSpace("$env:OMNIROUTE_PID")) {

            $process = Get-Process `
              -Id $env:OMNIROUTE_PID `
              -ErrorAction SilentlyContinue

            if ($null -ne $process) {

              Write-Host "Stopping OmniRoute PID $($process.Id)..."

              Stop-Process `
                -Id $process.Id `
                -Force `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3

              $stillRunning = Get-Process `
                -Id $env:OMNIROUTE_PID `
                -ErrorAction SilentlyContinue

              if ($null -eq $stillRunning) {

                Write-Host `
                  "OmniRoute stopped." `
                  -ForegroundColor Green
              }
              else {

                Write-Warning `
                  "OmniRoute process is still running."
              }
            }
            else {

              Write-Host "OmniRoute process was already stopped."
            }
          }

      # ==============================================================
      # 15. Final Git Persistence
      # ==============================================================

      - name: 15. Final Git SQLite Persistence
        if: always()
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=================================================="
          Write-Host "FINAL GITHUB SQLITE PUSH"
          Write-Host "=================================================="

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
            $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          $dbFile = "storage.sqlite"

          $archive =
            "backup/omniroute/omniroute-full-backup.tar.gz"

          New-Item `
            -ItemType Directory `
            -Path "backup/omniroute" `
            -Force |
            Out-Null

          $tarItems = @()

          if (Test-Path "storage.sqlite") {
            $tarItems += "storage.sqlite"
          }

          if (Test-Path "storage.sqlite-wal") {
            $tarItems += "storage.sqlite-wal"
          }

          if (Test-Path "storage.sqlite-shm") {
            $tarItems += "storage.sqlite-shm"
          }

          if (Test-Path "db_backups") {
            $tarItems += "db_backups"
          }

          if ($tarItems.Count -gt 0) {

            Remove-Item `
              $archive `
              -Force `
              -ErrorAction SilentlyContinue

            tar -czf $archive `
              --exclude=logs `
              --exclude=call_logs `
              --exclude=server `
              @tarItems

            if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                "Final backup archive creation failed."
            }
            else {

              Write-Host `
                "Final backup archive created." `
                -ForegroundColor Green
            }
          }

          git add `
            .gitattributes `
            storage.sqlite `
            storage.sqlite-wal `
            storage.sqlite-shm `
            backup/omniroute/omniroute-full-backup.tar.gz `
            db_backups/ `
            2>$null

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {

            Write-Host "No final database changes."

            exit 0
          }

          git commit `
            -m "chore: final OmniRoute DB state backup [skip ci]" `
            2>$null

          if ($LASTEXITCODE -ne 0) {

            Write-Warning "Final Git commit failed."

            exit 0
          }

          git fetch origin "$env:TARGET_BRANCH" 2>$null

          if ($LASTEXITCODE -ne 0) {

            Write-Warning "Final git fetch failed."

            exit 0
          }

          git rebase `
            "origin/$env:TARGET_BRANCH" `
            2>$null

          if ($LASTEXITCODE -ne 0) {

            Write-Warning "Final git rebase failed."

            git rebase --abort 2>$null

            exit 0
          }

          git push `
            origin `
            "HEAD:$env:TARGET_BRANCH" `
            2>$null

          if ($LASTEXITCODE -eq 0) {

            Write-Host ""
            Write-Host `
              "FINAL SQLITE STATE PUSHED SUCCESSFULLY." `
              -ForegroundColor Green
          }
          else {

            Write-Warning `
              "Final GitHub push failed."
          }

      # ==============================================================
      # 16. Final Diagnostics
      # ==============================================================

      - name: 16. Final Diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "FINAL DIAGNOSTICS"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "npm:"
          npm --version

          Write-Host ""
          Write-Host "OmniRoute:"
          $omnirouteCommand = Get-Command `
            omniroute.cmd `
            -ErrorAction SilentlyContinue

          if ($null -eq $omnirouteCommand) {
            $omnirouteCommand = Get-Command `
              omniroute `
              -ErrorAction SilentlyContinue
          }

          if ($null -ne $omnirouteCommand) {
            & $omnirouteCommand.Source --version
          }

          Write-Host ""
          Write-Host "Git:"
          git status --short

          Write-Host ""
          Write-Host "Branch:"
          git branch --show-current

          Write-Host ""
          Write-Host "Target branch:"
          Write-Host $env:TARGET_BRANCH

          Write-Host ""
          Write-Host "OmniRoute PID:"
          Write-Host $env:OMNIROUTE_PID

          if (-not [string]::IsNullOrWhiteSpace("$env:OMNIROUTE_PID")) {

            $process = Get-Process `
              -Id $env:OMNIROUTE_PID `
              -ErrorAction SilentlyContinue

            if ($null -ne $process) {
              Write-Host "Process: RUNNING"
            }
            else {
              Write-Host "Process: STOPPED"
            }
          }

          Write-Host ""
          Write-Host "OmniRoute HTTP:"

          try {

            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:20128" `
              -UseBasicParsing `
              -TimeoutSec 5 `
              -ErrorAction Stop

            Write-Host "HTTP $($response.StatusCode)"
          }
          catch {

            Write-Host "HTTP endpoint unavailable (expected if final process was stopped)."
          }

          Write-Host ""
          Write-Host "Tailscale:"
          tailscale status --peers=false 2>$null

          Write-Host ""
          Write-Host "RDP service:"

          Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Status, StartType |
            Format-Table

          Write-Host ""
          Write-Host "RDP TCP 3389:"

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table

          Write-Host ""
          Write-Host "Repository SQLite:"

          Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Filter "storage.sqlite*" `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Format-Table

          Write-Host ""
          Write-Host "Legacy JSON:"

          Get-Item `
            "${{ github.workspace }}\db_backups\omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json" `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-List

          Write-Host ""
          Write-Host "OmniRoute logs:"

          if (Test-Path $env:OMNIROUTE_LOG_FILE) {

            Get-Content `
              $env:OMNIROUTE_LOG_FILE `
              -Tail 50 `
              -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "OmniRoute error log:"

          if (Test-Path $env:OMNIROUTE_ERROR_LOG_FILE) {

            Get-Content `
              $env:OMNIROUTE_ERROR_LOG_FILE `
              -Tail 50 `
              -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "WORKFLOW COMPLETE"
          Write-Host "=================================================="
