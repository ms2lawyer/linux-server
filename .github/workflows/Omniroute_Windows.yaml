
name: OmniRoute Windows Gateway

on:
  workflow_dispatch:
    inputs:
      force_json_restore:
        description: "Force legacy JSON settings import even when api_keys already exist"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - Omniroute_Windows

concurrency:
  group: omniroute-windows-gateway
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET_BRANCH: Omniroute_Windows

  OMNIROUTE_PORT: 20128
  REDIS_PORT: 6379
  RDP_PORT: 3389

  SQLITE_SYNC_INTERVAL_MINUTES: 5

  LEGACY_BACKUP_BRANCH: Omniroute_Windows
  LEGACY_BACKUP_PATH: db_backups/omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json

jobs:

  run-omniroute:

    runs-on: windows-2022

    timeout-minutes: 360

    steps:

      # ==============================================================
      # 1. Checkout target branch
      # ==============================================================

      - name: 1. Checkout Omniroute_Windows
        uses: actions/checkout@v4
        with:
          ref: Omniroute_Windows
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GIT_TOKEN || github.token }}

      # ==============================================================
      # 2. Verify host
      # ==============================================================

      - name: 2. Verify Windows Host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING GITHUB WINDOWS RUNNER"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber |
            Format-List

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Architecture:"
          Write-Host (
            [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          )

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "Git LFS:"
          git lfs version

          Write-Host ""
          Write-Host "Docker:"
          docker --version

          Write-Host ""
          Write-Host "Docker Compose:"
          docker compose version

          Write-Host ""
          Write-Host "SQLite:"

          if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {
              sqlite3 --version
          }
          else {
              Write-Warning "sqlite3.exe not found. WAL checkpoint will be skipped."
          }

          Write-Host ""
          Write-Host "Docker Engine:"
          docker info |
            Select-String "Server Version|Operating System|OSType"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "HOST VERIFIED"
          Write-Host "=================================================="

      # ==============================================================
      # 3. Tailscale
      # ==============================================================

      - name: 3. Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: omniroute-ci-gateway

      - name: 3A. Verify Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = Get-Command `
            tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
              throw "tailscale.exe was not found."
          }

          $tailscaleIp = (
            & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
              throw "Unable to determine Tailscale IPv4."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "TAILSCALE READY"
          Write-Host "=================================================="

          Write-Host "Hostname : omniroute-ci-gateway"
          Write-Host "IPv4     : $tailscaleIp"

          Write-Host ""
          tailscale status --peers=false

      # ==============================================================
      # 4. RDP ONLY
      # ==============================================================

      - name: 4. Enable Remote Desktop
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "CONFIGURING REMOTE DESKTOP"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
              throw "RDP_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          $password = $env:RDP_PASSWORD

          if ($password.Length -lt 16) {
              throw "RDP_PASSWORD must be at least 16 characters."
          }

          if ($password -notmatch '[A-Z]') {
              throw "RDP_PASSWORD must contain an uppercase letter."
          }

          if ($password -notmatch '[a-z]') {
              throw "RDP_PASSWORD must contain a lowercase letter."
          }

          if ($password -notmatch '\d') {
              throw "RDP_PASSWORD must contain a number."
          }

          if ($password -notmatch '[^a-zA-Z0-9]') {
              throw "RDP_PASSWORD must contain a special character."
          }

          if (
              $password.IndexOf(
                $env:RDP_USERNAME,
                [System.StringComparison]::OrdinalIgnoreCase
              ) -ge 0
          ) {
              throw "RDP_PASSWORD must not contain RDP_USERNAME."
          }

          Write-Host "RDP password policy: PASSED"

          # ------------------------------------------------------------
          # Enable RDP
          # ------------------------------------------------------------

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          # ------------------------------------------------------------
          # Firewall
          # ------------------------------------------------------------

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          # ------------------------------------------------------------
          # TermService
          # ------------------------------------------------------------

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          $service = Get-Service `
            -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw "TermService is not running."
          }

          # ------------------------------------------------------------
          # Create / update RDP user
          # ------------------------------------------------------------

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -Description "OmniRoute GitHub Actions RDP User" |
                Out-Null
          }
          else {

              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $securePassword

              Enable-LocalUser `
                -Name $env:RDP_USERNAME
          }

          # ------------------------------------------------------------
          # Groups
          # ------------------------------------------------------------

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Remote Desktop configured." `
            -ForegroundColor Green

      # ==============================================================
      # 4A. Verify RDP
      # ==============================================================

      - name: 4A. Verify Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING REMOTE DESKTOP"
          Write-Host "=================================================="

          $rdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($rdpDenied -ne 0) {
              throw "RDP is disabled."
          }

          $nla = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication'

          if ($nla -ne 1) {
              throw "RDP NLA is disabled."
          }

          $service = Get-Service `
            -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw "TermService is not running."
          }

          $rules = Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq 'True'

          if ($null -eq $rules) {
              throw "RDP firewall rules are not enabled."
          }

          $port = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $port) {
              throw "TCP 3389 is not listening."
          }

          Write-Host ""
          Write-Host "RDP service : Running" -ForegroundColor Green
          Write-Host "RDP NLA     : Enabled" -ForegroundColor Green
          Write-Host "RDP firewall: Enabled" -ForegroundColor Green
          Write-Host "RDP port    : Listening" -ForegroundColor Green

      # ==============================================================
      # 4B. RDP information
      # ==============================================================

      - name: 4B. Display RDP Connection Information
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = Get-Command `
            tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
              throw "tailscale.exe was not found."
          }

          $tailscaleIp = (
            & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
              throw "Tailscale IP could not be detected."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "REMOTE DESKTOP READY"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Tailscale IP : $tailscaleIp"
          Write-Host "RDP hostname : omniroute-ci-gateway"
          Write-Host "RDP port     : 3389"

          Write-Host ""
          Write-Host "RDP command:"
          Write-Host "mstsc /v:omniroute-ci-gateway"

          Write-Host ""
          Write-Host "RDP username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "This is an ephemeral GitHub-hosted VM."

      # ==============================================================
      # 5. Download legacy JSON
      # ==============================================================

      - name: 5. Download Legacy OmniRoute JSON
        shell: powershell
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "DOWNLOADING LEGACY JSON EXPORT"
          Write-Host "=================================================="

          $backupDir = Join-Path `
            "${{ github.workspace }}" `
            "db_backups"

          $backupName = Split-Path `
            "$env:LEGACY_BACKUP_PATH" `
            -Leaf

          $backupFile = Join-Path `
            $backupDir `
            $backupName

          New-Item `
            -ItemType Directory `
            -Path $backupDir `
            -Force |
            Out-Null

          $apiUrl =
            "https://api.github.com/repos/ms2lawyer/linux-server/contents/" +
            "$env:LEGACY_BACKUP_PATH" +
            "?ref=" +
            "$env:LEGACY_BACKUP_BRANCH"

          $headers = @{
            "Accept"               = "application/vnd.github.raw+json"
            "Authorization"        = "Bearer $env:GIT_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent"           = "OmniRoute-Windows-Gateway"
          }

          Invoke-WebRequest `
            -Uri $apiUrl `
            -Headers $headers `
            -OutFile $backupFile `
            -UseBasicParsing

          if (-not (Test-Path $backupFile)) {
              throw "Legacy JSON file was not downloaded."
          }

          $info = Get-Item $backupFile

          Write-Host ""
          Write-Host "Backup file:"
          Write-Host $info.FullName
          Write-Host "Size: $($info.Length) bytes"

          if ($info.Length -lt 10) {
              throw "Downloaded JSON file is unexpectedly small."
          }

          try {

              Get-Content `
                -Path $backupFile `
                -Raw `
                -Encoding UTF8 |
                ConvertFrom-Json |
                Out-Null
          }
          catch {

              throw `
                "Legacy JSON validation failed: $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "Legacy JSON validation: PASSED" `
            -ForegroundColor Green

      # ==============================================================
      # 6. Start Redis
      # ==============================================================

      - name: 6. Start Redis
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING REDIS"
          Write-Host "=================================================="

          $existingRedis = docker ps -aq `
            --filter "name=^omniroute-redis$"

          if (-not [string]::IsNullOrWhiteSpace($existingRedis)) {

              Write-Host "Removing existing Redis container..."

              docker rm -f omniroute-redis

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to remove existing Redis container."
              }
          }

          docker run -d `
            --name omniroute-redis `
            --restart unless-stopped `
            -p 6379:6379 `
            --health-cmd "redis-cli ping" `
            --health-interval 10s `
            --health-timeout 5s `
            --health-retries 3 `
            redis:7-alpine

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to start Redis."
          }

          Write-Host ""
          Write-Host "Waiting for Redis..."

          $redisReady = $false

          for ($i = 1; $i -le 30; $i++) {

              $health = docker inspect `
                --format "{{.State.Health.Status}}" `
                omniroute-redis `
                2>$null

              if ($health -eq "healthy") {

                  $redisReady = $true
                  break
              }

              Start-Sleep -Seconds 2
          }

          if (-not $redisReady) {

              Write-Host ""
              Write-Host "Redis logs:"
              docker logs omniroute-redis

              throw "Redis health check failed."
          }

          Write-Host ""
          Write-Host "Redis is healthy." -ForegroundColor Green

      # ==============================================================
      # 7. Start OmniRoute
      # ==============================================================

      - name: 7. Start OmniRoute
        shell: powershell
        env:
          OMNI_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OMNI_API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          OMNI_STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING OMNIROUTE"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:OMNI_JWT_SECRET)) {
              throw "JWT_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_API_KEY_SECRET)) {
              throw "API_KEY_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_STORAGE_ENCRYPTION_KEY)) {
              throw "STORAGE_ENCRYPTION_KEY secret is missing."
          }

          $workspace = "${{ github.workspace }}"

          $existingOmniRoute = docker ps -aq `
            --filter "name=^omniroute$"

          if (-not [string]::IsNullOrWhiteSpace($existingOmniRoute)) {

              Write-Host "Removing existing OmniRoute container..."

              docker rm -f omniroute

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to remove existing OmniRoute container."
              }
          }

          docker run -d `
            --name omniroute `
            --restart unless-stopped `
            -p 20128:20128 `
            -e "NODE_ENV=production" `
            -e "PORT=20128" `
            -e "HOSTNAME=0.0.0.0" `
            -e "JWT_SECRET=$env:OMNI_JWT_SECRET" `
            -e "API_KEY_SECRET=$env:OMNI_API_KEY_SECRET" `
            -e "STORAGE_ENCRYPTION_KEY=$env:OMNI_STORAGE_ENCRYPTION_KEY" `
            -e "REDIS_URL=redis://host.docker.internal:6379" `
            -e "DATA_DIR=/root/.omniroute" `
            --add-host=host.docker.internal:host-gateway `
            -v "${workspace}:/root/.omniroute" `
            -v "${workspace}:/app/data" `
            diegosouzapw/omniroute:latest

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to start OmniRoute."
          }

          docker ps `
            --filter "name=^omniroute$"

      # ==============================================================
      # 7A. Wait for OmniRoute
      # ==============================================================

      - name: 7A. Wait for OmniRoute
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Waiting for OmniRoute..."

          $healthy = $false

          for ($i = 1; $i -le 60; $i++) {

              try {

                  $response = Invoke-WebRequest `
                    -Uri "http://localhost:20128" `
                    -UseBasicParsing `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  if (
                    $response.StatusCode -ge 200 -and
                    $response.StatusCode -lt 500
                  ) {

                      $healthy = $true
                      break
                  }
              }
              catch {
              }

              Write-Host "Waiting... ($i/60)"
              Start-Sleep -Seconds 2
          }

          if (-not $healthy) {

              Write-Host ""
              Write-Host "OmniRoute container:"
              docker ps -a `
                --filter "name=^omniroute$"

              Write-Host ""
              Write-Host "OmniRoute logs:"
              docker logs omniroute

              throw "OmniRoute did not become healthy."
          }

          Write-Host ""
          Write-Host "OmniRoute is healthy." `
            -ForegroundColor Green

      # ==============================================================
      # 8. Decide whether JSON import is required
      # ==============================================================

      - name: 8. Determine Legacy JSON Import Requirement
        shell: powershell
        env:
          FORCE_JSON_RESTORE: ${{ inputs.force_json_restore || false }}
        run: |
          $ErrorActionPreference = "Stop"

          $force =
            "$env:FORCE_JSON_RESTORE".ToLowerInvariant() -eq "true"

          if ($force) {

              Write-Host ""
              Write-Host "force_json_restore = true"
              Write-Host "Legacy JSON import WILL be performed."

              "OMNIROUTE_JSON_IMPORT_REQUIRED=true" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append

              exit 0
          }

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          if (-not (Test-Path $dbFile)) {

              Write-Host ""
              Write-Host "storage.sqlite does not exist."
              Write-Host "Legacy JSON import WILL be performed."

              "OMNIROUTE_JSON_IMPORT_REQUIRED=true" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append

              exit 0
          }

          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {

              Write-Warning `
                "sqlite3.exe is unavailable."

              Write-Warning `
                "Cannot inspect api_keys safely."

              Write-Warning `
                "Legacy JSON import will NOT be forced automatically."

              "OMNIROUTE_JSON_IMPORT_REQUIRED=false" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append

              exit 0
          }

          # ------------------------------------------------------------
          # Detect actual api_keys table.
          # ------------------------------------------------------------

          $tableExists = sqlite3 `
            $dbFile `
            "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='api_keys';" `
            2>$null

          $tableExists = $tableExists.Trim()

          if ($tableExists -ne "1") {

              Write-Host ""
              Write-Host "api_keys table does not exist."
              Write-Host "Legacy JSON import WILL be performed."

              "OMNIROUTE_JSON_IMPORT_REQUIRED=true" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append

              exit 0
          }

          $countRaw = sqlite3 `
            $dbFile `
            "SELECT COUNT(*) FROM api_keys;" `
            2>$null

          $count = 0

          if (-not [string]::IsNullOrWhiteSpace($countRaw)) {
              [int]::TryParse(
                $countRaw.Trim(),
                [ref]$count
              ) | Out-Null
          }

          Write-Host ""
          Write-Host "Current api_keys rows: $count"

          if ($count -gt 0) {

              Write-Host ""
              Write-Host "Existing API keys found."
              Write-Host "Legacy JSON import SKIPPED."

              "OMNIROUTE_JSON_IMPORT_REQUIRED=false" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append
          }
          else {

              Write-Host ""
              Write-Host "No API keys found."
              Write-Host "Legacy JSON import REQUIRED."

              "OMNIROUTE_JSON_IMPORT_REQUIRED=true" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append
          }

      # ==============================================================
      # 9. Correct legacy JSON import
      #
      # POST /api/settings/import-json
      #
      # This is the dashboard import endpoint.
      # ==============================================================

      - name: 9. Import Legacy JSON Through Settings API
        if: env.OMNIROUTE_JSON_IMPORT_REQUIRED == 'true'
        shell: powershell
        env:
          INITIAL_PASSWORD: ${{ secrets.INITIAL_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "IMPORTING LEGACY OMNIROUTE JSON"
          Write-Host "=================================================="

          $backupFile = Join-Path `
            "${{ github.workspace }}" `
            "db_backups\omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json"

          if (-not (Test-Path $backupFile)) {
              throw "Legacy JSON backup was not found."
          }

          $jsonBody = Get-Content `
            -Path $backupFile `
            -Raw `
            -Encoding UTF8

          if ([string]::IsNullOrWhiteSpace($jsonBody)) {
              throw "Legacy JSON backup is empty."
          }

          $uri =
            "http://localhost:$env:OMNIROUTE_PORT/api/settings/import-json"

          Write-Host ""
          Write-Host "Import endpoint:"
          Write-Host $uri

          # ------------------------------------------------------------
          # IMPORTANT:
          #
          # This is intentionally the same raw JSON request path as
          # the dashboard import endpoint.
          # ------------------------------------------------------------

          try {

              $response = Invoke-WebRequest `
                -Uri $uri `
                -Method POST `
                -ContentType "application/json" `
                -Body $jsonBody `
                -UseBasicParsing `
                -TimeoutSec 120 `
                -ErrorAction Stop

              Write-Host ""
              Write-Host "HTTP status: $($response.StatusCode)"

              $responseJson = $response.Content

              Write-Host ""
              Write-Host "Import response:"
              Write-Host $responseJson

              try {

                  $parsed = $responseJson |
                    ConvertFrom-Json
              }
              catch {

                  throw `
                    "Import endpoint returned invalid JSON."
              }

              $success = $false

              if ($null -ne $parsed.success) {
                  $success = [bool]$parsed.success
              }

              $apiKeys = 0

              if ($null -ne $parsed.apiKeys) {

                  [int]::TryParse(
                    "$($parsed.apiKeys)",
                    [ref]$apiKeys
                  ) | Out-Null
              }

              Write-Host ""
              Write-Host "=================================================="
              Write-Host "IMPORT RESULT"
              Write-Host "=================================================="

              Write-Host "success : $success"
              Write-Host "apiKeys : $apiKeys"

              if (-not $success) {

                  throw `
                    "OmniRoute JSON import returned success=false."
              }

              if ($apiKeys -le 0) {

                  Write-Warning `
                    "Import succeeded but apiKeys is 0."

                  Write-Warning `
                    "Verify API_KEY_SECRET and STORAGE_ENCRYPTION_KEY."
              }
              else {

                  Write-Host ""
                  Write-Host `
                    "API keys imported successfully." `
                    -ForegroundColor Green
              }
          }
          catch {

              $statusCode = 0

              if ($null -ne $_.Exception.Response) {

                  try {

                      $statusCode =
                        [int]$_.Exception.Response.StatusCode
                  }
                  catch {
                      $statusCode = 0
                  }
              }

              if ($statusCode -eq 401) {

                  if (
                    [string]::IsNullOrWhiteSpace(
                      $env:INITIAL_PASSWORD
                    )
                  ) {

                      throw @"OmniRoute returned HTTP 401.
                      The JSON import endpoint requires authentication.
                      Add the optional repository secret INITIAL_PASSWORD using
                      the same dashboard password used by OmniRoute."@
                  }

                  throw @"OmniRoute returned HTTP 401.
                  INITIAL_PASSWORD exists, but the exact login/authentication
                  contract of this installed OmniRoute image has not been
                  verified here, so no undocumented Authorization header is
                  being guessed."@
              }

              throw `
                "Legacy JSON import failed: $($_.Exception.Message)"
          }

      # ==============================================================
      # 9A. Verify API keys after import
      # ==============================================================

      - name: 9A. Verify Imported API Keys
        if: env.OMNIROUTE_JSON_IMPORT_REQUIRED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          if (-not (Test-Path $dbFile)) {
              throw "storage.sqlite is missing after JSON import."
          }

          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {

              Write-Warning `
                "sqlite3.exe unavailable; api_keys verification skipped."

              exit 0
          }

          $countRaw = sqlite3 `
            $dbFile `
            "SELECT COUNT(*) FROM api_keys;" `
            2>$null

          $count = 0

          if (-not [string]::IsNullOrWhiteSpace($countRaw)) {
              [int]::TryParse(
                $countRaw.Trim(),
                [ref]$count
              ) | Out-Null
          }

          Write-Host ""
          Write-Host "api_keys rows after import: $count"

          if ($count -gt 0) {

              Write-Host `
                "API keys verified." `
                -ForegroundColor Green
          }
          else {

              Write-Warning `
                "api_keys is still empty after JSON import."

              Write-Warning `
                "Check API_KEY_SECRET and STORAGE_ENCRYPTION_KEY."
          }

      # ==============================================================
      # 10. Verify OmniRoute after import
      # ==============================================================

      - name: 10. Verify OmniRoute After Import
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING OMNIROUTE"
          Write-Host "=================================================="

          $response = Invoke-WebRequest `
            -Uri "http://localhost:20128" `
            -UseBasicParsing `
            -TimeoutSec 10 `
            -ErrorAction Stop

          if (
            $response.StatusCode -lt 200 -or
            $response.StatusCode -ge 500
          ) {
              throw "OmniRoute is unhealthy after JSON import."
          }

          Write-Host ""
          Write-Host "OmniRoute is healthy." `
            -ForegroundColor Green

          Write-Host ""
          Write-Host "Dashboard:"
          Write-Host "http://omniroute-ci-gateway:20128"

          Write-Host ""
          Write-Host "API:"
          Write-Host "http://omniroute-ci-gateway:20128/v1"

      # ==============================================================
      # 11. Keep Alive + SQLite persistence
      # ==============================================================

      - name: 11. Keep Alive + SQLite Persistence
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          $workspace = "${{ github.workspace }}"

          $dbFile = Join-Path `
            $workspace `
            "storage.sqlite"

          $archive = Join-Path `
            $workspace `
            "backup\omniroute\omniroute-full-backup.tar.gz"

          $interval = [int]$env:SQLITE_SYNC_INTERVAL_MINUTES
          $counter = 0
          $totalMinutes = 355

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
              $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $workspace "backup\omniroute") `
            -Force |
            Out-Null

          function Sync-OmniRouteState {

              Write-Host ""
              Write-Host "==================================================" `
                -ForegroundColor Cyan

              Write-Host "PERSISTING OMNIROUTE STATE" `
                -ForegroundColor Cyan

              Write-Host "==================================================" `
                -ForegroundColor Cyan

              if (-not (Test-Path $dbFile)) {

                  Write-Warning `
                    "storage.sqlite does not exist."

                  return
              }

              # --------------------------------------------------------
              # Checkpoint WAL
              # --------------------------------------------------------

              if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

                  sqlite3 `
                    $dbFile `
                    "PRAGMA wal_checkpoint(TRUNCATE);"

                  if ($LASTEXITCODE -ne 0) {

                      Write-Warning `
                        "WAL checkpoint returned non-zero exit code."
                  }
              }

              # --------------------------------------------------------
              # Create backup archive
              # --------------------------------------------------------

              $tarItems = @()

              if (Test-Path "storage.sqlite") {
                  $tarItems += "storage.sqlite"
              }

              if (Test-Path "storage.sqlite-wal") {
                  $tarItems += "storage.sqlite-wal"
              }

              if (Test-Path "storage.sqlite-shm") {
                  $tarItems += "storage.sqlite-shm"
              }

              if (Test-Path "db_backups") {
                  $tarItems += "db_backups"
              }

              if ($tarItems.Count -gt 0) {

                  Remove-Item `
                    $archive `
                    -Force `
                    -ErrorAction SilentlyContinue

                  tar -czf $archive `
                    --exclude=logs `
                    --exclude=call_logs `
                    --exclude=server `
                    @tarItems

                  if ($LASTEXITCODE -ne 0) {

                      Write-Warning `
                        "Backup archive creation failed."
                  }
              }

              # --------------------------------------------------------
              # Stage
              # --------------------------------------------------------

              git add `
                .gitattributes `
                storage.sqlite `
                storage.sqlite-wal `
                storage.sqlite-shm `
                backup/omniroute/omniroute-full-backup.tar.gz `
                db_backups/ `
                2>$null

              git diff --cached --quiet

              $hasChanges = ($LASTEXITCODE -ne 0)

              if (-not $hasChanges) {

                  Write-Host "No database changes detected."

                  return
              }

              # --------------------------------------------------------
              # Commit
              # --------------------------------------------------------

              git commit `
                -m "chore: persist OmniRoute SQLite state [skip ci]" `
                2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning "Git commit failed."

                  return
              }

              # --------------------------------------------------------
              # Fetch fixed target branch
              # --------------------------------------------------------

              git fetch origin "$env:TARGET_BRANCH" 2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning "Git fetch failed."

                  return
              }

              # --------------------------------------------------------
              # Rebase local state
              # --------------------------------------------------------

              git rebase `
                "origin/$env:TARGET_BRANCH" `
                2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning "Git rebase failed."

                  git rebase --abort 2>$null

                  return
              }

              # --------------------------------------------------------
              # Explicit target branch push
              # --------------------------------------------------------

              git push `
                origin `
                "HEAD:$env:TARGET_BRANCH" `
                2>$null

              if ($LASTEXITCODE -eq 0) {

                  Write-Host ""
                  Write-Host `
                    "SQLite state persisted to Omniroute_Windows." `
                    -ForegroundColor Green
              }
              else {

                  Write-Warning `
                    "GitHub push failed."
              }
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "KEEP-ALIVE STARTED"
          Write-Host "Duration: 355 minutes"
          Write-Host "SQLite sync: every $interval minutes"
          Write-Host "=================================================="

          for ($minute = 1; $minute -le $totalMinutes; $minute++) {

              Start-Sleep -Seconds 60

              $counter++

              if ($counter -ge $interval) {

                  $counter = 0

                  Sync-OmniRouteState
              }

              if (($minute % 10) -eq 0) {

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] OmniRoute:"

                  docker ps `
                    --filter "name=^omniroute$" `
                    --format "Status: {{.Status}}" `
                    2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] Redis:"

                  docker ps `
                    --filter "name=^omniroute-redis$" `
                    --format "Status: {{.Status}}" `
                    2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] Tailscale:"

                  tailscale status `
                    --peers=false `
                    2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] RDP:"

                  $rdpPort = Get-NetTCPConnection `
                    -LocalPort 3389 `
                    -State Listen `
                    -ErrorAction SilentlyContinue

                  if ($null -ne $rdpPort) {
                      Write-Host "RDP: LISTENING"
                  }
                  else {
                      Write-Warning "RDP: NOT LISTENING"
                  }
              }
          }

          # Final normal persistence.
          Sync-OmniRouteState

      # ==============================================================
      # 12. Final shutdown
      # ==============================================================

      - name: 12. Final Shutdown
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=================================================="
          Write-Host "FINAL SHUTDOWN"
          Write-Host "=================================================="

          $omniExists = docker ps -aq `
            --filter "name=^omniroute$"

          if (-not [string]::IsNullOrWhiteSpace($omniExists)) {

              Write-Host "Stopping OmniRoute..."

              docker stop omniroute 2>$null

              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "docker stop omniroute failed."
              }

              docker rm omniroute 2>$null

              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "docker rm omniroute failed."
              }
          }

          $redisExists = docker ps -aq `
            --filter "name=^omniroute-redis$"

          if (-not [string]::IsNullOrWhiteSpace($redisExists)) {

              Write-Host "Stopping Redis..."

              docker stop omniroute-redis 2>$null

              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "docker stop omniroute-redis failed."
              }

              docker rm omniroute-redis 2>$null

              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "docker rm omniroute-redis failed."
              }
          }

          # ------------------------------------------------------------
          # Final SQLite checkpoint
          # ------------------------------------------------------------

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          if (
            (Test-Path $dbFile) -and
            (Get-Command sqlite3 -ErrorAction SilentlyContinue)
          ) {

              Write-Host ""
              Write-Host "Final SQLite WAL checkpoint..."

              sqlite3 `
                $dbFile `
                "PRAGMA wal_checkpoint(TRUNCATE);"

              if ($LASTEXITCODE -eq 0) {

                  Write-Host `
                    "Final WAL checkpoint completed." `
                    -ForegroundColor Green
              }
              else {

                  Write-Warning `
                    "Final WAL checkpoint failed."
              }
          }

      # ==============================================================
      # 13. Final Git persistence attempt
      # ==============================================================

      - name: 13. Final Git SQLite Persistence
        if: always()
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=================================================="
          Write-Host "FINAL GITHUB SQLITE PUSH"
          Write-Host "=================================================="

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
              $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          $dbFile = "storage.sqlite"
          $archive = `
            "backup/omniroute/omniroute-full-backup.tar.gz"

          # ------------------------------------------------------------
          # Final checkpoint
          # ------------------------------------------------------------

          if (
            (Test-Path $dbFile) -and
            (Get-Command sqlite3 -ErrorAction SilentlyContinue)
          ) {

              sqlite3 `
                $dbFile `
                "PRAGMA wal_checkpoint(TRUNCATE);"
          }

          # ------------------------------------------------------------
          # Final archive
          # ------------------------------------------------------------

          New-Item `
            -ItemType Directory `
            -Path "backup/omniroute" `
            -Force |
            Out-Null

          $tarItems = @()

          if (Test-Path "storage.sqlite") {
              $tarItems += "storage.sqlite"
          }

          if (Test-Path "storage.sqlite-wal") {
              $tarItems += "storage.sqlite-wal"
          }

          if (Test-Path "storage.sqlite-shm") {
              $tarItems += "storage.sqlite-shm"
          }

          if (Test-Path "db_backups") {
              $tarItems += "db_backups"
          }

          if ($tarItems.Count -gt 0) {

              Remove-Item `
                $archive `
                -Force `
                -ErrorAction SilentlyContinue

              tar -czf $archive `
                --exclude=logs `
                --exclude=call_logs `
                --exclude=server `
                @tarItems
          }

          # ------------------------------------------------------------
          # Stage
          # ------------------------------------------------------------

          git add `
            .gitattributes `
            storage.sqlite `
            storage.sqlite-wal `
            storage.sqlite-shm `
            backup/omniroute/omniroute-full-backup.tar.gz `
            db_backups/ `
            2>$null

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {

              Write-Host "No final database changes."

              exit 0
          }

          # ------------------------------------------------------------
          # Commit
          # ------------------------------------------------------------

          git commit `
            -m "chore: final OmniRoute DB state backup [skip ci]" `
            2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning "Final Git commit failed."

              exit 0
          }

          # ------------------------------------------------------------
          # Synchronize target branch
          # ------------------------------------------------------------

          git fetch origin "$env:TARGET_BRANCH" 2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning "Final git fetch failed."

              exit 0
          }

          git rebase `
            "origin/$env:TARGET_BRANCH" `
            2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning "Final git rebase failed."

              git rebase --abort 2>$null

              exit 0
          }

          # ------------------------------------------------------------
          # Push
          # ------------------------------------------------------------

          git push `
            origin `
            "HEAD:$env:TARGET_BRANCH" `
            2>$null

          if ($LASTEXITCODE -eq 0) {

              Write-Host ""
              Write-Host `
                "FINAL SQLITE STATE PUSHED SUCCESSFULLY." `
                -ForegroundColor Green
          }
          else {

              Write-Warning `
                "Final GitHub push failed."
          }

      # ==============================================================
      # 14. Diagnostics
      # ==============================================================

      - name: 14. Final Diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "FINAL DIAGNOSTICS"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Git:"
          git status --short

          Write-Host ""
          Write-Host "Current branch:"
          git branch --show-current

          Write-Host ""
          Write-Host "Target branch:"
          Write-Host $env:TARGET_BRANCH

          Write-Host ""
          Write-Host "Docker:"
          docker ps -a `
            --filter "name=^omniroute$"

          docker ps -a `
            --filter "name=^omniroute-redis$"

          Write-Host ""
          Write-Host "Tailscale:"
          tailscale status --peers=false 2>$null

          Write-Host ""
          Write-Host "RDP service:"
          Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Status, StartType |
            Format-Table

          Write-Host ""
          Write-Host "RDP port:"
          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table

          Write-Host ""
          Write-Host "SQLite:"
          Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Filter "storage.sqlite*" `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Format-Table

          Write-Host ""
          Write-Host "Legacy JSON:"
          Get-Item `
            "${{ github.workspace }}\db_backups\omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json" `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-List

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "WORKFLOW FINISHED"
          Write-Host "=================================================="
