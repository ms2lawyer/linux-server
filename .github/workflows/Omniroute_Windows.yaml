
name: OmniRoute CI Gateway Win (GitHub Windows 2022)

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

  push:
    branches:
      - "Omniroute_Windows"

concurrency:
  group: omniroute-ci-gateway-windows
  cancel-in-progress: false

permissions:
  contents: write

env:
  OMNIROUTE_PORT: 20128
  REDIS_PORT: 6379
  RDP_PORT: 3389

  SQLITE_SYNC_INTERVAL_MINUTES: 5

  LEGACY_BACKUP_BRANCH: "Omniroute_Windows"
  LEGACY_BACKUP_PATH: "db_backups/omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json"

jobs:

  run-omniroute:

    runs-on: windows-2022

    timeout-minutes: 360

    steps:

      # ==============================================================
      # 1. Checkout Repository
      # ==============================================================

      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GIT_TOKEN || github.token }}

      # ==============================================================
      # 2. Verify Windows Host
      # ==============================================================

      - name: 2. Verify Windows Host Prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING GITHUB WINDOWS RUNNER"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
              Select-Object Caption, Version, BuildNumber |
              Format-List

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Architecture:"
          Write-Host (
              [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          )

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "Git LFS:"
          git lfs version

          Write-Host ""
          Write-Host "Docker:"
          docker --version

          Write-Host ""
          Write-Host "Docker Compose:"
          docker compose version

          Write-Host ""
          Write-Host "SQLite:"
          if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {
              sqlite3 --version
          }
          else {
              Write-Warning "sqlite3.exe was not found. WAL checkpoint will be skipped."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "HOST VERIFICATION COMPLETE"
          Write-Host "=================================================="

      # ==============================================================
      # 3. Connect Tailscale
      # ==============================================================

      - name: 3. Connect Tailscale VPN
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: omniroute-ci-gateway

      # ==============================================================
      # 3A. Verify Tailscale
      # ==============================================================

      - name: 3A. Verify Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING TAILSCALE"
          Write-Host "=================================================="

          $tailscale = Get-Command tailscale.exe -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
              throw "tailscale.exe was not found."
          }

          Write-Host ""
          Write-Host "Tailscale version:"
          tailscale version

          $tailscaleIp = (
              & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
              throw "Unable to determine Tailscale IPv4 address."
          }

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          Write-Host $tailscaleIp

          Write-Host ""
          Write-Host "Tailscale status:"
          tailscale status --peers=false

          Write-Host ""
          Write-Host "MagicDNS hostname:"
          Write-Host "omniroute-ci-gateway"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "TAILSCALE CONNECTED"
          Write-Host "=================================================="

      # ==============================================================
      # 4. Enable Remote Desktop ONLY
      # ==============================================================

      - name: 4. Enable Remote Desktop
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "CONFIGURING WINDOWS REMOTE DESKTOP"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
              throw "RDP_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          # ------------------------------------------------------------
          # Validate password
          # ------------------------------------------------------------

          $password = $env:RDP_PASSWORD

          if ($password.Length -lt 16) {
              throw "RDP_PASSWORD must be at least 16 characters. Recommended: 20-24 characters."
          }

          if ($password -notmatch '[A-Z]') {
              throw "RDP_PASSWORD must contain at least one uppercase letter."
          }

          if ($password -notmatch '[a-z]') {
              throw "RDP_PASSWORD must contain at least one lowercase letter."
          }

          if ($password -notmatch '\d') {
              throw "RDP_PASSWORD must contain at least one number."
          }

          if ($password -notmatch '[^a-zA-Z0-9]') {
              throw "RDP_PASSWORD must contain at least one special character."
          }

          Write-Host "RDP password policy pre-check: PASSED"

          # ------------------------------------------------------------
          # Enable RDP
          # ------------------------------------------------------------

          Set-ItemProperty `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
              -Name 'fDenyTSConnections' `
              -Value 0

          Set-ItemProperty `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
              -Name 'UserAuthentication' `
              -Value 1

          # ------------------------------------------------------------
          # Firewall
          # ------------------------------------------------------------

          Enable-NetFirewallRule `
              -DisplayGroup 'Remote Desktop'

          # ------------------------------------------------------------
          # TermService
          # ------------------------------------------------------------

          Set-Service `
              -Name 'TermService' `
              -StartupType Automatic

          Start-Service `
              -Name 'TermService' `
              -ErrorAction SilentlyContinue

          $service = Get-Service `
              -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw "TermService is not running."
          }

          # ------------------------------------------------------------
          # Create / update RDP account
          # ------------------------------------------------------------

          $securePassword = ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          $existingUser = Get-LocalUser `
              -Name $env:RDP_USERNAME `
              -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

              Write-Host "Creating RDP user..."

              New-LocalUser `
                  -Name $env:RDP_USERNAME `
                  -Password $securePassword `
                  -PasswordNeverExpires `
                  -AccountNeverExpires `
                  -Description "GitHub Actions RDP Administrator" |
                  Out-Null
          }
          else {

              Write-Host "Updating RDP user password..."

              Set-LocalUser `
                  -Name $env:RDP_USERNAME `
                  -Password $securePassword

              Enable-LocalUser `
                  -Name $env:RDP_USERNAME
          }

          # ------------------------------------------------------------
          # Add groups
          # ------------------------------------------------------------

          Add-LocalGroupMember `
              -Group 'Administrators' `
              -Member $env:RDP_USERNAME `
              -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
              -Group 'Remote Desktop Users' `
              -Member $env:RDP_USERNAME `
              -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Remote Desktop configured." -ForegroundColor Green

      # ==============================================================
      # 4A. Verify Remote Desktop
      # ==============================================================

      - name: 4A. Verify Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING REMOTE DESKTOP"
          Write-Host "=================================================="

          $rdpDenied = Get-ItemPropertyValue `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
              -Name 'fDenyTSConnections'

          if ($rdpDenied -ne 0) {
              throw "RDP is disabled."
          }

          $nla = Get-ItemPropertyValue `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
              -Name 'UserAuthentication'

          if ($nla -ne 1) {
              throw "RDP NLA is not enabled."
          }

          $service = Get-Service -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw "TermService is not running."
          }

          $rules = Get-NetFirewallRule `
              -DisplayGroup 'Remote Desktop' `
              -ErrorAction SilentlyContinue |
              Where-Object Enabled -eq 'True'

          if ($null -eq $rules) {
              throw "RDP firewall rules are not enabled."
          }

          $rdpPort = $null

          for ($i = 1; $i -le 15; $i++) {

              $rdpPort = Get-NetTCPConnection `
                  -LocalPort 3389 `
                  -State Listen `
                  -ErrorAction SilentlyContinue

              if ($null -ne $rdpPort) {
                  break
              }

              Start-Sleep -Seconds 1
          }

          if ($null -eq $rdpPort) {
              throw "TCP 3389 is not listening."
          }

          Write-Host ""
          Write-Host "RDP service : Running" -ForegroundColor Green
          Write-Host "RDP NLA     : Enabled" -ForegroundColor Green
          Write-Host "RDP firewall: Enabled" -ForegroundColor Green
          Write-Host "RDP port    : LISTENING" -ForegroundColor Green

      # ==============================================================
      # 4B. Display RDP Connection Information
      # ==============================================================

      - name: 4B. Display Remote Desktop Connection Information
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = Get-Command tailscale.exe -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
              throw "tailscale.exe was not found."
          }

          $tailscaleIp = (
              & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
              throw "Tailscale IP could not be detected."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "REMOTE DESKTOP READY"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Tailscale IP : $tailscaleIp"
          Write-Host "RDP endpoint : ${tailscaleIp}:3389"
          Write-Host "RDP hostname : omniroute-ci-gateway"

          Write-Host ""
          Write-Host "RDP command:"
          Write-Host "mstsc /v:omniroute-ci-gateway"

          Write-Host ""
          Write-Host "RDP username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "WARNING:"
          Write-Host "The GitHub-hosted VM is ephemeral."
          Write-Host "RDP exists only while this job is running."

      # ==============================================================
      # 5. Download Legacy JSON Backup
      # ==============================================================

      - name: 5. Download Legacy OmniRoute JSON Backup
        shell: powershell
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "DOWNLOADING LEGACY OMNIROUTE JSON BACKUP"
          Write-Host "=================================================="

          $backupDir = Join-Path `
              "${{ github.workspace }}" `
              "db_backups"

          $backupName = Split-Path `
              "$env:LEGACY_BACKUP_PATH" `
              -Leaf

          $backupFile = Join-Path `
              $backupDir `
              $backupName

          New-Item `
              -ItemType Directory `
              -Path $backupDir `
              -Force |
              Out-Null

          $encodedPath = [System.Uri]::EscapeDataString(
              $env:LEGACY_BACKUP_PATH
          )

          $apiUrl =
              "https://api.github.com/repos/ms2lawyer/linux-server/contents/" +
              $encodedPath +
              "?ref=" +
              $env:LEGACY_BACKUP_BRANCH

          $headers = @{
              "Accept"               = "application/vnd.github.raw+json"
              "Authorization"        = "Bearer $env:GIT_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
              "User-Agent"           = "OmniRoute-CI-Gateway"
          }

          Invoke-WebRequest `
              -Uri $apiUrl `
              -Headers $headers `
              -OutFile $backupFile `
              -UseBasicParsing

          if (-not (Test-Path $backupFile)) {
              throw "Legacy JSON backup was not downloaded."
          }

          $info = Get-Item $backupFile

          if ($info.Length -lt 10) {
              throw "Downloaded JSON backup is suspiciously small."
          }

          Write-Host ""
          Write-Host "Backup downloaded:"
          Write-Host $info.FullName
          Write-Host "Size: $($info.Length) bytes"

          try {

              Get-Content `
                  -Path $backupFile `
                  -Raw `
                  -Encoding UTF8 |
                  ConvertFrom-Json |
                  Out-Null
          }
          catch {

              throw "Downloaded legacy backup is invalid JSON: $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "JSON validation: PASSED" -ForegroundColor Green

      # ==============================================================
      # 6. Start Redis
      # ==============================================================

      - name: 6. Start Redis Container
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING REDIS"
          Write-Host "=================================================="

          docker rm -f omniroute-redis 2>$null

          if ($LASTEXITCODE -ne 0) {
              $global:LASTEXITCODE = 0
          }

          docker run -d `
              --name omniroute-redis `
              --restart unless-stopped `
              -p 6379:6379 `
              --health-cmd "redis-cli ping" `
              --health-interval 10s `
              --health-timeout 5s `
              --health-retries 3 `
              redis:7-alpine

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to start Redis."
          }

          $redisReady = $false

          for ($i = 1; $i -le 30; $i++) {

              $health = docker inspect `
                  --format "{{.State.Health.Status}}" `
                  omniroute-redis `
                  2>$null

              if ($health -eq "healthy") {

                  $redisReady = $true
                  break
              }

              Start-Sleep -Seconds 2
          }

          if (-not $redisReady) {

              docker logs omniroute-redis

              throw "Redis health check failed."
          }

          Write-Host "Redis is healthy." -ForegroundColor Green

      # ==============================================================
      # 7. Start OmniRoute
      # ==============================================================

      - name: 7. Start OmniRoute Container
        shell: powershell
        env:
          OMNI_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OMNI_API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          OMNI_STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING OMNIROUTE"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:OMNI_JWT_SECRET)) {
              throw "JWT_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_API_KEY_SECRET)) {
              throw "API_KEY_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_STORAGE_ENCRYPTION_KEY)) {
              throw "STORAGE_ENCRYPTION_KEY secret is missing."
          }

          docker rm -f omniroute 2>$null

          if ($LASTEXITCODE -ne 0) {
              $global:LASTEXITCODE = 0
          }

          $workspace = "${{ github.workspace }}"

          docker run -d `
              --name omniroute `
              --restart unless-stopped `
              -p 20128:20128 `
              -e "NODE_ENV=production" `
              -e "PORT=20128" `
              -e "HOSTNAME=0.0.0.0" `
              -e "JWT_SECRET=$env:OMNI_JWT_SECRET" `
              -e "API_KEY_SECRET=$env:OMNI_API_KEY_SECRET" `
              -e "STORAGE_ENCRYPTION_KEY=$env:OMNI_STORAGE_ENCRYPTION_KEY" `
              -e "REDIS_URL=redis://host.docker.internal:6379" `
              -e "DATA_DIR=/root/.omniroute" `
              --add-host=host.docker.internal:host-gateway `
              -v "${workspace}:/root/.omniroute" `
              -v "${workspace}:/app/data" `
              diegosouzapw/omniroute:latest

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to start OmniRoute."
          }

          docker ps `
              --filter "name=omniroute"

      # ==============================================================
      # 7A. Verify OmniRoute Health
      # ==============================================================

      - name: 7A. Wait for OmniRoute
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Waiting for OmniRoute..."

          $healthy = $false

          for ($i = 1; $i -le 60; $i++) {

              try {

                  $response = Invoke-WebRequest `
                      -Uri "http://localhost:20128" `
                      -UseBasicParsing `
                      -TimeoutSec 5 `
                      -ErrorAction Stop

                  if (
                      $response.StatusCode -ge 200 -and
                      $response.StatusCode -lt 500
                  ) {

                      $healthy = $true
                      break
                  }
              }
              catch {
              }

              Write-Host "Waiting... ($i/60)"
              Start-Sleep -Seconds 2
          }

          if (-not $healthy) {

              docker ps -a `
                  --filter "name=omniroute"

              docker logs omniroute

              throw "OmniRoute did not become healthy."
          }

          Write-Host ""
          Write-Host "OmniRoute is live." -ForegroundColor Green

      # ==============================================================
      # 8. Register Legacy JSON Backup With OmniRoute
      #
      # OmniRoute's documented restore mechanism works with named
      # backups through:
      #
      #   omniroute restore <name>
      #
      # We copy the legacy snapshot into OmniRoute's backup directory.
      # ==============================================================

      - name: 8. Restore Legacy OmniRoute Backup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "RESTORING LEGACY OMNIROUTE BACKUP"
          Write-Host "=================================================="

          $workspace = "${{ github.workspace }}"
          $backupName = Split-Path `
              "$env:LEGACY_BACKUP_PATH" `
              -Leaf

          $hostBackup = Join-Path `
              $workspace `
              "db_backups\$backupName"

          if (-not (Test-Path $hostBackup)) {
              throw "Legacy backup not found: $hostBackup"
          }

          Write-Host ""
          Write-Host "Legacy backup:"
          Write-Host $hostBackup

          # ------------------------------------------------------------
          # Ensure OmniRoute backup directory exists.
          # ------------------------------------------------------------

          docker exec `
              omniroute `
              sh -lc `
              "mkdir -p /root/.omniroute/backups"

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to create OmniRoute backup directory."
          }

          # ------------------------------------------------------------
          # Copy legacy JSON into OmniRoute data directory.
          # ------------------------------------------------------------

          $containerBackup =
              "/root/.omniroute/backups/$backupName"

          Copy-Item `
              $hostBackup `
              (Join-Path $workspace "backups\$backupName") `
              -Force `
              -ErrorAction SilentlyContinue

          New-Item `
              -ItemType Directory `
              -Path (Join-Path $workspace "backups") `
              -Force |
              Out-Null

          Copy-Item `
              $hostBackup `
              (Join-Path $workspace "backups\$backupName") `
              -Force

          # ------------------------------------------------------------
          # Verify inside container.
          # ------------------------------------------------------------

          docker exec `
              omniroute `
              sh -lc `
              "test -s '$containerBackup'"

          if ($LASTEXITCODE -ne 0) {
              throw "Legacy backup is not visible inside OmniRoute."
          }

          Write-Host ""
          Write-Host "Legacy backup is available inside OmniRoute:"
          Write-Host $containerBackup

          # ------------------------------------------------------------
          # Show restore command supported by installed OmniRoute.
          # ------------------------------------------------------------

          Write-Host ""
          Write-Host "Checking OmniRoute restore command..."

          docker exec `
              omniroute `
              sh -lc `
              "omniroute restore --help"

          # ------------------------------------------------------------
          # IMPORTANT:
          # The backup is named using the filename without extension.
          # OmniRoute's documented CLI is:
          #
          #   omniroute restore <name>
          #
          # ------------------------------------------------------------

          $restoreName = [System.IO.Path]::GetFileNameWithoutExtension(
              $backupName
          )

          Write-Host ""
          Write-Host "Restore name:"
          Write-Host $restoreName

          docker exec `
              omniroute `
              sh -lc `
              "omniroute restore '$restoreName'"

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "Native restore command failed."

              Write-Host ""
              Write-Host "Available backup files:"

              docker exec `
                  omniroute `
                  sh -lc `
                  "find /root/.omniroute -maxdepth 3 -type f \( -name '*.json' -o -name '*.sqlite' -o -name '*.tar.gz' \) -print"

              throw "Legacy OmniRoute restore failed."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "LEGACY OMNIROUTE RESTORE COMPLETED"
          Write-Host "=================================================="

      # ==============================================================
      # 8A. Restart OmniRoute After Restore
      # ==============================================================

      - name: 8A. Restart OmniRoute After Restore
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Restarting OmniRoute after restore..."

          docker restart omniroute | Out-Null

          $healthy = $false

          for ($i = 1; $i -le 60; $i++) {

              try {

                  $response = Invoke-WebRequest `
                      -Uri "http://localhost:20128" `
                      -UseBasicParsing `
                      -TimeoutSec 5 `
                      -ErrorAction Stop

                  if (
                      $response.StatusCode -ge 200 -and
                      $response.StatusCode -lt 500
                  ) {

                      $healthy = $true
                      break
                  }
              }
              catch {
              }

              Start-Sleep -Seconds 2
          }

          if (-not $healthy) {

              docker ps -a `
                  --filter "name=omniroute"

              docker logs omniroute

              throw "OmniRoute failed after restore."
          }

          Write-Host `
              "OmniRoute is healthy after restore." `
              -ForegroundColor Green

      # ==============================================================
      # 8B. Verify SQLite
      # ==============================================================

      - name: 8B. Verify Restored SQLite Database
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dbFile = Join-Path `
              "${{ github.workspace }}" `
              "storage.sqlite"

          if (-not (Test-Path $dbFile)) {
              throw "storage.sqlite was not found."
          }

          $info = Get-Item $dbFile

          Write-Host ""
          Write-Host "SQLite database:"
          Write-Host $info.FullName
          Write-Host "Size: $($info.Length) bytes"

          if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

              Write-Host ""
              Write-Host "SQLite integrity check:"

              $result = sqlite3 `
                  $dbFile `
                  "PRAGMA integrity_check;"

              Write-Host $result

              if ($result -notmatch "^ok$") {
                  throw "SQLite integrity check failed."
              }
          }

      # ==============================================================
      # 9. Keep Alive + SQLite Persistence
      # ==============================================================

      - name: 9. Keep-Alive + Periodic SQLite Persistence
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          $workspace = "${{ github.workspace }}"

          $dbFile = Join-Path `
              $workspace `
              "storage.sqlite"

          $archive = Join-Path `
              $workspace `
              "backup/omniroute/omniroute-full-backup.tar.gz"

          $interval = [int]$env:SQLITE_SYNC_INTERVAL_MINUTES
          $counter = 0
          $totalMinutes = 355

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
              $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          New-Item `
              -ItemType Directory `
              -Path (Join-Path $workspace "backup/omniroute") `
              -Force |
              Out-Null

          function Sync-OmniRouteState {

              Write-Host ""
              Write-Host "==================================================" `
                  -ForegroundColor Cyan

              Write-Host "PERSISTING OMNIROUTE SQLITE STATE" `
                  -ForegroundColor Cyan

              Write-Host "==================================================" `
                  -ForegroundColor Cyan

              if (-not (Test-Path $dbFile)) {

                  Write-Warning "storage.sqlite does not exist."

                  return
              }

              # --------------------------------------------------------
              # Checkpoint WAL
              # --------------------------------------------------------

              if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

                  sqlite3 `
                      $dbFile `
                      "PRAGMA wal_checkpoint(TRUNCATE);"

                  if ($LASTEXITCODE -ne 0) {

                      Write-Warning `
                          "SQLite WAL checkpoint failed."
                  }
              }

              # --------------------------------------------------------
              # Create compressed backup
              # --------------------------------------------------------

              $tarItems = @()

              if (Test-Path "storage.sqlite") {
                  $tarItems += "storage.sqlite"
              }

              if (Test-Path "storage.sqlite-wal") {
                  $tarItems += "storage.sqlite-wal"
              }

              if (Test-Path "storage.sqlite-shm") {
                  $tarItems += "storage.sqlite-shm"
              }

              if (Test-Path "db_backups") {
                  $tarItems += "db_backups"
              }

              if ($tarItems.Count -gt 0) {

                  Remove-Item `
                      $archive `
                      -Force `
                      -ErrorAction SilentlyContinue

                  tar -czf $archive `
                      --exclude=logs `
                      --exclude=call_logs `
                      --exclude=server `
                      @tarItems

                  if ($LASTEXITCODE -ne 0) {

                      Write-Warning `
                          "Backup archive creation failed."
                  }
              }

              # --------------------------------------------------------
              # Stage database state
              # --------------------------------------------------------

              git add `
                  .gitattributes `
                  storage.sqlite `
                  storage.sqlite-wal `
                  storage.sqlite-shm `
                  backup/omniroute/omniroute-full-backup.tar.gz `
                  db_backups/ `
                  2>$null

              git diff --cached --quiet

              $hasChanges = ($LASTEXITCODE -ne 0)

              if (-not $hasChanges) {

                  Write-Host "No SQLite changes detected."

                  return
              }

              # --------------------------------------------------------
              # Commit
              # --------------------------------------------------------

              git commit `
                  -m "chore: persist OmniRoute SQLite state [skip ci]" `
                  2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning "Git commit failed."

                  return
              }

              # --------------------------------------------------------
              # Synchronize remote branch
              # --------------------------------------------------------

              git fetch origin "${{ github.ref_name }}" 2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning "git fetch failed."

                  return
              }

              git rebase `
                  "origin/${{ github.ref_name }}" `
                  2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning "git rebase failed."

                  git rebase --abort 2>$null

                  return
              }

              # --------------------------------------------------------
              # Push
              # --------------------------------------------------------

              git push `
                  origin `
                  "HEAD:${{ github.ref_name }}" `
                  2>$null

              if ($LASTEXITCODE -eq 0) {

                  Write-Host ""
                  Write-Host `
                      "SQLite state persisted to GitHub." `
                      -ForegroundColor Green
              }
              else {

                  Write-Warning `
                      "GitHub push failed."
              }
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "KEEP-ALIVE STARTED"
          Write-Host "Duration: 355 minutes"
          Write-Host "SQLite persistence: every $interval minutes"
          Write-Host "=================================================="

          for ($minute = 1; $minute -le $totalMinutes; $minute++) {

              Start-Sleep -Seconds 60

              $counter++

              if ($counter -ge $interval) {

                  $counter = 0

                  Sync-OmniRouteState
              }

              if (($minute % 10) -eq 0) {

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] OmniRoute:"

                  docker ps `
                      --filter "name=omniroute" `
                      --format "Status: {{.Status}}" `
                      2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] Redis:"

                  docker ps `
                      --filter "name=omniroute-redis" `
                      --format "Status: {{.Status}}" `
                      2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] Tailscale:"

                  tailscale status `
                      --peers=false `
                      2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] RDP:"

                  $rdpPort = Get-NetTCPConnection `
                      -LocalPort 3389 `
                      -State Listen `
                      -ErrorAction SilentlyContinue

                  if ($null -ne $rdpPort) {

                      Write-Host "RDP: LISTENING"
                  }
                  else {

                      Write-Warning "RDP: NOT LISTENING"
                  }
              }
          }

          # Final normal sync.
          Sync-OmniRouteState

      # ==============================================================
      # 10. Final Shutdown
      # ==============================================================

      - name: 10. Final Shutdown + SQLite Checkpoint
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=================================================="
          Write-Host "FINAL SHUTDOWN"
          Write-Host "=================================================="

          Write-Host "Stopping OmniRoute..."

          docker stop omniroute 2>$null
          docker rm omniroute 2>$null

          Write-Host "Stopping Redis..."

          docker stop omniroute-redis 2>$null
          docker rm omniroute-redis 2>$null

          $dbFile = Join-Path `
              "${{ github.workspace }}" `
              "storage.sqlite"

          if (Test-Path $dbFile) {

              if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

                  Write-Host "Running final WAL checkpoint..."

                  sqlite3 `
                      $dbFile `
                      "PRAGMA wal_checkpoint(TRUNCATE);"

                  if ($LASTEXITCODE -eq 0) {

                      Write-Host `
                          "Final WAL checkpoint completed." `
                          -ForegroundColor Green
                  }
                  else {

                      Write-Warning `
                          "Final WAL checkpoint failed."
                  }
              }
          }

      # ==============================================================
      # 11. Final GitHub Persistence
      # ==============================================================

      - name: 11. Final GitHub SQLite Persistence
        if: always()
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=================================================="
          Write-Host "FINAL GITHUB SQLITE PUSH"
          Write-Host "=================================================="

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
              $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          New-Item `
              -ItemType Directory `
              -Path "backup/omniroute" `
              -Force |
              Out-Null

          # ------------------------------------------------------------
          # Final SQLite checkpoint
          # ------------------------------------------------------------

          if (
              (Test-Path "storage.sqlite") -and
              (Get-Command sqlite3 -ErrorAction SilentlyContinue)
          ) {

              sqlite3 `
                  "storage.sqlite" `
                  "PRAGMA wal_checkpoint(TRUNCATE);"
          }

          # ------------------------------------------------------------
          # Final backup archive
          # ------------------------------------------------------------

          $archive =
              "backup/omniroute/omniroute-full-backup.tar.gz"

          $tarItems = @()

          if (Test-Path "storage.sqlite") {
              $tarItems += "storage.sqlite"
          }

          if (Test-Path "storage.sqlite-wal") {
              $tarItems += "storage.sqlite-wal"
          }

          if (Test-Path "storage.sqlite-shm") {
              $tarItems += "storage.sqlite-shm"
          }

          if (Test-Path "db_backups") {
              $tarItems += "db_backups"
          }

          if ($tarItems.Count -gt 0) {

              Remove-Item `
                  $archive `
                  -Force `
                  -ErrorAction SilentlyContinue

              tar -czf $archive `
                  --exclude=logs `
                  --exclude=call_logs `
                  --exclude=server `
                  @tarItems
          }

          # ------------------------------------------------------------
          # Stage
          # ------------------------------------------------------------

          git add `
              .gitattributes `
              storage.sqlite `
              storage.sqlite-wal `
              storage.sqlite-shm `
              backup/omniroute/omniroute-full-backup.tar.gz `
              db_backups/ `
              2>$null

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {

              Write-Host "No final database changes."

              exit 0
          }

          # ------------------------------------------------------------
          # Commit
          # ------------------------------------------------------------

          git commit `
              -m "chore: final OmniRoute DB state backup [skip ci]" `
              2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning "Final Git commit failed."

              exit 0
          }

          # ------------------------------------------------------------
          # Fetch and rebase
          # ------------------------------------------------------------

          git fetch origin "${{ github.ref_name }}" 2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning "Final git fetch failed."

              exit 0
          }

          git rebase `
              "origin/${{ github.ref_name }}" `
              2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning "Final git rebase failed."

              git rebase --abort 2>$null

              exit 0
          }

          # ------------------------------------------------------------
          # Push
          # ------------------------------------------------------------

          git push `
              origin `
              "HEAD:${{ github.ref_name }}" `
              2>$null

          if ($LASTEXITCODE -eq 0) {

              Write-Host ""
              Write-Host `
                  "FINAL SQLITE STATE PUSHED SUCCESSFULLY." `
                  -ForegroundColor Green
          }
          else {

              Write-Warning `
                  "Final GitHub push failed."
          }

      # ==============================================================
      # 12. Final Diagnostics
      # ==============================================================

      - name: 12. Final Diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "FINAL DIAGNOSTICS"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Git:"
          git status --short

          Write-Host ""
          Write-Host "Docker:"
          docker ps -a `
              --filter "name=omniroute"

          docker ps -a `
              --filter "name=omniroute-redis"

          Write-Host ""
          Write-Host "Tailscale:"
          tailscale status --peers=false 2>$null

          Write-Host ""
          Write-Host "RDP service:"

          Get-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue |
              Select-Object Name, Status, StartType |
              Format-Table

          Write-Host ""
          Write-Host "RDP TCP 3389:"

          Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Select-Object LocalAddress, LocalPort, State |
              Format-Table

          Write-Host ""
          Write-Host "SQLite:"

          Get-ChildItem `
              -Path "${{ github.workspace }}" `
              -Filter "storage.sqlite*" `
              -ErrorAction SilentlyContinue |
              Select-Object Name, Length, LastWriteTime |
              Format-Table

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "WORKFLOW FINISHED"
          Write-Host "=================================================="
