
name: OmniRoute CI Gateway (Windows 10 Restored State)

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

  push:
    branches:
      - "Omniroute_Windows"

concurrency:
  group: omniroute-ci-gateway-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-omniroute:

    # GitHub-hosted Windows runner.
    # This is NOT a self-hosted runner.
    runs-on: windows-2022

    # Maximum allowed runtime for this workflow design.
    timeout-minutes: 360

    steps:

      # ==============================================================
      # 1. Checkout Repository
      # ==============================================================

      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GIT_TOKEN || github.token }}

      # ==============================================================
      # 2. Verify Windows Host Prerequisites
      # ==============================================================

      - name: 2. Verify Windows Host Prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING GITHUB-HOSTED WINDOWS RUNNER"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber |
            Format-List

          Write-Host ""
          Write-Host "Computer:"
          $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Architecture:"
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture

          Write-Host ""
          Write-Host "Docker:"
          docker --version

          Write-Host ""
          Write-Host "Docker Compose:"
          docker compose version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "Git LFS:"
          git lfs version

          Write-Host ""
          Write-Host "SQLite:"
          if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {
              sqlite3 --version
          }
          else {
              Write-Warning "sqlite3.exe was not found. WAL checkpoint will be skipped."
          }

          Write-Host ""
          Write-Host "Docker Engine:"
          docker info |
            Select-String "Server Version|Operating System|OSType"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "HOST PREREQUISITES VERIFIED"
          Write-Host "=================================================="

      # ==============================================================
      # 3. Connect Tailscale VPN
      # ==============================================================

      - name: 3. Connect Tailscale VPN
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: omniroute-ci-gateway

      # ==============================================================
      # 3A. Verify Tailscale
      # ==============================================================

      - name: 3A. Verify Tailscale Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING TAILSCALE"
          Write-Host "=================================================="

          $tailscale = Get-Command tailscale.exe -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
              throw "tailscale.exe was not found."
          }

          Write-Host ""
          Write-Host "Tailscale version:"
          tailscale version

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          $tailscaleIp = (
              & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
              throw "Unable to determine Tailscale IPv4 address."
          }

          Write-Host $tailscaleIp

          Write-Host ""
          Write-Host "Tailscale status:"
          tailscale status --peers=false

          Write-Host ""
          Write-Host "MagicDNS hostname:"
          Write-Host "omniroute-ci-gateway"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "TAILSCALE CONNECTED"
          Write-Host "=================================================="

      # ==============================================================
      # 4. Enable SSH Access
      # ==============================================================

      - name: 4. Enable SSH Access
        shell: powershell
        env:
          SSH_USERNAME: ${{ secrets.RDP_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "CONFIGURING WINDOWS OPENSSH"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:SSH_USERNAME)) {
              throw "RDP_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:SSH_PASSWORD)) {
              throw "SSH_PASSWORD secret is missing."
          }

          $sshCapability = Get-WindowsCapability -Online |
              Where-Object Name -like "OpenSSH.Server*"

          if ($sshCapability.State -ne "Installed") {

              Write-Host "Installing OpenSSH Server..."

              Add-WindowsCapability `
                  -Online `
                  -Name OpenSSH.Server~~~~0.0.1.0
          }

          $securePassword = ConvertTo-SecureString `
              $env:SSH_PASSWORD `
              -AsPlainText `
              -Force

          $existingUser = Get-LocalUser `
              -Name $env:SSH_USERNAME `
              -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

              New-LocalUser `
                  -Name $env:SSH_USERNAME `
                  -Password $securePassword `
                  -Description "GitHub Actions OmniRoute SSH user" `
                  -AccountNeverExpires `
                  -PasswordNeverExpires:$false `
                  -UserMayNotChangePassword:$false |
                  Out-Null
          }
          else {

              Set-LocalUser `
                  -Name $env:SSH_USERNAME `
                  -Password $securePassword
          }

          $adminGroup = Get-LocalGroup -SID "S-1-5-32-544"

          $isAdmin = Get-LocalGroupMember `
              -Group $adminGroup.Name `
              -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.Name -eq "$env:COMPUTERNAME\$env:SSH_USERNAME"
              }

          if ($null -eq $isAdmin) {

              Add-LocalGroupMember `
                  -Group $adminGroup.Name `
                  -Member $env:SSH_USERNAME
          }

          $sshRoot = "$env:ProgramData\ssh"
          $configFile = "$sshRoot\sshd_config"
          $dropInDir = "$sshRoot\sshd_config.d"
          $dropInFile = "$dropInDir\99-github-runner-ssh.conf"

          New-Item `
              -ItemType Directory `
              -Path $dropInDir `
              -Force |
              Out-Null

          $configContent = @"
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          PubkeyAuthentication yes
          PermitRootLogin no
          MaxAuthTries 3
          LoginGraceTime 30
          X11Forwarding no
          AllowTcpForwarding no
          AllowAgentForwarding no
          "@

          Set-Content `
              -Path $dropInFile `
              -Value $configContent `
              -Encoding ascii

          $existingConfig = Get-Content `
              -Path $configFile `
              -Raw `
              -ErrorAction SilentlyContinue

          $includeLine = "Include C:/ProgramData/ssh/sshd_config.d/*.conf"

          if ($existingConfig -notmatch '(?im)^\s*Include\s+.*sshd_config\.d') {

              $newConfig = @"
          $includeLine

          $existingConfig
          "@

              Set-Content `
                  -Path $configFile `
                  -Value $newConfig `
                  -Encoding ascii
          }

          & "$env:WINDIR\System32\OpenSSH\sshd.exe" -t

          Set-Service `
              -Name sshd `
              -StartupType Automatic

          Start-Service `
              -Name sshd `
              -ErrorAction SilentlyContinue

          $sshService = Get-Service `
              -Name sshd

          if ($sshService.Status -ne "Running") {
              throw "OpenSSH service is not running."
          }

          $firewallRule = Get-NetFirewallRule `
              -Name "OpenSSH-Server-In-TCP" `
              -ErrorAction SilentlyContinue

          if ($null -eq $firewallRule) {

              New-NetFirewallRule `
                  -Name "OpenSSH-Server-In-TCP" `
                  -DisplayName "OpenSSH Server (TCP 22)" `
                  -Enabled True `
                  -Direction Inbound `
                  -Protocol TCP `
                  -LocalPort 22 `
                  -Action Allow |
                  Out-Null
          }
          else {

              Enable-NetFirewallRule `
                  -Name "OpenSSH-Server-In-TCP"
          }

          Write-Host ""
          Write-Host "SSH service : Running" -ForegroundColor Green
          Write-Host "SSH endpoint: $env:SSH_USERNAME@omniroute-ci-gateway" -ForegroundColor Green

      # ==============================================================
      # 4A. Enable Remote Desktop
      # ==============================================================

      - name: 4A. Enable Remote Desktop
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "CONFIGURING WINDOWS REMOTE DESKTOP" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
              throw "RDP_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          # ------------------------------------------------------------
          # Enable RDP
          # ------------------------------------------------------------

          Set-ItemProperty `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
              -Name 'fDenyTSConnections' `
              -Value 0

          Set-ItemProperty `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
              -Name 'UserAuthentication' `
              -Value 1

          # ------------------------------------------------------------
          # Enable firewall
          # ------------------------------------------------------------

          Enable-NetFirewallRule `
              -DisplayGroup 'Remote Desktop'

          # ------------------------------------------------------------
          # Configure TermService
          # ------------------------------------------------------------

          Set-Service `
              -Name 'TermService' `
              -StartupType Automatic

          Start-Service `
              -Name 'TermService' `
              -ErrorAction SilentlyContinue

          $service = Get-Service `
              -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw "TermService is not running."
          }

          # ------------------------------------------------------------
          # Create / update RDP user
          # ------------------------------------------------------------

          $securePassword = ConvertTo-SecureString `
              $env:RDP_PASSWORD `
              -AsPlainText `
              -Force

          $existing = Get-LocalUser `
              -Name $env:RDP_USERNAME `
              -ErrorAction SilentlyContinue

          if ($null -eq $existing) {

              New-LocalUser `
                  -Name $env:RDP_USERNAME `
                  -Password $securePassword `
                  -PasswordNeverExpires `
                  -AccountNeverExpires `
                  -Description "GitHub Actions RDP Administrator" |
                  Out-Null
          }
          else {

              Set-LocalUser `
                  -Name $env:RDP_USERNAME `
                  -Password $securePassword

              Enable-LocalUser `
                  -Name $env:RDP_USERNAME
          }

          # ------------------------------------------------------------
          # Administrator membership
          # ------------------------------------------------------------

          Add-LocalGroupMember `
              -Group 'Administrators' `
              -Member $env:RDP_USERNAME `
              -ErrorAction SilentlyContinue

          # ------------------------------------------------------------
          # Remote Desktop Users membership
          # ------------------------------------------------------------

          Add-LocalGroupMember `
              -Group 'Remote Desktop Users' `
              -Member $env:RDP_USERNAME `
              -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Remote Desktop enabled." -ForegroundColor Green
          Write-Host "RDP User: $env:RDP_USERNAME"

      # ==============================================================
      # 4B. Verify Remote Desktop
      # ==============================================================

      - name: 4B. Verify Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "VERIFYING REMOTE DESKTOP" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          $rdpDenied = Get-ItemPropertyValue `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
              -Name 'fDenyTSConnections'

          if ($rdpDenied -ne 0) {
              throw "RDP is disabled."
          }

          $userAuthentication = Get-ItemPropertyValue `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
              -Name 'UserAuthentication'

          if ($userAuthentication -ne 1) {
              throw "RDP Network Level Authentication is not enabled."
          }

          $service = Get-Service `
              -Name 'TermService'

          if ($service.Status -ne 'Running') {
              throw "TermService is not running."
          }

          $firewallRules = Get-NetFirewallRule `
              -DisplayGroup 'Remote Desktop' `
              -ErrorAction SilentlyContinue |
              Where-Object Enabled -eq 'True'

          if ($null -eq $firewallRules) {
              throw "Remote Desktop firewall rules are not enabled."
          }

          $rdpPort = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

          if ($null -eq $rdpPort) {
              throw "TCP port 3389 is not listening."
          }

          Write-Host "RDP service : Running" -ForegroundColor Green
          Write-Host "RDP registry: Enabled" -ForegroundColor Green
          Write-Host "RDP NLA     : Enabled" -ForegroundColor Green
          Write-Host "RDP firewall: Enabled" -ForegroundColor Green
          Write-Host "RDP port    : Listening on 3389" -ForegroundColor Green

      # ==============================================================
      # 4C. Display Remote Desktop Connection Information
      # ==============================================================

      - name: 4C. Display Remote Desktop Connection Information
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "REMOTE DESKTOP IS READY" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green

          $tailscale = Get-Command `
              tailscale.exe `
              -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
              throw "tailscale.exe was not found."
          }

          $tailscaleIp = (
              & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {

              throw "Tailscale IP could not be detected."
          }

          Write-Host ""
          Write-Host "Tailscale IP : $tailscaleIp" -ForegroundColor Yellow
          Write-Host "RDP endpoint : ${tailscaleIp}:3389" -ForegroundColor Yellow
          Write-Host "RDP hostname : omniroute-ci-gateway" -ForegroundColor Yellow

          Write-Host ""
          Write-Host "RDP command:" -ForegroundColor Magenta
          Write-Host "mstsc /v:omniroute-ci-gateway" -ForegroundColor Magenta

          Write-Host ""
          Write-Host "RDP Username : $env:RDP_USERNAME"

          Write-Host ""
          Write-Host "IMPORTANT:"
          Write-Host "This GitHub-hosted VM exists only while this workflow job is running."
          Write-Host "RDP will disappear when the GitHub Actions job ends."

      # ==============================================================
      # 5. Start Redis Container
      # ==============================================================

      - name: 5. Start Redis Container
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING REDIS"
          Write-Host "=================================================="

          docker rm -f omniroute-redis 2>$null

          if ($LASTEXITCODE -ne 0) {
              $global:LASTEXITCODE = 0
          }

          docker run -d `
              --name omniroute-redis `
              --restart unless-stopped `
              -p 6379:6379 `
              --health-cmd "redis-cli ping" `
              --health-interval 10s `
              --health-timeout 5s `
              --health-retries 3 `
              redis:7-alpine

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to start Redis container."
          }

          Write-Host "Waiting for Redis..."

          $redisReady = $false

          for ($i = 1; $i -le 30; $i++) {

              $health = docker inspect `
                  --format "{{.State.Health.Status}}" `
                  omniroute-redis 2>$null

              if ($health -eq "healthy") {

                  $redisReady = $true
                  break
              }

              Start-Sleep -Seconds 2
          }

          if (-not $redisReady) {

              Write-Host "Redis failed to become healthy."

              docker ps -a `
                  --filter "name=omniroute-redis"

              docker logs omniroute-redis

              throw "Redis health check failed."
          }

          docker ps `
              --filter "name=omniroute-redis"

          Write-Host "Redis is healthy." -ForegroundColor Green

      # ==============================================================
      # 6. Start OmniRoute Container
      # ==============================================================

      - name: 6. Start OmniRoute Container
        shell: powershell
        env:
          OMNI_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OMNI_API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          OMNI_STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING OMNIROUTE"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:OMNI_JWT_SECRET)) {
              throw "JWT_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_API_KEY_SECRET)) {
              throw "API_KEY_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_STORAGE_ENCRYPTION_KEY)) {
              throw "STORAGE_ENCRYPTION_KEY secret is missing."
          }

          docker rm -f omniroute 2>$null

          if ($LASTEXITCODE -ne 0) {
              $global:LASTEXITCODE = 0
          }

          $workspace = "${{ github.workspace }}"

          Write-Host "Workspace:"
          Write-Host $workspace

          docker run -d `
              --name omniroute `
              --restart unless-stopped `
              -p 20128:20128 `
              -e "NODE_ENV=production" `
              -e "JWT_SECRET=$env:OMNI_JWT_SECRET" `
              -e "API_KEY_SECRET=$env:OMNI_API_KEY_SECRET" `
              -e "STORAGE_ENCRYPTION_KEY=$env:OMNI_STORAGE_ENCRYPTION_KEY" `
              -e "REDIS_URL=redis://host.docker.internal:6379" `
              --add-host=host.docker.internal:host-gateway `
              -v "${workspace}:/root/.omniroute" `
              -v "${workspace}:/app/data" `
              diegosouzapw/omniroute:latest

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to start OmniRoute container."
          }

          Write-Host ""
          Write-Host "OmniRoute container started:"

          docker ps `
              --filter "name=omniroute"

      # ==============================================================
      # 6A. Verify OmniRoute Container
      # ==============================================================

      - name: 6A. Verify OmniRoute Container
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING OMNIROUTE CONTAINER"
          Write-Host "=================================================="

          $running = docker inspect `
              --format "{{.State.Running}}" `
              omniroute 2>$null

          if ($running -ne "true") {

              Write-Host ""
              Write-Host "OmniRoute is not running."

              docker ps -a `
                  --filter "name=omniroute"

              docker logs omniroute

              throw "OmniRoute container is not running."
          }

          Write-Host "OmniRoute container: Running" -ForegroundColor Green

      # ==============================================================
      # 7. Verify OmniRoute Health
      # ==============================================================

      - name: 7. Verify OmniRoute Health
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "WAITING FOR OMNIROUTE GATEWAY"
          Write-Host "=================================================="

          $success = $false

          for ($i = 1; $i -le 60; $i++) {

              try {

                  $response = Invoke-WebRequest `
                      -Uri "http://localhost:20128" `
                      -UseBasicParsing `
                      -TimeoutSec 5 `
                      -ErrorAction Stop

                  if (
                      $response.StatusCode -ge 200 -and
                      $response.StatusCode -lt 500
                  ) {

                      $success = $true
                      break
                  }
              }
              catch {
                  # OmniRoute may still be initializing.
              }

              Write-Host "Waiting... ($i/60)"
              Start-Sleep -Seconds 2
          }

          if ($success) {

              Write-Host ""
              Write-Host "=================================================="
              Write-Host "OMNIROUTE GATEWAY LIVE"
              Write-Host "=================================================="

              Write-Host "Dashboard:"
              Write-Host "http://omniroute-ci-gateway:20128"

              Write-Host ""
              Write-Host "API Endpoint:"
              Write-Host "http://omniroute-ci-gateway:20128/v1"

              Write-Host ""
              Write-Host "Local Endpoint:"
              Write-Host "http://localhost:20128/v1"

              Write-Host ""
              Write-Host "=================================================="

              exit 0
          }

          Write-Host ""
          Write-Host "OmniRoute initialization failed."

          Write-Host ""
          Write-Host "Container status:"

          docker ps -a `
              --filter "name=omniroute"

          Write-Host ""
          Write-Host "OmniRoute logs:"

          docker logs omniroute

          throw "OmniRoute health check failed."
          
      # ==============================================================
      # 8. Keep-Alive + Periodic SQLite Persistence
      # ==============================================================

      - name: 8. Keep-Alive + Periodic SQLite Persistence
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = "Continue"

          $workspace = "${{ github.workspace }}"
          $dbFile = Join-Path $workspace "storage.sqlite"
          $archive = Join-Path $workspace "backup/omniroute/omniroute-full-backup.tar.gz"

          $syncIntervalMinutes = 5
          $syncCounter = 0
          $totalMinutes = 355

          git config user.name "$env:GIT_USERNAME"

          if ([string]::IsNullOrWhiteSpace($env:GIT_USERNAME)) {
              git config user.name "github-actions[bot]"
          }

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          New-Item `
              -ItemType Directory `
              -Path (Join-Path $workspace "backup/omniroute") `
              -Force |
              Out-Null

          function Sync-OmniRouteState {

              Write-Host ""
              Write-Host "==================================================" -ForegroundColor Cyan
              Write-Host "PERSISTING OMNIROUTE STATE" -ForegroundColor Cyan
              Write-Host "==================================================" -ForegroundColor Cyan

              if (-not (Test-Path $dbFile)) {

                  Write-Warning "storage.sqlite does not exist yet."
                  return
              }

              # ----------------------------------------------------------
              # SQLite WAL checkpoint
              # ----------------------------------------------------------

              if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

                  Write-Host "Running SQLite WAL checkpoint..."

                  sqlite3 `
                      $dbFile `
                      "PRAGMA wal_checkpoint(TRUNCATE);"

                  if ($LASTEXITCODE -ne 0) {

                      Write-Warning `
                          "SQLite WAL checkpoint failed."
                  }
                  else {

                      Write-Host `
                          "SQLite WAL checkpoint completed." `
                          -ForegroundColor Green
                  }
              }
              else {

                  Write-Warning `
                      "sqlite3.exe not available. WAL checkpoint skipped."
              }

              # ----------------------------------------------------------
              # Create backup archive
              # ----------------------------------------------------------

              $tarItems = @()

              if (Test-Path "storage.sqlite") {
                  $tarItems += "storage.sqlite"
              }

              if (Test-Path "storage.sqlite-wal") {
                  $tarItems += "storage.sqlite-wal"
              }

              if (Test-Path "storage.sqlite-shm") {
                  $tarItems += "storage.sqlite-shm"
              }

              if (Test-Path "db_backups") {
                  $tarItems += "db_backups"
              }

              if ($tarItems.Count -gt 0) {

                  Remove-Item `
                      $archive `
                      -Force `
                      -ErrorAction SilentlyContinue

                  tar -czf $archive `
                      --exclude=logs `
                      --exclude=call_logs `
                      --exclude=server `
                      @tarItems

                  if ($LASTEXITCODE -ne 0) {

                      Write-Warning `
                          "Failed to create backup archive."
                  }
                  else {

                      Write-Host `
                          "Backup archive created." `
                          -ForegroundColor Green
                  }
              }

              # ----------------------------------------------------------
              # Stage state
              # ----------------------------------------------------------

              git add `
                  .gitattributes `
                  storage.sqlite `
                  storage.sqlite-wal `
                  storage.sqlite-shm `
                  backup/omniroute/omniroute-full-backup.tar.gz `
                  db_backups/ `
                  2>$null

              git diff --cached --quiet

              $hasChanges = ($LASTEXITCODE -ne 0)

              if (-not $hasChanges) {

                  Write-Host "No SQLite changes detected."

                  return
              }

              # ----------------------------------------------------------
              # Commit
              # ----------------------------------------------------------

              git commit `
                  -m "chore: persist OmniRoute SQLite state [skip ci]" `
                  2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning `
                      "Git commit failed."

                  return
              }

              # ----------------------------------------------------------
              # Push
              # ----------------------------------------------------------

              git fetch origin "${{ github.ref_name }}" 2>$null

              git rebase `
                  "origin/${{ github.ref_name }}" `
                  2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning `
                      "Git rebase failed."

                  git rebase --abort 2>$null

                  return
              }

              git push `
                  origin `
                  "HEAD:${{ github.ref_name }}" `
                  2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Warning `
                      "Git push failed."
              }
              else {

                  Write-Host ""
                  Write-Host `
                      "OmniRoute SQLite state persisted to GitHub." `
                      -ForegroundColor Green
              }
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "STARTING 355-MINUTE KEEP-ALIVE"
          Write-Host "SQLite persistence interval: $syncIntervalMinutes minutes"
          Write-Host "=================================================="

          for ($minute = 1; $minute -le $totalMinutes; $minute++) {

              Start-Sleep -Seconds 60

              $syncCounter++

              if ($syncCounter -ge $syncIntervalMinutes) {

                  $syncCounter = 0

                  Sync-OmniRouteState
              }

              if (($minute % 10) -eq 0) {

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] OmniRoute:"

                  docker ps `
                      --filter "name=omniroute" `
                      --format "Status: {{.Status}}" `
                      2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] Redis:"

                  docker ps `
                      --filter "name=omniroute-redis" `
                      --format "Status: {{.Status}}" `
                      2>$null

                  Write-Host ""
                  Write-Host "[$minute/$totalMinutes min] Tailscale:"

                  tailscale status `
                      --peers=false `
                      2>$null
              }
          }

          # Final periodic sync before normal completion.
          Sync-OmniRouteState


      # ==============================================================
      # 9. Graceful Shutdown & Final SQLite Checkpoint
      # ==============================================================

      - name: 9. Graceful Shutdown & Final SQLite Checkpoint
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Yellow
          Write-Host "FINAL SQLITE PERSISTENCE"
          Write-Host "==================================================" -ForegroundColor Yellow

          $workspace = "${{ github.workspace }}"
          $dbFile = Join-Path $workspace "storage.sqlite"

          # ------------------------------------------------------------
          # Stop OmniRoute
          # ------------------------------------------------------------

          Write-Host "Stopping OmniRoute..."

          docker stop omniroute 2>$null

          docker rm omniroute 2>$null

          # ------------------------------------------------------------
          # Stop Redis
          # ------------------------------------------------------------

          Write-Host "Stopping Redis..."

          docker stop omniroute-redis 2>$null

          docker rm omniroute-redis 2>$null

          # ------------------------------------------------------------
          # SQLite checkpoint
          # ------------------------------------------------------------

          if (Test-Path $dbFile) {

              Write-Host ""
              Write-Host "SQLite database found."

              if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

                  Write-Host "Running final WAL checkpoint..."

                  sqlite3 `
                      $dbFile `
                      "PRAGMA wal_checkpoint(TRUNCATE);"

                  if ($LASTEXITCODE -eq 0) {

                      Write-Host `
                          "Final SQLite checkpoint completed." `
                          -ForegroundColor Green
                  }
                  else {

                      Write-Warning `
                          "Final SQLite checkpoint failed."
                  }
              }
              else {

                  Write-Warning `
                      "sqlite3.exe unavailable."
              }
          }
          else {

              Write-Warning `
                  "storage.sqlite was not found."
          }


      # ==============================================================
      # 10. Final GitHub Persistence Attempt
      # ==============================================================

      - name: 10. Final GitHub Persistence Attempt
        if: always()
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Yellow
          Write-Host "FINAL GITHUB DATABASE PUSH"
          Write-Host "==================================================" -ForegroundColor Yellow

          $USERNAME = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($USERNAME)) {
              $USERNAME = "github-actions[bot]"
          }

          git config user.name "$USERNAME"
          git config user.email "$USERNAME@users.noreply.github.com"

          git lfs install

          New-Item `
              -ItemType Directory `
              -Path "backup/omniroute" `
              -Force |
              Out-Null

          $archive = "backup/omniroute/omniroute-full-backup.tar.gz"

          $tarItems = @()

          if (Test-Path "storage.sqlite") {
              $tarItems += "storage.sqlite"
          }

          if (Test-Path "storage.sqlite-wal") {
              $tarItems += "storage.sqlite-wal"
          }

          if (Test-Path "storage.sqlite-shm") {
              $tarItems += "storage.sqlite-shm"
          }

          if (Test-Path "db_backups") {
              $tarItems += "db_backups"
          }

          if ($tarItems.Count -gt 0) {

              Remove-Item `
                  $archive `
                  -Force `
                  -ErrorAction SilentlyContinue

              tar -czf $archive `
                  --exclude=logs `
                  --exclude=call_logs `
                  --exclude=server `
                  @tarItems
          }

          git add `
              .gitattributes `
              storage.sqlite `
              storage.sqlite-wal `
              storage.sqlite-shm `
              backup/omniroute/omniroute-full-backup.tar.gz `
              db_backups/ `
              2>$null

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {

              Write-Host "No final changes to push."

              exit 0
          }

          git fetch origin "${{ github.ref_name }}" 2>$null

          git rebase `
              "origin/${{ github.ref_name }}" `
              2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                  "Final rebase failed."

              git rebase --abort 2>$null
          }

          git add `
              .gitattributes `
              storage.sqlite `
              storage.sqlite-wal `
              storage.sqlite-shm `
              backup/omniroute/omniroute-full-backup.tar.gz `
              db_backups/ `
              2>$null

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {

              Write-Host "No final changes after synchronization."

              exit 0
          }

          git commit `
              -m "chore: final OmniRoute DB state backup [skip ci]" `
              2>$null

          if ($LASTEXITCODE -ne 0) {

              Write-Warning `
                  "Final commit failed."

              exit 0
          }

          git push `
              origin `
              "HEAD:${{ github.ref_name }}" `
              2>$null

          if ($LASTEXITCODE -eq 0) {

              Write-Host ""
              Write-Host `
                  "FINAL OMNIROUTE DATABASE STATE PUSHED SUCCESSFULLY." `
                  -ForegroundColor Green
          }
          else {

              Write-Warning `
                  "Final GitHub push failed."
          }
          
      # ==============================================================
      # 11. Final Diagnostics
      # ==============================================================

      - name: 11. Final Diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "FINAL DIAGNOSTICS"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Git:"
          git status --short

          Write-Host ""
          Write-Host "Docker containers:"
          docker ps -a `
              --filter "name=omniroute"

          docker ps -a `
              --filter "name=omniroute-redis"

          Write-Host ""
          Write-Host "Tailscale:"
          tailscale status --peers=false 2>$null

          Write-Host ""
          Write-Host "RDP service:"
          Get-Service `
              -Name 'TermService' `
              -ErrorAction SilentlyContinue |
              Select-Object Name, Status, StartType |
              Format-Table

          Write-Host ""
          Write-Host "RDP port:"
          Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Select-Object LocalAddress, LocalPort, State |
              Format-Table

          Write-Host ""
          Write-Host "OmniRoute database:"
          Get-ChildItem `
              -Path "${{ github.workspace }}" `
              -Filter "storage.sqlite*" `
              -ErrorAction SilentlyContinue |
              Select-Object Name, Length, LastWriteTime |
              Format-Table

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "WORKFLOW CLEANUP COMPLETE"
          Write-Host "=================================================="
