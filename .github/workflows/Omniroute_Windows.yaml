
name: OmniRoute Windows Gateway Win

on:
  workflow_dispatch:
    inputs:
      force_json_restore:
        description: "Force legacy JSON settings import even when api_keys already exist"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - Omniroute_Windows

concurrency:
  group: omniroute-windows-gateway
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET_BRANCH: Omniroute_Windows

  OMNIROUTE_PORT: 20128
  REDIS_PORT: 6379
  RDP_PORT: 3389

  SQLITE_SYNC_INTERVAL_MINUTES: 5

  LEGACY_BACKUP_BRANCH: Omniroute_Windows
  LEGACY_BACKUP_PATH: db_backups/omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json

jobs:

  run-omniroute:

    # GitHub-hosted Windows runner.
    # This is Windows Server 2022, not Windows 10.
    runs-on: windows-2022

    timeout-minutes: 360

    steps:

      # ==============================================================
      # 1. Checkout target branch
      # ==============================================================

      - name: 1. Checkout Omniroute_Windows
        uses: actions/checkout@v4
        with:
          ref: Omniroute_Windows
          fetch-depth: 0
          lfs: true
          token: ${{ secrets.GIT_TOKEN || github.token }}

      # ==============================================================
      # 2. Verify Windows Host
      # ==============================================================

      - name: 2. Verify Windows Host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING GITHUB WINDOWS RUNNER"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber |
            Format-List

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Architecture:"
          Write-Host (
            [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          )

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "Git LFS:"
          git lfs version

          Write-Host ""
          Write-Host "Docker:"
          docker --version

          Write-Host ""
          Write-Host "Docker Compose:"
          docker compose version

          Write-Host ""
          Write-Host "SQLite:"
          if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {
            sqlite3 --version
          }
          else {
            Write-Warning "sqlite3.exe not found. WAL checkpoint will be skipped."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "HOST VERIFIED"
          Write-Host "=================================================="

      # ==============================================================
      # 3. Connect Tailscale
      # ==============================================================

      - name: 3. Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: omniroute-ci-gateway

      # ==============================================================
      # 3A. Verify Tailscale
      # ==============================================================

      - name: 3A. Verify Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = Get-Command `
            tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
            throw "tailscale.exe was not found."
          }

          $tailscaleIp = (
            & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
            throw "Unable to determine Tailscale IPv4."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "TAILSCALE READY"
          Write-Host "=================================================="

          Write-Host "Hostname : omniroute-ci-gateway"
          Write-Host "IPv4     : $tailscaleIp"

          Write-Host ""
          tailscale status --peers=false

      # ==============================================================
      # 4. Remote Desktop
      # ==============================================================

      - name: 4. Enable Remote Desktop
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "CONFIGURING REMOTE DESKTOP"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME)) {
            throw "RDP_USERNAME secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $password = $env:RDP_PASSWORD

          if ($password.Length -lt 16) {
            throw "RDP_PASSWORD must be at least 16 characters."
          }

          if ($password -notmatch '[A-Z]') {
            throw "RDP_PASSWORD must contain an uppercase letter."
          }

          if ($password -notmatch '[a-z]') {
            throw "RDP_PASSWORD must contain a lowercase letter."
          }

          if ($password -notmatch '\d') {
            throw "RDP_PASSWORD must contain a number."
          }

          if ($password -notmatch '[^a-zA-Z0-9]') {
            throw "RDP_PASSWORD must contain a special character."
          }

          if (
            $password.IndexOf(
              $env:RDP_USERNAME,
              [System.StringComparison]::OrdinalIgnoreCase
            ) -ge 0
          ) {
            throw "RDP_PASSWORD must not contain RDP_USERNAME."
          }

          # ------------------------------------------------------------
          # Enable RDP
          # ------------------------------------------------------------

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

          # ------------------------------------------------------------
          # Firewall
          # ------------------------------------------------------------

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          # ------------------------------------------------------------
          # TermService
          # ------------------------------------------------------------

          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service `
            -Name 'TermService' `
            -ErrorAction SilentlyContinue

          $service = Get-Service `
            -Name 'TermService'

          if ($service.Status -ne 'Running') {
            throw "TermService is not running."
          }

          # ------------------------------------------------------------
          # Create / update RDP user
          # ------------------------------------------------------------

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

            Write-Host "Creating RDP user..."

            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -Description "OmniRoute GitHub Actions RDP User" |
              Out-Null
          }
          else {

            Write-Host "Updating RDP user..."

            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword

            Enable-LocalUser `
              -Name $env:RDP_USERNAME
          }

          # ------------------------------------------------------------
          # Groups
          # ------------------------------------------------------------

          Add-LocalGroupMember `
            -Group 'Administrators' `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Remote Desktop configured." `
            -ForegroundColor Green

      # ==============================================================
      # 4A. Verify Remote Desktop
      # ==============================================================

      - name: 4A. Verify Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING REMOTE DESKTOP"
          Write-Host "=================================================="

          $rdpDenied = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          if ($rdpDenied -ne 0) {
            throw "RDP is disabled."
          }

          $nla = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication'

          if ($nla -ne 1) {
            throw "RDP NLA is disabled."
          }

          $service = Get-Service `
            -Name 'TermService'

          if ($service.Status -ne 'Running') {
            throw "TermService is not running."
          }

          $firewallRules = Get-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq 'True'

          if ($null -eq $firewallRules) {
            throw "Remote Desktop firewall rules are not enabled."
          }

          $port = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $port) {
            throw "TCP 3389 is not listening."
          }

          Write-Host ""
          Write-Host "RDP service : Running" -ForegroundColor Green
          Write-Host "RDP NLA     : Enabled" -ForegroundColor Green
          Write-Host "RDP firewall: Enabled" -ForegroundColor Green
          Write-Host "RDP 3389    : Listening" -ForegroundColor Green

      # ==============================================================
      # 4B. Display RDP information
      # ==============================================================

      - name: 4B. Display RDP Information
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = Get-Command `
            tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $tailscale) {
            throw "tailscale.exe was not found."
          }

          $tailscaleIp = (
            & $tailscale.Source ip -4 2>$null
          ).Trim()

          if ([string]::IsNullOrWhiteSpace($tailscaleIp)) {
            throw "Tailscale IP could not be detected."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "REMOTE DESKTOP READY"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Tailscale IP : $tailscaleIp"
          Write-Host "Hostname     : omniroute-ci-gateway"
          Write-Host "RDP Port     : 3389"

          Write-Host ""
          Write-Host "RDP command:"
          Write-Host "mstsc /v:omniroute-ci-gateway"

          Write-Host ""
          Write-Host "RDP Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "The GitHub-hosted VM is ephemeral."
          Write-Host "RDP exists only while this job is running."

      # ==============================================================
      # 5. Verify Docker
      #
      # IMPORTANT:
      # The runner must already expose a Linux Docker engine for
      # redis:7-alpine and the OmniRoute Linux image.
      #
      # We do NOT use DockerCli -SwitchLinuxEngine here.
      # GitHub's Windows Server runner is not a reliable Docker
      # Desktop/Linux-container environment.
      # ==============================================================

      - name: 5. Verify Docker Linux Container Support
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "VERIFYING DOCKER"
          Write-Host "=================================================="

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            docker info *> $null

            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }

            Write-Host "Waiting for Docker daemon... ($i/30)"
            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            throw "Docker daemon is not available."
          }

          $dockerInfo = docker info 2>&1
          $dockerText = $dockerInfo | Out-String

          Write-Host ""
          Write-Host $dockerText

          if ($dockerText -match 'OSType:\s*windows') {

            throw @"
            Docker is running in Windows-container mode.
            This workflow requires Linux containers because:
            - redis:7-alpine is a Linux image
            - OmniRoute uses the Linux image:
            diegosouzapw/omniroute:latest
            
            A GitHub-hosted windows-2022 runner cannot be converted here
            into a Docker Desktop Linux-container host reliably.
            Use a Linux runner for OmniRoute, or use a persistent/self-hosted
            Windows machine with a Linux container runtime.
            "@
          }

          if ($dockerText -notmatch 'OSType:\s*linux') {

            throw @"
            Docker container type could not be verified as Linux.
            Docker info output:$dockerText
            "@
          }

          Write-Host ""
          Write-Host "Docker Linux container mode: READY" `
            -ForegroundColor Green

      # ==============================================================
      # 6. Verify SQLite
      # ==============================================================

      - name: 6. Verify Existing SQLite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          Write-Host "=================================================="
          Write-Host "VERIFYING SQLITE STATE"
          Write-Host "=================================================="

          if (-not (Test-Path $dbFile)) {

            Write-Warning `
              "storage.sqlite does not exist in Omniroute_Windows."
          }
          else {

            $db = Get-Item $dbFile

            Write-Host ""
            Write-Host "Database:"
            Write-Host "Path : $($db.FullName)"
            Write-Host "Size : $($db.Length) bytes"

            if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

              $integrity = sqlite3 `
                $dbFile `
                "PRAGMA integrity_check;"

              Write-Host ""
              Write-Host "Integrity:"
              Write-Host $integrity

              if ($integrity -notmatch "^ok$") {
                throw "SQLite integrity check failed."
              }
            }
          }

      # ==============================================================
      # 7. Download Legacy JSON
      # ==============================================================

      - name: 7. Download Legacy OmniRoute JSON
        shell: powershell
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "DOWNLOADING LEGACY JSON EXPORT"
          Write-Host "=================================================="

          $backupDir = Join-Path `
            "${{ github.workspace }}" `
            "db_backups"

          $backupName = Split-Path `
            "$env:LEGACY_BACKUP_PATH" `
            -Leaf

          $backupFile = Join-Path `
            $backupDir `
            $backupName

          New-Item `
            -ItemType Directory `
            -Path $backupDir `
            -Force |
            Out-Null

          $apiUrl =
            "https://api.github.com/repos/ms2lawyer/linux-server/contents/" +
            "$env:LEGACY_BACKUP_PATH" +
            "?ref=" +
            "$env:LEGACY_BACKUP_BRANCH"

          $headers = @{
            "Accept" = "application/vnd.github.raw+json"
            "Authorization" = "Bearer $env:GIT_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "OmniRoute-Windows-Gateway"
          }

          Invoke-WebRequest `
            -Uri $apiUrl `
            -Headers $headers `
            -OutFile $backupFile `
            -UseBasicParsing

          if (-not (Test-Path $backupFile)) {
            throw "Legacy JSON download failed."
          }

          $info = Get-Item $backupFile

          Write-Host ""
          Write-Host "Backup file:"
          Write-Host $info.FullName
          Write-Host "Size: $($info.Length) bytes"

          if ($info.Length -lt 10) {
            throw "Legacy JSON is suspiciously small."
          }

          try {

            Get-Content `
              -Path $backupFile `
              -Raw `
              -Encoding UTF8 |
              ConvertFrom-Json |
              Out-Null
          }
          catch {

            throw `
              "Legacy JSON validation failed: $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "Legacy JSON validation: PASSED" `
            -ForegroundColor Green

      # ==============================================================
      # 8. Start Redis
      # ==============================================================

      - name: 8. Start Redis
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING REDIS"
          Write-Host "=================================================="

          $existingRedis = docker ps -aq `
            --filter "name=^omniroute-redis$" `
            2>$null

          if (-not [string]::IsNullOrWhiteSpace($existingRedis)) {

            Write-Host "Removing existing Redis container..."

            docker rm -f omniroute-redis

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to remove existing Redis container."
            }
          }

          docker pull redis:7-alpine

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull redis:7-alpine."
          }

          docker run -d `
            --name omniroute-redis `
            --restart unless-stopped `
            -p 6379:6379 `
            --health-cmd "redis-cli ping" `
            --health-interval 10s `
            --health-timeout 5s `
            --health-retries 3 `
            redis:7-alpine

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start Redis."
          }

          Write-Host ""
          Write-Host "Waiting for Redis..."

          $redisReady = $false

          for ($i = 1; $i -le 30; $i++) {

            $health = docker inspect `
              --format "{{.State.Health.Status}}" `
              omniroute-redis `
              2>$null

            if ($health -eq "healthy") {

              $redisReady = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $redisReady) {

            Write-Host ""
            Write-Host "Redis containers:"
            docker ps -a `
              --filter "name=^omniroute-redis$"

            Write-Host ""
            Write-Host "Redis logs:"
            docker logs omniroute-redis

            throw "Redis health check failed."
          }

          Write-Host ""
          Write-Host "Redis is healthy." `
            -ForegroundColor Green

      # ==============================================================
      # 9. Start OmniRoute
      # ==============================================================

      - name: 9. Start OmniRoute
        shell: powershell
        env:
          OMNI_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OMNI_API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          OMNI_STORAGE_ENCRYPTION_KEY: ${{ secrets.STORAGE_ENCRYPTION_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "STARTING OMNIROUTE"
          Write-Host "=================================================="

          if ([string]::IsNullOrWhiteSpace($env:OMNI_JWT_SECRET)) {
            throw "JWT_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_API_KEY_SECRET)) {
            throw "API_KEY_SECRET secret is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:OMNI_STORAGE_ENCRYPTION_KEY)) {
            throw "STORAGE_ENCRYPTION_KEY secret is missing."
          }

          $workspace = "${{ github.workspace }}"

          $existingOmni = docker ps -aq `
            --filter "name=^omniroute$" `
            2>$null

          if (-not [string]::IsNullOrWhiteSpace($existingOmni)) {

            Write-Host "Removing existing OmniRoute container..."

            docker rm -f omniroute

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to remove existing OmniRoute container."
            }
          }

          docker pull diegosouzapw/omniroute:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull OmniRoute image."
          }

          docker run -d `
            --name omniroute `
            --restart unless-stopped `
            -p 20128:20128 `
            -e "NODE_ENV=production" `
            -e "PORT=20128" `
            -e "HOSTNAME=0.0.0.0" `
            -e "JWT_SECRET=$env:OMNI_JWT_SECRET" `
            -e "API_KEY_SECRET=$env:OMNI_API_KEY_SECRET" `
            -e "STORAGE_ENCRYPTION_KEY=$env:OMNI_STORAGE_ENCRYPTION_KEY" `
            -e "REDIS_URL=redis://host.docker.internal:6379" `
            -e "DATA_DIR=/root/.omniroute" `
            --add-host=host.docker.internal:host-gateway `
            -v "${workspace}:/root/.omniroute" `
            -v "${workspace}:/app/data" `
            diegosouzapw/omniroute:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start OmniRoute."
          }

          docker ps `
            --filter "name=^omniroute$"

      # ==============================================================
      # 9A. Wait for OmniRoute
      # ==============================================================

      - name: 9A. Wait For OmniRoute
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Waiting for OmniRoute..."

          $healthy = $false

          for ($i = 1; $i -le 60; $i++) {

            try {

              $response = Invoke-WebRequest `
                -Uri "http://localhost:20128" `
                -UseBasicParsing `
                -TimeoutSec 5 `
                -ErrorAction Stop

              if (
                $response.StatusCode -ge 200 -and
                $response.StatusCode -lt 500
              ) {

                $healthy = $true
                break
              }
            }
            catch {
            }

            Write-Host "Waiting... ($i/60)"
            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {

            docker ps -a `
              --filter "name=^omniroute$"

            Write-Host ""
            Write-Host "OmniRoute logs:"
            docker logs omniroute

            throw "OmniRoute did not become healthy."
          }

          Write-Host ""
          Write-Host "OmniRoute is healthy." `
            -ForegroundColor Green

      # ==============================================================
      # 10. Determine JSON Import Requirement
      # ==============================================================

      - name: 10. Determine JSON Import Requirement
        shell: powershell
        env:
          FORCE_JSON_RESTORE: ${{ inputs.force_json_restore || false }}
        run: |
          $ErrorActionPreference = "Stop"

          $force =
            "$env:FORCE_JSON_RESTORE".ToLowerInvariant() -eq "true"

          if ($force) {

            Write-Host "Forced JSON import requested."

            "OMNIROUTE_JSON_IMPORT_REQUIRED=true" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append

            exit 0
          }

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          if (-not (Test-Path $dbFile)) {

            Write-Host "storage.sqlite does not exist."
            Write-Host "JSON import required."

            "OMNIROUTE_JSON_IMPORT_REQUIRED=true" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append

            exit 0
          }

          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {

            Write-Warning `
              "sqlite3.exe unavailable."
            Write-Warning `
              "Skipping automatic JSON import."

            "OMNIROUTE_JSON_IMPORT_REQUIRED=false" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append

            exit 0
          }

          $tableExists = sqlite3 `
            $dbFile `
            "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='api_keys';" `
            2>$null

          if ($tableExists.Trim() -ne "1") {

            Write-Host "api_keys table does not exist."
            Write-Host "JSON import required."

            "OMNIROUTE_JSON_IMPORT_REQUIRED=true" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append

            exit 0
          }

          $countRaw = sqlite3 `
            $dbFile `
            "SELECT COUNT(*) FROM api_keys;" `
            2>$null

          $count = 0

          if (-not [string]::IsNullOrWhiteSpace($countRaw)) {

            [int]::TryParse(
              $countRaw.Trim(),
              [ref]$count
            ) | Out-Null
          }

          Write-Host ""
          Write-Host "Existing api_keys rows: $count"

          if ($count -gt 0) {

            Write-Host "Existing API keys found."
            Write-Host "Legacy JSON import will be skipped."

            "OMNIROUTE_JSON_IMPORT_REQUIRED=false" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append
          }
          else {

            Write-Host "No API keys found."
            Write-Host "Legacy JSON import required."

            "OMNIROUTE_JSON_IMPORT_REQUIRED=true" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Append
          }

      # ==============================================================
      # 11. Correct OmniRoute JSON Settings Import
      #
      # POST /api/settings/import-json
      # ==============================================================

      - name: 11. Import Legacy JSON Settings
        if: env.OMNIROUTE_JSON_IMPORT_REQUIRED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=================================================="
          Write-Host "IMPORTING LEGACY OMNIROUTE JSON"
          Write-Host "=================================================="

          $backupFile = Join-Path `
            "${{ github.workspace }}" `
            "db_backups\omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json"

          if (-not (Test-Path $backupFile)) {
            throw "Legacy JSON backup was not found."
          }

          $jsonBody = Get-Content `
            -Path $backupFile `
            -Raw `
            -Encoding UTF8

          if ([string]::IsNullOrWhiteSpace($jsonBody)) {
            throw "Legacy JSON backup is empty."
          }

          $uri =
            "http://localhost:$env:OMNIROUTE_PORT/api/settings/import-json"

          Write-Host ""
          Write-Host "POST $uri"

          try {

            $response = Invoke-WebRequest `
              -Uri $uri `
              -Method POST `
              -ContentType "application/json" `
              -Body $jsonBody `
              -UseBasicParsing `
              -TimeoutSec 120 `
              -ErrorAction Stop

            Write-Host ""
            Write-Host "HTTP status: $($response.StatusCode)"

            $parsed = $response.Content |
              ConvertFrom-Json

            Write-Host ""
            Write-Host "Import response:"
            Write-Host $response.Content

            $success = $false

            if ($null -ne $parsed.success) {
              $success = [bool]$parsed.success
            }

            $apiKeys = 0

            if ($null -ne $parsed.apiKeys) {
              [int]::TryParse(
                "$($parsed.apiKeys)",
                [ref]$apiKeys
              ) | Out-Null
            }

            Write-Host ""
            Write-Host "success : $success"
            Write-Host "apiKeys : $apiKeys"

            if (-not $success) {
              throw "OmniRoute returned success=false."
            }

            if ($apiKeys -gt 0) {

              Write-Host ""
              Write-Host `
                "API keys imported successfully." `
                -ForegroundColor Green
            }
            else {

              Write-Warning `
                "Import returned apiKeys=0."

              Write-Warning `
                "Verify API_KEY_SECRET and STORAGE_ENCRYPTION_KEY."
            }
          }
          catch {

            $statusCode = 0

            if ($null -ne $_.Exception.Response) {

              try {
                $statusCode =
                  [int]$_.Exception.Response.StatusCode
              }
              catch {
                $statusCode = 0
              }
            }

            if ($statusCode -eq 401) {

              throw @"
              OmniRoute returned HTTP 401 for:
              POST /api/settings/import-json
              The installed OmniRoute instance requires authentication
              for this endpoint.
              "@
            }

            throw `
              "Legacy JSON import failed: $($_.Exception.Message)"
          }

      # ==============================================================
      # 11A. Verify API Keys
      # ==============================================================

      - name: 11A. Verify API Key State
        if: env.OMNIROUTE_JSON_IMPORT_REQUIRED == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          if (-not (Test-Path $dbFile)) {
            throw "storage.sqlite does not exist after JSON import."
          }

          if (-not (Get-Command sqlite3 -ErrorAction SilentlyContinue)) {

            Write-Warning `
              "sqlite3 unavailable. API key verification skipped."

            exit 0
          }

          $countRaw = sqlite3 `
            $dbFile `
            "SELECT COUNT(*) FROM api_keys;" `
            2>$null

          $count = 0

          [int]::TryParse(
            $countRaw.Trim(),
            [ref]$count
          ) | Out-Null

          Write-Host ""
          Write-Host "api_keys rows after import: $count"

          if ($count -gt 0) {

            Write-Host `
              "API keys are present." `
              -ForegroundColor Green
          }
          else {

            Write-Warning `
              "api_keys is still empty."

            Write-Warning `
              "Check API_KEY_SECRET and STORAGE_ENCRYPTION_KEY."
          }

      # ==============================================================
      # 12. Verify OmniRoute
      # ==============================================================

      - name: 12. Verify OmniRoute
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $response = Invoke-WebRequest `
            -Uri "http://localhost:20128" `
            -UseBasicParsing `
            -TimeoutSec 10 `
            -ErrorAction Stop

          if (
            $response.StatusCode -lt 200 -or
            $response.StatusCode -ge 500
          ) {

            throw "OmniRoute is unhealthy."
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "OMNIROUTE READY"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Dashboard:"
          Write-Host "http://omniroute-ci-gateway:20128"

          Write-Host ""
          Write-Host "API:"
          Write-Host "http://omniroute-ci-gateway:20128/v1"

      # ==============================================================
      # 13. Keep Alive + SQLite Persistence
      # ==============================================================

      - name: 13. Keep Alive + SQLite Persistence
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          $workspace = "${{ github.workspace }}"

          $dbFile = Join-Path `
            $workspace `
            "storage.sqlite"

          $archive = Join-Path `
            $workspace `
            "backup\omniroute\omniroute-full-backup.tar.gz"

          $interval = [int]$env:SQLITE_SYNC_INTERVAL_MINUTES
          $counter = 0
          $totalMinutes = 355

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
            $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $workspace "backup\omniroute") `
            -Force |
            Out-Null

          function Sync-OmniRouteState {

            Write-Host ""
            Write-Host "==================================================" `
              -ForegroundColor Cyan

            Write-Host "PERSISTING SQLITE STATE" `
              -ForegroundColor Cyan

            Write-Host "==================================================" `
              -ForegroundColor Cyan

            if (-not (Test-Path $dbFile)) {

              Write-Warning `
                "storage.sqlite does not exist."

              return
            }

            # ----------------------------------------------------------
            # WAL checkpoint
            # ----------------------------------------------------------

            if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {

              sqlite3 `
                $dbFile `
                "PRAGMA wal_checkpoint(TRUNCATE);"

              if ($LASTEXITCODE -ne 0) {

                Write-Warning `
                  "SQLite WAL checkpoint failed."
              }
            }

            # ----------------------------------------------------------
            # Create archive
            # ----------------------------------------------------------

            $tarItems = @()

            if (Test-Path "storage.sqlite") {
              $tarItems += "storage.sqlite"
            }

            if (Test-Path "storage.sqlite-wal") {
              $tarItems += "storage.sqlite-wal"
            }

            if (Test-Path "storage.sqlite-shm") {
              $tarItems += "storage.sqlite-shm"
            }

            if (Test-Path "db_backups") {
              $tarItems += "db_backups"
            }

            if ($tarItems.Count -gt 0) {

              Remove-Item `
                $archive `
                -Force `
                -ErrorAction SilentlyContinue

              tar -czf $archive `
                --exclude=logs `
                --exclude=call_logs `
                --exclude=server `
                @tarItems

              if ($LASTEXITCODE -ne 0) {

                Write-Warning `
                  "Backup archive creation failed."
              }
            }

            # ----------------------------------------------------------
            # Stage
            # ----------------------------------------------------------

            git add `
              .gitattributes `
              storage.sqlite `
              storage.sqlite-wal `
              storage.sqlite-shm `
              backup/omniroute/omniroute-full-backup.tar.gz `
              db_backups/ `
              2>$null

            git diff --cached --quiet

            $hasChanges = ($LASTEXITCODE -ne 0)

            if (-not $hasChanges) {

              Write-Host "No database changes."

              return
            }

            # ----------------------------------------------------------
            # Commit
            # ----------------------------------------------------------

            git commit `
              -m "chore: persist OmniRoute SQLite state [skip ci]" `
              2>$null

            if ($LASTEXITCODE -ne 0) {

              Write-Warning "Git commit failed."

              return
            }

            # ----------------------------------------------------------
            # Fetch target branch
            # ----------------------------------------------------------

            git fetch origin "$env:TARGET_BRANCH" 2>$null

            if ($LASTEXITCODE -ne 0) {

              Write-Warning "Git fetch failed."

              return
            }

            # ----------------------------------------------------------
            # Rebase
            # ----------------------------------------------------------

            git rebase `
              "origin/$env:TARGET_BRANCH" `
              2>$null

            if ($LASTEXITCODE -ne 0) {

              Write-Warning "Git rebase failed."

              git rebase --abort 2>$null

              return
            }

            # ----------------------------------------------------------
            # Push
            # ----------------------------------------------------------

            git push `
              origin `
              "HEAD:$env:TARGET_BRANCH" `
              2>$null

            if ($LASTEXITCODE -eq 0) {

              Write-Host ""
              Write-Host `
                "SQLite state pushed to Omniroute_Windows." `
                -ForegroundColor Green
            }
            else {

              Write-Warning `
                "GitHub push failed."
            }
          }

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "KEEP-ALIVE STARTED"
          Write-Host "Duration: 355 minutes"
          Write-Host "SQLite persistence: every $interval minutes"
          Write-Host "=================================================="

          for ($minute = 1; $minute -le $totalMinutes; $minute++) {

            Start-Sleep -Seconds 60

            $counter++

            if ($counter -ge $interval) {

              $counter = 0

              Sync-OmniRouteState
            }

            if (($minute % 10) -eq 0) {

              Write-Host ""
              Write-Host "[$minute/$totalMinutes min] OmniRoute:"

              docker ps `
                --filter "name=^omniroute$" `
                --format "Status: {{.Status}}" `
                2>$null

              Write-Host ""
              Write-Host "[$minute/$totalMinutes min] Redis:"

              docker ps `
                --filter "name=^omniroute-redis$" `
                --format "Status: {{.Status}}" `
                2>$null

              Write-Host ""
              Write-Host "[$minute/$totalMinutes min] RDP:"

              $rdpPort = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($null -ne $rdpPort) {

                Write-Host "RDP: LISTENING"
              }
              else {

                Write-Warning "RDP: NOT LISTENING"
              }
            }
          }

          # Final normal persistence.
          Sync-OmniRouteState

      # ==============================================================
      # 14. Final Shutdown
      # ==============================================================

      - name: 14. Final Shutdown
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=================================================="
          Write-Host "FINAL SHUTDOWN"
          Write-Host "=================================================="

          $omniExists = docker ps -aq `
            --filter "name=^omniroute$" `
            2>$null

          if (-not [string]::IsNullOrWhiteSpace($omniExists)) {

            docker stop omniroute 2>$null
            docker rm omniroute 2>$null
          }

          $redisExists = docker ps -aq `
            --filter "name=^omniroute-redis$" `
            2>$null

          if (-not [string]::IsNullOrWhiteSpace($redisExists)) {

            docker stop omniroute-redis 2>$null
            docker rm omniroute-redis 2>$null
          }

          $dbFile = Join-Path `
            "${{ github.workspace }}" `
            "storage.sqlite"

          if (
            (Test-Path $dbFile) -and
            (Get-Command sqlite3 -ErrorAction SilentlyContinue)
          ) {

            Write-Host "Final SQLite checkpoint..."

            sqlite3 `
              $dbFile `
              "PRAGMA wal_checkpoint(TRUNCATE);"
          }

      # ==============================================================
      # 15. Final Git Persistence
      # ==============================================================

      - name: 15. Final Git SQLite Persistence
        if: always()
        shell: powershell
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=================================================="
          Write-Host "FINAL GITHUB SQLITE PUSH"
          Write-Host "=================================================="

          $gitUser = $env:GIT_USERNAME

          if ([string]::IsNullOrWhiteSpace($gitUser)) {
            $gitUser = "github-actions[bot]"
          }

          git config user.name "$gitUser"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git lfs install

          $dbFile = "storage.sqlite"
          $archive = `
            "backup/omniroute/omniroute-full-backup.tar.gz"

          if (
            (Test-Path $dbFile) -and
            (Get-Command sqlite3 -ErrorAction SilentlyContinue)
          ) {

            sqlite3 `
              $dbFile `
              "PRAGMA wal_checkpoint(TRUNCATE);"
          }

          New-Item `
            -ItemType Directory `
            -Path "backup/omniroute" `
            -Force |
            Out-Null

          $tarItems = @()

          if (Test-Path "storage.sqlite") {
            $tarItems += "storage.sqlite"
          }

          if (Test-Path "storage.sqlite-wal") {
            $tarItems += "storage.sqlite-wal"
          }

          if (Test-Path "storage.sqlite-shm") {
            $tarItems += "storage.sqlite-shm"
          }

          if (Test-Path "db_backups") {
            $tarItems += "db_backups"
          }

          if ($tarItems.Count -gt 0) {

            Remove-Item `
              $archive `
              -Force `
              -ErrorAction SilentlyContinue

            tar -czf $archive `
              --exclude=logs `
              --exclude=call_logs `
              --exclude=server `
              @tarItems
          }

          git add `
            .gitattributes `
            storage.sqlite `
            storage.sqlite-wal `
            storage.sqlite-shm `
            backup/omniroute/omniroute-full-backup.tar.gz `
            db_backups/ `
            2>$null

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {

            Write-Host "No final database changes."

            exit 0
          }

          git commit `
            -m "chore: final OmniRoute DB state backup [skip ci]" `
            2>$null

          if ($LASTEXITCODE -ne 0) {

            Write-Warning "Final Git commit failed."

            exit 0
          }

          git fetch origin "$env:TARGET_BRANCH" 2>$null

          if ($LASTEXITCODE -ne 0) {

            Write-Warning "Final git fetch failed."

            exit 0
          }

          git rebase `
            "origin/$env:TARGET_BRANCH" `
            2>$null

          if ($LASTEXITCODE -ne 0) {

            Write-Warning "Final git rebase failed."

            git rebase --abort 2>$null

            exit 0
          }

          git push `
            origin `
            "HEAD:$env:TARGET_BRANCH" `
            2>$null

          if ($LASTEXITCODE -eq 0) {

            Write-Host ""
            Write-Host `
              "FINAL SQLITE STATE PUSHED SUCCESSFULLY." `
              -ForegroundColor Green
          }
          else {

            Write-Warning `
              "Final GitHub push failed."
          }

      # ==============================================================
      # 16. Final Diagnostics
      # ==============================================================

      - name: 16. Final Diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "FINAL DIAGNOSTICS"
          Write-Host "=================================================="

          Write-Host ""
          Write-Host "Git:"
          git status --short

          Write-Host ""
          Write-Host "Branch:"
          git branch --show-current

          Write-Host ""
          Write-Host "Target branch:"
          Write-Host $env:TARGET_BRANCH

          Write-Host ""
          Write-Host "Docker:"
          docker ps -a `
            --filter "name=^omniroute$"

          docker ps -a `
            --filter "name=^omniroute-redis$"

          Write-Host ""
          Write-Host "Docker mode:"
          docker info 2>$null |
            Select-String "Operating System|OSType|Server Version"

          Write-Host ""
          Write-Host "Tailscale:"
          tailscale status --peers=false 2>$null

          Write-Host ""
          Write-Host "RDP service:"
          Get-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Status, StartType |
            Format-Table

          Write-Host ""
          Write-Host "RDP TCP 3389:"
          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table

          Write-Host ""
          Write-Host "SQLite:"
          Get-ChildItem `
            -Path "${{ github.workspace }}" `
            -Filter "storage.sqlite*" `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime |
            Format-Table

          Write-Host ""
          Write-Host "Legacy JSON:"
          Get-Item `
            "${{ github.workspace }}\db_backups\omniroute-legacy-backup-2026-08-29T08-40-34-825Z.json" `
            -ErrorAction SilentlyContinue |
            Select-Object FullName, Length, LastWriteTime |
            Format-List

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "WORKFLOW COMPLETE"
          Write-Host "=================================================="
